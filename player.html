<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>RUN FROM ZOMBIES — Player</title>
<style>
/* ----------------------------------------------------------------
   Black interface. Nothing but the player. Thin white outlines.
   ---------------------------------------------------------------- */
:root{
  --bg:#000;
  --ink:#fff;
  --line:rgba(255,255,255,.28);   /* tiny white outlines            */
  --line-hi:rgba(255,255,255,.85);
  --dim:rgba(255,255,255,.45);
  --ctl-h:56px;
  --pad:18px;
}

*{margin:0;padding:0;box-sizing:border-box}

html,body{
  height:100%;
  overflow:hidden;                /* no scrolling, one screen only  */
  background:var(--bg);
  overscroll-behavior:none;
  touch-action:manipulation;
}
body{
  position:fixed;
  inset:0;
  color:var(--ink);
  font:400 12px/1 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  letter-spacing:.06em;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
}

/* ---------------- stage ---------------- */
#stage{
  position:fixed;
  inset:0;
  background:var(--bg);
  display:block;
  overflow:hidden;
}
#video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  background:var(--bg);
  display:block;
}
#stage.idle{cursor:none}

/* ---------------- title slug (top left) ---------------- */
#slug{
  position:absolute;
  top:calc(var(--pad) + env(safe-area-inset-top));
  left:calc(var(--pad) + env(safe-area-inset-left));
  padding:6px 10px;
  border:1px solid var(--line);
  border-radius:2px;
  font-size:10px;
  letter-spacing:.22em;
  color:var(--dim);
  pointer-events:none;
  transition:opacity .25s ease;
  z-index:5;
}

/* ---------------- tap zones ---------------- */
#zones{
  position:absolute;
  inset:0 0 var(--ctl-h) 0;
  display:flex;
  z-index:3;
}
#zones .zone{flex:1 1 0;position:relative}
#zones .zone.mid{flex:0 0 34%}

/* seek ripple feedback */
.ripple{
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:120px;height:120px;
  border:1px solid var(--line-hi);
  border-radius:50%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  opacity:0;
  pointer-events:none;
}
.ripple.on{animation:pulse .62s ease-out}
.ripple .amt{font-size:11px;letter-spacing:.12em}
.ripple svg{width:22px;height:22px}
@keyframes pulse{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.72)}
  22%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.18)}
}

/* center play/pause flash */
#flash{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:74px;height:74px;
  border:1px solid var(--line-hi);
  border-radius:50%;
  display:grid;place-items:center;
  opacity:0;
  pointer-events:none;
  z-index:4;
}
#flash svg{width:26px;height:26px}
#flash.on{animation:flash .5s ease-out}
@keyframes flash{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}
  18%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}
}

/* ---------------- controls ---------------- */
#controls{
  position:absolute;
  left:0;right:0;bottom:0;
  padding:34px calc(var(--pad) + env(safe-area-inset-right)) calc(var(--pad) - 4px + env(safe-area-inset-bottom)) calc(var(--pad) + env(safe-area-inset-left));
  background:linear-gradient(to top,rgba(0,0,0,.92) 0%,rgba(0,0,0,.75) 42%,rgba(0,0,0,0) 100%);
  z-index:6;
  transition:opacity .28s ease,transform .28s ease;
}
#stage.idle #controls{opacity:0;transform:translateY(8px);pointer-events:none}
#stage.idle #slug{opacity:0}

/* chapter readout */
#chapter{
  font-size:10px;
  letter-spacing:.2em;
  color:var(--dim);
  height:14px;
  margin-bottom:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* scrubber */
#scrub{
  position:relative;
  height:20px;
  display:flex;
  align-items:center;
  cursor:pointer;
  touch-action:none;
}
#track{
  position:relative;
  width:100%;
  height:3px;
  border:1px solid var(--line);
  border-radius:2px;
  overflow:visible;
  transition:height .15s ease;
}
#scrub:hover #track,#scrub.dragging #track{height:6px}
#buffered{
  position:absolute;
  top:0;left:0;bottom:0;
  width:0;
  background:rgba(255,255,255,.16);
}
#played{
  position:absolute;
  top:0;left:0;bottom:0;
  width:0;
  background:var(--ink);
}
#knob{
  position:absolute;
  top:50%;left:0;
  width:11px;height:11px;
  margin:-5.5px 0 0 -5.5px;
  border:1px solid var(--ink);
  border-radius:50%;
  background:var(--bg);
  transform:scale(0);
  transition:transform .15s ease;
}
#scrub:hover #knob,#scrub.dragging #knob{transform:scale(1)}
.mark{
  position:absolute;
  top:-2px;bottom:-2px;
  width:1px;
  background:rgba(255,255,255,.55);
  pointer-events:none;
}
#hover{
  position:absolute;
  bottom:22px;
  transform:translateX(-50%);
  padding:4px 7px;
  border:1px solid var(--line);
  border-radius:2px;
  background:#000;
  font-size:10px;
  letter-spacing:.1em;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transition:opacity .12s ease;
}
#scrub:hover #hover{opacity:1}

/* button row */
#row{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:8px;
}
#row .spacer{flex:1}

.btn{
  appearance:none;
  background:none;
  border:1px solid transparent;
  border-radius:2px;
  color:var(--ink);
  width:38px;height:34px;
  display:grid;place-items:center;
  cursor:pointer;
  transition:border-color .15s ease,opacity .15s ease;
  opacity:.85;
  flex:0 0 auto;
}
.btn:hover,.btn:focus-visible{border-color:var(--line-hi);opacity:1;outline:none}
.btn:active{opacity:.6}
.btn svg{width:19px;height:19px;display:block}
.btn.wide{width:auto;padding:0 11px;font-size:11px;letter-spacing:.12em}

/* icon swapping */
#playBtn .i-pause,#stage.playing #playBtn .i-play{display:none}
#stage.playing #playBtn .i-pause{display:block}
#muteBtn .i-mute,#stage.muted #muteBtn .i-vol{display:none}
#stage.muted #muteBtn .i-mute{display:block}
#fsBtn .i-fsout,#stage.fs #fsBtn .i-fsin{display:none}
#stage.fs #fsBtn .i-fsout{display:block}

/* time */
#time{
  font-size:11px;
  letter-spacing:.1em;
  color:var(--dim);
  padding:0 8px;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
#time b{font-weight:400;color:var(--ink)}

/* volume */
#volWrap{display:flex;align-items:center}
#vol{
  width:0;
  opacity:0;
  transition:width .2s ease,opacity .2s ease;
  overflow:hidden;
}
#volWrap:hover #vol,#volWrap:focus-within #vol{width:74px;opacity:1;margin:0 8px 0 2px}
#vol input{
  appearance:none;-webkit-appearance:none;
  width:74px;height:14px;background:none;cursor:pointer;display:block;
}
#vol input::-webkit-slider-runnable-track{height:3px;border:1px solid var(--line);border-radius:2px}
#vol input::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;margin-top:-4.5px;border:1px solid var(--ink);border-radius:50%;background:var(--bg)}
#vol input::-moz-range-track{height:3px;border:1px solid var(--line);border-radius:2px}
#vol input::-moz-range-thumb{width:9px;height:9px;border:1px solid var(--ink);border-radius:50%;background:var(--bg)}

/* ---------------- popovers ---------------- */
.pop{
  position:absolute;
  bottom:calc(100% + 10px);
  right:0;
  min-width:134px;
  max-height:58vh;
  overflow-y:auto;
  border:1px solid var(--line);
  border-radius:2px;
  background:#000;
  padding:5px;
  display:none;
}
.pop.open{display:block}
.pop .head{
  font-size:9px;letter-spacing:.24em;color:var(--dim);
  padding:6px 9px 8px;
}
.pop button{
  appearance:none;background:none;border:1px solid transparent;border-radius:2px;
  color:var(--ink);width:100%;text-align:left;
  padding:8px 9px;font:inherit;font-size:11px;letter-spacing:.1em;
  white-space:nowrap;
  cursor:pointer;opacity:.7;display:flex;gap:10px;align-items:baseline;
}
.pop button:hover,.pop button:focus-visible{border-color:var(--line);opacity:1;outline:none}
.pop button[aria-checked="true"],
.pop button[aria-current="true"]{opacity:1;border-color:var(--line-hi)}
.pop button .n{color:var(--dim);font-size:10px;min-width:30px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.popHost{position:relative}
#chapPop{min-width:250px}
@media (max-width:560px){ #chapPop{min-width:0;width:min(74vw,250px)} }

/* ---------------- no source panel ---------------- */
#loader{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  z-index:7;
  background:var(--bg);
  text-align:center;
  padding:24px;
}
#loader.hidden{display:none}
#loader .box{
  border:1px solid var(--line);
  border-radius:3px;
  padding:34px 30px;
  max-width:420px;
}
#loader h1{
  font-size:13px;font-weight:400;letter-spacing:.34em;margin-bottom:14px;
}
#loader p{font-size:11px;line-height:1.9;color:var(--dim);letter-spacing:.1em}
#loader .pick{
  margin-top:22px;
  border:1px solid var(--line-hi);
  border-radius:2px;
  background:none;color:var(--ink);
  padding:11px 20px;
  font:inherit;font-size:11px;letter-spacing:.2em;
  cursor:pointer;
}
#loader .pick:hover{background:#fff;color:#000}
#stage.dragover #loader .box{border-color:var(--line-hi)}
#file{display:none}

/* spinner while buffering */
#spin{
  position:absolute;top:50%;left:50%;
  width:34px;height:34px;margin:-17px 0 0 -17px;
  border:1px solid rgba(255,255,255,.18);
  border-top-color:var(--ink);
  border-radius:50%;
  display:none;
  z-index:4;
  animation:spin .9s linear infinite;
}
#stage.waiting #spin{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:560px){
  :root{--pad:12px}
  #time{font-size:10px;padding:0 5px}
  .btn{width:34px}
  #volWrap{display:none}          /* phones use hardware volume */
}
</style>
</head>
<body>

<div id="stage">

  <video id="video" playsinline webkit-playsinline preload="metadata"></video>

  <div id="slug">RUN FROM ZOMBIES</div>

  <!-- tap targets: left = rewind, middle = play/pause, right = forward -->
  <div id="zones">
    <div class="zone" data-side="back">
      <div class="ripple" id="ripBack">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 5 9l6 4"/><path d="M5 9h8a6 6 0 1 1-6 6"/>
        </svg>
        <span class="amt">10</span>
      </div>
    </div>
    <div class="zone mid" data-side="mid"></div>
    <div class="zone" data-side="fwd">
      <div class="ripple" id="ripFwd">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 5l6 4-6 4"/><path d="M19 9h-8a6 6 0 1 0 6 6"/>
        </svg>
        <span class="amt">10</span>
      </div>
    </div>
  </div>

  <div id="flash">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.2" stroke-linejoin="round">
      <path id="flashIcon" d="M8 5l11 7-11 7z"/>
    </svg>
  </div>

  <div id="spin"></div>

  <!-- ------------------------------------------------ controls -->
  <div id="controls">
    <div id="chapter"></div>

    <div id="scrub" role="slider" aria-label="Seek" tabindex="0" aria-valuemin="0" aria-valuenow="0">
      <div id="track">
        <div id="buffered"></div>
        <div id="played"></div>
        <div id="knob"></div>
      </div>
      <div id="hover">0:00</div>
    </div>

    <div id="row">
      <button class="btn" id="playBtn" title="Play / pause  (space)" aria-label="Play">
        <svg class="i-play" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"><path d="M8 5l11 7-11 7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round"><path d="M9 5v14M15 5v14"/></svg>
      </button>

      <button class="btn" id="backBtn" title="Back 10s  (J)" aria-label="Back 10 seconds">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 5 9l6 4"/><path d="M5 9h8a6 6 0 1 1-6 6"/>
        </svg>
      </button>

      <button class="btn" id="fwdBtn" title="Forward 10s  (L)" aria-label="Forward 10 seconds">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 5l6 4-6 4"/><path d="M19 9h-8a6 6 0 1 0 6 6"/>
        </svg>
      </button>

      <span id="volWrap">
        <button class="btn" id="muteBtn" title="Mute  (M)" aria-label="Mute">
          <svg class="i-vol" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9h3l5-4v14l-5-4H4z"/><path d="M16 8.5a4 4 0 0 1 0 7"/><path d="M18.5 6a7.5 7.5 0 0 1 0 12"/>
          </svg>
          <svg class="i-mute" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9h3l5-4v14l-5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/>
          </svg>
        </button>
        <span id="vol"><input type="range" min="0" max="1" step=".01" value="1" aria-label="Volume"></span>
      </span>

      <div id="time"><b id="tCur">0:00</b> / <span id="tDur">0:00</span></div>

      <span class="spacer"></span>

      <span class="popHost">
        <button class="btn wide" id="rateBtn" title="Playback speed  ( < and > )" aria-haspopup="true" aria-expanded="false">1&times;</button>
        <div class="pop" id="ratePop" role="menu">
          <div class="head">SPEED</div>
        </div>
      </span>

      <span class="popHost">
        <button class="btn" id="chapBtn" title="Chapters  (C)" aria-haspopup="true" aria-expanded="false" aria-label="Chapters">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round">
            <path d="M9 7h11M9 12h11M9 17h11M4.5 7h.01M4.5 12h.01M4.5 17h.01"/>
          </svg>
        </button>
        <div class="pop" id="chapPop" role="menu">
          <div class="head">PARTS</div>
        </div>
      </span>

      <button class="btn" id="fsBtn" title="Fullscreen  (F)" aria-label="Fullscreen">
        <svg class="i-fsin" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
        </svg>
        <svg class="i-fsout" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ------------------------------------------------ no film yet -->
  <div id="loader">
    <div class="box">
      <h1>RUN FROM ZOMBIES</h1>
      <p>No film loaded yet.<br>Drop a video file anywhere, or choose one.</p>
      <button class="pick" id="pickBtn">SELECT FILM</button>
      <input type="file" id="file" accept="video/*">
    </div>
  </div>

</div>

<script>
(function(){
"use strict";

/* =======================================================
   1. FILM SOURCE
   Once the short film is cut, put its path here and the
   loader panel never appears.  e.g. FILM = "run-from-zombies.mp4";
   ======================================================= */
const FILM = "";

/* =======================================================
   2. CHAPTERS — the 14 parts of the film.
   `at` is the start time in seconds. These are placeholders;
   replace them with the real cut points once the film exists.
   Markers past the end of the video are simply not drawn.
   ======================================================= */
const CHAPTERS = [
  { at:   0, name:"Part 1 — The Bedroom" },
  { at:  45, name:"Part 2 — Walking to the Park" },
  { at: 105, name:"Part 3 — Something Is Wrong" },
  { at: 175, name:"Part 4 — Playing Tag" },
  { at: 250, name:"Part 5 — The First Attack" },
  { at: 310, name:"Part 6 — Under the Slide" },
  { at: 375, name:"Part 7 — We Need a Cure" },
  { at: 430, name:"Part 8 — Another Attack" },
  { at: 490, name:"Part 9 — The Bathroom" },
  { at: 560, name:"Part 10 — The Water Gun Plan" },
  { at: 620, name:"Part 11 — The Zombies" },
  { at: 680, name:"Part 12 — The Final Attack" },
  { at: 730, name:"Part 13 — The Water Gun Falls" },
  { at: 780, name:"Part 14 — The Ending" },
  { at: 830, name:"Title Card — RUN FROM ZOMBIES" }
];

const RATES = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
const STEP  = 10;          // tap-to-seek amount, seconds
const IDLE  = 2600;        // ms before the interface fades away

/* ------------------------------------------------------- refs */
const $ = function(id){ return document.getElementById(id); };
const stage=$("stage"), video=$("video"), controls=$("controls"),
      scrub=$("scrub"), track=$("track"), played=$("played"),
      buffered=$("buffered"), knob=$("knob"), hover=$("hover"),
      tCur=$("tCur"), tDur=$("tDur"), chapterEl=$("chapter"),
      flash=$("flash"), flashIcon=$("flashIcon"),
      ratePop=$("ratePop"), chapPop=$("chapPop"),
      rateBtn=$("rateBtn"), chapBtn=$("chapBtn"),
      loader=$("loader"), fileInput=$("file"),
      volInput=$("vol").firstElementChild;

const ICON_PLAY  = "M8 5l11 7-11 7z";
const ICON_PAUSE = "M9 5v14M15 5v14";

/* ------------------------------------------------------- utils */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

function fmt(t){
  if(!isFinite(t) || t<0) t = 0;
  t = Math.floor(t);
  const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
  const mm = h ? String(m).padStart(2,"0") : String(m);
  return (h ? h+":" : "") + mm + ":" + String(s).padStart(2,"0");
}

/* ------------------------------------------------------- idle */
let idleTimer = 0;
function wake(){
  stage.classList.remove("idle");
  clearTimeout(idleTimer);
  if(!video.paused && !popOpen()) idleTimer = setTimeout(sleep, IDLE);
}
function sleep(){
  if(video.paused || popOpen() || dragging) return;
  stage.classList.add("idle");
}
stage.addEventListener("pointermove", wake);
stage.addEventListener("pointerdown", wake);
controls.addEventListener("pointerenter", function(){ clearTimeout(idleTimer); });

/* ------------------------------------------------------- source */
function load(src, label){
  video.src = src;
  loader.classList.add("hidden");
  if(label) $("slug").textContent = label;
  video.load();
  wake();
}
if(FILM) load(FILM);

$("pickBtn").addEventListener("click", function(){ fileInput.click(); });
fileInput.addEventListener("change", function(){
  const f = fileInput.files && fileInput.files[0];
  if(f) load(URL.createObjectURL(f));
});
["dragenter","dragover"].forEach(function(ev){
  stage.addEventListener(ev, function(e){ e.preventDefault(); stage.classList.add("dragover"); });
});
["dragleave","drop"].forEach(function(ev){
  stage.addEventListener(ev, function(e){ e.preventDefault(); stage.classList.remove("dragover"); });
});
stage.addEventListener("drop", function(e){
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if(f && f.type.indexOf("video") === 0) load(URL.createObjectURL(f));
});

/* ------------------------------------------------------- play state */
function toggle(){
  if(!video.src) return;
  if(video.paused) video.play().catch(function(){}); else video.pause();
}
function showFlash(playing){
  flashIcon.setAttribute("d", playing ? ICON_PLAY : ICON_PAUSE);
  flash.classList.remove("on");
  void flash.offsetWidth;
  flash.classList.add("on");
}
video.addEventListener("play",  function(){ stage.classList.add("playing"); $("playBtn").setAttribute("aria-label","Pause"); wake(); });
video.addEventListener("pause", function(){ stage.classList.remove("playing"); $("playBtn").setAttribute("aria-label","Play"); wake(); });
video.addEventListener("waiting", function(){ stage.classList.add("waiting"); });
["playing","canplay","seeked","error"].forEach(function(ev){
  video.addEventListener(ev, function(){ stage.classList.remove("waiting"); });
});
video.addEventListener("ended", function(){ wake(); });

$("playBtn").addEventListener("click", toggle);
$("backBtn").addEventListener("click", function(){ seekBy(-STEP); bump("back", STEP); });
$("fwdBtn").addEventListener("click",  function(){ seekBy( STEP); bump("fwd",  STEP); });

/* ------------------------------------------------------- seeking */
function seekTo(t){
  if(!isFinite(video.duration)) return;
  video.currentTime = clamp(t, 0, video.duration);
  paint();
}
function seekBy(d){
  if(!video.src) return;
  seekTo((video.currentTime || 0) + d);
}

/* ------------------------------------------------------- tap zones */
const ripples = { back: $("ripBack"), fwd: $("ripFwd") };
let tapSide = null, tapTime = 0, tapAmount = 0, tapReset = 0;

function bump(side, amount){
  const r = ripples[side];
  if(!r) return;
  r.querySelector(".amt").textContent = amount;
  r.classList.remove("on");
  void r.offsetWidth;
  r.classList.add("on");
}

const isTouchLike = function(e){ return e.pointerType !== "mouse"; };

$("zones").addEventListener("pointerdown", function(e){
  if(!isTouchLike(e)) return;              // mouse is handled by click / dblclick
  const zone = e.target.closest(".zone");
  if(!zone) return;
  const side  = zone.dataset.side;
  const now   = e.timeStamp;
  const quick = (now - tapTime) < 340 && side === tapSide;

  tapTime = now;
  tapSide = side;

  if(side === "mid"){
    if(!quick){ toggle(); showFlash(video.paused); }
    return;
  }

  if(quick){
    // second (and further) taps on the same side accumulate: 10, 20, 30 ...
    tapAmount += STEP;
    seekBy(side === "back" ? -STEP : STEP);
    bump(side, tapAmount);
  }else{
    // a first tap only reveals the interface, it never jumps
    tapAmount = 0;
    wake();
  }
  clearTimeout(tapReset);
  tapReset = setTimeout(function(){ tapAmount = 0; tapSide = null; }, 900);
});

/* mouse: single click toggles, double click goes fullscreen.
   The toggle is held back briefly so a double click does not play/pause twice. */
let clickTimer = 0;
$("zones").addEventListener("click", function(e){
  if(e.pointerType === "touch" || !matchMedia("(hover:hover)").matches) return;
  clearTimeout(clickTimer);
  clickTimer = setTimeout(function(){ toggle(); showFlash(video.paused); }, 210);
});
$("zones").addEventListener("dblclick", function(){
  if(!matchMedia("(hover:hover)").matches) return;
  clearTimeout(clickTimer);
  toggleFullscreen();
});

/* ------------------------------------------------------- scrubber */
let dragging = false;

function ratioFromEvent(e){
  const r = track.getBoundingClientRect();
  return clamp((e.clientX - r.left) / r.width, 0, 1);
}
scrub.addEventListener("pointerdown", function(e){
  if(!isFinite(video.duration)) return;
  dragging = true;
  scrub.classList.add("dragging");
  scrub.setPointerCapture(e.pointerId);
  seekTo(ratioFromEvent(e) * video.duration);
});
scrub.addEventListener("pointermove", function(e){
  if(isFinite(video.duration)){
    const r  = ratioFromEvent(e);
    hover.textContent = fmt(r * video.duration);
    hover.style.left  = (r * 100) + "%";
    if(dragging) seekTo(r * video.duration);
  }
});
scrub.addEventListener("pointerup", function(e){
  dragging = false;
  scrub.classList.remove("dragging");
  try{ scrub.releasePointerCapture(e.pointerId); }catch(err){}
  wake();
});
scrub.addEventListener("pointercancel", function(){ dragging = false; scrub.classList.remove("dragging"); });

/* ------------------------------------------------------- painting */
function currentChapter(t){
  let found = null;
  for(let i = 0; i < CHAPTERS.length; i++){
    if(t >= CHAPTERS[i].at) found = CHAPTERS[i]; else break;
  }
  return found;
}
function paint(){
  const d = video.duration, t = video.currentTime || 0;
  const pct = isFinite(d) && d > 0 ? (t / d) * 100 : 0;
  played.style.width = pct + "%";
  knob.style.left    = pct + "%";
  tCur.textContent   = fmt(t);
  scrub.setAttribute("aria-valuenow", Math.round(t));
  scrub.setAttribute("aria-valuetext", fmt(t));

  if(video.buffered.length){
    const end = video.buffered.end(video.buffered.length - 1);
    buffered.style.width = (isFinite(d) && d > 0 ? (end / d) * 100 : 0) + "%";
  }

  const ch = currentChapter(t);
  chapterEl.textContent = ch && isFinite(d) ? ch.name.toUpperCase() : "";
}
video.addEventListener("timeupdate", paint);
video.addEventListener("progress", paint);
video.addEventListener("loadedmetadata", function(){
  tDur.textContent = fmt(video.duration);
  scrub.setAttribute("aria-valuemax", Math.round(video.duration) || 0);
  drawMarks();
  paint();
});

function drawMarks(){
  Array.prototype.forEach.call(track.querySelectorAll(".mark"), function(m){ m.remove(); });
  const d = video.duration;
  if(!isFinite(d) || d <= 0) return;
  CHAPTERS.forEach(function(c){
    if(c.at <= 0 || c.at >= d) return;
    const m = document.createElement("div");
    m.className = "mark";
    m.style.left = (c.at / d) * 100 + "%";
    track.appendChild(m);
  });
}

/* ------------------------------------------------------- volume */
$("muteBtn").addEventListener("click", function(){ video.muted = !video.muted; });
volInput.addEventListener("input", function(){
  video.volume = parseFloat(volInput.value);
  video.muted  = video.volume === 0;
});
video.addEventListener("volumechange", function(){
  stage.classList.toggle("muted", video.muted || video.volume === 0);
  volInput.value = video.muted ? 0 : video.volume;
  $("muteBtn").setAttribute("aria-label", video.muted ? "Unmute" : "Mute");
});

/* ------------------------------------------------------- speed */
function setRate(r){
  video.playbackRate = r;
  rateBtn.innerHTML = (r === 1 ? "1" : String(r)) + "&times;";
  Array.prototype.forEach.call(ratePop.querySelectorAll("button"), function(b){
    b.setAttribute("aria-checked", parseFloat(b.dataset.rate) === r ? "true" : "false");
  });
}
function nudgeRate(dir){
  const i = RATES.indexOf(video.playbackRate);
  const j = clamp((i === -1 ? RATES.indexOf(1) : i) + dir, 0, RATES.length - 1);
  setRate(RATES[j]);
  wake();
}
RATES.forEach(function(r){
  const b = document.createElement("button");
  b.type = "button";
  b.setAttribute("role","menuitemradio");
  b.dataset.rate = r;
  b.textContent = (r === 1 ? "NORMAL" : r + "×");
  b.addEventListener("click", function(){ setRate(r); closePops(); });
  ratePop.appendChild(b);
});

/* ------------------------------------------------------- chapters menu */
const chapButtons = CHAPTERS.map(function(c){
  const b = document.createElement("button");
  b.type = "button";
  b.setAttribute("role","menuitem");
  b.innerHTML = '<span class="n">' + fmt(c.at) + "</span><span>" +
                c.name.replace(/^Part \d+ — |^Title Card — /,"") + "</span>";
  b.addEventListener("click", function(){ seekTo(c.at); closePops(); wake(); });
  chapPop.appendChild(b);
  return b;
});
function markChapter(){
  const ch = currentChapter(video.currentTime || 0);
  const i  = ch ? CHAPTERS.indexOf(ch) : -1;
  chapButtons.forEach(function(b, n){ b.setAttribute("aria-current", n === i ? "true" : "false"); });
  return i;
}

/* ------------------------------------------------------- popovers */
function popOpen(){ return !!document.querySelector(".pop.open"); }
function closePops(){
  Array.prototype.forEach.call(document.querySelectorAll(".pop"), function(p){ p.classList.remove("open"); });
  rateBtn.setAttribute("aria-expanded","false");
  chapBtn.setAttribute("aria-expanded","false");
}
function togglePop(pop, btn){
  const wasOpen = pop.classList.contains("open");
  closePops();
  if(!wasOpen){
    pop.classList.add("open");
    btn.setAttribute("aria-expanded","true");
    clearTimeout(idleTimer);
  }
}
rateBtn.addEventListener("click", function(e){ e.stopPropagation(); togglePop(ratePop, rateBtn); });
chapBtn.addEventListener("click", function(e){ e.stopPropagation(); openChapters(); });
function openChapters(){
  const wasOpen = chapPop.classList.contains("open");
  togglePop(chapPop, chapBtn);
  if(wasOpen) return;
  const i = markChapter();
  if(i > -1) chapButtons[i].scrollIntoView({ block:"nearest" });
}
document.addEventListener("click", function(e){
  if(!e.target.closest(".popHost")) closePops();
});

/* ------------------------------------------------------- fullscreen */
function toggleFullscreen(){
  if(document.fullscreenElement || document.webkitFullscreenElement){
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }else if(stage.requestFullscreen){
    stage.requestFullscreen().catch(function(){});
  }else if(stage.webkitRequestFullscreen){
    stage.webkitRequestFullscreen();
  }else if(video.webkitEnterFullscreen){
    video.webkitEnterFullscreen();          // iPhone falls back to native
  }
}
$("fsBtn").addEventListener("click", toggleFullscreen);
["fullscreenchange","webkitfullscreenchange"].forEach(function(ev){
  document.addEventListener(ev, function(){
    const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
    stage.classList.toggle("fs", on);
    $("fsBtn").setAttribute("aria-label", on ? "Exit fullscreen" : "Fullscreen");
  });
});

/* ------------------------------------------------------- keyboard */
document.addEventListener("keydown", function(e){
  if(e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  let handled = true;

  switch(k){
    case " ": case "k": case "K":
      toggle(); showFlash(video.paused); break;
    case "ArrowLeft":  seekBy(-5);    bump("back", 5);    break;
    case "ArrowRight": seekBy( 5);    bump("fwd",  5);    break;
    case "j": case "J": seekBy(-STEP); bump("back", STEP); break;
    case "l": case "L": seekBy( STEP); bump("fwd",  STEP); break;
    case "ArrowUp":   volInput.value = clamp(video.volume + .05, 0, 1); volInput.dispatchEvent(new Event("input")); break;
    case "ArrowDown": volInput.value = clamp(video.volume - .05, 0, 1); volInput.dispatchEvent(new Event("input")); break;
    case "m": case "M": video.muted = !video.muted; break;
    case "f": case "F": toggleFullscreen(); break;
    case "c": case "C": openChapters(); break;
    case ",": case "<": nudgeRate(-1); break;
    case ".": case ">": nudgeRate( 1); break;
    case "Home": seekTo(0); break;
    case "End":  seekTo(video.duration); break;
    case "Escape": if(popOpen()) closePops(); else handled = false; break;
    default:
      if(k >= "0" && k <= "9" && isFinite(video.duration)){
        seekTo(video.duration * (parseInt(k,10) / 10));
      }else{
        handled = false;
      }
  }
  if(handled){ e.preventDefault(); wake(); }
});

/* ------------------------------------------------------- boot */
setRate(1);
paint();
wake();

})();
</script>
</body>
</html>
