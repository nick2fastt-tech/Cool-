<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0f14">
<title>Human Test 3D</title>
<style>
:root {
  --bg: #0b0f14; --panel: rgba(14, 19, 26, 0.92); --panel2: rgba(22, 29, 39, 0.95); --line: rgba(120, 190, 230, 0.18);
  --text: #dde7ef; --dim: #8597a6; --accent: #4fd1ff; --accent2: #7cffb2; --warn: #ffb347; --danger: #ff5a5f; --zombie: #9cd65a;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--sans); }
body { touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
button { font-family: inherit; cursor: pointer; }
.hidden { display: none !important; }

/* ---------------- Loading screen ---------------- */
#loading { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; overflow: hidden;
  background: radial-gradient(ellipse at 50% 40%, #142233 0%, #070a0e 70%); transition: opacity 0.9s ease; }
#loading.fade { opacity: 0; pointer-events: none; }
.ld-grid { position: absolute; inset: -50%; background-image: linear-gradient(rgba(79,209,255,0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(79,209,255,0.07) 1px, transparent 1px);
  background-size: 48px 48px; transform: perspective(600px) rotateX(62deg) translateY(0); animation: gridmove 6s linear infinite; transform-origin: 50% 100%; top: 30%; }
@keyframes gridmove { from { background-position: 0 0; } to { background-position: 0 48px; } }
.ld-vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.75) 100%); pointer-events: none; }
.ld-center { position: relative; width: min(640px, 94vw); text-align: center; }
.ld-figure { width: 110px; height: 150px; margin: 0 auto 10px; position: relative; }
.ld-figure svg { width: 100%; height: 100%; filter: drop-shadow(0 0 8px rgba(79,209,255,0.55)); }
.ld-scan { position: absolute; left: -10px; right: -10px; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: scan 2.2s ease-in-out infinite; box-shadow: 0 0 12px var(--accent); }
@keyframes scan { 0% { top: 0; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
#loading h1 { white-space: nowrap; font-size: clamp(24px, 7.2vw, 50px); letter-spacing: 0.18em; font-weight: 800; color: #eef7ff; text-shadow: 0 0 22px rgba(79,209,255,0.55); margin-left: 0.22em; }
#loading h1 span { color: var(--accent); }
.ld-sub { font-family: var(--mono); font-size: clamp(10px, 2.6vw, 13px); letter-spacing: 0.35em; color: var(--dim); margin: 6px 0 26px; }
.ld-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; border: 1px solid var(--line); }
.ld-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #1b8fd1, var(--accent), var(--accent2)); box-shadow: 0 0 12px var(--accent); transition: width 0.25s ease; }
.ld-row { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--dim); margin-top: 8px; }
.ld-pct { color: var(--accent); font-weight: 700; }
.ld-list { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 18px; margin: 18px auto 0; max-width: 440px; text-align: left; font-family: var(--mono); font-size: 11.5px; }
.ld-list li { color: #4b5a66; transition: color 0.3s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ld-list li::before { content: '\25CB  '; }
.ld-list li.active { color: var(--warn); } .ld-list li.active::before { content: '\25D4  '; }
.ld-list li.done { color: var(--accent2); } .ld-list li.done::before { content: '\25CF  '; }
.ld-tip { margin-top: 24px; min-height: 40px; font-size: 13px; color: #b9c8d4; line-height: 1.5; padding: 0 10px; transition: opacity 0.4s; }
.ld-tip b { color: var(--accent); font-weight: 600; }
.ld-hint { position: absolute; bottom: max(16px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 11px; color: #56697a; font-family: var(--mono); letter-spacing: 0.1em; }

/* ---------------- HUD ---------------- */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 14; }
#hud > * { pointer-events: auto; }
#topbar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px; padding: max(8px, env(safe-area-inset-top)) 10px 8px; pointer-events: none;
  background: linear-gradient(180deg, rgba(5,8,12,0.55), transparent); }
#topbar > * { pointer-events: auto; }
.brand { font-weight: 800; letter-spacing: 0.18em; font-size: 13px; color: #eaf6ff; text-shadow: 0 0 10px rgba(79,209,255,0.4); white-space: nowrap; background: rgba(8,12,17,0.62); padding: 4px 10px; border-radius: 7px; border: 1px solid var(--line); }
.brand small { display: block; font-family: var(--mono); font-weight: 400; letter-spacing: 0.08em; font-size: 10px; color: var(--dim); }
#stats { font-family: var(--mono); font-size: 11px; color: #b3c3cf; flex: 0 1 auto; margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(8,12,17,0.62); padding: 5px 9px; border-radius: 7px; border: 1px solid var(--line); }
#stats b { color: var(--text); font-weight: 600; } #stats .z { color: var(--zombie); } #stats .d { color: var(--danger); }
.tb-btns { display: flex; gap: 8px; margin-left: auto; }
.tbtn.big { height: 40px; padding: 0 14px; font-size: 14px; font-weight: 600; border-radius: 10px; }
.tbtn.big svg { width: 18px; height: 18px; }
.tbtn { height: 34px; min-width: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: rgba(14,19,26,0.75); color: var(--text); font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; backdrop-filter: blur(6px); }
.tbtn:hover { border-color: rgba(79,209,255,0.5); }
.tbtn.on { background: rgba(79,209,255,0.18); border-color: var(--accent); color: #fff; }
.tbtn svg { width: 16px; height: 16px; }
#crosshair { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; transform: translate(-50%, -50%); pointer-events: none; }
#crosshair svg { width: 100%; height: 100%; }
#hitmarker { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; transform: translate(-50%, -50%) scale(0.6); opacity: 0; pointer-events: none; transition: opacity 0.12s, transform 0.12s; }
#hitmarker.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#scope { position: absolute; inset: 0; pointer-events: none; display: none; background: radial-gradient(circle at center, transparent 0, transparent min(38vh, 38vw), rgba(0,0,0,0.97) calc(min(38vh, 38vw) + 1px)); }
#scope.on { display: block; }
#scope::before, #scope::after { content: ''; position: absolute; background: rgba(0,0,0,0.85); }
#scope::before { left: 50%; top: calc(50% - min(38vh, 38vw)); bottom: calc(50% - min(38vh, 38vw)); width: 1.5px; transform: translateX(-50%); }
#scope::after { top: 50%; left: calc(50% - min(38vh, 38vw)); right: calc(50% - min(38vh, 38vw)); height: 1.5px; transform: translateY(-50%); }
.scope-dot { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: #ff3b30; }
#toolbar { position: absolute; left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; border-radius: 12px; background: rgba(10,14,20,0.7); border: 1px solid var(--line); backdrop-filter: blur(8px); }
.slot { width: 62px; height: 56px; border-radius: 10px; border: 1px solid transparent; background: rgba(255,255,255,0.05); color: var(--dim); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; font-size: 9.5px; font-family: var(--mono); touch-action: manipulation; }
.slot svg { width: 34px; height: 24px; }
.slot:active { transform: scale(0.95); }
.slot .key { position: absolute; top: 2px; left: 4px; font-size: 9px; color: #5c6e7c; }
.slot.sel { border-color: var(--accent); color: #fff; background: rgba(79,209,255,0.14); }
.slot.off { opacity: 0.3; }
#ammo { position: absolute; right: 14px; bottom: max(16px, env(safe-area-inset-bottom)); text-align: right; font-family: var(--mono); pointer-events: none; }
#ammo .a-name { font-size: 11px; color: var(--dim); letter-spacing: 0.15em; }
#ammo .a-count { font-size: 26px; font-weight: 700; color: #fff; }
#ammo .a-count small { font-size: 14px; color: var(--dim); }
#ammo .a-status { font-size: 11px; color: var(--warn); min-height: 14px; }
#fps { position: absolute; left: 10px; bottom: max(10px, env(safe-area-inset-bottom)); font-family: var(--mono); font-size: 11px; color: #6c808f; pointer-events: none; }
#toasts { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.toast { background: rgba(10,14,20,0.85); border: 1px solid var(--line); color: var(--text); padding: 7px 14px; border-radius: 8px; font-size: 12.5px; animation: toastIn 0.25s ease; }
.toast.warn { border-color: rgba(255,179,71,0.5); } .toast.bad { border-color: rgba(255,90,95,0.6); } .toast.z { border-color: rgba(156,214,90,0.6); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
#playHint { position: absolute; left: 50%; top: 62%; transform: translateX(-50%); padding: 10px 16px; border-radius: 10px; background: rgba(10,14,20,0.78); border: 1px solid var(--line); font-size: 12.5px; color: #c6d4de; text-align: center; line-height: 1.6; pointer-events: none; max-width: 92vw; }
#playHint kbd { font-family: var(--mono); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-bottom-width: 2px; padding: 0 5px; border-radius: 4px; font-size: 11px; color: #fff; }
#pausedBadge { position: absolute; top: 58px; left: 12px; font-family: var(--mono); font-size: 11px; color: var(--warn); border: 1px solid rgba(255,179,71,0.5); padding: 3px 8px; border-radius: 6px; background: rgba(40,28,8,0.6); pointer-events: none; }

/* NPC labels */
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.npc-label { position: absolute; left: 0; top: 0; transform-origin: 0 0; white-space: nowrap; font-family: var(--mono); font-size: 10.5px; color: #e9f3fa; text-shadow: 0 1px 2px #000, 0 0 4px #000; text-align: center; will-change: transform; }
.npc-label .nm { font-weight: 700; }
.npc-label .st { font-size: 9.5px; color: #a8bccb; }
.npc-label .cd { font-size: 10px; color: var(--zombie); font-weight: 700; }
.npc-label.zombie .nm { color: var(--zombie); } .npc-label.dead .nm { color: #ff8a8d; }
.hit-card { position: absolute; left: 0; top: 0; font-family: var(--mono); font-size: 10.5px; line-height: 1.45; background: rgba(8,12,17,0.86); border: 1px solid rgba(79,209,255,0.45); border-left: 3px solid var(--accent); padding: 5px 8px; border-radius: 4px; color: #d8e6f0; white-space: nowrap; pointer-events: none; transition: opacity 0.4s; }
.hit-card b { color: var(--accent); font-weight: 600; display: inline-block; min-width: 92px; }
.hit-card.crit { border-left-color: var(--danger); }

/* ---------------- Drawer (sandbox controls) ---------------- */
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100vw); z-index: 30; background: var(--panel); border-left: 1px solid var(--line); backdrop-filter: blur(12px);
  transform: translateX(105%); transition: transform 0.28s ease; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }
#drawer.open { transform: none; }
.dr-head { display: flex; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); gap: 8px; }
.dr-head h2 { font-size: 14px; letter-spacing: 0.15em; flex: 1; }
.dr-modes { flex: 1; display: flex; gap: 6px; }
.dr-mode { flex: 1; max-width: 150px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--dim); font-size: 12.5px; font-weight: 700; letter-spacing: 0.12em; }
.dr-mode.sel { background: rgba(79,209,255,0.16); color: #fff; border-color: var(--accent); }
.row > label.toggle { flex: none; }
.dr-tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.dr-tab { font-size: 11.5px; padding: 6px 9px; border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--dim); }
.dr-tab.sel { background: rgba(79,209,255,0.16); color: #fff; border-color: var(--accent); }
.dr-body { flex: 1; overflow-y: auto; padding: 10px 12px 40px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.sec { margin-bottom: 16px; }
.sec h3 { font-size: 11px; letter-spacing: 0.18em; color: var(--accent); margin-bottom: 8px; font-weight: 700; text-transform: uppercase; }
.row { display: flex; align-items: center; gap: 8px; margin: 7px 0; font-size: 12.5px; }
.row > label { flex: 1; color: #c3d1dc; }
.row .val { font-family: var(--mono); font-size: 11.5px; color: var(--accent); min-width: 44px; text-align: right; }
.row input[type=range] { flex: 1.3; accent-color: var(--accent); height: 22px; }
.row select, .row input[type=number], .row input[type=text] { flex: 1.3; background: #0f151d; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; font-size: 12px; font-family: inherit; }
.btn { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: #131b25; color: var(--text); font-size: 12.5px; }
.btn:hover { border-color: rgba(79,209,255,0.55); }
.btn.pri { background: rgba(79,209,255,0.16); border-color: rgba(79,209,255,0.6); color: #fff; }
.btn.bad { border-color: rgba(255,90,95,0.5); color: #ffc9ca; }
.btn.z { border-color: rgba(156,214,90,0.6); color: #dff5c4; }
.btns { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 6px; margin: 6px 0; }
.toggle { position: relative; width: 40px; height: 22px; flex: none; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle span { position: absolute; inset: 0; border-radius: 11px; background: #25303b; transition: 0.2s; border: 1px solid var(--line); }
.toggle span::after { content: ''; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #9fb0bd; transition: 0.2s; }
.toggle input:checked + span { background: rgba(79,209,255,0.35); border-color: var(--accent); }
.toggle input:checked + span::after { transform: translateX(18px); background: #fff; }
.note { font-size: 11px; color: var(--dim); line-height: 1.5; margin: 4px 0 8px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-family: var(--mono); font-size: 11px; }
.kv span:nth-child(odd) { color: var(--dim); } .kv span:nth-child(even) { color: #e6f1f8; }

.wcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.wcard { border: 1px solid var(--line); background: #111923; border-radius: 10px; padding: 10px 6px 8px; color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; touch-action: manipulation; }
.wcard svg { width: 54px; height: 32px; color: #cfe3f0; }
.wcard small { font-size: 10px; color: var(--dim); text-align: center; line-height: 1.3; }
.wcard.sel { border-color: var(--accent); background: rgba(79,209,255,0.14); }
.spawnbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.spawnbtns .btn { padding: 14px 8px; font-size: 14px; font-weight: 600; }
/* ---------------- Inspector ---------------- */
#inspector { position: fixed; left: 10px; top: 60px; width: 270px; max-height: calc(100vh - 150px); overflow-y: auto; z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; backdrop-filter: blur(10px); font-size: 12px; }
#inspector .ins-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
#inspector .ins-head h4 { flex: 1; font-size: 13px; }
#inspector .ins-head h4 small { display: block; font-family: var(--mono); color: var(--dim); font-weight: 400; font-size: 10.5px; }
.xbtn { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--dim); font-size: 14px; }
.ins-body { display: flex; gap: 8px; }
.ins-diagram { width: 92px; flex: none; }
.ins-diagram svg { width: 100%; }
.ins-diagram .rg { fill: rgba(120,160,190,0.14); stroke: rgba(150,200,230,0.45); stroke-width: 1; }
.ins-info { flex: 1; min-width: 0; }
.bar { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; margin: 3px 0 6px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--danger), var(--warn), var(--accent2)); }
.ins-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-top: 8px; }
.ins-actions .btn { padding: 6px 4px; font-size: 11px; }

/* ---------------- Debug + event log ---------------- */
#debugPanel { position: fixed; right: 10px; top: 60px; width: 300px; max-height: calc(100vh - 160px); overflow-y: auto; z-index: 19; background: rgba(6,9,13,0.88); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-family: var(--mono); font-size: 10.5px; line-height: 1.5; color: #b8c8d4; pointer-events: auto; }
#debugPanel h5 { color: var(--accent); font-size: 10.5px; letter-spacing: 0.12em; margin: 6px 0 2px; }
#debugPanel .warn { color: var(--warn); } #debugPanel .bad { color: var(--danger); } #debugPanel .ok { color: var(--accent2); }
.graph { width: 100%; height: 34px; display: block; background: rgba(255,255,255,0.03); border-radius: 4px; }
#eventLog { position: fixed; left: 10px; bottom: 74px; width: min(360px, 70vw); height: 112px; z-index: 18; background: rgba(6,9,13,0.82); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; font-family: var(--mono); font-size: 10.5px; }
#eventLog .el-head { display: flex; align-items: center; padding: 4px 8px; border-bottom: 1px solid var(--line); color: var(--accent); letter-spacing: 0.12em; gap: 6px; }
#eventLog .el-head span { flex: 1; }
#eventLog .el-body { flex: 1; overflow-y: auto; padding: 4px 8px; line-height: 1.45; touch-action: pan-y; }
.ev { color: #a9bac7; } .ev .t { color: #56697a; } .ev.hit { color: #ffd38a; } .ev.death { color: #ff9a9c; } .ev.zombie { color: var(--zombie); } .ev.error { color: #ff5a5f; } .ev.sys { color: #8fd7ff; }
.mini { font-size: 10px; padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line); background: transparent; color: var(--dim); }

/* ---------------- Touch controls ---------------- */
#touch { position: fixed; inset: 0; z-index: 12; pointer-events: none; }
#touch .tz { position: absolute; pointer-events: auto; }
#joyZone { left: 0; bottom: 70px; width: 45%; height: 50%; }
#lookZone { right: 0; bottom: 0; width: 55%; height: 78%; }
#joy { position: absolute; width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.05); display: none; pointer-events: none; }
#joy i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px; border-radius: 50%; background: rgba(79,209,255,0.35); border: 2px solid rgba(79,209,255,0.7); }
.tbtn2 { position: absolute; pointer-events: auto; border-radius: 50%; border: 2px solid rgba(255,255,255,0.22); background: rgba(12,17,24,0.55); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-align: center; backdrop-filter: blur(4px); font-family: var(--mono); letter-spacing: 0.05em; }
.tbtn2.active { background: rgba(79,209,255,0.35); border-color: var(--accent); }
#tFire { right: 24px; bottom: 128px; width: 78px; height: 78px; font-size: 12px; border-color: rgba(255,90,95,0.7); background: rgba(80,16,18,0.45); }
#tAim { right: 112px; bottom: 150px; width: 56px; height: 56px; }
#tReload { right: 112px; bottom: 86px; width: 50px; height: 50px; }
#tUp { left: 22px; bottom: 210px; width: 46px; height: 46px; }
#tDown { left: 76px; bottom: 210px; width: 46px; height: 46px; }

@media (max-width: 760px) {
  .brand small, #stats { display: none; }
  .tbtn .lbl { display: none; }
  .slot { width: 50px; height: 50px; } .slot svg { width: 26px; height: 19px; } .slot .nm { font-size: 8px; } .slot .key { display: none; }
  #toolbar { bottom: max(8px, env(safe-area-inset-bottom)); left: 8px; transform: none; padding: 4px; gap: 4px; }
  #ammo { bottom: 64px; right: 16px; } #ammo .a-count { font-size: 20px; }
  #inspector { width: min(270px, 80vw); top: 56px; font-size: 11px; }
  #debugPanel { width: min(280px, 86vw); top: 56px; }
  #eventLog { bottom: 64px; height: 120px; width: min(330px, 80vw); }
  #fps { bottom: 60px; }
  #playHint { font-size: 11.5px; top: 30%; }
}
/* short screens (phones in landscape): keep the left thumb area clear */
