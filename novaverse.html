<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0b1020" />
<title>NovaVerse</title>
<style>
/* ===========================================================================
   NovaVerse UI — mobile-first, dark, glassy. Designed for touch: large tap
   targets, safe-area insets for notched phones, GPU-friendly transitions, and
   a responsive layout that works from small phones to tablets.
   =========================================================================== */

:root {
  --bg: #0b1020;
  --panel: rgba(22, 28, 46, 0.82);
  --panel-solid: #161c2e;
  --stroke: rgba(255, 255, 255, 0.08);
  --text: #eef2ff;
  --muted: #9aa7c7;
  --accent: #5b8cff;
  --accent-2: #9b5de5;
  --good: #30d158;
  --warn: #ffd60a;
  --bad: #ff453a;
  --coin: #ffd60a;
  --radius: 16px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
  touch-action: none;
}

#game-canvas {
  position: fixed;
  inset: 0;
  /* Explicit display size is REQUIRED: the renderer sets a high-res drawing
     buffer (canvas width/height attributes = viewport × devicePixelRatio) but
     intentionally does not touch CSS size. Without this, the canvas would lay
     out at its intrinsic buffer size (e.g. 2× the viewport, top-left anchored),
     shifting the whole 3D view off-centre. 100%/100% pins it to the viewport. */
  width: 100%;
  height: 100%;
  display: block;
  z-index: 0;
}

#ui-root {
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none; /* children opt back in */
}
#ui-root > * {
  pointer-events: auto;
}

/* ---- Boot loader --------------------------------------------------------- */
#boot {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at 50% 40%, #1a2242, #070a14);
  gap: 22px;
  transition: opacity 0.5s;
}
#boot.hide {
  opacity: 0;
  pointer-events: none;
}
.boot-logo {
  font-size: clamp(34px, 10vw, 64px);
  font-weight: 800;
  letter-spacing: 2px;
  background: linear-gradient(90deg, #5b8cff, #9b5de5, #5b8cff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.boot-logo span {
  opacity: 0.7;
}
.boot-bar {
  width: min(260px, 70vw);
  height: 6px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.1);
  overflow: hidden;
}
.boot-bar-fill {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width 0.3s ease;
}
.boot-hint {
  color: var(--muted);
  font-size: 14px;
}
.boot-error {
  color: var(--bad);
  font-size: 12px;
  max-width: 80vw;
  text-align: center;
}

/* ---- Generic screen scaffold --------------------------------------------- */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding: calc(var(--safe-top) + 14px) calc(var(--safe-right) + 14px)
    calc(var(--safe-bottom) + 14px) calc(var(--safe-left) + 14px);
  background: linear-gradient(180deg, rgba(8, 11, 22, 0.72), rgba(8, 11, 22, 0.92));
  backdrop-filter: blur(8px);
  animation: fadeIn 0.25s ease;
  overflow: hidden;
}
.screen.transparent {
  background: none;
  backdrop-filter: none;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

.screen-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}
.screen-title {
  font-size: 22px;
  font-weight: 700;
}
.screen-body {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-bottom: 8px;
}

/* ---- Buttons ------------------------------------------------------------- */
.btn {
  font: inherit;
  font-weight: 600;
  color: var(--text);
  background: linear-gradient(180deg, #2a3350, #202741);
  border: 1px solid var(--stroke);
  border-radius: 14px;
  padding: 14px 18px;
  cursor: pointer;
  transition: transform 0.08s, filter 0.15s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn:active {
  transform: scale(0.96);
  filter: brightness(1.2);
}
.btn.primary {
  background: linear-gradient(180deg, var(--accent), #3f6fe0);
  border: none;
}
.btn.accent {
  background: linear-gradient(180deg, var(--accent-2), #7b3fd0);
  border: none;
}
.btn.ghost {
  background: rgba(255, 255, 255, 0.06);
}
.btn.small {
  padding: 8px 12px;
  font-size: 13px;
  border-radius: 10px;
}
.btn.icon {
  width: 44px;
  height: 44px;
  padding: 0;
  font-size: 20px;
  border-radius: 12px;
}
.btn:disabled {
  opacity: 0.45;
  pointer-events: none;
}

/* ---- Cards / panels ------------------------------------------------------ */
.card {
  background: var(--panel);
  border: 1px solid var(--stroke);
  border-radius: var(--radius);
  padding: 16px;
}
.row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.spread {
  justify-content: space-between;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
}
.muted {
  color: var(--muted);
  font-size: 13px;
}
.pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  font-size: 12px;
}

/* ---- Inputs -------------------------------------------------------------- */
.input {
  font: inherit;
  width: 100%;
  color: var(--text);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--stroke);
  border-radius: 12px;
  padding: 14px;
  outline: none;
  user-select: text;
  -webkit-user-select: text;
}
.input:focus {
  border-color: var(--accent);
}
.slider {
  width: 100%;
  accent-color: var(--accent);
}

/* ---- Coins / XP HUD ------------------------------------------------------ */
.topbar {
  position: absolute;
  top: calc(var(--safe-top) + 10px);
  left: calc(var(--safe-left) + 10px);
  right: calc(var(--safe-right) + 10px);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  pointer-events: none;
  /* Must sit above the full-screen .touch-layer (z-index 5) so the menu,
     notifications, and player-list buttons remain tappable in-world. */
  z-index: 8;
}
.topbar > * {
  pointer-events: auto;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--panel);
  border: 1px solid var(--stroke);
  border-radius: 999px;
  padding: 8px 12px;
  font-weight: 700;
  font-size: 14px;
}
.xp-wrap {
  min-width: 120px;
}
.xp-bar {
  height: 6px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.12);
  overflow: hidden;
  margin-top: 4px;
}
.xp-fill {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width 0.3s;
}

/* ---- In-game HUD --------------------------------------------------------- */
.hud-info {
  position: absolute;
  top: calc(var(--safe-top) + 64px);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
  pointer-events: none;
}
.hud-stat {
  background: var(--panel);
  border: 1px solid var(--stroke);
  border-radius: 10px;
  padding: 6px 10px;
  font-size: 13px;
  font-weight: 600;
}

/* Touch controls */
.touch-layer {
  position: absolute;
  inset: 0;
  z-index: 5;
  touch-action: none;
}
.joystick-base {
  position: absolute;
  width: 120px;
  height: 120px;
  margin: -60px 0 0 -60px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.08);
  border: 2px solid rgba(255, 255, 255, 0.18);
  pointer-events: none;
}
.joystick-knob {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 52px;
  height: 52px;
  margin: -26px 0 0 -26px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #8fb0ff, #3f6fe0);
  border: 2px solid rgba(255, 255, 255, 0.4);
}
.touch-buttons {
  position: absolute;
  bottom: calc(var(--safe-bottom) + 30px);
  right: calc(var(--safe-right) + 24px);
  display: flex;
  flex-direction: column-reverse;
  gap: 16px;
  z-index: 6;
}
.touch-btn {
  width: calc(72px * var(--btn-scale, 1));
  height: calc(72px * var(--btn-scale, 1));
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.25);
  background: rgba(60, 80, 140, 0.4);
  color: #fff;
  font-size: 26px;
  font-weight: 700;
  backdrop-filter: blur(4px);
}
.touch-btn:active,
.touch-btn.active {
  background: rgba(91, 140, 255, 0.7);
  transform: scale(0.94);
}
.action-buttons {
  position: absolute;
  bottom: calc(var(--safe-bottom) + 30px);
  right: calc(var(--safe-right) + 110px);
  display: flex;
  flex-direction: column-reverse;
  gap: 12px;
  z-index: 6;
}
.action-btn {
  padding: 12px 16px;
  border-radius: 14px;
  border: 1px solid var(--stroke);
  background: rgba(30, 40, 70, 0.7);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  backdrop-filter: blur(4px);
}
.action-btn:active {
  transform: scale(0.94);
}

/* Bottom navigation (home hub) */
.bottom-nav {
  position: absolute;
  bottom: calc(var(--safe-bottom) + 14px);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  background: var(--panel);
  border: 1px solid var(--stroke);
  border-radius: 18px;
  padding: 8px;
  backdrop-filter: blur(10px);
}
.nav-btn {
  width: 56px;
  height: 52px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 22px;
  border-radius: 12px;
  position: relative;
}
.nav-btn.active {
  color: var(--text);
  background: rgba(91, 140, 255, 0.25);
}
.badge {
  position: absolute;
  top: 4px;
  right: 8px;
  min-width: 16px;
  height: 16px;
  border-radius: 8px;
  background: var(--bad);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
}

/* Chat */
.chat {
  position: absolute;
  left: calc(var(--safe-left) + 10px);
  bottom: calc(var(--safe-bottom) + 150px);
  width: min(320px, 62vw);
  z-index: 6;
}
.chat-log {
  max-height: 26vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 8px;
  mask-image: linear-gradient(180deg, transparent, #000 20%);
}
.chat-msg {
  font-size: 13px;
  background: rgba(10, 14, 26, 0.6);
  border-radius: 8px;
  padding: 5px 8px;
  align-self: flex-start;
  max-width: 100%;
}
.chat-msg b {
  color: var(--accent);
}
.chat-msg.self b {
  color: var(--good);
}
.chat-input-row {
  display: none;
  gap: 8px;
}
.chat-input-row.open {
  display: flex;
}

/* Player list */
.playerlist {
  position: absolute;
  top: calc(var(--safe-top) + 64px);
  right: calc(var(--safe-right) + 10px);
  width: 180px;
  max-height: 40vh;
  overflow-y: auto;
  z-index: 6;
}

/* Toasts */
.toast-wrap {
  position: absolute;
  top: calc(var(--safe-top) + 12px);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 30;
  pointer-events: none;
  width: min(360px, 90vw);
}
.toast {
  background: var(--panel-solid);
  border: 1px solid var(--stroke);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  gap: 10px;
  align-items: center;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
  animation: toastIn 0.3s ease;
}
.toast .t-icon {
  font-size: 22px;
}
.toast .t-title {
  font-weight: 700;
  font-size: 14px;
}
.toast .t-text {
  color: var(--muted);
  font-size: 12px;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateY(-12px); }
  to { opacity: 1; transform: none; }
}

/* Modal */
.modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 40;
  padding: 20px;
  animation: fadeIn 0.2s;
}
.modal {
  width: min(420px, 92vw);
  max-height: 80vh;
  overflow-y: auto;
  background: var(--panel-solid);
  border: 1px solid var(--stroke);
  border-radius: 20px;
  padding: 20px;
}

/* Avatar customizer swatches */
.swatches {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.swatch {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  border: 2px solid transparent;
  cursor: pointer;
}
.swatch.sel {
  border-color: #fff;
}

/* Shop / inventory item card */
.item {
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: center;
  text-align: center;
  padding: 12px;
}
.item .price {
  color: var(--coin);
  font-weight: 700;
  font-size: 13px;
}
.item.owned .price {
  color: var(--good);
}

.center-col {
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 18px;
}
.hidden {
  display: none !important;
}

</style>
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="ui-root"></div>
<div id="boot">
  <div class="boot-logo">NOVA<span>VERSE</span></div>
  <div class="boot-bar"><div class="boot-bar-fill" id="boot-bar-fill"></div></div>
  <div class="boot-hint" id="boot-hint">Warming up the engine…</div>
  <div class="boot-error" id="boot-error"></div>
</div>
<script>
window.addEventListener('error', function (e) { var el = document.getElementById('boot-error'); if (el) el.textContent = 'Startup error: ' + (e.message || e.error); });
window.addEventListener('unhandledrejection', function (e) { var el = document.getElementById('boot-error'); if (el) el.textContent = 'Startup error: ' + ((e.reason && e.reason.message) || e.reason); });
</script>
