<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1117">
<title>ANGER OF STICK — OUTBREAK</title>
<style>
  /* ================= design tokens ================= */
  :root{
    --neon:#3ff0a5; --ice:#8fe4ff; --gold:#ffc93c; --viol:#c07bff; --red:#ff5347; --amber:#ff9a3c;
    --bg0:#05070c; --line:#22364c; --txt:#e9f4ff; --dim:#7d97b1;
    --head:'Impact','Haettenschweiler','Arial Narrow',Arial,sans-serif;
    --cut:10px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg0);
    font-family:'Trebuchet MS','Segoe UI',Arial,sans-serif;color:var(--txt);}
  canvas#game{display:block;position:absolute;inset:0;touch-action:none;}
  .hidden{display:none !important;}

  /* ================= screens ================= */
  #screen{position:absolute;inset:0;z-index:20;overflow-y:auto;overflow-x:hidden;
    padding:calc(8px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling:touch;
    background:
      radial-gradient(900px 460px at 82% -12%, rgba(63,240,165,.16), transparent 62%),
      radial-gradient(760px 420px at 8% 112%, rgba(255,83,71,.15), transparent 62%),
      linear-gradient(165deg, rgba(5,9,16,.66), rgba(8,14,26,.56) 45%, rgba(18,8,20,.70));
    backdrop-filter:blur(3.5px) saturate(1.15);-webkit-backdrop-filter:blur(3.5px) saturate(1.15);}
  #screen::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
    background:repeating-linear-gradient(0deg, rgba(140,220,255,.035) 0 1px, transparent 1px 3px);
    animation:scan 9s linear infinite;}
  #screen::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
    box-shadow:inset 0 0 150px 34px rgba(0,0,0,.62);}
  @keyframes scan{from{background-position:0 0}to{background-position:0 120px}}
  #screen.clear{background:
      radial-gradient(700px 400px at 50% -10%, rgba(255,83,71,.14), transparent 60%),
      linear-gradient(180deg, rgba(4,7,13,.90), rgba(4,7,13,.82));}
  .wrap{max-width:860px;margin:0 auto;position:relative;z-index:2;}
  #screen::-webkit-scrollbar{width:6px}
  #screen::-webkit-scrollbar-thumb{background:#24506b;border-radius:6px}

  h1.logo{font-family:var(--head);font-size:clamp(34px,10vw,72px);letter-spacing:2px;text-align:center;line-height:.94;
    text-transform:uppercase;
    background:linear-gradient(180deg,#ffffff 6%,#bfeaff 42%,#3ff0a5 52%,#178f63 96%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 0 rgba(0,0,0,.55)) drop-shadow(0 0 22px rgba(63,240,165,.45));
    animation:flick 5.5s infinite;}
  @keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.55}94%{opacity:1}96%{opacity:.7}97%{opacity:1}}
  h1.logo span{display:block;font-size:.34em;letter-spacing:12px;margin-top:10px;
    background:linear-gradient(180deg,#ff9a3c,#ff5347);-webkit-background-clip:text;background-clip:text;color:transparent;}
  h2.title{font-family:var(--head);font-size:clamp(19px,5.4vw,30px);letter-spacing:3px;color:#dff2ff;
    margin:4px 0 12px;text-transform:uppercase;display:flex;align-items:center;gap:10px;
    text-shadow:0 2px 8px rgba(0,0,0,.85);}
  h2.title::before{content:'';width:5px;height:1.05em;background:linear-gradient(180deg,var(--neon),var(--ice));
    box-shadow:0 0 12px rgba(63,240,165,.8);}
  h2.title::after{content:'';flex:1;height:6px;
    background:repeating-linear-gradient(115deg,rgba(63,240,165,.32) 0 8px,transparent 8px 16px);}
  .sub{text-align:center;color:#9fb8cd;letter-spacing:4px;font-size:clamp(10px,2.9vw,13px);
    margin:8px 0 18px;text-transform:uppercase;text-shadow:0 2px 8px rgba(0,0,0,.9);}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:stretch;}
  .grid{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));}
  .grid3{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));}
  .spacer{height:12px} .center{text-align:center} .muted{color:var(--dim);font-size:11px;letter-spacing:1px}

  /* ================= buttons ================= */
  .btn{position:relative;overflow:hidden;font-family:var(--head);font-size:clamp(14px,3.9vw,19px);letter-spacing:2px;
    color:#eaf8ff;background:linear-gradient(180deg,#18304a,#0a1523);border:1px solid #2f6b8f;
    padding:13px 20px 12px;cursor:pointer;text-transform:uppercase;
    clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12), inset 0 -14px 18px rgba(0,0,0,.35);
    transition:transform .07s, filter .12s;}
  .btn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ice);
    box-shadow:0 0 10px var(--ice);opacity:.85;}
  .btn::after{content:'';position:absolute;inset:0;transform:translateX(-130%);
    background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.30) 50%,transparent 58%);}
  .btn:active{transform:translateY(2px);filter:brightness(1.35);}
  .btn:active::after{transform:translateX(130%);transition:transform .55s ease-out;}
  .btn small{display:block;font-family:'Trebuchet MS',sans-serif;font-size:11px;letter-spacing:1px;
    color:var(--neon);font-weight:normal;margin-top:3px;text-transform:none;}
  .btn.big{width:100%;padding:16px 20px;font-size:clamp(16px,4.6vw,23px);}
  .btn.go{background:linear-gradient(180deg,#12704a,#06301f);border-color:var(--neon);color:#eafff4;}
  .btn.go::before{background:var(--neon);box-shadow:0 0 12px var(--neon)}
  .btn.go small{color:#bfffe4}
  .btn.warn{background:linear-gradient(180deg,#7d2622,#3a0e0c);border-color:var(--red);}
  .btn.warn::before{background:var(--red);box-shadow:0 0 12px var(--red)}
  .btn.ghost{background:linear-gradient(180deg,#141d2a,#090e16);border-color:#3a4d63;color:#9db4ca;}
  .btn.ghost::before{background:#3a4d63;box-shadow:none}
  .btn:disabled{opacity:.4;filter:grayscale(.75);}

  /* ================= cards ================= */
  .card{position:relative;overflow:hidden;padding:11px 11px 12px;
    background:linear-gradient(180deg,rgba(24,38,58,.94),rgba(8,14,24,.94));
    border:1px solid var(--line);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%);
    animation:cardIn .32s cubic-bezier(.2,.9,.3,1.2) backwards;}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
  .card:nth-child(1){animation-delay:.02s} .card:nth-child(2){animation-delay:.05s}
  .card:nth-child(3){animation-delay:.08s} .card:nth-child(4){animation-delay:.11s}
  .card:nth-child(5){animation-delay:.14s} .card:nth-child(6){animation-delay:.17s}
  .card:nth-child(7){animation-delay:.20s} .card:nth-child(8){animation-delay:.23s}
  .card:nth-child(n+9){animation-delay:.26s}
  .card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--tone,var(--ice));box-shadow:0 0 14px var(--tone,var(--ice));opacity:.9;}
  .card[data-act]{cursor:pointer;transition:transform .1s, box-shadow .18s, border-color .18s;}
  .card[data-act]:active{transform:translateY(2px) scale(.985);border-color:var(--tone,var(--ice));
    box-shadow:0 0 22px rgba(143,228,255,.25);}
  .card.sel{border-color:var(--neon);box-shadow:0 0 0 1px rgba(63,240,165,.55),0 0 24px rgba(63,240,165,.22);}
  .card.locked{filter:grayscale(.65);opacity:.6;}
  .card.locked::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(135deg,rgba(255,83,71,.10) 0 9px,transparent 9px 18px);}
  .card h3{font-family:var(--head);font-size:15px;letter-spacing:1.4px;color:#f0f8ff;margin-bottom:4px;
    text-transform:uppercase;padding-left:8px;}
  .card .meta{font-size:11.5px;color:#93aec6;line-height:1.6;padding-left:8px;}
  .card .glyph{position:absolute;right:7px;bottom:0;font-size:32px;line-height:1;opacity:.13;
    color:var(--tone,var(--ice));pointer-events:none;font-family:var(--head);}
  .card .tag{position:absolute;top:0;right:0;background:var(--neon);color:#032015;font-size:9.5px;
    font-weight:bold;padding:3px 9px 3px 12px;letter-spacing:1.5px;
    clip-path:polygon(8px 0,100% 0,100% 100%,0 100%);}
  .card .tag.red{background:var(--red);color:#280604} .card .tag.gold{background:var(--gold);color:#2e2000}

  /* ================= bars ================= */
  .bar{position:relative;height:9px;background:#070d16;border:1px solid #1d3348;overflow:hidden;margin-top:5px;}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--neon),var(--ice));
    box-shadow:0 0 12px rgba(63,240,165,.5);transition:width .18s ease-out;}
  .bar::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(0,0,0,.55) 9px 11px);}
  .bar.red > i{background:linear-gradient(90deg,#ff2f2f,#ff9a3c);box-shadow:0 0 12px rgba(255,80,60,.55)}
  .bar.blue > i{background:linear-gradient(90deg,#2f7bff,#8fe4ff);box-shadow:0 0 12px rgba(90,170,255,.55)}
  .bar.xp > i{background:linear-gradient(90deg,#ffc93c,#fff3a8);box-shadow:0 0 12px rgba(255,201,60,.5)}
  .bar.inf > i{background:linear-gradient(90deg,#2fbf7a,#8fffc8);box-shadow:0 0 12px rgba(63,240,165,.7)}

  /* ================= misc panels ================= */
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;
    padding:7px 10px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(18,30,46,.9),rgba(7,12,20,.9));
    clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%);}
  .purse{display:flex;gap:12px;align-items:center;font-size:13px;font-weight:bold;letter-spacing:1px;}
  .purse b{color:var(--gold);text-shadow:0 0 10px rgba(255,201,60,.5)}
  .purse i{color:var(--viol);font-style:normal;text-shadow:0 0 10px rgba(192,123,255,.5)}
  .lvlchip{font-family:var(--head);letter-spacing:2px;font-size:13px;color:#cfeaff;
    background:linear-gradient(180deg,#123049,#08151f);border:1px solid #2f6b8f;padding:5px 12px;
    clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);}
  .story{max-width:660px;margin:0 auto;font-size:clamp(12px,3.3vw,15px);line-height:1.85;color:#b9d1e4;
    background:linear-gradient(180deg,rgba(9,16,26,.85),rgba(5,9,16,.85));
    border:1px solid var(--line);border-left:3px solid var(--neon);padding:13px 15px;}
  .story em{color:var(--neon);font-style:normal;text-shadow:0 0 10px rgba(63,240,165,.4)}
  .story b{color:#e9f4ff}
  .list{display:flex;flex-direction:column;gap:6px;}
  .li{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;
    background:linear-gradient(90deg,rgba(18,30,46,.85),rgba(8,14,24,.6));
    border:1px solid var(--line);border-left:3px solid #2b4054;padding:9px 11px;}
  .li.done{border-left-color:var(--neon);color:#c8ffe8;background:linear-gradient(90deg,rgba(12,52,38,.7),rgba(8,14,24,.6));}

  /* ================= HUD ================= */
  #hud{position:absolute;inset:0;z-index:10;pointer-events:none;
    padding:calc(6px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 6px calc(8px + env(safe-area-inset-left));}
  .hudTop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .hudL{max-width:60vw}
  .heroPlate{display:flex;gap:7px;align-items:center;padding:5px 10px 5px 5px;
    background:linear-gradient(100deg,rgba(6,12,20,.82),rgba(6,12,20,.45));border:1px solid #2a4058;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%);}
  .portrait{width:34px;height:34px;flex:none;position:relative;border:1px solid #375a78;background:#0a1420;
    display:flex;align-items:center;justify-content:center;}
  .portrait::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 12px rgba(63,240,165,.35)}
  .pbars{width:min(40vw,190px)}
  .barRow{display:flex;align-items:center;gap:5px;margin-bottom:2px}
  .barRow .lb{font-family:var(--head);font-size:10px;letter-spacing:1.5px;color:#9fb8ce;width:22px;flex:none}
  .barRow .bar{flex:1;margin-top:0;height:8px;transform:skewX(-16deg)}
  .barRow em{font-style:normal;font-size:9px;font-weight:bold;width:46px;flex:none;text-align:right;
    color:#cfe6f8;text-shadow:0 1px 3px #000;letter-spacing:.3px}
  .party{display:flex;gap:5px;margin-top:5px}
  .pface{width:33px;height:33px;position:relative;border:1px solid #2a4058;background:rgba(6,12,20,.72);
    display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:11px;letter-spacing:1px;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%);}
  .pface.down{filter:grayscale(1);opacity:.5}
  .pface .hpf{position:absolute;left:0;bottom:0;height:3px;transition:width .2s}
  .pface .inff{position:absolute;left:0;top:0;height:3px;background:#6ad6a0;box-shadow:0 0 8px #6ad6a0;transition:width .2s}
  .pface.sick{color:#8fd8a0 !important;border-color:#4aa87a !important}
  #objective{margin-top:5px;font-size:11px;color:#a9e6ff;letter-spacing:1.5px;text-shadow:0 0 8px #000;
    display:inline-block;padding:3px 9px;background:linear-gradient(90deg,rgba(6,12,20,.8),transparent);
    border-left:3px solid var(--ice);text-transform:uppercase;}
  #wname{margin-top:3px;font-size:10px;letter-spacing:1.5px;color:var(--gold);text-shadow:0 0 8px #000;white-space:nowrap;}
  .hudR{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
  .chip{font-family:var(--head);font-size:13px;letter-spacing:1.5px;padding:3px 10px 3px 12px;
    background:linear-gradient(90deg,rgba(6,12,20,.5),rgba(6,12,20,.85));border:1px solid #2a4058;
    clip-path:polygon(9px 0,100% 0,100% 100%,0 100%);text-shadow:0 0 8px #000;}
  .chip.gold{color:var(--gold)} .chip.viol{color:var(--viol)} .chip.time{color:#bcd6ea;font-size:12px}
  #btnPause{pointer-events:auto;width:32px;height:32px;background:rgba(6,12,20,.75);border:1px solid #2a4058;
    color:#dff6ff;font-size:13px;line-height:30px;text-align:center;margin-bottom:2px;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);}
  #bossBar{position:absolute;left:50%;top:calc(46px + env(safe-area-inset-top));transform:translateX(-50%);
    width:min(74vw,470px);text-align:center;}
  #bossBar .bn{font-family:var(--head);font-size:13px;letter-spacing:5px;color:#ff8a7a;
    text-shadow:0 0 12px rgba(255,60,40,.8),0 2px 0 #000;margin-bottom:2px;}
  #bossBar .bar{height:11px;transform:skewX(-16deg);border-color:#6a2020;background:#12060a}
  #bossPips{display:flex;gap:4px;justify-content:center;margin-top:3px}
  #bossPips i{width:16px;height:3px;background:#4a1a1a;display:block}
  #bossPips i.on{background:var(--red);box-shadow:0 0 8px var(--red)}
  #comboTag{position:absolute;left:50%;top:calc(84px + env(safe-area-inset-top));transform:translateX(-50%);
    font-family:var(--head);font-size:clamp(20px,6vw,34px);letter-spacing:2px;
    background:linear-gradient(180deg,#fff6c8,#ffc93c 55%,#ff7a2a);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 0 rgba(0,0,0,.6)) drop-shadow(0 0 14px rgba(255,201,60,.7));
    opacity:0;transition:opacity .2s;}
  #comboTag.pop{animation:comboPop .28s cubic-bezier(.2,1.4,.4,1);}
  @keyframes comboPop{0%{transform:translateX(-50%) scale(1.5) rotate(-3deg)}100%{transform:translateX(-50%) scale(1)}}
  body.lowhp #dmgVig{animation:pulseRed 1.1s infinite}
  @keyframes pulseRed{0%,100%{box-shadow:inset 0 0 90px 26px rgba(200,20,20,.55)}50%{box-shadow:inset 0 0 120px 40px rgba(220,20,20,.85)}}

  /* ================= touch controls ================= */
  #pad{position:absolute;inset:0;z-index:12;pointer-events:none;touch-action:none;}
  .k{position:absolute;pointer-events:auto;touch-action:none;display:flex;flex-direction:column;
    align-items:center;justify-content:center;border-radius:50%;
    background:radial-gradient(circle at 34% 26%,rgba(120,190,240,.34),rgba(8,16,26,.55));
    border:2px solid rgba(150,210,245,.42);color:#eaf8ff;font-family:var(--head);letter-spacing:1.5px;
    text-shadow:0 2px 4px #000;box-shadow:0 3px 14px rgba(0,0,0,.55), inset 0 0 18px rgba(80,170,220,.20);
    backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);font-size:13px;transition:transform .06s,filter .1s;}
  .k::after{content:'';position:absolute;inset:5px;border-radius:50%;border:1px solid rgba(150,210,245,.16);}
  .k.on{background:radial-gradient(circle at 34% 26%,rgba(90,255,200,.7),rgba(6,60,45,.7));
    border-color:var(--neon);transform:scale(.93);filter:brightness(1.2);
    box-shadow:0 0 22px rgba(63,240,165,.55), inset 0 0 20px rgba(63,240,165,.35);}
  .k.sq{border-radius:12px}.k.sq::after{border-radius:9px}
  .k b{font-family:'Trebuchet MS',sans-serif;font-size:10px;font-weight:bold;letter-spacing:0;
    color:var(--gold);margin-top:1px;text-shadow:0 1px 2px #000;}
  .k b.low{color:var(--red)}
  #kL{left:calc(14px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom));width:19vmin;height:15vmin;max-width:96px;max-height:76px;border-radius:12px;font-size:22px;}
  #kR{left:calc(20vmin + 22px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom));width:19vmin;height:15vmin;max-width:96px;max-height:76px;border-radius:12px;font-size:22px;}
  #kA{right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));width:21vmin;height:21vmin;max-width:108px;max-height:108px;font-size:16px;
    border-color:rgba(255,150,90,.5);background:radial-gradient(circle at 34% 26%,rgba(255,150,80,.34),rgba(30,10,6,.55));}
  #kJ{right:calc(21vmin + 20px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));width:16vmin;height:16vmin;max-width:86px;max-height:86px;font-size:13px;}
  #kF{right:calc(16px + env(safe-area-inset-right));bottom:calc(22vmin + 22px + env(safe-area-inset-bottom));width:16vmin;height:16vmin;max-width:84px;max-height:84px;font-size:13px;
    border-color:rgba(255,201,60,.5);background:radial-gradient(circle at 34% 26%,rgba(255,201,60,.28),rgba(28,18,4,.55));}
  #kD{left:calc(14px + env(safe-area-inset-left));bottom:calc(16vmin + 24px + env(safe-area-inset-bottom));width:13vmin;height:13vmin;max-width:68px;max-height:68px;font-size:12px;}
  #kS{left:50%;margin-left:-7.5vmin;bottom:calc(13px + env(safe-area-inset-bottom));width:15vmin;height:15vmin;max-width:78px;max-height:78px;font-size:13px;
    border-color:rgba(192,123,255,.55);
    background:
      radial-gradient(circle at 50% 50%, rgba(24,10,40,.85) 0 58%, transparent 59%),
      conic-gradient(var(--viol) var(--mp,0%), rgba(60,40,90,.5) 0);}
  #kS.ready{border-color:var(--viol);animation:spReady 1.1s infinite;}
  @keyframes spReady{0%,100%{box-shadow:0 0 12px rgba(192,123,255,.5),inset 0 0 14px rgba(192,123,255,.3)}
    50%{box-shadow:0 0 30px rgba(192,123,255,.95),inset 0 0 22px rgba(192,123,255,.6)}}
  #kG{right:calc(20vmin + 26px + env(safe-area-inset-right));bottom:calc(22vmin + 26px + env(safe-area-inset-bottom));
    width:12vmin;height:12vmin;max-width:64px;max-height:64px;font-size:14px;border-color:rgba(255,201,60,.5);}
  #kW{left:50%;margin-left:-24vmin;bottom:calc(15px + env(safe-area-inset-bottom));width:12vmin;height:12vmin;max-width:64px;max-height:64px;font-size:15px;}
  #kV{left:calc(14px + env(safe-area-inset-left));bottom:calc(30vmin + 30px + env(safe-area-inset-bottom));

<script>
"use strict";
/* =========================================================================
   ANGER OF STICK — OUTBREAK
   A single-file 2D side-scrolling action RPG.  Touch-first, mobile ready.
   ========================================================================= */

/* ---------------------------------------------------------------- core */
const W = 720, H = 405, GY = 352;          // design resolution + ground line
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let scale = 1, padY = 0, viewW = W, viewH = H, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const cw = Math.floor(window.innerWidth), ch = Math.floor(window.innerHeight);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.floor(cw * DPR); cv.height = Math.floor(ch * DPR);
  scale = Math.max(cw / W, ch / H);
  viewW = cw / scale; viewH = ch / scale;
  padY = ch - H * scale;                    // pin design-bottom to screen-bottom
  document.getElementById('rotate').classList.toggle('armed', ch > cw * 1.05);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));

/* ---------------------------------------------------------------- utils */
const rnd  = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const sign = v => v < 0 ? -1 : 1;
const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e4 ? Math.floor(n / 1e3) + 'K' : ('' + Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const clock = s => (s < 0 ? 0 : Math.floor(s / 60)).toString().padStart(2, '0') + ':' + Math.floor(s % 60).toString().padStart(2, '0');
function mulberry(seed){ let t = seed >>> 0; return function(){ t += 0x6D2B79F5; let r = Math.imul(t ^ t >>> 15, 1 | t); r ^= r + Math.imul(r ^ r >>> 7, 61 | r); return ((r ^ r >>> 14) >>> 0) / 4294967296; }; }
const todayKey = () => new Date().toISOString().slice(0, 10);
const $ = id => document.getElementById(id);

/* ---------------------------------------------------------------- audio */
const Snd = {
  ac: null, on: true,
  boot(){ if (!this.ac){ try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ this.on = false; } }
          if (this.ac && this.ac.state === 'suspended') this.ac.resume(); },
  tone(freq, dur, type, vol, slide){
    if (!this.on || !this.ac) return;
    const t = this.ac.currentTime, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + dur);
    g.gain.setValueAtTime((vol || .2) * .5, t);
    g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g); g.connect(this.ac.destination); o.start(t); o.stop(t + dur + .02);
  },
  noise(dur, vol, hp){
    if (!this.on || !this.ac) return;
    const sr = this.ac.sampleRate, len = Math.floor(sr * dur);
    const buf = this.ac.createBuffer(1, len, sr), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = this.ac.createBufferSource(); s.buffer = buf;
    const f = this.ac.createBiquadFilter(); f.type = hp ? 'highpass' : 'lowpass'; f.frequency.value = hp || 900;
    const g = this.ac.createGain(); g.gain.value = (vol || .2) * .5;
    s.connect(f); f.connect(g); g.connect(this.ac.destination); s.start();
  },
  punch(){ this.tone(180, .09, 'square', .16, 60); this.noise(.07, .12); },
  hit()  { this.noise(.06, .14, 1800); },
  shot() { this.tone(320, .06, 'square', .13, 90); this.noise(.05, .1, 1200); },
  boom() { this.noise(.45, .3); this.tone(90, .4, 'sawtooth', .2, 30); },
  coin() { this.tone(880, .06, 'triangle', .1); this.tone(1320, .08, 'triangle', .08); },
  lvl()  { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, .16, 'triangle', .13), i * 85)); },
  hurt() { this.tone(140, .18, 'sawtooth', .16, 60); },
  ui()   { this.tone(660, .04, 'square', .07); },
  bad()  { this.tone(220, .3, 'sawtooth', .16, 70); },
  infect(){ this.tone(150, .5, 'sawtooth', .18, 62); setTimeout(() => this.tone(120, .55, 'square', .12, 48), 130); },
  cure() { [660, 880, 1180, 1560].forEach((f, i) => setTimeout(() => this.tone(f, .14, 'triangle', .11), i * 70)); },
  zap()  { this.tone(1200, .12, 'square', .12, 260); this.noise(.1, .12, 2400); },
  parry(){ this.tone(1400, .1, 'triangle', .16, 700); this.noise(.06, .1, 3000); }
};

/* ---------------------------------------------------------------- save */
const SAVEKEY = 'aos_outbreak_v2';
const OLDKEY = 'aos_outbreak_v1';
const defaultSave = () => ({
  lvl: 1, xp: 0, sp: 0, coins: 600, gems: 5, prestige: 0, ngplus: 0,
  antidotes: 2, mats: { scrap: 0, chem: 0, cell: 0, alloy: 0 }, bp: {},
  throwOwned: { grenade: 1 }, throwable: 'grenade',
  cos: { hair: 'spike', head: 'none', body: 'none', glove: 'none', boot: 'none',
         colour: '#111318', wskin: 'none', emote: 'wave', victory: 'stand' },
  cosOwned: { spike: 1, wave: 1, stand: 1 },
  weekly: { week: '', prog: {}, claimed: {} }, season: { id: '', pts: 0, claimed: {} },
  hardcore: 0, settings: { fps: 60, gfx: 2, shake: 1, music: 1, blood: 1 },
  base: { hp: 0, atk: 0, spd: 0, sp: 0 },      // points spent per stat
  owned: { fist: 1, bat: 0 },                  // weaponId -> upgrade level (0 = not owned)
  equipped: ['fist', 'fist'],                  // [melee, ranged]
  armor: 0,
  skills: {}, activeSkill: 'shock',
  allies: {},                                  // filled from ALLIES in load()
  party: [],
  progress: { chapter: 0, stage: 0 },          // highest unlocked
  cleared: {},                                 // "c-s" -> stars
  difficulty: 1, unlockedDiff: 0,
  bossKills: {}, records: { survival: 0, endless: 0, bossrush: 0, defense: 0, horde: 0, timeattack: 0 },
  stats: { kills: 0, rescues: 0, missions: 0, coinsEarned: 0, deaths: 0, bosses: 0, headshots: 0,
           cured: 0, infected: 0, crafted: 0, vehicles: 0, cleanRuns: 0, hardcoreWins: 0,
           turned: 0, playTime: 0, parries: 0, finishers: 0 },
  ach: {}, secrets: {},
  daily: { day: '', streak: 0, claimed: '', chDone: '' },
  sound: 1, seenIntro: 0
});
let S = defaultSave();
function load(){
  try {
    const r = localStorage.getItem(SAVEKEY);
    if (r) S = Object.assign(defaultSave(), JSON.parse(r));
    else {
      const old = localStorage.getItem(OLDKEY);            // carry a v1 save forward
      if (old){
        const v1 = JSON.parse(old);
        S = Object.assign(defaultSave(), v1);
        S.difficulty = clamp((v1.difficulty | 0) + 1, 0, 3);  // Easy was inserted at index 0
        S.allies = Object.assign({}, v1.allies || {});
      }
    }
    const d = defaultSave();
    for (const k of ['mats', 'cos', 'settings', 'weekly', 'season', 'stats', 'records', 'throwOwned'])
      S[k] = Object.assign(d[k], S[k] || {});
    S.allies = S.allies || {};
    for (const k in ALLIES) if (!(k in S.allies)) S.allies[k] = 0;
    S.party = (S.party || []).filter(id => ALLIES[id]);
  } catch(e){ S = defaultSave(); }
  Snd.on = !!S.sound;
}
function save(){ try { localStorage.setItem(SAVEKEY, JSON.stringify(S)); } catch(e){} }

/* ---------------------------------------------------------------- input */
const K = { left: 0, right: 0, jump: 0, atk: 0, fire: 0, dodge: 0, skill: 0, nade: 0, swap: 0, anti: 0, stance: 0 };
const tap = { jump: 0, atk: 0, dodge: 0, skill: 0, nade: 0, swap: 0, anti: 0, stance: 0 };   // edge-triggered
function press(k){ if (K[k] === 0 && k in tap) tap[k] = 1; K[k] = 1; }
function release(k){ K[k] = 0; }
function consume(k){ const v = tap[k]; tap[k] = 0; return v; }

(function bindPad(){
  const held = {};   // touchId -> key
  const pad = $('pad');
  function keyAt(x, y){
    const el = document.elementFromPoint(x, y);
    const k = el && el.closest ? el.closest('[data-key]') : null;
    return k ? k.dataset.key : null;
  }
  function setVisual(k, on){ const el = pad.querySelector('[data-key="' + k + '"]'); if (el) el.classList.toggle('on', on); }
  function start(e){
    Snd.boot();
    for (const t of e.changedTouches){
      const k = keyAt(t.clientX, t.clientY);
      if (k){ held[t.identifier] = k; press(k); setVisual(k, true); }
    }
    if (Object.keys(held).length && e.cancelable) e.preventDefault();
  }
  function move(e){
    for (const t of e.changedTouches){
      const cur = held[t.identifier], k = keyAt(t.clientX, t.clientY);
      if (cur && cur !== k){ release(cur); setVisual(cur, false); delete held[t.identifier]; }
      if (k && held[t.identifier] !== k){ held[t.identifier] = k; press(k); setVisual(k, true); }
    }
  }
  function end(e){
    for (const t of e.changedTouches){
      const k = held[t.identifier];
      if (k){ release(k); setVisual(k, false); delete held[t.identifier]; }
    }
  }
  pad.addEventListener('touchstart', start, { passive: false });
  pad.addEventListener('touchmove', move, { passive: false });
  pad.addEventListener('touchend', end);
  pad.addEventListener('touchcancel', end);
  // mouse fallback (desktop testing)
  let mk = null;
  pad.addEventListener('mousedown', e => { Snd.boot(); mk = keyAt(e.clientX, e.clientY); if (mk){ press(mk); setVisual(mk, true); e.preventDefault(); } });
  window.addEventListener('mouseup', () => { if (mk){ release(mk); setVisual(mk, false); mk = null; } });
})();

const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'jump', KeyW: 'jump', Space: 'jump', KeyJ: 'atk', KeyK: 'fire', KeyL: 'dodge',
  ShiftLeft: 'dodge', KeyU: 'skill', KeyI: 'nade', KeyQ: 'swap', KeyE: 'anti', KeyR: 'stance' };
window.addEventListener('keydown', e => {
  Snd.boot();
  const k = KEYMAP[e.code]; if (k){ press(k); e.preventDefault(); }
  if (e.code === 'Escape' && Game.state === 'play') UI.pause();
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) release(k); });

/* ---------------------------------------------------------------- toast */
let toastT = 0;
function toast(msg, ms){
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => { el.classList.remove('show'); }, ms || 1600);
}
/* =======================================================================
   CONTENT — weapons, enemies, maps, campaign, skills, allies, achievements
   ======================================================================= */

const WEAPONS = [
  // --- melee -----------------------------------------------------------
  { id:'fist',    name:'Bare Fists',    kind:'melee', dmg:14,  rate:.26, range:62,  price:0,     desc:'Free, fast, endless.' },
  { id:'bat',     name:'Baseball Bat',  kind:'melee', dmg:26,  rate:.34, range:78,  price:450,   kb:230, desc:'Solid knockback.' },
  { id:'axe',     name:'Fire Axe',      kind:'melee', dmg:42,  rate:.44, range:82,  price:1600,  kb:280, bleed:1, desc:'Heavy chopper. Causes bleeding.' },
  { id:'spear',   name:'Spear',         kind:'melee', dmg:48,  rate:.38, range:112, price:2600,  kb:200, desc:'Longest melee reach in the game.' },
  { id:'katana',  name:'Katana',        kind:'melee', dmg:56,  rate:.28, range:92,  price:4200,  kb:180, desc:'Lightning fast steel.' },

/* --------------------------------------------------------- progression */
const xpNeed = lv => Math.floor(90 * Math.pow(1.135, lv - 1));
function playerStats(){
  const p = S.base, sk = S.skills;
  const vit = sk.vit || 0, pow = sk.pow || 0, agi = sk.agi || 0;
  return {
    maxHp: Math.floor(180 + p.hp * 22 + vit * 30 + S.lvl * 4),
    atk:   (1 + p.atk * .06 + pow * .08) * prestigeBonus(),
    spd:   250 * (1 + p.spd * .035 + agi * .06),
    mpGain: 1 + (sk.foc || 0) * .18,
    crit:  .03 + (sk.crit || 0) * .05,
    regen: (sk.reg || 0) * .6,
    dr:    ARMORS[S.armor].dr,
    nades: 3 + (sk.nade || 0),
    greed: (1 + (sk.greed || 0) * .12) * prestigeBonus(),
    rollCd: 1.1 * (1 - agi * .06)
  };
}
function addXp(n){
  if (S.lvl >= LVL_CAP){ S.xp = 0; return 0; }
  S.xp += n; let up = 0;
  while (S.lvl < LVL_CAP && S.xp >= xpNeed(S.lvl)){ S.xp -= xpNeed(S.lvl); S.lvl++; S.sp += 2; up++; }
  if (S.lvl >= LVL_CAP){ S.xp = 0; toast('MAX LEVEL — PRESTIGE AVAILABLE', 2600); }
  if (up){ Snd.lvl(); toast('LEVEL UP!  Lv ' + S.lvl + '  (+' + (up * 2) + ' SP)', 2200);
    if (Game.player){ const st = playerStats(); Game.player.maxHp = st.maxHp; Game.player.hp = st.maxHp; } }
  return up;
}
function checkAch(){
  let got = 0;
  for (const a of ACHS){ if (!S.ach[a.id] && a.f(S)){ S.ach[a.id] = 1; S.coins += a.c; S.gems += a.g || 0;
      got++; setTimeout(() => toast('★ ' + a.name + ' +' + a.c + '◉', 2200), got * 900); } }
  if (got) save();
}

const cam = { x: 0, shake: 0, shx: 0, shy: 0 };
function camApply(){
  cam.shx = cam.shake ? rnd(-cam.shake, cam.shake) : 0;
  cam.shy = cam.shake ? rnd(-cam.shake, cam.shake) : 0;
  const k = scale * DPR;
  ctx.setTransform(k, 0, 0, k, (-cam.x + cam.shx) * k, padY * DPR + cam.shy * k);
}
function shake(v){ if (!S.settings.shake) return; cam.shake = Math.min(18, cam.shake + v); }

/* ------------------------------------------------------------ particles */
const P = [];
function part(x, y, vx, vy, life, col, size, type){
  if (col === '#c81e1e' && !S.settings.blood) col = '#5a5a66';
  if (P.length > (Game.maxParts || 620)) P.shift();
  P.push({ x, y, vx, vy, t: 0, life, col, size, type: type || 'dot', r: rnd(0, 6.28), vr: rnd(-9, 9) });
}
function blood(x, y, dir, amt){
  for (let i = 0; i < amt; i++)
    part(x, y, rnd(20, 260) * dir + rnd(-60, 60), rnd(-220, 60), rnd(.35, .8), i % 4 ? '#c81e1e' : '#8a1010', rnd(2, 5), 'blood');
}
function sparks(x, y, amt, col){
  for (let i = 0; i < amt; i++){ const a = rnd(0, 6.28), sp = rnd(80, 380);
    part(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 40, rnd(.2, .5), col || '#ffd76a', rnd(1.5, 3.5), 'spark'); }
}
function smoke(x, y, amt, col){
  for (let i = 0; i < amt; i++)
    part(x, y + rnd(-8, 8), rnd(-40, 40), rnd(-70, -20), rnd(.6, 1.4), col || 'rgba(120,120,130,', rnd(8, 20), 'smoke');
}
function debris(x, y, amt, col){
  for (let i = 0; i < amt; i++)
    part(x, y, rnd(-200, 200), rnd(-320, -60), rnd(.6, 1.2), col || '#6a5a4a', rnd(2, 6), 'chunk');
}
function fire(x, y, amt){
  for (let i = 0; i < amt; i++)
    part(x + rnd(-6, 6), y + rnd(-6, 6), rnd(-40, 40), rnd(-120, -30), rnd(.25, .6), '#ff8a2a', rnd(4, 10), 'fire');
}
function boomFX(x, y, r){
  Game.flashes.push({ x, y, r, t: 0, life: .4 });
  sparks(x, y, 26, '#ffcc44'); smoke(x, y, 12); debris(x, y, 10, '#40332a'); fire(x, y, 14);
  shake(r / 12); Snd.boom(); flashScreen(.35);
}
function updateParts(dt){
  for (let i = P.length - 1; i >= 0; i--){
    const p = P[i]; p.t += dt;
    if (p.t >= p.life){ P.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
    if (p.type === 'blood' || p.type === 'chunk'){ p.vy += 900 * dt; if (p.y > GY){ p.y = GY; p.vy *= -.25; p.vx *= .6; } }
    else if (p.type === 'spark'){ p.vy += 480 * dt; p.vx *= .96; }
    else if (p.type === 'smoke'){ p.vx *= .97; p.vy *= .97; }
    else if (p.type === 'fire'){ p.vy -= 60 * dt; p.vx *= .95; }
  }
}
function drawParts(){
  for (const p of P){
    const k = 1 - p.t / p.life;
    if (p.type === 'smoke'){ ctx.fillStyle = (typeof p.col === 'string' && p.col.startsWith('rgba')) ? p.col + (k * .28) + ')' : p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (2 - k), 0, 6.283); ctx.fill(); continue; }
    if (p.type === 'fire'){ ctx.globalAlpha = k; ctx.fillStyle = k > .6 ? '#fff0a0' : k > .3 ? '#ff8a2a' : '#a03010';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * k * 1.4, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1; continue; }
    ctx.globalAlpha = Math.min(1, k * 1.6); ctx.fillStyle = p.col;
    if (p.type === 'chunk'){ ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size); ctx.restore(); }
    else if (p.type === 'spark'){ ctx.fillRect(p.x, p.y, p.size, p.size * .8); }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.283); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
}
/* floating damage numbers */
const DN = [];
function dmgNum(x, y, v, crit){ DN.push({ x, y, v: Math.round(v), t: 0, crit, vy: -70, vx: rnd(-24, 24) }); if (DN.length > 60) DN.shift(); }
function updateDN(dt){ for (let i = DN.length - 1; i >= 0; i--){ const d = DN[i]; d.t += dt; d.y += d.vy * dt; d.x += d.vx * dt; d.vy += 90 * dt; if (d.t > .8) DN.splice(i, 1); } }
function drawDN(){

  for (const d of DN){

    ctx.globalAlpha = a; ctx.font = 'bold ' + (d.crit ? 22 : 15) + 'px Trebuchet MS';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.strokeText(d.v, d.x, d.y);
    ctx.fillStyle = d.crit ? '#ffcc44' : '#ffffff'; ctx.fillText(d.v, d.x, d.y);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'left';
}

/* --------------------------------------------------------- backgrounds */
function buildBG(mapId, len, seed){
  const m = MAPS.find(x => x.id === mapId) || MAPS[0];
  const R = mulberry(seed);
  const bg = { m, far: [], mid: [], props: [], len, lamps: [] };
  const farEnd = len * 1.35 + 1200, midEnd = len * 1.5 + 1200;
  if (m.theme === 'city' || m.theme === 'roof'){
    for (let x = -400; x < farEnd; x += R() * 60 + 45){
      const h = 60 + R() * 150, w = 45 + R() * 70;
      bg.far.push({ x, w, h, win: R() > .35 });
    }
    for (let x = -300; x < midEnd; x += R() * 150 + 130){
      const h = 90 + R() * 105, w = 80 + R() * 110;
      bg.mid.push({ x, w, h, win: 1 });
    }
  } else if (m.theme === 'subway'){
    for (let x = -300; x < farEnd; x += 260){ bg.far.push({ x, w: 220, h: 205, arch: 1 }); }
    for (let x = -200; x < midEnd; x += 130){ bg.mid.push({ x, w: 16, h: 168, pillar: 1 }); }
  } else if (m.theme === 'factory'){
    for (let x = -300; x < farEnd; x += R() * 120 + 100){ bg.far.push({ x, w: 40 + R() * 60, h: 100 + R() * 130, stack: R() > .5 }); }
    for (let x = -200; x < midEnd; x += R() * 200 + 170){ bg.mid.push({ x, w: 120 + R() * 90, h: 78 + R() * 70, mach: 1 }); }
  } else { // indoor
    for (let x = -300; x < farEnd; x += 120){ bg.far.push({ x, w: 120, h: 290, panel: 1 }); }
    for (let x = -100; x < midEnd; x += R() * 260 + 200){
      const k = R();
      bg.mid.push({ x, w: 70 + R() * 60, h: 80 + R() * 60, door: k > .6, window: k <= .3, poster: k > .3 && k <= .6 });
    }
  }
  for (let x = 120; x < midEnd; x += R() * 220 + 190) bg.lamps.push({ x });
  for (let x = 80; x < len; x += R() * 130 + 70){
    const k = R();
    bg.props.push({ x, y: GY, t: k > .82 ? 'car' : k > .62 ? 'crate' : k > .45 ? 'barrel' : k > .28 ? 'rubble' : 'trash',
      f: R() > .5 ? 1 : -1, s: .8 + R() * .5 });
  }
  return bg;
}
function drawBG(bg){
  const m = bg.m, x0 = cam.x, x1 = cam.x + viewW;
  // sky
  const g = ctx.createLinearGradient(0, 0, 0, GY);
  g.addColorStop(0, m.sky[0]); g.addColorStop(1, m.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(x0 - 10, -viewH, viewW + 20, GY + viewH);
  if (m.theme === 'city'){
    ctx.fillStyle = 'rgba(255,220,150,.5)'; ctx.beginPath();
    ctx.arc(x0 + viewW * .74, 120, 44, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.14)';
    for (let i = 0; i < 5; i++){ const cx = ((i * 480 - x0 * .12) % (viewW + 600)) + x0 - 200;
      ctx.beginPath(); ctx.ellipse(cx, 70 + i * 26, 110, 20, 0, 0, 6.283); ctx.fill(); }
  }
  if (m.theme === 'roof'){
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    for (let i = 0; i < 40; i++){ const sx = ((i * 137 - x0 * .05) % (viewW + 200)) + x0 - 100, sy = (i * 53) % 220;
      ctx.fillRect(sx, sy, 2, 2); }
  }
  // far layer (parallax .3)
  const fx = x0 * .7;
  ctx.save(); ctx.translate(-fx * 0 - x0 * .3 + x0 * 0, 0);
  ctx.fillStyle = m.far;
  for (const b of bg.far){
    const bx = b.x - x0 * .3; if (bx + b.w < x0 - 60 || bx > x1 + 60) continue;
    if (b.arch){ ctx.fillStyle = m.far; ctx.fillRect(bx, GY - b.h, b.w, b.h);
      ctx.fillStyle = m.sky[0]; ctx.beginPath(); ctx.moveTo(bx + 24, GY);
      ctx.lineTo(bx + 24, GY - b.h + 80); ctx.quadraticCurveTo(bx + b.w / 2, GY - b.h - 30, bx + b.w - 24, GY - b.h + 80);
      ctx.lineTo(bx + b.w - 24, GY); ctx.fill(); continue; }
    if (b.panel){ ctx.fillStyle = m.far; ctx.fillRect(bx, GY - b.h, b.w, b.h);
      ctx.strokeStyle = 'rgba(0,0,0,.13)'; ctx.lineWidth = 2; ctx.strokeRect(bx + 4, GY - b.h + 6, b.w - 8, b.h - 12); continue; }
    ctx.fillStyle = m.far; ctx.fillRect(bx, GY - b.h, b.w, b.h);
    if (b.stack){ ctx.fillRect(bx + b.w * .3, GY - b.h - 40, b.w * .35, 40); }
    if (b.win){ ctx.fillStyle = 'rgba(255,230,160,.22)';
      for (let wy = GY - b.h + 12; wy < GY - 20; wy += 22)
        for (let wx = bx + 8; wx < bx + b.w - 10; wx += 16) if ((wx * wy) % 7 > 2) ctx.fillRect(wx, wy, 7, 11); }
  }
  ctx.restore();
  // mid layer (parallax .55)
  for (const b of bg.mid){
    const bx = b.x - x0 * .45; if (bx + (b.w || 60) < x0 - 80 || bx > x1 + 80) continue;
    ctx.fillStyle = m.mid;
    if (b.pillar){ ctx.fillRect(bx, GY - b.h, b.w, b.h); ctx.fillStyle = m.accent; ctx.globalAlpha = .25;
      ctx.fillRect(bx, GY - b.h, b.w, 8); ctx.globalAlpha = 1; continue; }
    if (b.door){ ctx.fillRect(bx, GY - b.h, b.w, b.h);
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(bx + 8, GY - b.h + 10, b.w - 16, b.h - 10); continue; }
    if (b.window){ ctx.fillRect(bx, GY - b.h - 40, b.w, b.h);
      ctx.fillStyle = 'rgba(180,220,255,.5)'; ctx.fillRect(bx + 7, GY - b.h - 33, b.w - 14, b.h - 16);
      ctx.strokeStyle = m.mid; ctx.lineWidth = 4; ctx.beginPath();
      ctx.moveTo(bx + b.w / 2, GY - b.h - 33); ctx.lineTo(bx + b.w / 2, GY - 49); ctx.stroke(); continue; }
    if (b.poster){ ctx.fillStyle = 'rgba(240,240,235,.85)'; ctx.fillRect(bx, GY - b.h - 60, 34, 46);

/* ------------------------------------------------------------- helpers */
function makeEnt(o){
  return Object.assign({
    x: 0, y: GY, vx: 0, vy: 0, hp: 100, maxHp: 100, face: 1, s: 1, col: '#1a1a1a',
    pose: 'idle', anim: rnd(0, 6), poseT: 0, onGround: true, hitT: 0, flash: 0,
    dead: false, deadT: 0, iframe: 0, atkCd: 0, stun: 0, team: 'e', wep: null, r: 26
  }, o);
}
function physics(e, dt){
  e.x += e.vx * dt;
  if (e.fly){
    e.y = lerp(e.y, (e.flyBase || GY - 150) + Math.sin(e.anim * 2.4) * 16, 1 - Math.pow(.05, dt));
    e.onGround = false;
  } else {
    e.y += e.vy * dt;
    if (e.y < GY){ e.vy += 1750 * dt; e.onGround = false; }
    if (e.y >= GY){ e.y = GY; e.vy = 0; e.onGround = true; }
  }
  e.x = clamp(e.x, 30, Game.len - 30);
  if (e.onGround) e.vx *= Math.pow(.0016, dt); else e.vx *= Math.pow(.35, dt);
  e.anim += dt; e.poseT += dt;
  if (e.hitT > 0) e.hitT -= dt;
  if (e.flash > 0) e.flash -= dt;
  if (e.iframe > 0) e.iframe -= dt;
  if (e.stun > 0) e.stun -= dt;
  if (e.atkCd > 0) e.atkCd -= dt;
}
const hitbox = e => ({ x: e.x - 20 * e.s, y: e.y - 78 * e.s, w: 40 * e.s, h: 78 * e.s });
function overlapRect(a, b){ return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

function hurtEnt(t, dmg, opt){
  opt = opt || {};
  if (t.dead || t.iframe > 0 || t.invuln) return 0;
  // Counter: rolling into an attack turns it back on the attacker
  if (t === Game.player && t.parryT > 0 && opt.fromX !== undefined){
    t.parryT = 0; t.iframe = Math.max(t.iframe, .4);
    Game.hitstop = Math.max(Game.hitstop, .12); Game.slowmo = Math.max(Game.slowmo, .5);
    Snd.parry(); flashScreen(.2); shake(5);
    S.stats.parries = (S.stats.parries || 0) + 1;
    toast('PARRY!', 800);
    addMp(t, 25);
    for (const e of Game.enemies)
      if (!e.dead && Math.abs(e.x - t.x) < 150){
        e.stun = Math.max(e.stun, 1.4);
        hurtEnt(e, 60 * t.atkMul, { fromX: t.x, kb: 420, up: 260, dir: sign(e.x - t.x) || 1, big: 1 });
      }
    return 0;
  }
  let d = dmg;
  if (t.shield && opt.fromX !== undefined && sign(opt.fromX - t.x) === t.face && !opt.pierceShield) d *= (1 - t.shield);
  if (t === Game.player && t.vehicle){
    t.vehicle.hp -= d; t.hitT = .12;
    dmgNum(t.x + rnd(-8, 8), t.y - 80, d, false); shake(2);
    if (t.vehicle.hp > 0) return d;
    d *= .3;
  }
  if (t === Game.player){ d *= (1 - t.dr); if (t.mechT > 0) d *= .35; if (t.berserkT > 0) d *= .85; }
  if (t.inf > 0) d *= 1 + t.inf / 260;                    // the sick take more punishment
  d = Math.max(1, d);
  t.hp -= d;
  t.hitT = .16; t.flash = .09;
  dmgNum(t.x + rnd(-8, 8), t.y - 70 * t.s, d, opt.crit);
  const dir = opt.dir !== undefined ? opt.dir : (opt.fromX !== undefined ? sign(t.x - opt.fromX) : 1);
  const kbres = t.kbres || 0;
  t.vx += (opt.kb || 90) * dir * (1 - kbres) * (t.boss ? .18 : 1);
  if (opt.up && !t.boss) { t.vy = -opt.up * (1 - kbres); t.onGround = false; }
  if (opt.burn && !t.burnT) { t.burnT = 3; t.burnSrc = opt.burnSrc || 6; }
  if (t !== Game.player) blood(t.x, t.y - 46 * t.s, dir, opt.big ? 12 : 5);
  else { blood(t.x, t.y - 46, dir, 6); $('dmgVig').style.opacity = Math.min(.9, 1 - t.hp / t.maxHp); Snd.hurt();
         setTimeout(() => { if (Game.player) $('dmgVig').style.opacity = clamp(1 - Game.player.hp / Game.player.maxHp - .35, 0, .8); }, 220); }
  if (opt.stun) t.stun = Math.max(t.stun, opt.stun);
  Snd.hit();
  if (t.hp <= 0) killEnt(t, opt);
  return d;
}
function killEnt(t, opt){
  if (t.dead) return;
  t.dead = true; t.deadT = 0; t.hp = 0; t.vy = -220; t.vx = (opt && opt.dir ? opt.dir : 1) * 130;
  blood(t.x, t.y - 46 * t.s, opt && opt.dir ? opt.dir : 1, 16);
  if (t === Game.player){ Snd.bad(); Game.over = true; S.stats.deaths++; return; }
  if (t.ally){ t.downT = 12; return; }
  // rewards
  const mult = DIFFS[Game.diff].rew, greed = Game.player ? Game.player.greed : 1;
  const coin = Math.round((t.coinV || 10) * mult * greed), xp = Math.round((t.xpV || 8) * mult * greed);
  Game.kills++; Game.coins += coin; Game.xp += xp;
  Game.combo++; Game.comboT = 2.6; Game.best = Math.max(Game.best, Game.combo);
  for (let i = 0; i < (t.boss ? 14 : 1 + (Math.random() < .5 ? 1 : 0)); i++)
    spawnPickup(t.x + rnd(-30, 30), t.y - 40, 'coin', Math.max(1, Math.round(coin / (t.boss ? 14 : 1))));
  if (Math.random() < (t.boss ? 1 : .06)) spawnPickup(t.x, t.y - 50, 'health', 30);
  if (Math.random() < (t.boss ? 1 : .05)) spawnPickup(t.x, t.y - 50, 'ammo', 40);
  if (t.drops === 'anti' || Math.random() < .022 * Game.diffData.anti) spawnPickup(t.x, t.y - 50, 'anti', 1);
  if (Math.random() < .3) spawnPickup(t.x, t.y - 40, 'mat', 1 + (t.boss ? 14 : 0));
  if (t.boom) setTimeout(() => explode({ x: t.x, y: GY - 30, splash: 150, dmg: t.dmg * 2.2, team: 'e' }), 240);
  if (t.gas) gasCloud(t.x, 7, 1.4);
  if (t.zap) zapBurst(t.x, t.y - 40, t.dmg);
  if (t.boss){
    Game.gems += 3; spawnPickup(t.x, t.y - 60, 'gem', 3);
    S.stats.bosses++; if (t.bossId) S.bossKills[t.bossId] = 1;
    weeklyAdd('bosses', 1);
    Game.slowmo = Math.max(Game.slowmo, 2.2); Game.hitstop = Math.max(Game.hitstop, .18);
    boomFX(t.x, t.y - 50, 160); Game.boss = null; $('bossBar').classList.add('hidden');
    if (t.drop && !S.owned[t.drop]){ S.owned[t.drop] = 1; toast('WEAPON UNLOCKED: ' + WMAP[t.drop].name, 2600); }
  }
  S.stats.kills++;
  if (t.type === 'robot' || t.type === 'brute') boomFX(t.x, t.y - 40, 80);
}

function gunList(){ return WEAPONS.filter(w => w.kind !== 'melee' && S.owned[w.id] > 0).map(w => w.id); }

function updatePlayer(p, dt){
  if (p.dead){ p.deadT += dt; p.pose = 'hurt'; physics(p, dt); return; }
  if (p.vehicle){ updateVehicle(p, dt); updateInfection(p, dt); if (consume('anti')) useAntidote(); return; }
  const moving = (K.left ? -1 : 0) + (K.right ? 1 : 0);
  const busy = p.atkT > 0 || p.rollT > 0;
  const spdMul = (p.berserkT > 0 ? 1.4 : 1) * (p.mechT > 0 ? .85 : 1);

  if (p.regen) p.hp = Math.min(p.maxHp, p.hp + p.regen * dt);
  if (p.mechT > 0){ p.mechT -= dt; if (p.mechT <= 0) toast('Mech suit offline'); }
  if (p.berserkT > 0) p.berserkT -= dt;
  if (p.rollCd > 0) p.rollCd -= dt;

  if (p.comboT > 0){ p.comboT -= dt; if (p.comboT <= 0) p.combo = 0; }

      p.vx = p.face * 620; Snd.tone(300, .12, 'triangle', .1, 700);
      if (S.skills.parry) p.parryT = .22;
    } else if (S.skills.dash && !p.airDashed){
      p.airDashed = 1; p.rollT = .28; p.rollCd = p.rollCdMax * .8; p.iframe = .24;
      p.vx = p.face * 780; p.vy = -60;
      for (let i = 0; i < 10; i++) part(p.x - p.face * rnd(0, 40), p.y - rnd(10, 70), -p.face * rnd(40, 160), rnd(-30, 30), .3, '#9fe8ff', 3, 'dot');
      Snd.tone(420, .12, 'triangle', .1, 900);
    }
  }
  if (p.rollT > 0){ p.rollT -= dt; p.pose = 'crawl'; }
  if (p.parryT > 0) p.parryT -= dt;
  if (p.onGround){ p.jumps = 0; p.airDashed = 0; p.airHits = 0; }

  if (!busy){
    if (moving){ p.face = moving; p.vx += moving * p.spd * spdMul * 9 * dt; p.vx = clamp(p.vx, -p.spd * spdMul, p.spd * spdMul); }

    if (jumpTap && p.onGround && !p.vehicle){
      for (const g of Game.gear)
        if (g.type === 'vehicle' && Math.abs(p.x - g.x) < 54){ jumpTap = 0; mountVehicle(g); break; }
    }
    if (p.vehicle) return;
    if (jumpTap){
      const maxJumps = S.skills.djump ? 2 : 1;
      const onWall = !p.onGround && S.skills.wall && (p.x <= 44 || p.x >= Game.len - 44);
      if (p.onGround || p.jumps < maxJumps || onWall){
        if (onWall){
          p.vx = (p.x <= 44 ? 1 : -1) * 520; p.face = sign(p.vx); p.vy = -600; p.jumps = 1;
          for (let i = 0; i < 8; i++) part(p.x, p.y - rnd(20, 60), rnd(-60, 60), rnd(-40, 40), .3, '#cfe4f6', 3, 'dot');
        } else {
          p.vy = -640; p.jumps = p.onGround ? 1 : p.jumps + 1;
          if (p.jumps > 1){ for (let i = 0; i < 10; i++)
            part(p.x + rnd(-14, 14), p.y, rnd(-90, 90), rnd(20, 90), .35, '#9fe8ff', 3, 'dot'); }
        }

    }

    // decides between slide, dash, air and finishing attacks

      else if (p.rollT > 0) startMelee(p, 'slide');

    }
    if (p.pendingHeavy && p.atkCd <= 0 && p.atkT <= 0){ p.pendingHeavy = 0; startMelee(p, 'heavy'); }

      p.atkT = .3; p.atkMax = .3; p.atkKind = 'throw'; p.hitIds = new Set();

      Game.shots.push({ x: p.x + p.face * 26, y: p.y - 60, vx: p.face * 460, vy: -320, team: 'p',
        type: 'nade', dmg: th.dmg * p.atkMul, splash: th.splash, life: th.fire ? 1.6 : 2.2, r: 6,
        col: th.col, grav: 1, sticky: th.sticky, fire: th.fire });
      Snd.tone(300, .08, 'triangle', .08, 600);
    }
    if (consume('swap')){
      const gl = gunList();
      if (gl.length){ const i = gl.indexOf(p.gun); p.gun = gl[(i + 1) % gl.length]; S.equipped[1] = p.gun; save();
        toast(WMAP[p.gun].name + '  ' + (Game.ammo[p.gun] | 0), 900); Snd.ui(); }
      else toast('No firearm owned');
    }
    // shooting
    if (K.fire && p.gun && p.fireT <= 0 && p.mechT <= 0) fireGun(p, p.gun);

    p.holdT += dt;
    if (p.holdT > .32 && Math.random() < dt * 26)
      part(p.x + p.face * 26, p.y - rnd(40, 66), rnd(-30, 30), -rnd(20, 60), .3, p.holdT > .55 ? '#ffcc44' : '#9fe8ff', 3, 'dot');
  }
  if (!K.atk && p.holding){
    p.holding = 0;
    if (p.holdT > .32) p.pendingHeavy = 1;
    p.holdT = 0;
  }
  // skill
  if (consume('skill') && p.mp >= 100){ useSkill(p); }

  // melee resolution
  if (p.atkT > 0){
    p.atkT -= dt;
    p.pose = p.atkKind; p.poseT = 1 - p.atkT / p.atkMax;
    const prog = p.poseT;
    if (p.atkKind !== 'throw' && prog > .25 && prog < .8) meleeHit(p);
    if (p.atkT <= 0) p.pose = 'idle';
  } else if (p.rollT <= 0){
    if (!p.onGround) p.pose = p.vy < 0 ? 'jump' : 'fall';
    else if (K.fire && p.gun) p.pose = 'shoot';
    else if (Math.abs(p.vx) > 40) p.pose = 'run';
    else p.pose = 'idle';
  }
  if (p.pose === 'shoot') p.poseT = clamp(p.fireT, 0, 1);
  p.wep = p.mechT > 0 ? 'mini' : (K.fire && p.gun ? p.gun : (p.melee === 'fist' ? null : p.melee));
  if (p.burnT > 0){ p.burnT -= dt; }
  updateInfection(p, dt);
  if (consume('anti')) useAntidote();
  if (consume('stance')){
    if (Game.allies.length){
      Game.stance = Game.stance === 'fight' ? 'retreat' : 'fight';
      toast('SQUAD: ' + (Game.stance === 'fight' ? 'ENGAGE' : 'FALL BACK'), 1200);
      $('kT').classList.toggle('retreat', Game.stance === 'retreat');
    } else {
      p.emoteT = 1.1; p.emote = S.cos.emote;
      toast({ wave: '👋 …hello?', flex: '💪 flexing at zombies', taunt: '“COME ON THEN”', salute: '🫡 for the fallen' }[S.cos.emote] || 'emote', 1200);
    }
  }
  if (p.emoteT > 0){
    p.emoteT -= dt;
    p.pose = p.emote === 'flex' ? 'block' : p.emote === 'salute' ? 'throw' : p.emote === 'taunt' ? 'punch2' : 'block';
    p.poseT = 1 - p.emoteT / 1.1;
  }
  physics(p, dt);
}
function findFinisher(p){
  // a staggered, nearly-dead enemy in reach can be executed outright
  const w = WMAP[p.melee] || WMAP.fist;
  for (const e of Game.enemies){
    if (e.dead || e.boss || e.hp / e.maxHp > .18) continue;
    if (Math.abs(e.x - p.x) < (w.range || 62) + 10 && Math.abs(e.y - p.y) < 70) return e;
  }

}
function startMelee(p, kind, victim){
  const w = WMAP[p.melee] || WMAP.fist;
  const rate = w.rate * (p.berserkT > 0 ? .8 : 1);
  p.hitIds = new Set(); p.atkType = kind; p.finVictim = null;
  if (kind === 'light'){
    p.combo = (p.comboT > 0 ? p.combo % 3 : 0) + 1; p.comboT = .75;
    p.atkT = rate; p.atkPower = 1; p.atkKb = w.kb || 150; p.atkUp = p.combo === 3 ? 300 : 0;
    p.atkKind = w.kind === 'melee' && p.melee !== 'fist' ? 'swing' : (p.combo === 3 ? 'kick' : p.combo === 2 ? 'punch2' : 'punch');

    p.atkT = rate * 1.7; p.atkPower = 2.6; p.atkKb = (w.kb || 150) * 3.2; p.atkUp = 260;
    p.atkKind = 'swing'; p.vx += p.face * 120; shake(4);
    Snd.tone(160, .16, 'sawtooth', .14, 70);
  } else if (kind === 'air'){
    p.atkT = rate * .9; p.atkPower = 1.25; p.atkKb = 120; p.atkUp = 320;   // keeps them airborne
    p.atkKind = 'kick'; p.vy = Math.min(p.vy, -60);
  } else if (kind === 'slide'){
    p.atkT = .34; p.atkPower = 1.5; p.atkKb = 300; p.atkUp = 260;
    p.atkKind = 'kick'; p.vx = p.face * 700; p.iframe = Math.max(p.iframe, .18);

  } else if (kind === 'dash'){

function meleeHit(p){
  const w = WMAP[p.melee] || WMAP.fist;
  const reach = (w.range || 60) * (p.mechT > 0 ? 1.4 : 1);
  const box = { x: p.face > 0 ? p.x : p.x - reach, y: p.y - 74, w: reach, h: 66 };
  for (const e of Game.enemies){
    if (e.dead || p.hitIds.has(e)) continue;
    if (!overlapRect(box, hitbox(e))) continue;
    p.hitIds.add(e);
    const crit = Math.random() < p.crit;
    const pow = p.atkPower || 1;
    if (p.atkType === 'finisher' && (e === p.finVictim || e.hp / e.maxHp <= .18) && !e.boss){
      blood(e.x, e.y - 46 * e.s, p.face, 26); shake(7); Snd.punch();
      e.coinV = (e.coinV || 10) * 1.6;
      killEnt(e, { dir: p.face, big: 1 });
      Game.hitstop = Math.max(Game.hitstop, .12);
      addMp(p, 14);
      continue;
    }
    let d = wDmg(w, S.owned[p.melee] || 1) * p.atkMul * pow *
      (p.berserkT > 0 ? 2.2 : 1) * (p.mechT > 0 ? 2.6 : 1) * (crit ? 2 : 1) * (1 - (p.inf || 0) / 300);
    const juggling = !e.onGround || !p.onGround;
    hurtEnt(e, d, { fromX: p.x, kb: p.atkKb || 150, up: juggling ? Math.max(p.atkUp || 0, 250) : (p.atkUp || 0),
      crit, dir: p.face, stun: .25, big: crit || pow > 2,
      burn: w.id === 'chainsaw' ? 1 : 0, burnSrc: w.bleed ? 6 * w.bleed : 0, pierceShield: w.pierceShield });
    if (crit && Math.random() < .35) Game.slowmo = Math.max(Game.slowmo, .45);
    sparks(e.x, e.y - 46 * e.s, crit ? 12 : 5, crit ? '#ffcc44' : '#fff2b0');
    addMp(p, 5); Game.hitstop = Math.max(Game.hitstop, crit ? .075 : .045); shake(crit ? 5 : 2.5);
    Snd.punch();
    if (w.aoe){
      for (const o of Game.enemies) if (o !== e && !o.dead && Math.abs(o.x - e.x) < w.aoe)
        hurtEnt(o, d * .6, { fromX: p.x, kb: 260, up: 220, dir: p.face });
      sparks(e.x, GY - 10, 14, '#ffd76a');
    }
  }
  for (const c of Game.civs) if (c.caged && !c.freed && overlapRect(box, { x: c.x - 26, y: GY - 80, w: 52, h: 80 })) freeCiv(c);
  for (const g of Game.gear) if (g.breakable && !g.broken && overlapRect(box, { x: g.x - 24, y: GY - 60, w: 48, h: 60 })) breakGear(g);
}
function addMp(p, n){ p.mp = Math.min(100, p.mp + n * p.mpGain); }

function fireGun(p, id, free){
  const w = WMAP[id], lv = S.owned[id] || 1;
  if (!free){
    if ((Game.ammo[id] | 0) <= 0){ if (p.fireT <= 0){ Snd.tone(140, .06, 'square', .06); p.fireT = .3; toast('Out of ammo — press ⟳', 900); } return; }
    Game.ammo[id]--;
  }
  p.fireT = w.rate * (p.berserkT > 0 ? .7 : 1);
  p.pose = 'shoot'; p.poseT = 0;
  const hx = p.x + p.face * (28 * (p.mechT > 0 ? 1.5 : 1)), hy = p.y - 62 * (p.mechT > 0 ? 1.35 : 1);
  const crit = Math.random() < p.crit;
  const dmg = wDmg(w, lv) * p.atkMul * (p.berserkT > 0 ? 2.2 : 1) * (free ? 1.8 : 1) * (crit ? 2 : 1);
  const n = w.pellets || 1;
  for (let i = 0; i < n; i++){
    const sp = (w.spread || 0) * (n > 1 ? 1 : .5);
    const a = rnd(-sp, sp);
    if (w.kind === 'flame'){
      Game.shots.push({ x: hx, y: hy, vx: (Math.cos(a) * w.bs + rnd(-40, 40)) * p.face, vy: Math.sin(a) * w.bs * .6 + rnd(-30, 30),
        team: 'p', type: 'flame', dmg, life: .42, r: 14, col: '#ff8a2a', burn: 1 });
    } else if (w.kind === 'rocket'){
      Game.shots.push({ x: hx, y: hy, vx: Math.cos(a) * w.bs * p.face, vy: Math.sin(a) * 60, team: 'p',
        type: 'rocket', dmg, splash: w.splash, life: 2.5, r: 7, col: '#d8d8d0' });
    } else {
      Game.shots.push({ x: hx, y: hy, vx: Math.cos(a) * w.bs * p.face, vy: Math.sin(a) * w.bs * .4,
        team: 'p', type: id === 'rail' ? 'rail' : 'bullet', dmg, life: 1.1, r: 4, crit,
        pierce: (w.pierce || 0), col: id === 'rail' ? '#4de3a0' : '#ffe08a' });
    }
  }
  sparks(hx + p.face * 12, hy, 4, '#ffd76a');
  Game.flashes.push({ x: hx + p.face * 20, y: hy, r: 46, t: 0, life: .09 });
  addMp(p, w.kind === 'flame' ? .4 : 1.6);
  shake(w.kind === 'rocket' ? 6 : 1.2);
  if (w.kb) p.vx -= p.face * w.kb * .12;
  Snd.shot();
}

      if (e.dead) return;

      zapBurst(e.x, e.y - 40 * e.s, 40 * p.atkMul);
      shake(4);
    }, i * 130));
    toast('LIGHTNING STRIKE'); flashScreen(.25);
  }
  else if (id === 'missiles'){
    for (let i = 0; i < 12; i++) setTimeout(() => {
      if (Game.state !== 'play') return;
      const tg = Game.enemies.filter(e => !e.dead)[0];
      Game.shots.push({ x: p.x + rnd(-40, 40), y: p.y - 70, vx: rnd(200, 620) * (tg ? sign(tg.x - p.x) || 1 : p.face),
        vy: -rnd(120, 260), team: 'p', type: 'rocket', dmg: 120 * p.atkMul, splash: 110, life: 2.4, r: 6,
        col: '#e8e8e0', grav: .35, homing: 1 });
      Snd.shot();
    }, i * 70);
    toast('MISSILE BARRAGE');

    Game.gear.push({ type: 'drone', owner: null, x: p.x, y: 190, cd: 0, t: 20 });
    toast('DRONE SUPPORT ONLINE');
  }
  else if (id === 'slow'){ Game.slowmo = 6; toast('ADRENALINE'); }
  else if (id === 'turret'){
    Game.gear.push({ type: 'turret', x: p.x + p.face * 40, y: GY, t: 14, cd: 0, hp: 200 });
    toast('TURRET DEPLOYED');
  } else if (id === 'mech'){ p.mechT = 16; toast('MECH SUIT ONLINE'); Snd.lvl(); }

/* ------------------------------------------------------------- enemies */
function makeEnemy(type, x, tier){
  const t = ETYPES[type], d = DIFFS[Game.diff];

  const e = makeEnt({
    x, type, s: t.s, col: t.col, r: 24 * t.s,
    hp: t.hp * d.hp * scaleUp, maxHp: t.hp * d.hp * scaleUp,
    dmg: t.dmg * d.dmg * (1 + (tier || 0) * .08), spd: t.spd, atkR: t.atkR, rate: t.rate,
    xpV: t.xp, coinV: t.coin, kbres: t.kbres || 0, shield: t.shield || 0,
    ranged: t.ranged, rangeR: t.rangeR || t.atkR, charge: t.charge, lunge: t.lunge, crawl: t.crawl,
    bite: t.bite || 0, infSp: t.infSp || 1, fly: t.fly, quad: t.quad, gas: t.gas, zap: t.zap,
    boom: t.boom, aura: t.aura, drops: t.drops, mechU: t.mechU,
    eyes: type === 'mutant' || type === 'robot' ? '#ff5a5a' : null,
    headGear: t.headGear || null,
    gearCol: '#2a3546',
    wep: type === 'gunner' ? 'rifle' : type === 'robot' || type === 'drone' ? 'laser' : type === 'riot' ? 'bat' :
         type === 'flamer' ? 'flame' : type === 'mech' ? 'rocket' : type === 'elite' ? 'rifle' :
         type === 'mutant' || type === 'brute' ? 'claw' : null,
    aiT: rnd(0, .6)
  });
  if (t.crawl) e.pose = 'crawl';
  if (t.fly){ e.y = GY - 150; e.flyBase = GY - 150 - rnd(0, 40); }

}
function makeBoss(id, x){
  const b = BMAP[id], d = DIFFS[Game.diff];
  const scaleUp = (1 + (Game.mode === 'bossrush' ? .25 : 0)) * (S.ngplus ? 1.6 : 1);
  const e = makeEnt({
    x, type: 'boss', boss: 1, bossId: id, name: b.name, s: b.s, col: b.col, r: 40 * b.s,
    hp: b.hp * d.hp * scaleUp, maxHp: b.hp * d.hp * scaleUp, dmg: b.dmg * d.dmg,
    spd: 92, atkR: 88 * b.s, rate: 1.1, xpV: 400, coinV: 700, kbres: .92,
    moves: b.moves, drop: b.drop, eyes: '#ff3a3a', headGear: 'helmet', gearCol: b.col,
    moveT: 1.4, phase: 1, wep: b.drop && WMAP[b.drop] && WMAP[b.drop].kind !== 'melee' ? b.drop : 'claw',
    heli: b.heli, flyY: 200
  });
  if (b.heli){ e.y = 240; e.fly = 1; }
  Game.boss = e;
  $('bossBar').classList.remove('hidden'); $('bossName').textContent = b.name;
  toast('⚠ ' + b.name, 2400); Snd.bad(); shake(10); Snd.startMusic(true);
  return e;
}

function updateEnemy(e, dt){
  const p = Game.player;
  if (e.dead){ e.deadT += dt; e.pose = 'hurt'; physics(e, dt); return; }
  if (e.burnT > 0){ e.burnT -= dt; e.burnTick = (e.burnTick || 0) - dt;
    if (e.burnTick <= 0){ e.burnTick = .4; e.hp -= e.burnSrc; fire(e.x, e.y - 40 * e.s, 2); if (e.hp <= 0) killEnt(e, {}); } }
  if (e.stun > 0){ e.pose = 'hurt'; physics(e, dt); return; }
  if (e.boss){ updateBoss(e, dt); return; }

  const target = nearestTarget(e);
  if (!target){ e.pose = 'idle'; physics(e, dt); return; }
  const dx = target.x - e.x, ad = Math.abs(dx);
  e.face = sign(dx);
  e.aiT -= dt;

  /* ---- special strains ---- */
  if (e.gas && Math.random() < dt * .25) gasCloud(e.x, 5, 3.5);
  if (e.zap){
    e.zapT = (e.zapT || rnd(1, 3)) - dt;
    if (e.zapT <= 0 && ad < 240){ e.zapT = rnd(3, 5); zapBurst(e.x, e.y - 40 * e.s, e.dmg * 1.3); e.zapDraw = .25; }
    if (e.zapDraw > 0) e.zapDraw -= dt;
  }
  if (e.boom){
    if (ad < 78){ e.fuse = (e.fuse === undefined ? .85 : e.fuse) - dt; e.flash = .06;
      if (e.fuse <= 0){ killEnt(e, { dir: 1 }); return; } }
    else if (e.fuse !== undefined && e.fuse > 0) e.fuse = Math.min(.85, e.fuse + dt * .5);
  }
  if (e.aura){
    e.auraT = (e.auraT || 0) - dt;
    if (e.auraT <= 0){
      e.auraT = 2.5;
      for (const o of Game.enemies)
        if (o !== e && !o.dead && Math.abs(o.x - e.x) < 300){ o.buffT = 3; o.flash = Math.max(o.flash, .05); }
    }
  }
  if (e.buffT > 0){ e.buffT -= dt; }

  if (e.ranged && ad < e.rangeR && ad > 90){
    e.vx *= .8;
    e.pose = e.ranged === 'bullet' || e.ranged === 'laser' ? 'shoot' : 'throw';
    if (e.atkCd <= 0){
      e.atkCd = e.rate * rnd(.85, 1.3);
      const hy = e.y - 60 * e.s;
      const dy = (target.y - 50 - hy) / Math.max(140, ad);
      if (e.ranged === 'fire'){
        for (let i = 0; i < 3; i++)
          Game.shots.push({ x: e.x + e.face * 30 * e.s, y: hy, vx: e.face * rnd(340, 460), vy: rnd(-50, 50) + dy * 200,
            team: 'e', type: 'flame', dmg: e.dmg, life: .55, r: 14, col: '#ff8a2a' });
        e.atkCd = .12;
      } else if (e.ranged === 'rocketE'){
        Game.shots.push({ x: e.x + e.face * 40 * e.s, y: hy, vx: e.face * 620, vy: dy * 300, team: 'e',
          type: 'rocket', dmg: e.dmg, splash: 110, life: 2.4, r: 7, col: '#d8d0c0' });
      } else {
        const bs = e.ranged === 'laser' ? 900 : e.ranged === 'spit' ? 520 : 1000;
        Game.shots.push({ x: e.x + e.face * 26 * e.s, y: hy, vx: e.face * bs, vy: dy * bs * .55, team: 'e',
          type: e.ranged === 'spit' ? 'spit' : 'bullet', dmg: e.dmg, life: 1.4, r: e.ranged === 'spit' ? 8 : 4,
          col: e.ranged === 'spit' ? '#b6ff5a' : e.ranged === 'laser' ? '#ff6a6a' : '#ffd76a',
          grav: e.ranged === 'spit' ? .35 : 0, infect: e.ranged === 'spit' ? .12 : 0 });
      }
      sparks(e.x + e.face * 30 * e.s, hy, 3, '#ff9a5a'); Snd.shot();
      e.poseT = 0;
    }
    physics(e, dt); return;
  }
  for (const o of Game.enemies){
    if (o === e || o.dead || o.boss) continue;
    const gap = o.x - e.x;
    if (Math.abs(gap) < 26 * e.s){ e.vx -= sign(gap || 1) * 340 * dt; break; }
  }
  if (ad > e.atkR){
    let sp = e.spd * (e.buffT > 0 ? 1.35 : 1);
    if (e.charge && ad < 420 && e.aiT <= 0){ sp *= 2.6; e.chargeT = (e.chargeT || 0) + dt;
      if (e.chargeT > 1.6){ e.chargeT = 0; e.aiT = 2.4; } }
    if (e.lunge && ad < 220 && e.onGround && Math.random() < dt * 1.6){ e.vy = -420; e.vx = e.face * 380; }
    e.vx += sign(dx) * sp * 8 * dt;
    e.vx = clamp(e.vx, -sp, sp);
    e.pose = e.crawl ? 'crawl' : 'run';
  } else {
    e.vx *= .85;
    if (e.atkCd <= 0){
      e.atkCd = e.rate * rnd(.8, 1.25); e.poseT = 0; e.atkAnim = .34;
      e.pendingHit = .16;
    }
    if (e.atkAnim > 0){ e.atkAnim -= dt; e.pose = e.crawl ? 'crawl' : (e.type === 'brute' ? 'swing' : 'punch'); }
    else e.pose = e.crawl ? 'crawl' : 'idle';
  }
  if (e.pendingHit > 0){
    e.pendingHit -= dt;
    if (e.pendingHit <= 0){
      const tg = nearestTarget(e);
      if (tg && Math.abs(tg.x - e.x) < e.atkR + 24 && Math.abs(tg.y - e.y) < 80){
        const dealt = hurtEnt(tg, e.dmg * (e.buffT > 0 ? 1.4 : 1), { fromX: e.x, kb: 200, dir: sign(tg.x - e.x) });
        if (dealt && e.bite) tryInfect(tg, e.bite, e.infSp);
        if (tg === Game.player) shake(4);
      }
      Snd.punch();
    }
  }
  physics(e, dt);
}
function nearestTarget(e){
  let best = null, bd = 1e9;
  const cands = [Game.player].concat(Game.allies);
  for (const c of cands){ if (!c || c.dead) continue; const d = Math.abs(c.x - e.x); if (d < bd){ bd = d; best = c; } }
  return best;
}

/* --------------------------------------------------------------- bosses */
function updateBoss(b, dt){
  const p = Game.player; if (!p) return;
  const dx = p.x - b.x, ad = Math.abs(dx);
  b.face = sign(dx) || 1;
  b.moveT -= dt;
  if (b.hp < b.maxHp * .5 && b.phase === 1){ b.phase = 2; b.rate *= .75; toast(b.name + ' IS ENRAGED', 1800); shake(10); flashScreen(.3); }

  if (b.heli){
    b.y = 200 + Math.sin(b.anim * 1.1) * 40;
    b.vx += sign(dx) * 120 * dt; b.vx = clamp(b.vx, -220, 220);
    b.x += b.vx * dt; b.anim += dt;
    if (b.moveT <= 0){
      b.moveT = b.phase === 2 ? .8 : 1.3;
      const t = rnd(0, 1);
      if (t < .5){ for (let i = 0; i < 3; i++) setTimeout(() => { if (!b.dead) Game.shots.push({ x: b.x, y: b.y + 30, vx: rnd(-60, 60) + dx * .4, vy: 520, team: 'e', type: 'bullet', dmg: b.dmg * .5, life: 1.4, r: 4, col: '#ffd76a' }); }, i * 110); }
      else Game.shots.push({ x: b.x, y: b.y + 20, vx: sign(dx) * 200, vy: 260, team: 'e', type: 'rocket', dmg: b.dmg, splash: 120, life: 3, r: 8, col: '#e0e0d0' });
    }
    if (b.hitT > 0) b.flash = .08;
    return;
  }

  if (b.moveT <= 0){
    const mv = pick(b.moves);
    b.moveT = rnd(1.5, 2.5) / (b.phase === 2 ? 1.5 : 1);
    b.act = mv; b.actT = 0;
    if (mv === 'dash'){ b.vx = b.face * 900; b.pose = 'run'; }
    else if (mv === 'charge'){ b.vx = b.face * 760; b.pose = 'run'; b.charging = .9; }
    else if (mv === 'leap'){ b.vy = -760; b.vx = b.face * 520; }
    else if (mv === 'slam'){ b.pose = 'swing'; b.poseT = 0; b.slamT = .45; }
    else if (mv === 'volley'){ b.volley = 5; b.volleyT = 0; }
    else if (mv === 'spit3'){ b.volley = 3; b.volleyT = 0; b.spit = 1; }
    else if (mv === 'summon'){
      for (let i = 0; i < (b.phase === 2 ? 4 : 3); i++){
        const t = pick(CHAPTERS[Math.min(CH_N - 1, Game.ch)].pool);
        Game.enemies.push(makeEnemy(t, b.x + rnd(-260, 260), 1));
      }
      toast('REINFORCEMENTS!', 1100);
    }
    else if (mv === 'airstrike'){ callEnemyStrike(); }
    else if (mv === 'flamewave'){ b.flameT = 1.1; }
    else if (mv === 'rage'){ b.berserk = 5; toast(b.name + ': RAGE', 1200); }
    else if (mv === 'throw'){
      Game.shots.push({ x: b.x, y: b.y - 90, vx: b.face * 460, vy: -300, team: 'e', type: 'nade',
        dmg: b.dmg, splash: 140, life: 2.2, r: 8, col: '#6a5a4a', grav: 1 });
    }
  }
  b.actT += dt;
  if (b.volley > 0){
    b.volleyT -= dt;
    if (b.volleyT <= 0){
      b.volleyT = .16; b.volley--;
      const hy = b.y - 90 * (b.s / 2);
      Game.shots.push({ x: b.x + b.face * 40, y: hy, vx: b.face * (b.spit ? 520 : 980), vy: rnd(-60, 60), team: 'e',
        type: b.spit ? 'spit' : 'bullet', dmg: b.dmg * .55, life: 1.6, r: b.spit ? 9 : 5,
        col: b.spit ? '#b6ff5a' : '#ffd76a', grav: b.spit ? .3 : 0 });
      Snd.shot(); b.pose = 'shoot'; b.poseT = 0;
      if (b.volley <= 0) b.spit = 0;
    }
  }
  if (b.slamT > 0){
    b.slamT -= dt;
    if (b.slamT <= 0){
      shake(12); boomFX(b.x, GY - 10, 90); Snd.boom();
      for (const t of [Game.player].concat(Game.allies)) if (t && !t.dead && Math.abs(t.x - b.x) < 220)
        hurtEnt(t, b.dmg, { fromX: b.x, kb: 380, up: 340 });
      for (let i = 0; i < 16; i++) part(b.x + rnd(-200, 200), GY, rnd(-90, 90), -rnd(100, 320), .7, '#8a7a5a', rnd(3, 7), 'chunk');
    } else b.pose = 'swing';
  }
  if (b.flameT > 0){
    b.flameT -= dt; b.pose = 'shoot';
    Game.shots.push({ x: b.x + b.face * 50, y: b.y - 70, vx: b.face * rnd(300, 480), vy: rnd(-60, 60),
      team: 'e', type: 'flame', dmg: b.dmg * .12, life: .5, r: 16, col: '#ff8a2a' });
  }
  if (b.charging > 0){
    b.charging -= dt;
    for (const t of [Game.player].concat(Game.allies))
      if (t && !t.dead && Math.abs(t.x - b.x) < 60 && t.iframe <= 0)
        hurtEnt(t, b.dmg * .9, { fromX: b.x, kb: 520, up: 260 });
    if (Math.random() < .5) part(b.x, GY - rnd(0, 20), rnd(-120, 120), -rnd(40, 140), .5, '#9a8a6a', 4, 'chunk');
  }
  if (b.berserk > 0) b.berserk -= dt;

  // basic pursuit / melee
  if (!b.volley && b.slamT <= 0 && b.flameT <= 0){
    if (ad > b.atkR){
      const sp = b.spd * (b.phase === 2 ? 1.25 : 1) * (b.berserk > 0 ? 1.5 : 1);
      b.vx += sign(dx) * sp * 6 * dt; b.vx = clamp(b.vx, -sp * 1.6, sp * 1.6);
      if (Math.abs(b.vx) > 40 && b.pose !== 'swing') b.pose = 'run';
    } else {
      if (b.atkCd <= 0){ b.atkCd = b.rate; b.pose = 'punch'; b.poseT = 0; b.pendingHit = .2; }
      else if (b.pose !== 'punch') b.pose = 'idle';
    }
  }
  if (b.pendingHit > 0){
    b.pendingHit -= dt;
    if (b.pendingHit <= 0){
      for (const t of [Game.player].concat(Game.allies))
        if (t && !t.dead && Math.abs(t.x - b.x) < b.atkR + 30){
          hurtEnt(t, b.dmg, { fromX: b.x, kb: 320, up: 180 });
          if (b.plague) tryInfect(t, .3, 2);
        }
      Snd.punch(); shake(5);
    }
  }
  physics(b, dt);
}

function makeAlly(id){
  const a = ALLIES[id], lvl = Math.max(1, S.allies[id] || 1);
  const guard = 1 + (S.skills.guard || 0) * .10;
  return makeEnt({
    x: 90, team: 'p', ally: 1, allyId: id, role: a.role, col: '#1a1a1a', gearCol: a.col,
    headGear: a.role === 'robot' ? 'helmet' : 'hair', eyes: '#fff',
    hp: a.hp * (1 + (lvl - 1) * .2) * guard, maxHp: a.hp * (1 + (lvl - 1) * .2) * guard,
    s: a.role === 'dog' ? .64 : a.role === 'shield' ? 1.14 : 1,
    dmg: a.dmg * (1 + (lvl - 1) * .25) * guard, spd: a.spd,
    wep: a.wep, gunId: a.wep, fireT: 0, downT: 0, r: 24, roleT: rnd(0, 3),
    immune: a.immune ? 1 : 0, quad: a.quad ? 1 : 0, shield: a.role === 'shield' ? .7 : 0,
    kbres: a.role === 'shield' ? .6 : a.role === 'robot' ? .5 : 0,
    inf: 0, infSp: 1, melee: a.role === 'dog' || a.role === 'shield'
  });
}
const ALLY_RANGE = { sniper: 940, heavy: 640, medic: 460, engineer: 600, drone: 620, robot: 660, dog: 460, shield: 300, assault: 560 };

function updateAlly(a, dt){
  const p = Game.player;
  updateInfection(a, dt);
  if (a.dead){
    a.deadT += dt; a.downT -= dt; a.pose = 'hurt';
    // medics get their squadmates back on their feet faster
    const medic = Game.allies.some(m => !m.dead && m.role === 'medic' && Math.abs(m.x - a.x) < 320);
    if (medic) a.downT -= dt * 2;
    if (a.downT <= 0 && !S.hardcore){
      a.dead = false; a.deadT = 0; a.hp = a.maxHp * .6; a.x = p.x - p.face * 60; a.y = GY;
      toast(ALLIES[a.allyId].name + ' is back up');
    }
    physics(a, dt); return;
  }
  a.roleT -= dt;
  if (a.fireT > 0) a.fireT -= dt;
  const retreat = Game.stance === 'retreat';

  /* ---- role utilities ---- */
  if (a.role === 'medic' && a.roleT <= 0){
    let worst = null, frac = .92;
    for (const t of [p].concat(Game.allies)){
      if (!t || t.dead || t === a) continue;
      const f = t.hp / t.maxHp;
      if (f < frac && Math.abs(t.x - a.x) < 340){ frac = f; worst = t; }
    }
    if (!worst && a.hp / a.maxHp < .7) worst = a;
    if (worst){
      a.roleT = 7; worst.hp = Math.min(worst.maxHp, worst.hp + worst.maxHp * .26);
      for (let i = 0; i < 14; i++)
        part(worst.x + rnd(-14, 14), worst.y - rnd(10, 70), rnd(-20, 20), -rnd(30, 110), .7, '#ffffff', 3, 'dot');
      Snd.cure();
    }
  }
  if (a.role === 'engineer' && a.roleT <= 0 && Game.enemies.some(e => !e.dead && Math.abs(e.x - a.x) < 620)){
    a.roleT = 24;
    Game.gear.push({ type: 'turret', x: a.x + a.face * 34, y: GY, t: 18, cd: 0, hp: 200 });
    toast('Wren deployed a turret', 1200);
  }
  if (a.role === 'drone' && !a.droneOut){
    a.droneOut = 1;
    Game.gear.push({ type: 'drone', owner: a, x: a.x, y: 190, cd: 0, t: 1e9 });
  }

  /* ---- pick a target ---- */
  let tgt = null, bd = ALLY_RANGE[a.role] || 560;
  if (!retreat){
    for (const e of Game.enemies){
      if (e.dead) continue;
      const d = Math.abs(e.x - a.x);
      if (d < bd){ bd = d; tgt = e; }
    }
  }

  if (retreat){
    const want = p.x - p.face * (120 + (a.slot || 0) * 56);
    const d = want - a.x;
    if (Math.abs(d) > 40){ a.face = sign(d); a.vx += sign(d) * a.spd * 8 * dt; a.vx = clamp(a.vx, -a.spd * 1.3, a.spd * 1.3); a.pose = 'run'; }
    else { a.vx *= .8; a.pose = Math.abs(a.vx) > 40 ? 'run' : 'block'; a.face = p.face; }
    physics(a, dt); return;
  }

  if (tgt){
    a.face = sign(tgt.x - a.x) || 1;
    const d = Math.abs(tgt.x - a.x);
    if (a.melee){
      // dogs and shields close the distance and hit things
      if (d > (a.role === 'dog' ? 40 : 54)){ a.vx += a.face * a.spd * 9 * dt; a.pose = a.quad ? 'run' : 'run'; }
      else {
        a.vx *= .8;
        if (a.fireT <= 0){
          a.fireT = a.role === 'dog' ? .55 : .9;
          a.pose = 'punch'; a.poseT = 0;
          hurtEnt(tgt, a.dmg, { fromX: a.x, kb: a.role === 'shield' ? 320 : 140, dir: a.face, stun: .2 });
          sparks(tgt.x, tgt.y - 40, 4, '#fff2b0'); Snd.punch();
        } else if (a.fireT > .3) a.pose = 'punch';
        else a.pose = 'block';
      }
      if (a.role === 'dog' && d > 150 && d < 260 && a.onGround && Math.random() < dt * 2){ a.vy = -400; a.vx = a.face * 420; }
    } else {
      const keep = a.role === 'sniper' ? 640 : a.role === 'heavy' ? 300 : 230;
      if (d > keep){ a.vx += a.face * a.spd * 7 * dt; a.pose = 'run'; }
      else if (d < keep * .55){ a.vx -= a.face * a.spd * 5 * dt; a.pose = 'run'; }
      else { a.vx *= .8; a.pose = 'shoot'; }
      if (a.fireT <= 0 && d < bd + 40){
        const w = a.gunId === 'laser' ? { rate: .5, bs: 1600 } : WMAP[a.gunId] || { rate: .4, bs: 900 };
        a.fireT = w.rate * (a.role === 'sniper' ? 2.2 : a.role === 'heavy' ? .9 : 1.5);
        a.pose = 'shoot'; a.poseT = 0;
        const n = a.gunId === 'shotgun' ? 5 : 1;
        for (let i = 0; i < n; i++){
          const ang = rnd(-.11, .11);
          const hy = a.y - 60 * a.s;
          const dy = ((tgt.y - 46 * tgt.s) - hy) / Math.max(120, d);
          Game.shots.push({ x: a.x + a.face * 26, y: hy,
            vx: a.face * (w.bs || 900) * Math.cos(ang), vy: (dy + ang) * (w.bs || 900) * .5,
            team: 'p', type: a.gunId === 'plasma' || a.gunId === 'rocket' ? 'rocket' : 'bullet',
            dmg: a.dmg, splash: a.gunId === 'plasma' ? 80 : a.gunId === 'rocket' ? 110 : 0,
            life: a.role === 'sniper' ? 1.6 : 1.2, r: 4, pierce: a.role === 'sniper' ? 2 : 0,
            col: a.gunId === 'laser' ? '#9fe8ff' : a.role === 'sniper' ? '#ffffff' : '#ffe08a' });
        }
        sparks(a.x + a.face * 30, a.y - 60, 3, '#ffd76a'); Snd.shot();
      }
    }
    a.vx = clamp(a.vx, -a.spd, a.spd);
  } else {
    // no target: shields lead, everyone else tucks in behind the player
    const lead = a.role === 'shield' ? 70 : -(72 + (a.slot || 0) * 62);
    const want = p.x + p.face * lead;
    const d = want - a.x;
    if (Math.abs(d) > 60){ a.face = sign(d); a.vx += sign(d) * a.spd * 7 * dt; a.vx = clamp(a.vx, -a.spd, a.spd); a.pose = 'run'; }
    else { a.vx *= .8; a.pose = Math.abs(a.vx) > 40 ? 'run' : 'idle'; a.face = p.face; }
  }
  for (const o of Game.allies){
    if (o === a || o.dead) continue;
    if (Math.abs(o.x - a.x) < 34){ a.vx += sign(a.x - o.x || 1) * 260 * dt; break; }
  }
  physics(a, dt);
}

function drawBolt(x1, y1, x2, y2, col){
  ctx.strokeStyle = col || '#9fe8ff'; ctx.lineWidth = 2.4;
