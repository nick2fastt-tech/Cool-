/* ---------------------------------------------------------- projectiles */
function updateShots(dt){
  const arr = Game.shots;
  for (let i = arr.length - 1; i >= 0; i--){
    const s = arr[i];
    s.life -= dt;
    if (s.stuck){ s.x = s.stuck.x; s.y = s.stuck.y - 40 * (s.stuck.s || 1); }
    if (s.grav) s.vy += 1400 * s.grav * dt;
    if (s.type === 'flame'){ s.vx *= .93; s.vy -= 40 * dt; s.r += 34 * dt; }
    if (s.homing){
      let tg = null, bd = 460;
      for (const e of Game.enemies){ if (e.dead) continue; const d = Math.hypot(e.x - s.x, (e.y - 40) - s.y); if (d < bd){ bd = d; tg = e; } }
      if (tg){
        const a = Math.atan2((tg.y - 40) - s.y, tg.x - s.x), sp = Math.hypot(s.vx, s.vy) || 500;
        s.vx = lerp(s.vx, Math.cos(a) * sp, 1 - Math.pow(.02, dt));
        s.vy = lerp(s.vy, Math.sin(a) * sp, 1 - Math.pow(.02, dt));
        s.grav = 0;
      }
    }
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.type === 'flame') fire(s.x, s.y, 1);
    if (s.type === 'rocket' && Math.random() < .6) smoke(s.x, s.y, 1, 'rgba(160,160,170,');
    let gone = s.life <= 0 || s.x < cam.x - 400 || s.x > cam.x + viewW + 400;
    if (s.y > GY && (s.type === 'nade' || s.type === 'rocket' || s.type === 'spit')){
      if (s.type === 'nade' && s.life > 0 && !s.bounced){ s.bounced = 1; s.y = GY; s.vy = -260; s.vx *= .5; }
      else { explode(s); arr.splice(i, 1); continue; }
    }
    if (s.y > GY + 10 && s.type !== 'flame') gone = true;
    if (gone){ if (s.type === 'rocket' || s.type === 'nade') explode(s); arr.splice(i, 1); continue; }
    // collisions
    const targets = s.team === 'p' ? Game.enemies : [Game.player].concat(Game.allies);
    for (const t of targets){
      if (!t || t.dead) continue;
      const hb = hitbox(t);
      if (s.x > hb.x - s.r && s.x < hb.x + hb.w + s.r && s.y > hb.y - s.r && s.y < hb.y + hb.h + s.r){
        if (s.type === 'nade' && s.sticky && !s.stuck){
          s.stuck = t; s.life = Math.min(s.life, .9); s.grav = 0; s.vx = 0; s.vy = 0;
          Snd.tone(500, .08, 'square', .1); continue;
        }
        if (s.type === 'rocket' || s.type === 'nade'){ explode(s); arr.splice(i, 1); }
        else {
          hurtEnt(t, s.dmg, { fromX: s.x - s.vx * .01, dir: sign(s.vx), kb: s.type === 'flame' ? 20 : 110,
            crit: s.crit, burn: s.burn, burnSrc: 7, pierceShield: s.type === 'rail' });
          if (s.infect) tryInfect(t, s.infect, 1.5);
          if (s.team === 'p' && Game.player) addMp(Game.player, s.type === 'flame' ? .3 : 1.2);
          sparks(s.x, s.y, 4, s.col);
          if (s.type === 'flame'){ /* flame keeps going but only hits each once */ if (!s.hitSet) s.hitSet = new Set();
            if (s.hitSet.has(t)) continue; s.hitSet.add(t); }
          else if ((s.pierce | 0) > 0){ s.pierce--; if (!s.hitSet) s.hitSet = new Set(); s.hitSet.add(t); }
          else { arr.splice(i, 1); }
        }
        break;
      }
    }
  }
}
function explode(s){
  if (s.fire){
    firePool(s.x, 22, 6);
    for (let i = 0; i < 26; i++) fire(s.x + rnd(-60, 60), GY - rnd(0, 30), 1);
    Snd.boom(); shake(4); Game.flashes.push({ x: s.x, y: GY - 20, r: 130, t: 0, life: .3 });
  } else boomFX(s.x, s.y, s.splash || 100);
  const targets = s.team === 'p' ? Game.enemies : [Game.player].concat(Game.allies);
  for (const t of targets){
    if (!t || t.dead) continue;
    const d = Math.abs(t.x - s.x);
    if (d < (s.splash || 100)){
      const k = 1 - d / (s.splash || 100);
      hurtEnt(t, s.dmg * (.45 + k * .55), { fromX: s.x, kb: 380 * k, up: 300 * k, big: 1 });
    }
  }
  for (const g of Game.gear) if (g.breakable && !g.broken && Math.abs(g.x - s.x) < (s.splash || 100)) breakGear(g);
}
function drawShots(){
  for (const s of Game.shots){
    if (s.type === 'flame'){
      ctx.globalAlpha = clamp(s.life * 2.2, 0, .85);
      ctx.fillStyle = s.life > .3 ? '#ffe08a' : '#ff6a2a';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1; continue;
    }
    if (s.type === 'rail'){ ctx.strokeStyle = s.col; ctx.lineWidth = 4; ctx.globalAlpha = .9;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * .045, s.y - s.vy * .045); ctx.stroke(); ctx.globalAlpha = 1; continue; }
    if (s.type === 'rocket' || s.type === 'nade'){
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(Math.atan2(s.vy, s.vx));
      ctx.fillStyle = s.col; ctx.fillRect(-10, -4, 20, 8);
      ctx.fillStyle = '#ff8a2a'; ctx.fillRect(-15, -3, 6, 6); ctx.restore(); continue;
    }
    ctx.strokeStyle = s.col; ctx.lineWidth = s.type === 'spit' ? 6 : 2.6;
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * .022, s.y - s.vy * .022); ctx.stroke();
    if (s.type === 'spit'){ ctx.fillStyle = s.col; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill(); }
  }
}

function spawnPickup(x, y, kind, val){
  Game.pickups.push({ x, y, vx: rnd(-140, 140), vy: rnd(-360, -160), kind, val, t: 0, taken: 0 });

function updatePickups(dt){
  const p = Game.player;
  for (let i = Game.pickups.length - 1; i >= 0; i--){
    const o = Game.pickups[i]; o.t += dt;
    o.vy += 1300 * dt; o.x += o.vx * dt; o.y += o.vy * dt;
    if (o.y > GY - 8){ o.y = GY - 8; o.vy *= -.35; o.vx *= .7; }
    if (p && !p.dead){
      const d = Math.hypot(p.x - o.x, (p.y - 40) - o.y);
      if (d < 150 && o.t > .35){ const a = Math.atan2((p.y - 40) - o.y, p.x - o.x);
        o.vx += Math.cos(a) * 1500 * dt; o.vy += Math.sin(a) * 1500 * dt; }
      if (d < 34){
        if (o.kind === 'coin'){ Game.coins += o.val; Snd.coin(); }
        else if (o.kind === 'gem'){ Game.gems += o.val; Snd.coin(); }
        else if (o.kind === 'health'){ p.hp = Math.min(p.maxHp, p.hp + p.maxHp * .25); toast('+HP'); Snd.coin(); }
        else if (o.kind === 'ammo'){ const g = p.gun; if (g){ Game.ammo[g] = (Game.ammo[g] | 0) + Math.round(wAmmo(WMAP[g], S.owned[g] || 1) * .3); toast('+AMMO'); } Snd.coin(); }
        else if (o.kind === 'nade'){ Game.nades++; $('nadeN').textContent = Game.nades; toast('+THROWABLE'); Snd.coin(); }
        else if (o.kind === 'anti'){
          if (Game.antidotes < Game.diffData.maxAnti){ Game.antidotes++; toast('+ANTIDOTE  (' + Game.antidotes + '/' + Game.diffData.maxAnti + ')', 1500); }
          else toast('Antidote pouch full'); Snd.cure(); }
        else if (o.kind === 'mat'){
          const k = pick(['scrap', 'scrap', 'chem', 'cell', 'alloy']);
          Game.matsFound[k] = (Game.matsFound[k] || 0) + o.val; Snd.coin(); }
        Game.pickups.splice(i, 1); continue;
      }
    }
    if (o.t > 26) Game.pickups.splice(i, 1);
  }
}

    else { ctx.fillStyle = '#4a5a3a'; ctx.beginPath(); ctx.arc(o.x, o.y + b, 7, 0, 6.283); ctx.fill(); }
  }
}

function updateGear(dt){
  for (let i = Game.gear.length - 1; i >= 0; i--){
    const g = Game.gear[i];
    if (g.type === 'spikes' || g.type === 'zapfloor' || g.type === 'sawblade'){
      updateTraps(g, dt, i);
    } else if (g.type === 'vehicle'){
      // mounting is handled in updatePlayer so it beats the jump input
    } else if (g.type === 'turret'){
      g.t -= dt; g.cd -= dt;
      if (g.t <= 0){ smoke(g.x, GY - 20, 6); Game.gear.splice(i, 1); continue; }
      let tgt = null, bd = 520;
      for (const e of Game.enemies){ if (e.dead) continue; const d = Math.abs(e.x - g.x); if (d < bd){ bd = d; tgt = e; } }
      if (tgt && g.cd <= 0){
        g.cd = .14; const f = sign(tgt.x - g.x);
        Game.shots.push({ x: g.x + f * 22, y: GY - 34, vx: f * 1100, vy: ((tgt.y - 50) - (GY - 34)) * 1.4, team: 'p',
          type: 'bullet', dmg: 26 * (Game.player ? Game.player.atkMul : 1), life: 1, r: 4, col: '#9fe8ff' });
        sparks(g.x + f * 26, GY - 34, 2, '#9fe8ff'); Snd.shot();
      }
    } else if (g.type === 'gas' || g.type === 'firepool'){
      g.t -= dt; g.cd -= dt;
      if (g.t <= 0){ Game.gear.splice(i, 1); continue; }
      const isGas = g.type === 'gas';
      if (Math.random() < dt * (isGas ? 22 : 26)){
        if (isGas) part(g.x + rnd(-g.r, g.r), GY - rnd(0, 60), rnd(-14, 14), -rnd(6, 26), 1.1, 'rgba(120,220,160,', rnd(9, 18), 'smoke');
        else fire(g.x + rnd(-g.r, g.r), GY - rnd(0, 14), 1);
      }
      if (g.cd <= 0){
        g.cd = .5;
        for (const t of [Game.player].concat(Game.allies))
          if (t && !t.dead && Math.abs(t.x - g.x) < g.r){
            hurtEnt(t, g.dmg, { fromX: g.x, kb: 0 });
            if (isGas) tryInfect(t, .10, 1.8); else t.burnT = Math.max(t.burnT || 0, 1.5);
          }
        if (!isGas) for (const e of Game.enemies)
          if (!e.dead && Math.abs(e.x - g.x) < g.r) hurtEnt(e, g.dmg * 1.6, { fromX: g.x, kb: 0, burn: 1, burnSrc: 8 });
      }
    } else if (g.type === 'drone'){
      const own = g.owner;
      if (g.t < 1e8){ g.t -= dt; if (g.t <= 0){ smoke(g.x, g.y, 6); Game.gear.splice(i, 1); continue; } }
      if (own && own.gone){ Game.gear.splice(i, 1); continue; }
      const ax = own ? own.x : Game.player.x;
      g.x = lerp(g.x, ax - 40, 1 - Math.pow(.2, dt));
      g.y = 180 + Math.sin(Game.time * 2.2) * 14;
      g.cd -= dt;
      let tg = null, bd = 520;
      for (const e of Game.enemies){ if (e.dead) continue; const d = Math.abs(e.x - g.x); if (d < bd){ bd = d; tg = e; } }
      if (tg && g.cd <= 0){
        g.cd = .45; const f = sign(tg.x - g.x);
        Game.shots.push({ x: g.x, y: g.y + 10, vx: f * 1200, vy: ((tg.y - 46) - g.y) * 1.6, team: 'p',
          type: 'bullet', dmg: 24 * (Game.player ? Game.player.atkMul : 1), life: 1, r: 4, col: '#9fe8ff' });
        Snd.shot();
      }
    } else if (g.type === 'heli'){
      g.t -= dt; g.cd -= dt;
      g.x += (g.friendly ? 420 : 360) * dt;
      if (g.t <= 0){ Game.gear.splice(i, 1); continue; }
      if (g.cd <= 0){
        g.cd = g.friendly ? .16 : .34;
        if (g.friendly){
          Game.shots.push({ x: g.x, y: g.y + 20, vx: rnd(60, 180), vy: 700, team: 'p', type: 'rocket',
            dmg: 130 * (Game.player ? Game.player.atkMul : 1), splash: 120, life: 2, r: 7, col: '#d8d8d0' });
        } else {
          const px = Game.player ? Game.player.x : g.x;
          Game.shots.push({ x: g.x, y: g.y + 20, vx: (px - g.x) * .5, vy: 620, team: 'e', type: 'rocket',
            dmg: 70 * DIFFS[Game.diff].dmg, splash: 110, life: 2, r: 7, col: '#e0c0c0' });
        }
      }
    }
  }
}

const MAXALIVE = 24;

function spawnParty(){

/* --------------------------------------------------------- stage build */
function startMission(mode, ch, st, opts){
  opts = opts || {};
  resetRun();
  Game.mode = mode; Game.ch = ch | 0; Game.st = st | 0; Game.diff = S.difficulty;
  Game.diffData = DIFFS[Game.diff];
  Game.antidotes = Math.min(S.antidotes, Game.diffData.maxAnti);
  Game.stance = 'fight'; Game.everBitten = false; Game.squadWiped = 0;
  $('kT').classList.remove('retreat');
  Game.modeData = opts;
  let mapId, seed, len, pool;
  if (mode === 'story'){
    const C = CHAPTERS[Game.ch];
    mapId = C.map; pool = C.pool; len = 2700 + Game.st * 550 + Game.ch * 60; seed = 1000 + Game.ch * 31 + Game.st;
  } else if (mode === 'survival'){
    mapId = opts.map || pick(MAPS).id; pool = CH_POOL[rndi(0, CH_POOL.length - 1)]; len = 1900; seed = 7000 + rndi(0, 999);
  } else if (mode === 'defense'){
    mapId = opts.map || pick(MAPS).id; pool = CH_POOL[rndi(2, CH_POOL.length - 1)]; len = 2200; seed = 6100 + rndi(0, 999);
  } else if (mode === 'horde'){
    mapId = opts.map || pick(MAPS).id; pool = CH_POOL[rndi(4, CH_POOL.length - 1)]; len = 2600; seed = 6200 + rndi(0, 999);
  } else if (mode === 'timeattack'){
    mapId = opts.map || pick(MAPS).id; pool = CH_POOL[rndi(1, CH_POOL.length - 1)]; len = 2400; seed = 6300 + rndi(0, 999);
  } else if (mode === 'weekly'){
    const R2 = mulberry(weekSeed());
    mapId = MAPS[Math.floor(R2() * MAPS.length)].id; pool = CH_POOL[Math.floor(R2() * CH_POOL.length)];
    len = 3600; seed = weekSeed();
  } else if (mode === 'bossrush'){
    mapId = 'lab'; pool = CH_POOL[CH_POOL.length - 1]; len = 1900; seed = 8123;
  } else if (mode === 'endless'){
    mapId = opts.map || pick(MAPS).id; pool = CH_POOL[rndi(2, CH_POOL.length - 1)]; len = 60000; seed = 9000 + rndi(0, 999);
  } else if (mode === 'secret'){
    mapId = 'lab'; pool = ['elite', 'robot', 'mech', 'armored', 'toxic']; len = 2400; seed = 4242;
  } else { // daily
    const R = mulberry(dailySeed());
    mapId = MAPS[Math.floor(R() * MAPS.length)].id; pool = CH_POOL[Math.floor(R() * CH_POOL.length)];
    len = 3000; seed = dailySeed();
  }
  Game.len = len;
  Game.bg = buildBG(mapId, len, seed);
  initWeather(MAPS.find(m => m.id === mapId) || MAPS[0], seed);
  Game.pool = pool;
  loadAmmo();
  Game.player = makePlayer();
  Game.player.x = 120;
  spawnParty();
  Game.startedWithAllies = Game.allies.length;

  const R = mulberry(seed);
  // interactive objects & secrets
  for (let x = 320; x < len - 300; x += 380 + R() * 320){
    const k = R();
    Game.gear.push({ type: k > .7 ? 'barrel' : 'crateObj', x, breakable: 1, broken: 0 });
  }
  if (mode === 'story' || mode === 'daily' || mode === 'weekly'){
    const sx = 500 + R() * (len - 900);
    Game.gear.push({ type: 'secret', x: sx, breakable: 1, broken: 0 });
  }
  buildTraps(Game.bg, seed, len);
  // a ride shows up on the bigger stages
  if ((mode === 'story' && (Game.st === 1 || Game.ch >= 6)) || mode === 'endless' || mode === 'daily'){
    const pool = Game.ch >= 12 ? ['tank', 'apc', 'heli'] : Game.ch >= 8 ? ['jeep', 'apc', 'bike'] : ['bike', 'jeep'];
    spawnVehicle(pick(pool), 700 + R() * Math.max(200, len - 1600));
  }
  // civilians in cages
  if (mode === 'story' || mode === 'daily' || mode === 'weekly'){
    const n = 2 + (Game.st % 2);
    for (let i = 0; i < n; i++){
      const cx = 600 + (len - 1100) * ((i + .5) / n) + R() * 160;
      Game.civs.push(makeEnt({ x: cx, caged: 1, col: '#2a2a30', headGear: 'hair', gearCol: '#8a5a3a',
        s: .92, pose: 'block', eyes: '#fff', civ: 1 }));
    }
  }
  // wave gates
  if (mode === 'story' || mode === 'daily' || mode === 'weekly'){
    const gates = 3 + Math.min(2, Game.st) + (mode === 'weekly' ? 2 : 0);
    for (let i = 0; i < gates; i++){
      const gx = 620 + (len - 1000) * (i / gates);
      const count = 5 + i * 2 + Game.ch + (Game.diff * 2);
      Game.gates.push({ x: gx, count, spawned: 0, active: 0, done: 0, tier: i });
    }
    Game.bossPending = (mode === 'daily') || (mode === 'weekly') || Game.st === ST_N - 1;
  } else if (mode === 'survival'){
    Game.wave = 0; Game.waveT = 1.5;
  } else if (mode === 'bossrush'){
    Game.brQueue = BOSSES.map(b => b.id).filter((id, i) => S.bossKills[id] || i <= S.progress.chapter);
    if (!Game.brQueue.length) Game.brQueue = ['butcher'];
    Game.brIdx = 0; Game.waveT = 1.2;
  } else if (mode === 'endless'){
    Game.waveT = 1; Game.endless = 0;
  } else if (mode === 'defense'){
    Game.gen = { x: Math.floor(len / 2), hp: 2000, max: 2000 };
    Game.player.x = Game.gen.x - 60;
    Game.wave = 0; Game.waveT = 2.5; Game.waveQ = 0;
  } else if (mode === 'horde'){
    Game.wave = 0; Game.waveT = 1; Game.hordeKills = 0;
  } else if (mode === 'timeattack'){
    Game.taLeft = 90; Game.taTarget = 60 + Game.diff * 20;
  } else if (mode === 'secret'){
    Game.gates = [];
    for (let i = 0; i < 3; i++)
      Game.gates.push({ x: 500 + i * 600, count: 8 + i * 4, spawned: 0, active: 0, done: 0, tier: 3 });
    Game.bossPending = 1;
    for (let i = 0; i < 6; i++) spawnPickup(300 + i * 40, GY - 60, 'anti', 1);
  }
  // resuming from a checkpoint skips the sections already cleared
  if (opts.checkpoint){
    const cp = opts.checkpoint;
    for (let i = 0; i < Math.min(cp.gates, Game.gates.length); i++){
      Game.gates[i].done = 1; Game.gates[i].spawned = Game.gates[i].count;
    }
    Game.player.x = cp.x;
    Game.checkpoint = cp;
    cam.x = clamp(cp.x - viewW * .42, 0, Math.max(0, Game.len - viewW));
    toast('RESUMING FROM CHECKPOINT', 1800);
  }
  Game.state = 'play';
  Snd.boot(); Snd.startMusic(false);
  $('hud').classList.remove('hidden'); $('pad').classList.remove('hidden');
  UI.hideScreen();
  updateWeaponLabel();
  setObjective({
    story: 'Advance and clear the area', survival: 'Survive as long as you can',
    bossrush: 'Destroy every boss', endless: 'Run east — never stop',
    daily: 'Daily Challenge', weekly: 'Weekly Challenge — clear it out',
    defense: 'Defend the generator', horde: 'Kill everything', timeattack: 'Beat the clock'
  }[mode] || 'Survive');
}
function weekSeed(){ const w = isoWeek(new Date()); let h = 7; for (let i = 0; i < w.length; i++) h = (h * 33 + w.charCodeAt(i)) >>> 0; return h; }
function dailySeed(){ const d = todayKey(); let h = 0; for (let i = 0; i < d.length; i++) h = (h * 31 + d.charCodeAt(i)) >>> 0; return h; }
function setObjective(t){ Game.objective = t; $('objective').textContent = t; }
function updateWeaponLabel(){
  const p = Game.player; if (!p) return;
  const g = p.gun ? WMAP[p.gun].name : 'no firearm';
  $('wname').textContent = '⚔ ' + (WMAP[p.melee] ? WMAP[p.melee].name.toUpperCase() : 'FISTS') + '   ▸   ✦ ' + g.toUpperCase();
}

/* ------------------------------------------------------------- spawning */
function spawnAt(type, side, tier){
  const p = Game.player;
  const x = side > 0 ? Math.min(Game.len - 40, cam.x + viewW + rnd(40, 160))
                     : Math.max(40, cam.x - rnd(40, 160));
  const e = makeEnemy(type, x, tier);
  e.face = side > 0 ? -1 : 1;
  Game.enemies.push(e);
  Game.spawned++;
  return e;
}
function aliveCount(){ let n = 0; for (const e of Game.enemies) if (!e.dead) n++; return n; }

function updateWaves(dt){
  const p = Game.player;
  if (Game.mode === 'story' || Game.mode === 'daily' || Game.mode === 'weekly' || Game.mode === 'secret'){
    // gate logic
    if (!Game.activeGate){
      for (const g of Game.gates){
        if (!g.done && p.x > g.x - 40){ Game.activeGate = g; g.active = 1; g.timer = 0;
          setObjective('CLEAR THE AREA  (' + g.count + ' hostiles)'); Snd.bad(); break; }
      }
    }
    const g = Game.activeGate;
    if (g){
      g.timer -= dt;
      if (g.spawned < g.count && aliveCount() < MAXALIVE && g.timer <= 0){
        const n = Math.min(3, g.count - g.spawned);
        for (let i = 0; i < n; i++) spawnAt(pick(Game.pool), Math.random() < .55 ? 1 : -1, g.tier);
        g.spawned += n; g.timer = rnd(.5, 1.1);
      }
      setObjective('CLEAR THE AREA  (' + Math.max(0, g.count - Game.gateKills(g)) + ' left)');
      if (g.spawned >= g.count && aliveCount() === 0){
        g.done = 1; Game.activeGate = null; setObjective('Area clear — move east ▶');
        toast('AREA CLEAR', 1200); Snd.coin();
        if (!S.hardcore){
          Game.checkpoint = { gates: Game.gates.filter(x => x.done).length, x: Math.round(p.x) };
          toast('CHECKPOINT', 900);
        }
      }
      Game.ambT -= dt;
    } else {
      Game.ambT -= dt;
      if (!Game.exitOpen && Game.ambT <= 0 && aliveCount() < 6){
        Game.ambT = rnd(2.4, 4.2);
        spawnAt(pick(Game.pool), Math.random() < .8 ? 1 : -1, 0);
      }
    }
    if (!Game.activeGate && Game.gates.every(x => x.done)){
      if (Game.bossPending && !Game.boss && !Game.bossDone && p.x > Game.len - 900){
        const id = Game.mode === 'secret' ? 'scientist'
                 : Game.mode === 'weekly' ? BOSSES[weekSeed() % BOSSES.length].id
                 : Game.mode === 'daily' ? BOSSES[dailySeed() % BOSSES.length].id
                 : CHAPTERS[Game.ch].boss;
        Game.enemies.push(makeBoss(id, Math.min(Game.len - 120, p.x + 420)));
        Game.bossPending = 0; setObjective('DEFEAT THE BOSS');
      } else if (!Game.boss && !Game.bossPending){
        Game.exitOpen = true;
        setObjective('Reach the extraction point ▶');
        if (p.x > Game.len - 90) finishMission(true);
      }
    }
    if (Game.boss && Game.boss.dead){ Game.boss = null; Game.bossDone = 1; }
  }
  else if (Game.mode === 'survival'){
    Game.waveT -= dt;
    if (aliveCount() === 0 && Game.waveT <= 0){
      Game.wave++;
      const n = 4 + Game.wave * 2;
      Game.waveQ = n; Game.waveT = 0;
      toast('WAVE ' + Game.wave, 1400); Snd.bad();
      setObjective('WAVE ' + Game.wave);
      if (Game.wave % 5 === 0){
        const bi = Math.min(BOSSES.length - 1, Math.floor(Game.wave / 5) - 1);
        Game.enemies.push(makeBoss(BOSSES[bi].id, p.x + 500));
      }
    }
    if (Game.waveQ > 0 && aliveCount() < MAXALIVE){
      spawnAt(pick(Game.pool), Math.random() < .5 ? 1 : -1, Math.floor(Game.wave / 2));
      Game.waveQ--;
      if (Game.wave % 3 === 0 && Game.waveQ === 0) Game.pool = CH_POOL[Math.min(9, Math.floor(Game.wave / 2))];
    }
    S.records.survival = Math.max(S.records.survival, Game.wave);
  }
  else if (Game.mode === 'bossrush'){
    if (!Game.boss){
      Game.waveT -= dt;
      if (Game.waveT <= 0){
        if (Game.brIdx >= Game.brQueue.length){ finishMission(true); return; }
        Game.enemies.push(makeBoss(Game.brQueue[Game.brIdx], p.x + 480));
        setObjective('BOSS ' + (Game.brIdx + 1) + ' / ' + Game.brQueue.length);
        Game.brIdx++; Game.waveT = 3;
      }
    }
    S.records.bossrush = Math.max(S.records.bossrush, Game.brIdx);
  }
  else if (Game.mode === 'defense'){
    const g = Game.gen;
    Game.waveT -= dt;
    if (aliveCount() === 0 && Game.waveQ <= 0 && Game.waveT <= 0){
      Game.wave++; Game.waveQ = 5 + Game.wave * 3; Game.waveT = 0;
      toast('WAVE ' + Game.wave + ' — DEFEND THE GENERATOR', 1800); Snd.bad();
      g.hp = Math.min(g.max, g.hp + g.max * .08);
      if (Game.wave % 4 === 0) Game.enemies.push(makeBoss(BOSSES[clamp(Math.floor(Game.wave / 4) - 1, 0, BOSSES.length - 1)].id, g.x + 420));
    }
    if (Game.waveQ > 0 && aliveCount() < MAXALIVE){
      const e = spawnAt(pick(Game.pool), Math.random() < .5 ? 1 : -1, Math.floor(Game.wave / 2));
      e.targetGen = 1; Game.waveQ--;
    }
    // enemies chew on the generator
    for (const e of Game.enemies){
      if (e.dead) continue;
      if (Math.abs(e.x - g.x) < 60){
        e.genCd = (e.genCd || 0) - dt;
        if (e.genCd <= 0){ e.genCd = 1; g.hp -= e.dmg * 1.6; shake(2); sparks(g.x, GY - 50, 6, '#ffcc44'); }
      }
    }
    setObjective('DEFEND  ·  WAVE ' + Game.wave + '  ·  GENERATOR ' + Math.max(0, Math.round(g.hp / g.max * 100)) + '%');
    S.records.defense = Math.max(S.records.defense || 0, Game.wave);
    if (g.hp <= 0){ boomFX(g.x, GY - 40, 220); Game.over = true; }
  }
  else if (Game.mode === 'horde'){
    Game.waveT -= dt;
    if (Game.waveT <= 0 && aliveCount() < MAXALIVE + 8){
      Game.waveT = .35;
      const tier = Math.floor(Game.time / 30);
      for (let i = 0; i < 3; i++) spawnAt(pick(Game.pool), Math.random() < .5 ? 1 : -1, tier);
      if (Game.time > 60 && Math.random() < .08) spawnAt('elite', 1, tier);
    }
    setObjective('HORDE  ·  KILLS ' + Game.kills + '  ·  ' + clock(Game.time));
    S.records.horde = Math.max(S.records.horde || 0, Game.kills);
  }
  else if (Game.mode === 'timeattack'){
    Game.taLeft -= dt;
    Game.waveT -= dt;
    if (Game.waveT <= 0 && aliveCount() < MAXALIVE){
      Game.waveT = .5;
      spawnAt(pick(Game.pool), Math.random() < .6 ? 1 : -1, 1);
    }
    setObjective('TIME ATTACK  ·  ' + Game.kills + '/' + Game.taTarget + '  ·  ' + Math.max(0, Math.ceil(Game.taLeft)) + 's');
    if (Game.kills >= Game.taTarget){
      S.records.timeattack = Math.max(S.records.timeattack || 0, Math.round((90 - Game.taLeft) * 10) / 10 ? Math.round(Game.time) : 1);
      finishMission(true); return;
    }
    if (Game.taLeft <= 0){ Game.over = true; }
  }
  else if (Game.mode === 'endless'){
    Game.dist = Math.max(Game.dist, Math.floor(p.x - 120));
    Game.waveT -= dt;
    const tier = Math.floor(Game.dist / 800);
    if (Game.waveT <= 0 && aliveCount() < MAXALIVE){
      Game.waveT = Math.max(.35, 1.5 - tier * .09);
      spawnAt(pick(Game.pool), Math.random() < .8 ? 1 : -1, tier);
      if (tier > 2 && Math.random() < .12) spawnAt(pick(['heavy', 'mutant', 'robot']), 1, tier);
    }
    if (Game.dist > (Game.lastBoss || 0) + 2200){
      Game.lastBoss = Game.dist;
      Game.enemies.push(makeBoss(BOSSES[clamp(Math.floor(Game.dist / 2200) - 1, 0, BOSSES.length - 1)].id, p.x + 520));
    }
    setObjective('DISTANCE  ' + Game.dist + 'm');
    S.records.endless = Math.max(S.records.endless, Game.dist);
  }
}
Game.gateKills = function(g){ return g.spawned - aliveCount(); };

      if (S.unlockedDiff < 2 && S.progress.chapter >= 6) S.unlockedDiff = 2;

  else if (Game.mode === 'defense'){ bonus = Game.wave * 140; }

  else if (Game.mode === 'weekly'){ if (win) bonus = 3000; }
  else if (Game.mode === 'secret'){ if (win){ bonus = 12000; S.gems += 10; S.mats.alloy = (S.mats.alloy || 0) + 40; } }
  else if (Game.mode === 'bossrush'){ bonus = Game.brIdx * 300; }
  else if (Game.mode === 'defense'){
    const g = Game.gen;
    Game.waveT -= dt;
    if (aliveCount() === 0 && Game.waveQ <= 0 && Game.waveT <= 0){
      Game.wave++; Game.waveQ = 5 + Game.wave * 3; Game.waveT = 0;
      toast('WAVE ' + Game.wave + ' — DEFEND THE GENERATOR', 1800); Snd.bad();
      g.hp = Math.min(g.max, g.hp + g.max * .08);

    }
    if (Game.waveQ > 0 && aliveCount() < MAXALIVE){
      const e = spawnAt(pick(Game.pool), Math.random() < .5 ? 1 : -1, Math.floor(Game.wave / 2));
      e.targetGen = 1; Game.waveQ--;
    }
    // enemies chew on the generator
    for (const e of Game.enemies){
      if (e.dead) continue;
      if (Math.abs(e.x - g.x) < 60){
        e.genCd = (e.genCd || 0) - dt;
        if (e.genCd <= 0){ e.genCd = 1; g.hp -= e.dmg * 1.6; shake(2); sparks(g.x, GY - 50, 6, '#ffcc44'); }
      }
    }
    setObjective('DEFEND  ·  WAVE ' + Game.wave + '  ·  GENERATOR ' + Math.max(0, Math.round(g.hp / g.max * 100)) + '%');
    S.records.defense = Math.max(S.records.defense || 0, Game.wave);
    if (g.hp <= 0){ boomFX(g.x, GY - 40, 220); Game.over = true; }
  }
  else if (Game.mode === 'horde'){
    Game.waveT -= dt;
    if (Game.waveT <= 0 && aliveCount() < MAXALIVE + 8){
      Game.waveT = .35;
      const tier = Math.floor(Game.time / 30);
      for (let i = 0; i < 3; i++) spawnAt(pick(Game.pool), Math.random() < .5 ? 1 : -1, tier);
      if (Game.time > 60 && Math.random() < .08) spawnAt('elite', 1, tier);
    }
    setObjective('HORDE  ·  KILLS ' + Game.kills + '  ·  ' + clock(Game.time));
    S.records.horde = Math.max(S.records.horde || 0, Game.kills);
  }
  else if (Game.mode === 'timeattack'){
    Game.taLeft -= dt;
    Game.waveT -= dt;
    if (Game.waveT <= 0 && aliveCount() < MAXALIVE){
      Game.waveT = .5;
      spawnAt(pick(Game.pool), Math.random() < .6 ? 1 : -1, 1);
    }
    setObjective('TIME ATTACK  ·  ' + Game.kills + '/' + Game.taTarget + '  ·  ' + Math.max(0, Math.ceil(Game.taLeft)) + 's');
    if (Game.kills >= Game.taTarget){
      S.records.timeattack = Math.max(S.records.timeattack || 0, Math.round((90 - Game.taLeft) * 10) / 10 ? Math.round(Game.time) : 1);
      finishMission(true); return;
    }
    if (Game.taLeft <= 0){ Game.over = true; }
  }
  else if (Game.mode === 'endless'){ bonus = Math.floor(Game.dist / 10); }
  else if (Game.mode === 'daily'){
    if (win && S.daily.chDone !== todayKey()){ S.daily.chDone = todayKey(); bonus = 1200; S.gems += 3; }
  }
  const hcMul = (S.hardcore ? 2 : 1) * (S.ngplus ? 1.8 : 1);
  const coins = Math.round((Game.coins + bonus) * (win ? 1 : .5) * hcMul);
  const xp = Math.round((Game.xp + (win ? bonus * .8 : 0)) * (win ? 1 : .5));
  S.coins += coins; S.gems += Game.gems; S.stats.coinsEarned += coins;
  for (const k in Game.matsFound) S.mats[k] = (S.mats[k] || 0) + Math.round(Game.matsFound[k] * (win ? 1 : .5) * hcMul);
  weeklyCheck();
  weeklyAdd('kills', Game.kills); weeklyAdd('rescues', Game.rescued);

  if (Game.secretFound) weeklyAdd('caches', 1);
  seasonAdd(Math.round(Game.kills * 2 + (win ? 120 : 30)));
  if (win && S.hardcore && Game.mode === 'story') S.stats.hardcoreWins = (S.stats.hardcoreWins || 0) + 1;
  if (Game.mode === 'timeattack' && win) S.records.timeattack = Math.max(S.records.timeattack || 0, Game.kills);
  const ups = addXp(xp);
  Game.result = { win, coins, xp, kills: Game.kills, rescued: Game.rescued, stars, ups,
    time: Game.time, wave: Game.wave, dist: Game.dist, bosses: Game.brIdx,
    mats: Object.assign({}, Game.matsFound), reason: Game.failReason,
    infected: Game.player ? Math.round(Game.player.inf || 0) : 0 };
  checkAch(); save(); Snd.stopMusic();
  $('pad').classList.add('hidden');
  if (win && Game.player && !Game.player.dead){
    Game.state = 'victory'; Game.victoryT = 0;
    Game.player.vehicle = null;
    return;
  }
  $('hud').classList.add('hidden');
  UI.result();
}

/* ----------------------------------------------------------- main loop */
let lastT = 0, acc = 0;
function step(dt){
  const p = Game.player;
  Game.time += dt;
  if (Game.slowmo > 0) Game.slowmo -= dt;
  if (Game.comboT > 0){ Game.comboT -= dt; if (Game.comboT <= 0) Game.combo = 0; }
  if (cam.shake > 0) cam.shake = Math.max(0, cam.shake - dt * 42);

  updatePlayer(p, dt);
  for (const a of Game.allies) updateAlly(a, dt);
  for (let i = Game.enemies.length - 1; i >= 0; i--){
    const e = Game.enemies[i];
    updateEnemy(e, dt);
    if (e.dead && e.deadT > 2.2) Game.enemies.splice(i, 1);
  }
  updateShots(dt); updatePickups(dt); updateGear(dt); updateParts(dt); updateDN(dt);
  updateWeather(dt);
  for (let i = Game.civs.length - 1; i >= 0; i--){
    const c = Game.civs[i];
    if (c.freed){ c.x += c.vx * dt; c.pose = 'run'; c.face = sign(c.vx); c.anim += dt;
      if (c.x < cam.x - 200 || c.x > cam.x + viewW + 200) Game.civs.splice(i, 1); }
    else c.anim += dt;
  }
  for (let i = Game.flashes.length - 1; i >= 0; i--){ const f = Game.flashes[i]; f.t += dt; if (f.t > f.life) Game.flashes.splice(i, 1); }
  for (let i = Game.bolts.length - 1; i >= 0; i--){ Game.bolts[i].t += dt; if (Game.bolts[i].t > .3) Game.bolts.splice(i, 1); }

  if (!Game.over) updateWaves(dt);

  // gate wall
  if (Game.activeGate) p.x = Math.min(p.x, Game.activeGate.x + 260);
  if (!Game.exitOpen && Game.mode === 'story') p.x = Math.min(p.x, Game.len - 120);

  // camera
  const camMax = Math.max(0, Game.len - viewW);
  let want = p.x - viewW * .42;
  if (Game.activeGate) want = Math.min(want, Game.activeGate.x + 300 - viewW * .5);
  cam.x = clamp(lerp(cam.x, clamp(want, 0, camMax), 1 - Math.pow(.001, dt)), 0, camMax);

  if (Game.squadWiped && Game.startedWithAllies && !Game.allies.length && !Game.over){
    Game.over = true; Game.wipeFail = 1;
  }
  if (Game.over && !Game.overT) Game.overT = 1.6;
  if (Game.overT){ Game.overT -= dt; if (Game.overT <= 0){ Game.overT = 0; finishMission(false); } }
  hudUpdate();
}
function hudUpdate(){
  const p = Game.player; if (!p) return;
  $('hpFill').style.width = clamp(p.hp / p.maxHp * 100, 0, 100) + '%';
  $('hpTxt').textContent = Math.max(0, Math.round(p.hp)) + '/' + Math.round(p.maxHp);
  $('mpFill').style.width = p.mp + '%'; $('mpTxt').textContent = Math.round(p.mp) + '%';
  const need = xpNeed(S.lvl);
  $('xpFill').style.width = clamp(S.xp / need * 100, 0, 100) + '%';
  $('lvTxt').textContent = 'Lv ' + S.lvl; $('xpTxt').textContent = Math.floor(S.xp / need * 100) + '%';
  $('coinTxt').textContent = fmt(S.coins + Game.coins);
  $('gemTxt').textContent = fmt(S.gems + Game.gems);
  $('timeTxt').textContent = clock(Game.time);
  const kS = $('kS');
  kS.style.setProperty('--mp', Math.round(p.mp) + '%');
  kS.classList.toggle('ready', p.mp >= 100);
  const at = $('ammoTxt'), am = p.mechT > 0 ? -1 : (p.gun ? (Game.ammo[p.gun] | 0) : -2);
  at.textContent = am === -1 ? '∞' : am === -2 ? '—' : am;
  at.classList.toggle('low', am >= 0 && am < 15);
  document.body.classList.toggle('lowhp', p.hp / p.maxHp < .28);
  const infRow = $('infRow');
  if (p.inf > 0){
    infRow.style.display = '';
    $('infFill').style.width = p.inf + '%';
    $('infTxt').textContent = Math.round(p.inf) + '%';
    $('infVig').style.opacity = clamp(p.inf / 100 * .85, 0, .85);
    document.body.classList.toggle('turning', p.inf > 65);
  } else {
    infRow.style.display = 'none'; $('infVig').style.opacity = 0;
    document.body.classList.remove('turning');
  }
  $('antiN').textContent = Game.antidotes;
  $('kV').classList.toggle('armed', Game.antidotes > 0 && (p.inf > 25 || Game.allies.some(a => a.inf > 25)));
  const ct = $('comboTag');
  if (Game.combo > 2){
    if (ct._n !== Game.combo){
      ct._n = Game.combo; ct.textContent = Game.combo + ' HIT COMBO';
      ct.classList.remove('pop'); void ct.offsetWidth; ct.classList.add('pop');
    }
    ct.style.opacity = 1;
  } else { ct.style.opacity = 0; ct._n = 0; }
  if (Game.boss && !Game.boss.dead){
    $('bossFill').style.width = clamp(Game.boss.hp / Game.boss.maxHp * 100, 0, 100) + '%';
    const pips = $('bossPips');
    if (pips._p !== Game.boss.phase){
      pips._p = Game.boss.phase;
      pips.innerHTML = Game.boss.phase >= 2 ? '<i></i><i class="on"></i>' : '<i class="on"></i><i class="on"></i>';
    }
  }
  const party = $('party');
  const want = Game.allies.map(a => (a.dead ? '⨯' : ALLIES[a.allyId].name[0]) + '|' + Math.round(a.hp / a.maxHp * 100) + '|' + (a.inf > 0 ? 1 : 0)).join(',');
  if (party._k !== want){
    party._k = want;
    party.innerHTML = Game.allies.map(a => {
      const c = ALLIES[a.allyId].col;
      return '<div class="pface' + (a.dead ? ' down' : '') + (a.inf > 0 ? ' sick' : '') + '" style="color:' + c + ';border-color:' + c + '55">' +
        (a.dead ? '⨯' : ALLIES[a.allyId].name.slice(0, 3).toUpperCase()) +
        '<i class="hpf" style="width:' + clamp(a.hp / a.maxHp * 100, 0, 100) + '%;background:' + c +
        ';box-shadow:0 0 8px ' + c + '"></i>' +
        (a.inf > 0 ? '<u class="inff" style="width:' + clamp(a.inf, 0, 100) + '%"></u>' : '') + '</div>';
    }).join('');
  } else {
    const nodes = party.children;
    for (let i = 0; i < nodes.length; i++){
      const a = Game.allies[i]; if (!a) continue;
      const f = nodes[i].querySelector('.hpf'); if (f) f.style.width = clamp(a.hp / a.maxHp * 100, 0, 100) + '%';
      const g = nodes[i].querySelector('.inff'); if (g) g.style.width = clamp(a.inf, 0, 100) + '%';
    }
  }
  if (Game.player.gun && Game.time % .25 < .02) updateWeaponLabel();
}

function render(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#05070c'; ctx.fillRect(0, 0, cv.width, cv.height);
  camApply();
  if (Game.bg) drawBG(Game.bg);
  // exit marker
  if (Game.exitOpen && (Game.mode === 'story' || Game.mode === 'daily')){
    const ex = Game.len - 80;
    ctx.fillStyle = 'rgba(77,227,160,.20)'; ctx.fillRect(ex - 30, GY - 220, 60, 220);
    ctx.fillStyle = '#4de3a0'; ctx.font = 'bold 22px Trebuchet MS'; ctx.textAlign = 'center';
    ctx.fillText('EXIT ▶', ex, GY - 232); ctx.textAlign = 'left';
  }
  if (Game.activeGate){
    const gx = Game.activeGate.x + 300;
    ctx.fillStyle = 'rgba(255,80,60,.10)'; ctx.fillRect(gx - 6, 0, 12, GY);
    ctx.strokeStyle = 'rgba(255,80,60,.55)'; ctx.lineWidth = 3; ctx.setLineDash([14, 12]);
    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, GY); ctx.stroke(); ctx.setLineDash([]);
  }
  if (Game.gen){
    const g = Game.gen;
    ctx.fillStyle = '#2a3a4a'; ctx.fillRect(g.x - 34, GY - 74, 68, 74);
    ctx.fillStyle = '#9fe8ff'; ctx.globalAlpha = .5 + Math.sin(Game.time * 4) * .2;
    ctx.fillRect(g.x - 22, GY - 62, 44, 26); ctx.globalAlpha = 1;
    ctx.fillStyle = '#0a1018'; ctx.fillRect(g.x - 34, GY - 90, 68, 8);
    ctx.fillStyle = g.hp / g.max > .35 ? '#4de3a0' : '#ff5347';
    ctx.fillRect(g.x - 34, GY - 90, 68 * clamp(g.hp / g.max, 0, 1), 8);
    if (g.hp / g.max < .5 && Math.random() < .3) smoke(g.x + rnd(-20, 20), GY - 70, 1);
  }
  drawWeather();
  drawGear();
  drawPickups();
  drawCivs();
  // entities sorted by scale so big things read behind
  const ents = Game.enemies.concat(Game.allies).filter(e => e.x > cam.x - 200 && e.x < cam.x + viewW + 200);
  ents.sort((a, b) => (b.s || 1) - (a.s || 1));
  for (const e of ents){ if (e.heli) drawBossHeli(e); else drawStick(e); if (e.boss) drawBossAura(e); }
  if (Game.player) drawPlayer(Game.player);
  drawShots();
  drawParts();
  // light flashes (additive)
  for (const b of Game.bolts){
    ctx.globalAlpha = clamp(1 - b.t / .3, 0, 1);
    drawBolt(b.x + rnd(-20, 20), -viewH, b.x, b.y, '#cfeaff');
    ctx.lineWidth = 6; ctx.globalAlpha *= .35; drawBolt(b.x, -viewH, b.x, b.y, '#8fd4ff');
    ctx.globalAlpha = 1;
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const f of Game.flashes){
    const k = 1 - f.t / f.life;
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * (1.2 - k * .4));
    g.addColorStop(0, 'rgba(255,220,150,' + (.75 * k) + ')');
    g.addColorStop(.55, 'rgba(255,140,60,' + (.32 * k) + ')');
    g.addColorStop(1, 'rgba(255,80,20,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1.2 - k * .4), 0, 6.283); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  drawDN();
  // off-screen enemy arrows
  ctx.fillStyle = 'rgba(255,90,70,.8)';
  for (const e of Game.enemies){
    if (e.dead) continue;
    if (e.x < cam.x - 20){ ctx.beginPath(); ctx.moveTo(cam.x + 14, GY - 120); ctx.lineTo(cam.x + 34, GY - 132); ctx.lineTo(cam.x + 34, GY - 108); ctx.fill(); }
    else if (e.x > cam.x + viewW + 20){ const rx = cam.x + viewW - 14;
      ctx.beginPath(); ctx.moveTo(rx, GY - 120); ctx.lineTo(rx - 20, GY - 132); ctx.lineTo(rx - 20, GY - 108); ctx.fill(); }
  }
}
function drawPlayer(p){
  if (p.mechT > 0){
    // mech chassis behind the hero
    ctx.save(); ctx.translate(p.x, p.y); ctx.scale(p.face, 1);
    ctx.fillStyle = '#3a4654'; ctx.fillRect(-34, -104, 68, 62);
    ctx.fillStyle = '#5a6a7c'; ctx.fillRect(-40, -110, 80, 14);
    ctx.fillStyle = '#9fe8ff'; ctx.fillRect(-14, -92, 28, 12);
    ctx.fillStyle = '#3a4654'; ctx.fillRect(-30, -44, 22, 44); ctx.fillRect(8, -44, 22, 44);
    ctx.fillStyle = '#6a7a8c'; ctx.fillRect(24, -96, 44, 20);
    ctx.restore();
  }
  if (p.vehicle){ drawVehicle(p); return; }
  drawStick(p);
  if (p.berserkT > 0){
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,60,40,.16)'; ctx.beginPath(); ctx.arc(p.x, p.y - 44, 46, 0, 6.283); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    if (Math.random() < .5) part(p.x + rnd(-16, 16), p.y - rnd(0, 80), rnd(-20, 20), -rnd(40, 120), .4, '#ff5a3a', 3, 'dot');
  }
  if (p.iframe > 0){ ctx.globalAlpha = .3; ctx.strokeStyle = '#9fe8ff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y - 40, 40, 0, 6.283); ctx.stroke(); ctx.globalAlpha = 1; }
}
function drawBossAura(b){
  ctx.globalAlpha = .18 + Math.sin(b.anim * 5) * .05;
  ctx.fillStyle = b.col;
  ctx.beginPath(); ctx.ellipse(b.x, GY - 4, 46 * b.s, 10 * b.s, 0, 0, 6.283); ctx.fill();
  ctx.globalAlpha = 1;
}
function drawBossHeli(b){
  drawHeli(b.x, b.y, b.col, b.anim * 22);
  if (b.flash > 0){ ctx.globalAlpha = .5; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(b.x, b.y, 58, 26, 0, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1; }
}

/* ------------------------------------------------------- victory pose */
function victoryStep(dt){
  Game.victoryT += dt;
  const p = Game.player, pose = S.cos.victory;
  p.vx *= .8; p.anim += dt; p.poseT = Game.victoryT;
  p.pose = pose === 'kneel' ? 'crawl' : pose === 'raise' ? 'throw' :
           pose === 'spin' ? 'swing' : (Game.victoryT % 1.2 < .6 ? 'block' : 'idle');
  if (pose === 'spin'){ p.poseT = (Game.victoryT * 1.4) % 1; }
  physics(p, dt);
  for (const a of Game.allies){ if (a.dead) continue; a.anim += dt; a.vx *= .8; a.pose = 'block'; physics(a, dt); }
  updateParts(dt); updateWeather(dt);
  cam.x = clamp(lerp(cam.x, p.x - viewW * .5, 1 - Math.pow(.02, dt)), 0, Math.max(0, Game.len - viewW));
  if (Math.random() < dt * 22)
    part(p.x + rnd(-70, 70), GY - rnd(0, 10), rnd(-40, 40), -rnd(120, 300), 1.3, pick(['#ffc93c', '#3ff0a5', '#8fe4ff']), rnd(2, 4), 'spark');
  if (Game.victoryT > 1.9){
    Game.state = 'result';
    $('hud').classList.add('hidden');
    UI.result();
  }
}

/* ------------------------------------------------- attract-mode backdrop */
const Attract = { ents: [], on: false, t: 0 };
function attractStart(){
  const m = pick(MAPS);
  Game.len = 6000;
  Game.bg = buildBG(m.id, Game.len, rndi(1, 99999));
  cam.x = rnd(300, 2200); cam.shake = 0;
  P.length = 0; DN.length = 0;
  Attract.ents = []; Attract.on = true;
  const hero = makeEnt({ x: cam.x + viewW * .36, col: '#111318', s: 1.06, headGear: 'hair', eyes: '#fff',
    face: 1, pose: 'run', wep: pick(['katana', 'bat', 'rifle', 'axe', 'shotgun']) });
  hero.spd = 128; Attract.ents.push(hero);
  for (let i = 0; i < 7; i++){
    const t = pick(['walker', 'runner', 'heavy', 'crawler', 'mutant', 'infected', 'dog', 'toxic']), d = ETYPES[t];
    const e = makeEnt({ x: cam.x + rnd(-260, viewW + 500), col: d.col, s: d.s,
      pose: d.crawl ? 'crawl' : 'run', face: -1, headGear: d.headGear || null, gearCol: '#2a3546', quad: d.quad });
    e.spd = d.spd * .55; Attract.ents.push(e);
  }
}
function attractStep(dt){
  Attract.t += dt;
  cam.x += 24 * dt;
  if (cam.x > Game.len - viewW - 80) cam.x = 240;
  for (const e of Attract.ents){
    e.anim += dt;
    e.x += e.spd * e.face * dt;
    if (e.x < cam.x - 300) e.x = cam.x + viewW + rnd(80, 460);
    else if (e.x > cam.x + viewW + 460) e.x = cam.x - rnd(80, 260);
  }
  updateParts(dt);
}
function attractRender(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#05070c'; ctx.fillRect(0, 0, cv.width, cv.height);
  camApply();
  if (Game.bg) drawBG(Game.bg);
  for (const e of Attract.ents) drawStick(e);
  drawParts();
}

function frame(ts){
  requestAnimationFrame(frame);
  if (Game.frameCap){
    const min = 1000 / Game.frameCap - 1.5;
    if (ts - lastT < min) return;
  }
  const raw = Math.min(.05, (ts - lastT) / 1000 || 0); lastT = ts;
  pollGamepad();
  if (Game.state === 'play' && !Game.paused) S.stats.playTime = (S.stats.playTime || 0) + raw;
  if (Game.state === 'play' && !Game.paused){
    if (Game.hitstop > 0){ Game.hitstop -= raw; }
    else {
      let dt = raw * (Game.slowmo > 0 ? .35 : 1);
      step(dt);
    }
    render();
  } else if (Game.state === 'play' && Game.paused){
    render();
  } else if (Game.state === 'victory'){
    victoryStep(raw); render();
  } else if (Game.state === 'cine'){
    cineStep(raw);
    cineRender();
  } else if (Attract.on){
    attractStep(raw);
    attractRender();
  }
}

    this.show('<div style="height:8vh"></div><h2 class="title center">Paused</h2>' +
      '<div class="center muted">' + Game.objective + '</div><div class="spacer"></div>' +
      '<div class="card"><div class="meta">Kills <b>' + Game.kills + '</b> · Rescued <b>' + Game.rescued + '</b> · ' +
      'Coins <b>' + fmt(Game.coins) + '</b> · Best combo <b>' + Game.best + '</b></div></div><div class="spacer"></div>' +
      '<button class="btn go big" data-act="resume">RESUME</button><div class="spacer"></div>' +
      '<div class="row"><button class="btn ghost" data-act="sound">Sound: ' + (S.sound ? 'ON' : 'OFF') + '</button>' +
      '<button class="btn warn" data-act="quitmission">Abandon mission</button></div>', true);
  },
  resume(){ Game.paused = false; this.hideScreen(); },

  /* ----------------------------------------------------------- result */
  result(){
    const r = Game.result;
    let extra = '';
    if (Game.mode === 'survival') extra = 'Waves survived <b>' + r.wave + '</b>';
    else if (Game.mode === 'endless') extra = 'Distance <b>' + fmt(r.dist) + 'm</b>';
    else if (Game.mode === 'bossrush') extra = 'Bosses <b>' + r.bosses + '</b>';
    const nextAvail = Game.mode === 'story' && r.win &&
      (Game.st + 1 < ST_N ? (Game.ch < S.progress.chapter || Game.st + 1 <= S.progress.stage) : Game.ch + 1 < CH_N);
    const line = (k, v, cls) => '<div class="statline"><span>' + k + '</span><b' + (cls ? ' class="' + cls + '"' : '') + '>' + v + '</b></div>';
    attractStart();
    this.show('<div style="height:3vh"></div>' +
      '<h1 class="logo' + (r.win ? '' : ' dead') + '" style="font-size:clamp(26px,8vw,52px)">' +
        (r.win ? 'MISSION COMPLETE' : r.reason === 'infected' ? 'YOU TURNED' : Game.wipeFail ? 'SQUAD LOST' : 'YOU DIED') + '</h1>' +
      (!r.win && r.reason === 'infected'
        ? '<div class="sub" style="color:#8fd8a0">the virus finished what the city started</div>' : '') +
      (Game.mode === 'story' && r.win
        ? '<div class="stars">' + [0, 1, 2].map(i => '<i' + (i < r.stars ? '' : ' class="off"') + '>★</i>').join('') + '</div>'
        : '<div class="spacer"></div>') +
      '<div class="card" style="--tone:' + (r.win ? 'var(--neon)' : 'var(--red)') + '">' +
      line('Kills', r.kills) +
      line('Civilians rescued', r.rescued) +
      line('Best combo', Game.best + '×') +
      line('Time', clock(r.time)) +
      (extra ? line(extra.split('<b>')[0].trim(), extra.split('<b>')[1].replace('</b>', '')) : '') +
      (Game.secretFound ? line('Hidden cache', 'FOUND ★', 'gold') : '') +
      (Object.values(r.mats || {}).some(v => v > 0)
        ? line('Materials', Object.keys(r.mats).filter(k => r.mats[k] > 0).map(k => r.mats[k] + ' ' + MATS[k]).join(', '), 'ice') : '') +
      line('Coins earned', '+' + fmt(r.coins) + ' ◉', 'gold') +
      line('EXP earned', '+' + fmt(r.xp), 'ice') +
      (r.ups ? line('Level up', '×' + r.ups + '  (+' + r.ups * 2 + ' SP)', 'neon') : '') +
      '</div><div class="spacer"></div>' +
      (nextAvail ? '<button class="btn go big" data-act="nextstage">NEXT MISSION ▶</button><div class="spacer"></div>' : '') +
      (!r.win && Game.lastCheckpoint && !S.hardcore && (Game.mode === 'story' || Game.mode === 'daily' || Game.mode === 'weekly')
        ? '<button class="btn go big" data-act="resumecp">CONTINUE FROM CHECKPOINT</button><div class="spacer"></div>' : '') +
      '<div class="row"><button class="btn" data-act="retry">Retry</button>' +
      '<button class="btn ghost" data-act="shop">Armory</button>' +
      '<button class="btn ghost" data-act="menu">Base</button></div>');
  }
};

/* ------------------------------------------------------------- actions */
scr.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const parts = el.dataset.act.split(':'), a = parts[0];
  Snd.boot(); Snd.ui();
  switch (a){
    case 'title': UI.title(); break;
    case 'menu': UI.menu(); break;
    case 'howto': UI.howto(); break;
    case 'story': UI.story(); break;
    case 'stages': UI.stages(+parts[1]); break;
    case 'brief': UI.brief(+parts[1], +parts[2]); break;
    case 'play': startMission('story', +parts[1], +parts[2]); break;
    case 'nextstage': {
      let c = Game.ch, s = Game.st + 1;
      if (s >= ST_N){ c++; s = 0; }
      if (c < CH_N) UI.brief(c, s); else UI.menu();
      break; }
    case 'retry':
      if (Game.mode === 'story') startMission('story', Game.ch, Game.st);
      else startMission(Game.mode, 0, 0, Game.modeData);
      break;
    case 'resumecp':
      startMission(Game.mode, Game.ch, Game.st, { checkpoint: Game.lastCheckpoint });
      break;
    case 'survivalinfo': UI.modeIntro('survival'); break;
    case 'bossrushinfo': UI.modeIntro('bossrush'); break;
    case 'endlessinfo': UI.modeIntro('endless'); break;
    case 'dailyinfo': UI.modeIntro('daily'); break;
    case 'survivalgo': startMission('survival', 0, 0); break;
    case 'bossrushgo': startMission('bossrush', 0, 0); break;
    case 'endlessgo': startMission('endless', 0, 0); break;
    case 'dailygo': startMission('daily', 0, 0); break;
    case 'defenseinfo': UI.modeIntro('defense'); Game.lastIntro = 'defense'; break;
    case 'hordeinfo': UI.modeIntro('horde'); Game.lastIntro = 'horde'; break;
    case 'timeattackinfo': UI.modeIntro('timeattack'); Game.lastIntro = 'timeattack'; break;
    case 'weeklyinfo': UI.modeIntro('weekly'); Game.lastIntro = 'weekly'; break;
    case 'defensego': startMission('defense', 0, 0); break;
    case 'hordego': startMission('horde', 0, 0); break;
    case 'timeattackgo': startMission('timeattack', 0, 0); break;
    case 'weeklygo': startMission('weekly', 0, 0); break;
    case 'secretinfo': UI.modeIntro('secret'); Game.lastIntro = 'secret'; break;
    case 'secretgo': startMission('secret', 0, 0); break;
    case 'shop': UI.shop(); break;
    case 'skills': UI.skills(); break;
    case 'allies': UI.allies(); break;
    case 'ach': UI.ach(); break;
    case 'daily': UI.daily(); break;
    case 'settings': UI.settings(); break;
    case 'lockedmsg': toast('Locked — keep pushing the campaign'); break;
    case 'diff':
      if (DIFFS[+parts[1]].need <= S.unlockedDiff){ S.difficulty = +parts[1]; save();
        if (scr.innerHTML.indexOf('Settings') > 0) UI.settings();
        else if (Game.state === 'menu' && scr.textContent.indexOf('Stage') > 0) UI.stages(Game.ch);
        else UI.modeIntro(Game.lastIntro || 'survival'); }
      break;
    case 'buy': {
      const w = WMAP[parts[1]];
      if (S.owned[w.id]) break;
      if (S.coins < w.price){ toast('Not enough coins'); break; }
      S.coins -= w.price; S.owned[w.id] = 1;
      S.equipped[w.kind === 'melee' ? 0 : 1] = w.id;
      toast(w.name + ' purchased'); Snd.coin(); checkAch(); save(); UI.shop(); break; }
    case 'up': {
      const w = WMAP[parts[1]], lv = S.owned[w.id];
      if (!lv || lv >= MAXLV) break;
      const c = upCost(w, lv);
      if (S.coins < c){ toast('Not enough coins'); break; }
      S.coins -= c; S.owned[w.id]++; Snd.coin(); toast(w.name + ' → Lv ' + S.owned[w.id]); checkAch(); save(); UI.shop(); break; }
    case 'equip': {
      const w = WMAP[parts[1]];
      S.equipped[w.kind === 'melee' ? 0 : 1] = w.id; save(); UI.shop(); break; }
    case 'armor': {
      const i = +parts[1], ar = ARMORS[i];
      if (i <= S.armor) break;
      if (i > S.armor + 1){ toast('Buy the previous armor first'); break; }
      if (S.coins < ar.price){ toast('Not enough coins'); break; }
      S.coins -= ar.price; S.armor = i; Snd.coin(); toast(ar.name + ' equipped'); save(); UI.shop(); break; }
    case 'stat': {
      if (S.sp < 1) break; S.sp--; S.base[parts[1]]++; save(); UI.skills(); break; }
    case 'learn': {
      const p = PASSIVES[parts[1]], r = S.skills[parts[1]] || 0;
      if (r >= p.max || S.sp < p.cost) break;
      S.sp -= p.cost; S.skills[parts[1]] = r + 1; save(); UI.skills(); break; }
    case 'buyskill': {
      const s = SKILLS[parts[1]];
      if (S.sp < s.cost) break;
      S.sp -= s.cost; S.skills['sk_' + parts[1]] = 1; S.activeSkill = parts[1];
      toast(s.name + ' unlocked'); save(); UI.skills(); break; }
    case 'setskill': S.activeSkill = parts[1]; save(); UI.skills(); break;
    case 'recruit': {
      const id = parts[1], a = ALLIES[id];
      if (S.progress.chapter + 1 < a.need){ toast('Locked'); break; }
      if (S.coins < a.price || S.gems < (a.gem || 0)){ toast('Not enough resources'); break; }
      S.coins -= a.price; S.gems -= a.gem || 0; S.allies[id] = 1;
      if (S.party.length < 2) S.party.push(id);
      toast(a.name + ' joined the squad'); Snd.lvl(); checkAch(); save(); UI.allies(); break; }
    case 'allyup': {
      const id = parts[1], a = ALLIES[id], c = Math.floor(a.price * .6 * Math.pow(1.6, S.allies[id]));
      if (!S.allies[id] || S.coins < c){ toast('Not enough coins'); break; }
      S.coins -= c; S.allies[id]++; Snd.coin(); save(); UI.allies(); break; }
    case 'party': {
      const id = parts[1], i = S.party.indexOf(id);
      if (i >= 0) S.party.splice(i, 1);
      else if (S.party.length >= 3) toast('Squad is full (3)');
      else S.party.push(id);
      save(); UI.allies(); break; }
    case 'claimdaily': {
      if (S.daily.claimed === todayKey()) break;
      const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
      S.daily.streak = (S.daily.claimed === y ? S.daily.streak : 0) + 1;
      const day = ((S.daily.streak - 1) % 7) + 1;
      const c = 300 * day; S.coins += c;
      let g = day === 7 ? 5 : day === 4 ? 2 : 0; S.gems += g;
      S.daily.claimed = todayKey();
      toast('+' + fmt(c) + '◉' + (g ? '  +' + g + '◆' : ''), 2000); Snd.lvl(); save(); UI.daily(); break; }
    case 'sound': S.sound = S.sound ? 0 : 1; Snd.on = !!S.sound; save();
      if (Game.paused) UI.pause(); else UI.settings(); break;
    case 'craft':
      if (parts[1]){ craft(BLUEPRINTS.find(b => b.id === parts[1])); UI.craft(); }
      else UI.craft();
      break;
    case 'cosmetics': UI.cosmetics(); break;
    case 'weekly': UI.weekly(); break;
    case 'season': UI.season(); break;
    case 'stats': UI.stats(); break;
    case 'prestige': UI.prestige(); break;
    case 'doprestige': if (doPrestige()) UI.menu(); break;
    case 'throwbuy': {
      const t = TMAP[parts[1]];
      if (S.throwOwned[t.id]) break;
      if (S.coins < t.price){ toast('Not enough coins'); break; }
      S.coins -= t.price; S.throwOwned[t.id] = 1; S.throwable = t.id;
      Snd.coin(); save(); UI.shop(); break; }
    case 'throwset': S.throwable = parts[1]; save(); UI.shop(); break;
    case 'buyanti':
      if (S.coins < 2500){ toast('Not enough coins'); break; }
      S.coins -= 2500; S.antidotes++; Snd.coin(); toast('Antidote purchased (' + S.antidotes + ')');
      save(); UI.shop(); break;
    case 'buybp': {
      const bp = BLUEPRINTS.find(b => b.id === parts[1]);
      if (S.bp[bp.id]) break;
      if (S.coins < bp.price){ toast('Not enough coins'); break; }
      S.coins -= bp.price; S.bp[bp.id] = 1; Snd.coin(); toast(bp.name + ' blueprint acquired');
      save(); UI.craft(); break; }
    case 'crate': { openCrate(CRATES.find(c => c.id === parts[1])); UI.craft(); break; }
    case 'cos': {
      const slot = parts[1], it = COSMETICS[slot].find(x => x.id === parts.slice(2).join(':'));
      if (it && buyCos(slot, it)) UI.cosmetics();
      break; }
    case 'wclaim': {
      const w = WEEKLIES.find(x => x.id === parts[1]);
      if (S.weekly.claimed[w.id] || (S.weekly.prog[w.unit] || 0) < w.goal) break;
      S.weekly.claimed[w.id] = 1; S.coins += w.coins; S.gems += w.gems;
      Snd.lvl(); toast('+' + fmt(w.coins) + '◉  +' + w.gems + '◆', 2000); save(); UI.weekly(); break; }
    case 'sclaim': {
      const i = +parts[1], t = SEASON_TIERS[i];
      if (S.season.claimed[i] || S.season.pts < t.pts) break;
      S.season.claimed[i] = 1; S.coins += t.coins; S.gems += t.gems;
      if (t.mats) for (const k in t.mats) S.mats[k] = (S.mats[k] || 0) + t.mats[k];
      if (t.cos) S.cosOwned[t.cos] = 1;
      Snd.lvl(); toast('Season reward claimed', 2000); save(); UI.season(); break; }
    case 'setfps': { const order = [30, 60, 120, 0];
      S.settings.fps = order[(order.indexOf(S.settings.fps) + 1) % order.length];
      applySettings(); save(); UI.settings(); break; }
    case 'setgfx': S.settings.gfx = (S.settings.gfx + 1) % 3; applySettings(); save(); UI.settings(); break;
    case 'setshake': S.settings.shake = S.settings.shake ? 0 : 1; save(); UI.settings(); break;
    case 'setblood': S.settings.blood = S.settings.blood ? 0 : 1; save(); UI.settings(); break;
    case 'setmusic': S.settings.music = S.settings.music ? 0 : 1;
      if (!S.settings.music) Snd.stopMusic(); save(); UI.settings(); break;
    case 'hardcore': S.hardcore = S.hardcore ? 0 : 1; save(); UI.settings();
      toast(S.hardcore ? 'HARDCORE ON — one life, double loot' : 'Hardcore off', 2000); break;
    case 'ngplus': S.ngplus = S.ngplus ? 0 : 1; save(); UI.settings();
      toast(S.ngplus ? 'NEW GAME+ ENABLED' : 'New Game+ off', 1800); break;
    case 'copysave':
      try { navigator.clipboard.writeText(exportSave()); toast('Save code copied to clipboard', 2000); }
      catch(e){ toast('Copy failed — select the code manually'); }
      break;
    case 'importsave': {
      const code = prompt('Paste your save code:');
      if (!code) break;
      if (importSave(code)){ toast('Save imported', 2000); UI.menu(); } else toast('That code is not valid');
      break; }
    case 'resetask': UI.show('<div style="height:10vh"></div><h2 class="title center">Erase everything?</h2>' +
      '<div class="center muted">Levels, weapons, progress — all of it. This cannot be undone.</div><div class="spacer"></div>' +
      '<div class="row"><button class="btn warn" data-act="reset">Yes, erase</button>' +
      '<button class="btn go" data-act="settings">Cancel</button></div>'); break;
    case 'reset': S = defaultSave(); save(); toast('Save erased'); UI.title(); break;
    case 'resume': UI.resume(); break;
    case 'quitmission': Game.paused = false; Game.state = 'menu';
      $('hud').classList.add('hidden'); $('pad').classList.add('hidden'); UI.menu(); break;
  }
  if (a === 'survivalinfo') Game.lastIntro = 'survival';
  if (a === 'bossrushinfo') Game.lastIntro = 'bossrush';
  if (a === 'endlessinfo') Game.lastIntro = 'endless';
  if (a === 'dailyinfo') Game.lastIntro = 'daily';
});
$('btnPause').addEventListener('click', () => { if (Game.state === 'play' && !Game.paused) UI.pause(); });

/* =======================================================================
   META — prestige, weekly/seasonal, crafting, cosmetics, settings
   ======================================================================= */

/* --------------------------------------------------------- level & prestige */
const LVL_CAP = 100;
function prestigeBonus(){ return 1 + (S.prestige || 0) * .05; }
function canPrestige(){ return S.lvl >= LVL_CAP; }
function doPrestige(){
  if (!canPrestige()) return false;
  S.prestige = (S.prestige || 0) + 1;
  S.lvl = 1; S.xp = 0;
  S.sp += 6;
  S.base = { hp: 0, atk: 0, spd: 0, sp: 0 };
  toast('PRESTIGE ' + S.prestige + ' — permanent +' + Math.round((prestigeBonus() - 1) * 100) + '% power', 3000);
  Snd.lvl(); checkAch(); save();
  return true;
}
function ngPlusReady(){ return !!S.cleared['14-2']; }

/* ------------------------------------------------------- weekly missions */
function isoWeek(d){
  d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return d.getUTCFullYear() + '-W' + String(Math.ceil(((d - y0) / 864e5 + 1) / 7)).padStart(2, '0');
}
const WEEKLIES = [
  { id:'kill',   name:'Purge the Streets', goal:400, unit:'kills',     coins:4000, gems:3 },
  { id:'boss',   name:'Head Hunter',       goal:5,   unit:'bosses',    coins:5000, gems:4 },
  { id:'rescue', name:'Evacuation Duty',   goal:20,  unit:'rescues',   coins:3000, gems:2 },
  { id:'cure',   name:'Field Medicine',    goal:8,   unit:'cures',     coins:3500, gems:3 },
  { id:'clear',  name:'Steady Advance',    goal:10,  unit:'missions',  coins:4500, gems:3 },
  { id:'cache',  name:'Scavenger Hunt',    goal:6,   unit:'caches',    coins:3000, gems:2 }
];
function weeklyCheck(){
  const w = isoWeek(new Date());
  if (S.weekly.week !== w){ S.weekly.week = w; S.weekly.prog = {}; S.weekly.claimed = {}; save(); }
}
function weeklyAdd(unit, n){
  weeklyCheck();
  S.weekly.prog[unit] = (S.weekly.prog[unit] || 0) + n;
}
/* ------------------------------------------------------- seasonal events */
const SEASONS = [
  { id:'outbreak', name:'Outbreak Season', desc:'Double infection rewards. Cure the city.', tint:'#3ff0a5' },
  { id:'blood',    name:'Blood Moon',      desc:'Enemies hit harder, coins rain heavier.',  tint:'#ff5347' },
  { id:'frost',    name:'Frostbite',       desc:'Snowbound missions and frozen loot.',      tint:'#8fe4ff' },
  { id:'circuit',  name:'Circuit Break',   desc:'Robots everywhere. Salvage is plentiful.', tint:'#c07bff' }
];
function currentSeason(){
  const m = new Date().getMonth();
  return SEASONS[Math.floor(m / 3) % SEASONS.length];
}
const SEASON_TIERS = [
  { pts:200,   coins:2000,  gems:2 },
  { pts:600,   coins:5000,  gems:4 },
  { pts:1400,  coins:9000,  gems:8, mats:{ alloy:15 } },
  { pts:3000,  coins:20000, gems:16, cos:'skull' },
  { pts:6000,  coins:45000, gems:30, cos:'visor' }
];
function seasonAdd(pts){
  const s = currentSeason();
  if (S.season.id !== s.id){ S.season = { id: s.id, pts: 0, claimed: {} }; }
  S.season.pts += pts;
}

/* -------------------------------------------------------------- crafting */
function haveMats(cost){ for (const k in cost) if ((S.mats[k] || 0) < cost[k]) return false; return true; }
function payMats(cost){ for (const k in cost) S.mats[k] -= cost[k]; }
function craft(bp){
  if (!S.bp[bp.id]){ toast('Blueprint not owned'); return; }
  if (!haveMats(bp.cost)){ toast('Not enough materials'); Snd.bad(); return; }
  payMats(bp.cost);
  S.stats.crafted = (S.stats.crafted || 0) + 1;
  if (bp.makes === 'anti'){ S.antidotes++; toast('Antidote crafted  (' + S.antidotes + ' held)'); }
  else if (bp.makes.startsWith('w:')){
    const id = bp.makes.slice(2);
    if (!S.owned[id]){ S.owned[id] = 1; toast(WMAP[id].name + ' crafted!', 2200); }
    else { S.owned[id] = Math.min(MAXLV, S.owned[id] + 1); toast(WMAP[id].name + ' → Lv ' + S.owned[id]); }
  } else if (bp.makes.startsWith('t:')){
    const id = bp.makes.slice(2);
    S.throwOwned[id] = 1; S.throwable = id;
    toast(TMAP[id].name + ' equipped', 2000);
  }
  Snd.lvl(); checkAch(); save();
}
function openCrate(c){
  if (c.gem){ if (S.gems < c.gem){ toast('Not enough gems'); return; } S.gems -= c.gem; }
  else { if (S.coins < c.price){ toast('Not enough coins'); return; } S.coins -= c.price; }
  const got = [];
  const mats = rndi(c.mats[0], c.mats[1]);
  for (let i = 0; i < 4; i++){
    const k = ['scrap', 'chem', 'cell', 'alloy'][i];
    const n = Math.round(mats * [.45, .3, .18, .07][i]);
    if (n > 0){ S.mats[k] = (S.mats[k] || 0) + n; got.push(n + ' ' + MATS[k]); }
  }
  const coins = rndi(c.coins[0], c.coins[1]); S.coins += coins; got.push(fmt(coins) + '◉');
  if (Math.random() < c.rare){
    const locked = WEAPONS.filter(w => !S.owned[w.id]);
    const cos = Object.keys(COSMETICS).flatMap(k => COSMETICS[k].map(i => ({ k, i }))).filter(o => !S.cosOwned[o.i.id]);
    if (locked.length && Math.random() < .5){
      const w = pick(locked); S.owned[w.id] = 1; got.push('★ ' + w.name);
    } else if (cos.length){
      const o = pick(cos); S.cosOwned[o.i.id] = 1; got.push('★ ' + o.i.name);
    } else { S.gems += 5; got.push('5◆'); }
  }
  S.antidotes += 1; got.push('1 antidote');
  Snd.lvl(); save();
  toast('CRATE: ' + got.join(', '), 3200);
  return got;
}

/* ------------------------------------------------------------ cosmetics */
function cosOwned(id){ return id === 'none' || S.cosOwned[id] || (COSMETICS.colour.some(c => c.id === id) && id === '#111318'); }
function buyCos(slot, item){
  if (S.cosOwned[item.id] || item.price === 0){ S.cos[slot] = item.id; save(); return true; }
  if (S.coins < item.price){ toast('Not enough coins'); return false; }
  S.coins -= item.price; S.cosOwned[item.id] = 1; S.cos[slot] = item.id;
  Snd.coin(); save(); return true;
}

/* ------------------------------------------------------------- settings */
function applySettings(){
  const g = S.settings;
  Game.maxParts = g.gfx === 0 ? 140 : g.gfx === 1 ? 340 : 640;
  Game.lighting = g.gfx >= 1;
  Game.frameCap = g.fps === 0 ? 0 : g.fps;        // 0 = unlimited
  Snd.on = !!S.sound;
  if (!S.settings.music) Snd.stopMusic();
}
function exportSave(){
  try { return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); } catch(e){ return ''; }
}
function importSave(code){
  try {
    const o = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if (!o || typeof o.lvl !== 'number') throw 0;
    S = Object.assign(defaultSave(), o);
    const d = defaultSave();
    for (const k of ['mats', 'cos', 'settings', 'weekly', 'season', 'stats', 'records', 'throwOwned'])
      S[k] = Object.assign(d[k], S[k] || {});
    for (const k in ALLIES) if (!(k in S.allies)) S.allies[k] = 0;
    save(); applySettings();
    return true;
  } catch(e){ return false; }
}

/* ------------------------------------------------------------- gamepad */
const PAD_MAP = { 0: 'atk', 1: 'jump', 2: 'fire', 3: 'swap', 4: 'dodge', 5: 'nade', 6: 'anti', 7: 'skill', 9: 'stance' };
let padWas = {};
function pollGamepad(){
  if (!navigator.getGamepads) return;
  const gp = navigator.getGamepads()[0];
  if (!gp) return;
  const ax = gp.axes[0] || 0;
  if (ax < -.35) press('left'); else release('left');
  if (ax > .35) press('right'); else release('right');
  if ((gp.axes[1] || 0) < -.6) press('jump');
  for (const b in PAD_MAP){
    const down = gp.buttons[b] && gp.buttons[b].pressed;
    if (down && !padWas[b]) press(PAD_MAP[b]);
    else if (!down && padWas[b]) release(PAD_MAP[b]);
    padWas[b] = down;
  }
  const dl = gp.buttons[14] && gp.buttons[14].pressed, dr = gp.buttons[15] && gp.buttons[15].pressed;
  if (dl) press('left'); if (dr) press('right');
}

/* ------------------------------------------------------------- weather */
const WX = { drops: [], flakes: [], boltT: 0, flash: 0 };
function initWeather(mapDef, seed){
  const R = mulberry(seed + 77);
  const r = R();
  if (mapDef.snow) Game.weather = r < .75 ? 'snow' : 'fog';
  else if (mapDef.theme === 'indoor' || mapDef.theme === 'subway') Game.weather = r < .25 ? 'fog' : 'clear';
  else Game.weather = r < .34 ? 'clear' : r < .58 ? 'rain' : r < .74 ? 'storm' : r < .88 ? 'fog' : 'clear';
  Game.night = (mapDef.theme === 'indoor' || mapDef.theme === 'subway') ? 0 : (R() < .4 ? .55 + R() * .35 : 0);
  WX.drops.length = 0; WX.flakes.length = 0; WX.flash = 0; WX.boltT = rnd(2, 6);
  const n = Game.weather === 'storm' ? 190 : Game.weather === 'rain' ? 130 : Game.weather === 'snow' ? 140 : 0;
  for (let i = 0; i < n; i++){
    const o = { x: rnd(0, W + 200), y: rnd(-100, H), v: rnd(.7, 1.4), s: rnd(.6, 1.4), ph: rnd(0, 6.3) };
    (Game.weather === 'snow' ? WX.flakes : WX.drops).push(o);
  }
}
function updateWeather(dt){
  const gust = Game.weather === 'storm' ? 220 : 90;
  for (const d of WX.drops){
    d.y += (Game.weather === 'storm' ? 1500 : 1050) * d.v * dt;
    d.x -= gust * d.v * dt;
    if (d.y > H + 20){ d.y = -20; d.x = rnd(0, W + 260); }
    if (d.x < -60) d.x += W + 260;
  }
  for (const f of WX.flakes){
    f.y += 90 * f.v * dt; f.ph += dt * 1.6;
    f.x += Math.sin(f.ph) * 26 * dt - 22 * dt;
    if (f.y > H + 10){ f.y = -10; f.x = rnd(0, W + 260); }
    if (f.x < -40) f.x += W + 260;
  }
  if (Game.weather === 'storm'){
    WX.boltT -= dt;
    if (WX.boltT <= 0){
      WX.boltT = rnd(3.5, 9); WX.flash = .5;
      Snd.thunder();
    }
  }
  if (WX.flash > 0) WX.flash -= dt * 1.6;
}
function drawWeather(){
  const x0 = cam.x;
  if (Game.night > 0){
    ctx.fillStyle = 'rgba(8,14,38,' + (Game.night * .62) + ')';
    ctx.fillRect(x0 - 20, -viewH, viewW + 40, H + viewH + 80);
  }
  if (Game.weather === 'fog'){
    const g = ctx.createLinearGradient(0, GY - 220, 0, GY + 40);
    g.addColorStop(0, 'rgba(180,195,210,0)'); g.addColorStop(1, 'rgba(180,195,210,.35)');
    ctx.fillStyle = g; ctx.fillRect(x0 - 20, GY - 220, viewW + 40, 280);
  }
  if (WX.drops.length){
    ctx.strokeStyle = Game.weather === 'storm' ? 'rgba(190,215,255,.55)' : 'rgba(170,200,235,.42)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (const d of WX.drops){
      const sx = x0 + d.x % (viewW + 40) - 20;
      ctx.moveTo(sx, d.y); ctx.lineTo(sx - 7 * d.s, d.y + 20 * d.s);
    }
    ctx.stroke();
  }
  if (WX.flakes.length){
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    for (const f of WX.flakes){
      const sx = x0 + f.x % (viewW + 40) - 20;
      ctx.beginPath(); ctx.arc(sx, f.y, 1.6 * f.s, 0, 6.283); ctx.fill();
    }
  }
  if (WX.flash > 0){
    ctx.fillStyle = 'rgba(220,235,255,' + clamp(WX.flash, 0, .5) + ')';
    ctx.fillRect(x0 - 20, -viewH, viewW + 40, H + viewH + 80);
  }
}

/* --------------------------------------------------------------- traps */
function buildTraps(bg, seed, len){
  const R = mulberry(seed + 313);
  for (let x = 700; x < len - 400; x += 500 + R() * 700){
    const k = R();
    if (k < .34) Game.gear.push({ type: 'spikes', x, armed: 1, cd: 0 });
    else if (k < .62) Game.gear.push({ type: 'zapfloor', x, cd: rnd(0, 2), on: 0 });
    else Game.gear.push({ type: 'sawblade', x, base: x, dir: 1, span: 120 + R() * 120 });
  }
}
function updateTraps(g, dt, i){
  if (g.type === 'spikes'){
    g.cd -= dt;
    if (g.cd <= 0){
      g.cd = .55;
      for (const t of [Game.player].concat(Game.allies, Game.enemies))
        if (t && !t.dead && t.onGround && Math.abs(t.x - g.x) < 34)
          hurtEnt(t, 16 * Game.diffData.dmg, { fromX: g.x, kb: 60, up: 120 });
    }
  } else if (g.type === 'zapfloor'){
    g.cd -= dt;
    if (g.cd <= 0){
      g.on = g.on ? 0 : 1;
      g.cd = g.on ? .8 : 2.2;
      if (g.on){
        Snd.zap();
        for (const t of [Game.player].concat(Game.allies, Game.enemies))
          if (t && !t.dead && t.onGround && Math.abs(t.x - g.x) < 52)
            hurtEnt(t, 22 * Game.diffData.dmg, { fromX: g.x, kb: 40, stun: .3 });
      }
    }
    if (g.on && Math.random() < dt * 30)
      part(g.x + rnd(-46, 46), GY - rnd(0, 30), rnd(-40, 40), -rnd(20, 90), .25, '#9fe8ff', 2, 'spark');
  } else if (g.type === 'sawblade'){
    g.x += g.dir * 160 * dt;
    if (g.x > g.base + g.span){ g.x = g.base + g.span; g.dir = -1; }
    if (g.x < g.base - g.span){ g.x = g.base - g.span; g.dir = 1; }
    g.spin = (g.spin || 0) + dt * 14;
    for (const t of [Game.player].concat(Game.allies, Game.enemies))
      if (t && !t.dead && Math.abs(t.x - g.x) < 30 && t.y > GY - 60)
        hurtEnt(t, 30 * Game.diffData.dmg * dt * 4, { fromX: g.x, kb: 120, dir: g.dir });
  }
}
function drawTrap(g){
  if (g.type === 'spikes'){
    ctx.fillStyle = '#8a929a';
    for (let i = -3; i <= 3; i++){
      ctx.beginPath(); ctx.moveTo(g.x + i * 10 - 5, GY); ctx.lineTo(g.x + i * 10, GY - 20); ctx.lineTo(g.x + i * 10 + 5, GY); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,80,60,.5)'; ctx.fillRect(g.x - 36, GY - 2, 72, 3);
  } else if (g.type === 'zapfloor'){
    ctx.fillStyle = g.on ? '#9fe8ff' : '#2a4055';

      ctx.globalAlpha = .5;
      drawBolt(g.x - 40, GY - 6, g.x + 40, GY - 6, '#9fe8ff');
      ctx.globalAlpha = 1;
    }
  } else if (g.type === 'sawblade'){
    ctx.save(); ctx.translate(g.x, GY - 26); ctx.rotate(g.spin || 0);
    ctx.fillStyle = '#c8ccd2';
    for (let i = 0; i < 8; i++){

      ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(7, -14); ctx.lineTo(-7, -14); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#5a6068'; ctx.beginPath(); ctx.arc(0, 0, 5, 0, 6.283); ctx.fill();
    ctx.restore();
  }
}

function updateVehicle(p, dt){
  const v = p.vehicle, def = VEHICLES[v.type];

        type: 'rocket', dmg: 190 * p.atkMul, splash: 130, life: 2, r: 7, col: '#d8d8d0' });

      if (Math.abs(e.x - p.x) < def.w * .6 && Math.abs(e.y - p.y) < 70){

  if (v.hp <= 0){ toast('VEHICLE DESTROYED'); dismount(); }

    part(p.x - p.face * 40, GY - 4, -p.face * rnd(40, 140), -rnd(10, 50), .4, '#6a6a60', rnd(2, 5), 'smoke');
}
function drawVehicle(p){

/* --------------------------------------------------------------- music */
Snd.music = { on: false, t: 0, step: 0, timer: null, boss: false };
Snd.startMusic = function(boss){
  if (!this.ac || !S.settings.music) return;
  this.stopMusic();
  this.music.on = true; this.music.boss = !!boss; this.music.step = 0;
  const bpm = boss ? 168 : 138, spb = 60 / bpm / 2;
  const root = boss ? 55 : 49;                      // G1 / low A
  const prog = boss ? [0, 0, 3, 5, 0, 0, 7, 5] : [0, 0, 5, 3, 0, 0, 7, 7];
  const self = this;
  this.music.timer = setInterval(() => {
    if (!self.music.on || !self.on) return;
    const st = self.music.step++ % 16;
    const chord = prog[Math.floor(st / 2) % prog.length];
    const f = root * Math.pow(2, chord / 12);
    // driving bass
    self.tone(f, spb * .9, 'sawtooth', .10);
    if (st % 2 === 0) self.tone(f * 2, spb * .5, 'square', .045);
    // power chord stabs
    if (st % 4 === 0) { self.tone(f * 3, spb * .7, 'sawtooth', .035); self.tone(f * 4.49, spb * .7, 'sawtooth', .028); }
    // drums
    if (st % 4 === 0) self.noise(.12, .16, 260);              // kick
    if (st % 8 === 4) self.noise(.18, .13, 1400);             // snare
    if (boss || st % 2 === 1) self.noise(.05, .05, 5200);     // hats
  }, spb * 1000);
};
Snd.stopMusic = function(){
  this.music.on = false;
  if (this.music.timer){ clearInterval(this.music.timer); this.music.timer = null; }
};
Snd.thunder = function(){
  if (!this.on) return;
  this.noise(1.4, .3, 220);
  this.tone(48, 1.2, 'sawtooth', .16, 26);
};

/* =======================================================================
   INFECTION — bites, the meter, antidotes, medics, transformation
   ======================================================================= */
const INF_MAX = 100;

/* how resistant a character is: passives, armour, being a robot */
function infResist(t){
  if (t.immune) return 1;
  let r = 0;
  if (t === Game.player){
    r += (S.skills.immu || 0) * .12;
    const a = ARMORS[S.armor]; if (a.infRes) r += a.infRes;
  } else if (t.ally){
    r += (S.skills.immu || 0) * .06;
  }
  return clamp(r, 0, .85);
}
/* a zombie landed a bite — roll for transmission */
function tryInfect(t, chance, speed){
  if (!t || t.dead || t.zombified || !chance) return;
  if (t !== Game.player && !t.ally) return;
  const res = infResist(t);
  if (res >= 1) return;
  if (t.inf > 0){ t.infSp = Math.max(t.infSp || 1, speed || 1); return; }   // already infected: worst strain wins
  if (Math.random() > chance * (1 - res) * (Game.diffData.inf > 1 ? 1.15 : 1)) return;
  t.inf = 1; t.infSp = speed || 1;
  Game.everBitten = true;
  if (t === Game.player){
    S.stats.infected = (S.stats.infected || 0) + 1;
    toast('⚠ YOU HAVE BEEN INFECTED', 2400);
    Snd.infect(); flashScreen(.25);
  } else {
    toast('⚠ ' + ALLIES[t.allyId].name + ' IS INFECTED', 2000);
    Snd.infect();
  }
}
/* medics hold the virus back while they are near */
function medicNear(t){
  for (const a of Game.allies)
    if (!a.dead && a.role === 'medic' && Math.abs(a.x - t.x) < 320) return true;
  return false;
}
function updateInfection(t, dt){
  if (!t.inf || t.dead || t.zombified) return;
  const slow = medicNear(t) ? .35 : 1;
  const rate = 1.55 * (t.infSp || 1) * Game.diffData.inf * slow * (1 - infResist(t) * .5);
  t.inf = clamp(t.inf + rate * dt, 0, INF_MAX);
  if (t.inf > 55 && !t.infWarned){ t.infWarned = 1; Snd.infect();
    toast(t === Game.player ? '⚠ INFECTION CRITICAL — USE AN ANTIDOTE' : '⚠ ' + ALLIES[t.allyId].name + ' IS TURNING', 2200); }
  if (Math.random() < dt * (t.inf / 40))
    part(t.x + rnd(-12, 12), t.y - rnd(20, 70), rnd(-16, 16), -rnd(18, 46), .7, '#6ad6a0', rnd(1.5, 3), 'dot');
  if (t.inf >= INF_MAX) transform(t);
}
function cureEnt(t){
  if (!t || !t.inf) return false;
  t.inf = 0; t.infWarned = 0; t.infSp = 1;
  S.stats.cured = (S.stats.cured || 0) + 1;
  weeklyAdd('cures', 1);
  for (let i = 0; i < 22; i++)
    part(t.x + rnd(-16, 16), t.y - rnd(0, 76), rnd(-40, 40), -rnd(40, 150), .8, '#9fe8ff', rnd(2, 4), 'dot');
  Snd.cure();
  return true;
}
function useAntidote(){
  if (Game.antidotes <= 0){ toast('No antidotes left'); Snd.bad(); return; }
  const p = Game.player;
  let target = null;
  if (p.inf > 0) target = p;
  else {
    let worst = 0;
    for (const a of Game.allies) if (!a.dead && a.inf > worst){ worst = a.inf; target = a; }
  }
  if (!target){ toast('Nobody is infected'); return; }
  Game.antidotes--;
  cureEnt(target);
  toast(target === p ? 'ANTIDOTE USED — YOU ARE CLEAN' : ALLIES[target.allyId].name + ' IS CURED', 1800);
}
/* the virus wins */
function transform(t){
  if (t.zombified) return;
  t.zombified = 1;
  if (t === Game.player){ startCinematic(); return; }
  // an ally turns and joins the horde
  const name = ALLIES[t.allyId].name;
  t.dead = true; t.downT = 1e9; t.gone = 1;
  const z = makeEnemy('runner', t.x, 2);
  z.col = '#8fd8a0'; z.name = name + ' (turned)'; z.hp = z.maxHp = t.maxHp * .8;
  z.turned = 1; z.headGear = 'hair'; z.gearCol = ALLIES[t.allyId].col;
  Game.enemies.push(z);
  Game.allies.splice(Game.allies.indexOf(t), 1);
  toast('☠ ' + name.toUpperCase() + ' HAS TURNED', 2600);
  Snd.bad(); shake(8); flashScreen(.3);
  if (!Game.allies.length && Game.startedWithAllies) {
    toast('SQUAD LOST', 2200);
    if (Game.startedWithAllies >= 1) { Game.squadWiped = 1; }
  }
}

/* --------------------------------------------------- failure cinematic */
function startCinematic(){
  if (Game.state === 'cine') return;
  Game.state = 'cine';
  Game.cine = { t: 0, done: 0 };
  Snd.stopMusic();
  Snd.bad();
  const p = Game.player;
  p.pose = 'hurt'; p.vx = 0;
  for (const a of Game.allies) a.pose = 'hurt';
  $('pad').classList.add('hidden');
}
function cineStep(dt){
  const c = Game.cine, p = Game.player;
  c.t += dt;
  cam.x = lerp(cam.x, clamp(p.x - viewW * .5, 0, Math.max(0, Game.len - viewW)), 1 - Math.pow(.02, dt));
  p.anim += dt;
  // hunch over, colour drains to the virus green
  p.pose = c.t < 1.6 ? 'hurt' : c.t < 3 ? 'block' : 'crawl';
  p.col = mixCol('#111318', '#6ad6a0', clamp(c.t / 3, 0, .85));
  if (Math.random() < dt * 14) part(p.x + rnd(-14, 14), p.y - rnd(0, 76), rnd(-30, 30), -rnd(20, 90), .9, '#6ad6a0', rnd(2, 5), 'dot');
  for (const a of Game.allies){
    a.anim += dt; a.pose = c.t < 2 ? 'hurt' : 'crawl';
    a.col = mixCol('#1a1a1a', '#6ad6a0', clamp((c.t - .8) / 3, 0, .8));
  }
  for (const e of Game.enemies){ e.anim += dt; e.vx *= .9; }
  updateParts(dt);
  $('infVig').style.opacity = clamp(.5 + c.t * .12, 0, .95);
  if (c.t > 4.6 && !c.done){ c.done = 1; finishMission(false, 'infected'); }
}
function mixCol(a, b, t){
  const pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
  const pb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
  return '#' + pa.map((v, i) => Math.round(lerp(v, pb[i], t)).toString(16).padStart(2, '0')).join('');
}
function cineRender(){
  render();
  const c = Game.cine;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const a = clamp((c.t - 2.4) / 2.2, 0, 1);
  ctx.fillStyle = 'rgba(6,18,12,' + a * .92 + ')';
  ctx.fillRect(0, 0, cv.width, cv.height);
  if (c.t > 3.1){
    ctx.globalAlpha = clamp((c.t - 3.1) / 1, 0, 1);
    ctx.fillStyle = '#8fd8a0';
    ctx.font = 'bold ' + Math.round(cv.width / 22) + 'px Impact, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('THE VIRUS TAKES HOLD', cv.width / 2, cv.height * .48);
    ctx.font = Math.round(cv.width / 52) + 'px Trebuchet MS';
    ctx.fillStyle = '#4a8a68';
    ctx.fillText('the city keeps walking without you', cv.width / 2, cv.height * .58);
    ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  }
}

/* --------------------------------------------------------------- boot */
load();
weeklyCheck();
applySettings();
resize();
attractStart();
UI.title();
requestAnimationFrame(function first(ts){ lastT = ts; requestAnimationFrame(frame); });
document.addEventListener('visibilitychange', () => { if (document.hidden && Game.state === 'play' && !Game.paused) UI.pause(); });
window.addEventListener('beforeunload', save);
</script>
