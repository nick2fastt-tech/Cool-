      const got = i < streak % 7 || (streak % 7 === 0 && streak > 0 && i < 7 && !can);
      h += '<div class="card' + (got ? ' sel' : '') + '"><h3>Day ' + (i + 1) + '</h3><div class="meta">' +
        fmt(300 * (i + 1)) + '◉' + (i === 6 ? '<br>+5◆' : i === 3 ? '<br>+2◆' : '') + '</div></div>';
    }
    h += '</div><div class="spacer"></div>' +
      '<button class="btn go big" data-act="claimdaily"' + (can ? '' : ' disabled') + '>' +
      (can ? 'CLAIM DAY ' + ((streak % 7) + 1) : 'ALREADY CLAIMED TODAY') + '</button>' +
      '<div class="spacer"></div><div class="center muted">Login streak: ' + streak + ' days</div>' +
      '<div class="spacer"></div>' + this.back('menu');
    this.show(h);
  },

  /* --------------------------------------------------------- settings */
  settings(){
    this.show(this.purse() + '<h2 class="title">Settings</h2>' +
      '<div class="row"><button class="btn" data-act="sound">Sound: ' + (S.sound ? 'ON' : 'OFF') + '</button></div>' +
      '<div class="spacer"></div><h2 class="title">Difficulty</h2>' + this.diffRow() +
      '<div class="spacer"></div><div class="muted center">Hard unlocks after Chapter 3, Nightmare after Chapter 6.</div>' +
      '<div class="spacer"></div><div class="row"><button class="btn warn" data-act="resetask">Erase save data</button></div>' +
      '<div class="spacer"></div>' + this.back('menu'));
  },

  /* ------------------------------------------------------------ pause */
  pause(){
    if (Game.state !== 'play') return;
    Game.paused = true;
    this.show('<div style="height:8vh"></div><h2 class="title center">Paused</h2>' +
      '<div class="center muted">' + Game.objective + '</div><div class="spacer"></div>' +
      '<div class="card"><div class="meta">Kills <b>' + Game.kills + '</b> · Rescued <b>' + Game.rescued + '</b> · ' +
      'Coins <b>' + fmt(Game.coins) + '</b> · Best combo <b>' + Game.best + '</b></div></div><div class="spacer"></div>' +
      '<button class="btn go big" data-act="resume">RESUME</button><div class="spacer"></div>' +
      '<div class="row"><button class="btn ghost" data-act="sound">Sound: ' + (S.sound ? 'ON' : 'OFF') + '</button>' +
      '<button class="btn warn" data-act="quitmission">Abandon mission</button></div>', true);
  },
  resume(){ Game.paused = false; this.hideScreen(); },

  /* ----------------------------------------------------------- result */
  result(){
    const r = Game.result;
    let extra = '';
    if (Game.mode === 'survival') extra = 'Waves survived <b>' + r.wave + '</b>';
    else if (Game.mode === 'endless') extra = 'Distance <b>' + fmt(r.dist) + 'm</b>';
    else if (Game.mode === 'bossrush') extra = 'Bosses <b>' + r.bosses + '</b>';
    const nextAvail = Game.mode === 'story' && r.win &&
      (Game.st + 1 < ST_N ? (Game.ch < S.progress.chapter || Game.st + 1 <= S.progress.stage) : Game.ch + 1 < CH_N);
    this.show('<div style="height:4vh"></div>' +
      '<h1 class="logo" style="font-size:clamp(24px,7vw,44px)">' + (r.win ? 'MISSION COMPLETE' : 'YOU DIED') + '</h1>' +
      (Game.mode === 'story' && r.win ? '<div class="sub">' + '★'.repeat(r.stars) + '☆'.repeat(3 - r.stars) + '</div>' : '<div class="spacer"></div>') +
      '<div class="card"><div class="meta" style="font-size:13px;line-height:2">' +
      'Kills <b>' + r.kills + '</b><br>' +
      'Civilians rescued <b>' + r.rescued + '</b><br>' +
      'Best combo <b>' + Game.best + '</b><br>' +
      'Time <b>' + clock(r.time) + '</b><br>' +
      (extra ? extra + '<br>' : '') +
      (Game.secretFound ? '<span style="color:#ffcc44">★ Hidden cache found</span><br>' : '') +
      'Coins earned <b style="color:#ffcc44">+' + fmt(r.coins) + '◉</b><br>' +
      'EXP earned <b style="color:#9fe8ff">+' + fmt(r.xp) + '</b>' +
      (r.ups ? '<br><b style="color:#4de3a0">LEVEL UP ×' + r.ups + '  (+' + r.ups * 2 + ' SP)</b>' : '') +
      '</div></div><div class="spacer"></div>' +
      (nextAvail ? '<button class="btn go big" data-act="nextstage">NEXT MISSION ▶</button><div class="spacer"></div>' : '') +
      '<div class="row"><button class="btn" data-act="retry">Retry</button>' +
      '<button class="btn ghost" data-act="shop">Armory</button>' +
      '<button class="btn ghost" data-act="menu">Base</button></div>');
  }
};

/* ------------------------------------------------------------- actions */
scr.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const parts = el.dataset.act.split(':'), a = parts[0];
  Snd.boot(); Snd.ui();
  switch (a){
    case 'title': UI.title(); break;
    case 'menu': UI.menu(); break;
    case 'howto': UI.howto(); break;
    case 'story': UI.story(); break;
    case 'stages': UI.stages(+parts[1]); break;
    case 'brief': UI.brief(+parts[1], +parts[2]); break;
    case 'play': startMission('story', +parts[1], +parts[2]); break;
    case 'nextstage': {
      let c = Game.ch, s = Game.st + 1;
      if (s >= ST_N){ c++; s = 0; }
      if (c < CH_N) UI.brief(c, s); else UI.menu();
      break; }
    case 'retry':
      if (Game.mode === 'story') startMission('story', Game.ch, Game.st);
      else startMission(Game.mode, 0, 0, Game.modeData);
      break;
    case 'survivalinfo': UI.modeIntro('survival'); break;
    case 'bossrushinfo': UI.modeIntro('bossrush'); break;
    case 'endlessinfo': UI.modeIntro('endless'); break;
    case 'dailyinfo': UI.modeIntro('daily'); break;
    case 'survivalgo': startMission('survival', 0, 0); break;
    case 'bossrushgo': startMission('bossrush', 0, 0); break;
    case 'endlessgo': startMission('endless', 0, 0); break;
    case 'dailygo': startMission('daily', 0, 0); break;
    case 'shop': UI.shop(); break;
    case 'skills': UI.skills(); break;
    case 'allies': UI.allies(); break;
    case 'ach': UI.ach(); break;
    case 'daily': UI.daily(); break;
    case 'settings': UI.settings(); break;
    case 'lockedmsg': toast('Locked — keep pushing the campaign'); break;
    case 'diff':
      if (+parts[1] <= S.unlockedDiff){ S.difficulty = +parts[1]; save();
        if (scr.innerHTML.indexOf('Settings') > 0) UI.settings();
        else if (Game.state === 'menu' && scr.textContent.indexOf('Stage') > 0) UI.stages(Game.ch);
        else UI.modeIntro(Game.lastIntro || 'survival'); }
      break;
    case 'buy': {
      const w = WMAP[parts[1]];
      if (S.owned[w.id]) break;
      if (S.coins < w.price){ toast('Not enough coins'); break; }
      S.coins -= w.price; S.owned[w.id] = 1;
      S.equipped[w.kind === 'melee' ? 0 : 1] = w.id;
      toast(w.name + ' purchased'); Snd.coin(); checkAch(); save(); UI.shop(); break; }
    case 'up': {
      const w = WMAP[parts[1]], lv = S.owned[w.id];
      if (!lv || lv >= MAXLV) break;
      const c = upCost(w, lv);
      if (S.coins < c){ toast('Not enough coins'); break; }
      S.coins -= c; S.owned[w.id]++; Snd.coin(); toast(w.name + ' → Lv ' + S.owned[w.id]); checkAch(); save(); UI.shop(); break; }
    case 'equip': {
      const w = WMAP[parts[1]];
      S.equipped[w.kind === 'melee' ? 0 : 1] = w.id; save(); UI.shop(); break; }
    case 'armor': {
      const i = +parts[1], ar = ARMORS[i];
      if (i <= S.armor) break;
      if (i > S.armor + 1){ toast('Buy the previous armor first'); break; }
      if (S.coins < ar.price){ toast('Not enough coins'); break; }
      S.coins -= ar.price; S.armor = i; Snd.coin(); toast(ar.name + ' equipped'); save(); UI.shop(); break; }
    case 'stat': {
      if (S.sp < 1) break; S.sp--; S.base[parts[1]]++; save(); UI.skills(); break; }
    case 'learn': {
      const p = PASSIVES[parts[1]], r = S.skills[parts[1]] || 0;
      if (r >= p.max || S.sp < p.cost) break;
      S.sp -= p.cost; S.skills[parts[1]] = r + 1; save(); UI.skills(); break; }
    case 'buyskill': {
      const s = SKILLS[parts[1]];
      if (S.sp < s.cost) break;
      S.sp -= s.cost; S.skills['sk_' + parts[1]] = 1; S.activeSkill = parts[1];
      toast(s.name + ' unlocked'); save(); UI.skills(); break; }
    case 'setskill': S.activeSkill = parts[1]; save(); UI.skills(); break;
    case 'recruit': {
      const id = parts[1], a = ALLIES[id];
      if (S.progress.chapter + 1 < a.need){ toast('Locked'); break; }
      if (S.coins < a.price || S.gems < (a.gem || 0)){ toast('Not enough resources'); break; }
      S.coins -= a.price; S.gems -= a.gem || 0; S.allies[id] = 1;
      if (S.party.length < 2) S.party.push(id);
      toast(a.name + ' joined the squad'); Snd.lvl(); checkAch(); save(); UI.allies(); break; }
    case 'allyup': {
      const id = parts[1], a = ALLIES[id], c = Math.floor(a.price * .6 * Math.pow(1.6, S.allies[id]));
      if (!S.allies[id] || S.coins < c){ toast('Not enough coins'); break; }
      S.coins -= c; S.allies[id]++; Snd.coin(); save(); UI.allies(); break; }
    case 'party': {
      const id = parts[1], i = S.party.indexOf(id);
      if (i >= 0) S.party.splice(i, 1);
      else if (S.party.length >= 2) toast('Squad is full (2)');
      else S.party.push(id);
      save(); UI.allies(); break; }
    case 'claimdaily': {
      if (S.daily.claimed === todayKey()) break;
      const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
      S.daily.streak = (S.daily.claimed === y ? S.daily.streak : 0) + 1;
      const day = ((S.daily.streak - 1) % 7) + 1;
      const c = 300 * day; S.coins += c;
      let g = day === 7 ? 5 : day === 4 ? 2 : 0; S.gems += g;
      S.daily.claimed = todayKey();
      toast('+' + fmt(c) + '◉' + (g ? '  +' + g + '◆' : ''), 2000); Snd.lvl(); save(); UI.daily(); break; }
    case 'sound': S.sound = S.sound ? 0 : 1; Snd.on = !!S.sound; save();
      if (Game.paused) UI.pause(); else UI.settings(); break;
    case 'resetask': UI.show('<div style="height:10vh"></div><h2 class="title center">Erase everything?</h2>' +
      '<div class="center muted">Levels, weapons, progress — all of it. This cannot be undone.</div><div class="spacer"></div>' +
      '<div class="row"><button class="btn warn" data-act="reset">Yes, erase</button>' +
      '<button class="btn go" data-act="settings">Cancel</button></div>'); break;
    case 'reset': S = defaultSave(); save(); toast('Save erased'); UI.title(); break;
    case 'resume': UI.resume(); break;
    case 'quitmission': Game.paused = false; Game.state = 'menu';
      $('hud').classList.add('hidden'); $('pad').classList.add('hidden'); UI.menu(); break;
  }
  if (a === 'survivalinfo') Game.lastIntro = 'survival';
  if (a === 'bossrushinfo') Game.lastIntro = 'bossrush';
  if (a === 'endlessinfo') Game.lastIntro = 'endless';
  if (a === 'dailyinfo') Game.lastIntro = 'daily';
});
$('btnPause').addEventListener('click', () => { if (Game.state === 'play' && !Game.paused) UI.pause(); });

/* --------------------------------------------------------------- boot */
load();
resize();
UI.title();
requestAnimationFrame(function first(ts){ lastT = ts; requestAnimationFrame(frame); });
document.addEventListener('visibilitychange', () => { if (document.hidden && Game.state === 'play' && !Game.paused) UI.pause(); });
window.addEventListener('beforeunload', save);
</script>
</body>
</html>
