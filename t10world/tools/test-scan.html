<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="module">
window.__results={logs:[],errors:[],done:false};
const log=(...a)=>window.__results.logs.push(a.map(String).join(' '));
try{
 const {settings}=await import('../src/core/settings.js'); settings.setQuality('high');
 const {Human}=await import('../src/human/human.js');
 const {defaultPlayerAppearance}=await import('../src/human/appearance.js');
 const h=new Human(defaultPlayerAppearance('female'),{tier:'player'});
 const tex=h.materials.head.map, img=tex.image;
 const cc=document.createElement('canvas'); cc.width=img.width; cc.height=img.height;
 const cx=cc.getContext('2d'); cx.drawImage(img,0,0);
 const d=cx.getImageData(0,0,img.width,img.height).data;
 // Find the darkest pixels (lash lines / brows) and report their uv bounds
 let minLum=999, uMin=2,uMax=-2,vMin=2,vMax=-2, n=0, sumU=0,sumV=0;
 for(let y=0;y<img.height;y+=2){for(let x=0;x<img.width;x+=2){
   const i=(y*img.width+x)*4; const lum=(d[i]*0.3+d[i+1]*0.6+d[i+2]*0.1);
   minLum=Math.min(minLum,lum);
   if(lum<90){ const u=x/img.width, v=1-y/img.height;
     uMin=Math.min(uMin,u);uMax=Math.max(uMax,u);vMin=Math.min(vMin,v);vMax=Math.max(vMax,v);
     sumU+=u;sumV+=v;n++; }
 }}
 log('texture', img.width+'x'+img.height, 'darkest lum', minLum.toFixed(0), 'dark px(sampled)', n);
 log('dark feature bounds u', uMin.toFixed(3), uMax.toFixed(3), ' v', vMin.toFixed(3), vMax.toFixed(3));
 log('dark centroid u', (sumU/n).toFixed(3), 'v', (sumV/n).toFixed(3));
 // Head geometry: print uv along the eye row and the centre column
 const g=h.parts.body.geometry, pos=g.attributes.position, uv=g.attributes.uv, idx=g.index.array;
 const hg=g.groups.find(x=>x.materialIndex===1);
 const seen=new Set(); for(let i=hg.start;i<hg.start+hg.count;i++) seen.add(idx[i]);
 const m=h.prop.measure;
 // Winding check: for a roughly convex part, face normals should point away
 // from the part's own centroid.
 const checkWinding=(label,start,count)=>{
   let cxm=0,cym=0,czm=0,n=0; const vs=new Set();
   for(let i=start;i<start+count;i++) vs.add(idx[i]);
   for(const vi of vs){cxm+=pos.getX(vi);cym+=pos.getY(vi);czm+=pos.getZ(vi);n++;}
   cxm/=n;cym/=n;czm/=n;
   let out=0,tot=0;
   for(let i=start;i<start+count;i+=3){
     const a=idx[i],b2=idx[i+1],c2=idx[i+2];
     const ax=pos.getX(a),ay=pos.getY(a),az=pos.getZ(a);
     const e1x=pos.getX(b2)-ax,e1y=pos.getY(b2)-ay,e1z=pos.getZ(b2)-az;
     const e2x=pos.getX(c2)-ax,e2y=pos.getY(c2)-ay,e2z=pos.getZ(c2)-az;
     const nx=e1y*e2z-e1z*e2y, ny=e1z*e2x-e1x*e2z, nz=e1x*e2y-e1y*e2x;
     const dx=ax-cxm,dy=ay-cym,dz=az-czm;
     if(nx*dx+ny*dy+nz*dz>0) out++; tot++;
   }
   log('winding',label,'outward '+out+'/'+tot+' ('+(100*out/tot).toFixed(1)+'%)');
 };
 checkWinding('head group', hg.start, hg.count);
 const bg=g.groups.find(x=>x.materialIndex===0);
 checkWinding('body group', bg.start, bg.count);
 const eyeRow=[...seen].filter(vi=>Math.abs(pos.getY(vi)-m.eyeLine)<0.006 && pos.getZ(vi)>0.0)
   .sort((a,b)=>pos.getX(a)-pos.getX(b));
 log('--- eye row (y~'+m.eyeLine.toFixed(3)+'), front verts: '+eyeRow.length);
 for(const vi of eyeRow) log('   x='+pos.getX(vi).toFixed(4)+' z='+pos.getZ(vi).toFixed(4)+' u='+uv.getX(vi).toFixed(3)+' v='+uv.getY(vi).toFixed(3));
}catch(e){window.__results.errors.push(e.stack||String(e));}
window.__results.done=true;
</script></body></html>
