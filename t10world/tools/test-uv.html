<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="module">
window.__results={logs:[],errors:[],done:false};
const log=(...a)=>window.__results.logs.push(a.map(String).join(' '));
try{
 const {settings}=await import('../src/core/settings.js'); settings.setQuality('high');
 const {Human}=await import('../src/human/human.js');
 const {defaultPlayerAppearance}=await import('../src/human/appearance.js');
 const h=new Human(defaultPlayerAppearance('female'),{tier:'player'});
 const g=h.parts.body.geometry;
 log('groups', JSON.stringify(g.groups));
 const idx=g.index.array, uv=g.attributes.uv, pos=g.attributes.position;
 const headGroup=g.groups.find(x=>x.materialIndex===1);
 log('head group', headGroup.start, headGroup.count);
 let uMin=9,uMax=-9,vMin=9,vMax=-9, yMin=9,yMax=-9;
 const seen=new Set();
 for(let i=headGroup.start;i<headGroup.start+headGroup.count;i++){
   const vi=idx[i]; if(seen.has(vi))continue; seen.add(vi);
   const u=uv.getX(vi), v=uv.getY(vi);
   uMin=Math.min(uMin,u);uMax=Math.max(uMax,u);vMin=Math.min(vMin,v);vMax=Math.max(vMax,v);
   yMin=Math.min(yMin,pos.getY(vi));yMax=Math.max(yMax,pos.getY(vi));
 }
 log('head uv u range',uMin.toFixed(3),uMax.toFixed(3),'v range',vMin.toFixed(3),vMax.toFixed(3));
 log('head y range',yMin.toFixed(3),yMax.toFixed(3),'verts',seen.size);
 // Find vertex nearest the front centre at the eye line and report its uv
 const m=h.prop.measure;
 let best=null,bd=9;
 for(const vi of seen){
   const x=pos.getX(vi),y=pos.getY(vi),z=pos.getZ(vi);
   const d=Math.abs(x)+Math.abs(y-m.eyeLine)*3+Math.abs(z-0.09);
   if(z>0 && d<bd){bd=d;best=vi;}
 }
 log('front-centre-at-eyeline vert uv',uv.getX(best).toFixed(3),uv.getY(best).toFixed(3),'pos',pos.getX(best).toFixed(3),pos.getY(best).toFixed(3),pos.getZ(best).toFixed(3));
 log('material1 map?', !!h.parts.body.material[1].map, h.parts.body.material[1].map && h.parts.body.material[1].map.image.width);
 log('material0 map?', !!h.parts.body.material[0].map);
 log('chinY',m.chinY.toFixed(3),'eyeLine',m.eyeLine.toFixed(3),'headH',m.headH.toFixed(3),'neckBaseY',m.neckBaseY.toFixed(3),'shoulderY',m.shoulderY.toFixed(3));
 // Dump the face texture to a visible canvas for inspection
 const tex=h.parts.body.material[1].map;
 const c=document.createElement('canvas'); c.width=512;c.height=512; document.body.appendChild(c); c.id='ft';
 c.getContext('2d').drawImage(tex.image,0,0,512,512);
}catch(e){window.__results.errors.push(e.stack||String(e));}
window.__results.done=true;
</script></body></html>
