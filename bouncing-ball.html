<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bouncing Ball</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
  }

  .ball {
    position: absolute;
    top: 20%;
    left: 50%;
    width: 60px;
    height: 60px;
    margin-left: -30px;
    border-radius: 50%;
    background: #e63946;
    animation: bounce 1s cubic-bezier(0.5, 0, 1, 0.5) infinite alternate;
  }

  @keyframes bounce {
    from {
      top: 10%;
    }
    to {
      top: 75%;
    }
  }
</style>
</head>
<body>
  <div class="ball"></div>
</body>
</html>
