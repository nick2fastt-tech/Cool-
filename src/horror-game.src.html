  {x:5.4,z:3.3, act:'putback',wait:1.5}
];
const PATROL=[{x:9.8,z:9.5},{x:16.5,z:3.5},{x:17.0,z:10.5},{x:6.0,z:16.0},{x:9.8,z:15.5}];

/* ---- collision ---- */
const BLOCKERS=[
  {lv:0,x:2.9,z:2.6,hw:1.05,hh:1.3},{lv:0,x:5.4,z:2.5,hw:.34,hh:.3},
  {lv:0,x:3.1,z:17.15,hw:1.22,hh:.56},{lv:0,x:3.1,z:14.55,hw:.56,hh:.3},
  {lv:0,x:14.4,z:1.5,hw:.7,hh:.35},
  {lv:1,x:18.5,z:11.4,hw:.95,hh:.46}
];
function blocked(lv,x,z,rad,ignoreProps){
  for(let oz=-1;oz<=1;oz++)for(let ox=-1;ox<=1;ox++){
    const c=(x+ox*rad)|0, r=(z+oz*rad)|0;
    // a shut door seals its tile for the player; she opens them instead (ignoreProps)
    const dr=ignoreProps?null:doorAt(lv,c,r);
    if(solid(lv,c,r)||(dr&&!dr.open)){
      const nx=Math.max(c,Math.min(x,c+1)), nz=Math.max(r,Math.min(z,r+1));
      if((x-nx)**2+(z-nz)**2<rad*rad) return true;
    }
  }
  if(!ignoreProps) for(const b of BLOCKERS){
    if(b.lv!==lv) continue;
    if(Math.abs(x-b.x)<b.hw+rad&&Math.abs(z-b.z)<b.hh+rad) return true;
  }
  return false;
}
function slide(o,dx,dz,rad,ip){
  if(!blocked(o.lv,o.x+dx,o.z,rad,ip)) o.x+=dx;
  if(!blocked(o.lv,o.x,o.z+dz,rad,ip)) o.z+=dz;
}
function los(lv,ax,az,bx,bz){
  const d=Math.hypot(bx-ax,bz-az), n=Math.ceil(d*4);
  for(let i=1;i<n;i++){ const t=i/n;
    if(solid(lv,(ax+(bx-ax)*t)|0,(az+(bz-az)*t)|0)) return false; }
  return true;
}
let flow=null,flowKey='';
function computeFlow(lv,tc,tr){
  const key=lv+':'+tc+':'+tr; if(key===flowKey) return; flowKey=key;
  const d=new Int16Array(COLS*ROWS).fill(-1);
  if(!walkable(lv,tc,tr)){ flow=null; return; }
  const q=[tc+tr*COLS]; d[tc+tr*COLS]=0;
  for(let h=0;h<q.length;h++){
    const cur=q[h],c=cur%COLS,r=(cur/COLS)|0,nd=d[cur]+1;
    for(const [nc,nr] of [[c+1,r],[c-1,r],[c,r+1],[c,r-1]]){
      if(nc<0||nr<0||nc>=COLS||nr>=ROWS) continue;
      const i=nc+nr*COLS;
      if(d[i]!==-1||!walkable(lv,nc,nr)) continue;
      d[i]=nd; q.push(i);
    }
  }
  flow=d;
}
function stepToward(o,tx,tz,spd,dt){
  computeFlow(o.lv,tx|0,tz|0);
  let gx=tx,gz=tz;
  if(flow){
    const c=o.x|0,r=o.z|0,here=flow[c+r*COLS];
    if(here>0){
      let best=here,bc=c,br=r;
      for(const [nc,nr] of [[c+1,r],[c-1,r],[c,r+1],[c,r-1]]){
        if(nc<0||nr<0||nc>=COLS||nr>=ROWS) continue;
        const v=flow[nc+nr*COLS]; if(v>=0&&v<best){best=v;bc=nc;br=nr;}
      }
      gx=bc+.5; gz=br+.5;
    }
  }
  const dx=gx-o.x,dz=gz-o.z,m=Math.hypot(dx,dz)||1;
  const want=Math.atan2(dx,dz);
  let diff=((want-o.a+Math.PI*3)%(Math.PI*2))-Math.PI;
  o.a+=diff*Math.min(1,dt*7);
  o.speed=spd;
  slide(o,dx/m*spd*dt,dz/m*spd*dt,.3,true);
}

/* ==========================================================
   ENTITY AI
   ========================================================== */
function canSeePlayer(){
  if(state.hidden) return false;
  if(ent.lv!==state.lv) return false;
  const dx=state.px-ent.x,dz=state.pz-ent.z,d=Math.hypot(dx,dz);
  const range=state.crouch?7.5:13;
  if(d>range) return false;
  const ang=Math.atan2(dx,dz);
  const diff=Math.abs(((ang-ent.a+Math.PI*3)%(Math.PI*2))-Math.PI);
  if(d>1.6&&diff>0.82) return false;
  return los(ent.lv,ent.x,ent.z,state.px,state.pz);
}
function spot(){
  if(ent.state==='CHASE'){ ent.seeT=2; return; }
  ent.notice=(ent.notice||0)+1/60;
  if(ent.notice<0.45) return;          // slow on the uptake
  ent.notice=0;
  ent.state='CHASE'; ent.seeT=3; ent.lostT=0; sfx.scream(); state.fear=1;
}
function grab(){
  if(state.mode!=='play') return;
  ent.screamT=1.3; sfx.scream();
  state.mode='dead'; state.hurt=1; save.deaths++; writeSave();
  setTimeout(()=>document.getElementById('death').classList.add('on'),750);
}
function entityUpdate(dt){
  ent.anim+=dt;
  if(state.noAI) return;            // held still so poses can be inspected
  if(ent.screamT>0){ ent.screamT-=dt; ent.speed=0; return; }
  if(!ent.active){ ent.speed=0; return; }
  if(!canSeePlayer()) ent.notice=0;
  ent.speed=0;
  switch(ent.state){
    case 'SLEEP': break;
    case 'ABED':                       // asleep on top of the covers
      ent.roamT-=dt;
      if(ent.roamT<=0){ ent.state='NIGHT_WALK'; ent.roamT=9+Math.random()*7;
        ent.patrolI=(Math.random()*PATROL.length)|0; ent.x=BED.x; ent.z=BED.z; sfx.creak(); }
      break;
    case 'NIGHT_WALK': {               // up for a wander, then back to bed
      ent.roamT-=dt;
      const t=PATROL[ent.patrolI%PATROL.length];
      stepToward(ent,t.x,t.z,1.15,dt);
      if(Math.hypot(t.x-ent.x,t.z-ent.z)<.6) ent.patrolI++;
      if(ent.roamT<=0) ent.state='NIGHT_BACK';
      if(canSeePlayer()) spot();
      break;
    }
    case 'NIGHT_BACK':
      stepToward(ent,BED.x,BED.z,1.2,dt);
      if(Math.hypot(BED.x-ent.x,BED.z-ent.z)<.6){
        ent.state='ABED'; ent.roamT=16+Math.random()*14; sfx.creak();
      }
      if(canSeePlayer()) spot();
      break;
    case 'WAKE': ent.wakeT-=dt; if(ent.wakeT<=0){ent.state='HUNT';ent.patrolI=0;} break;
    case 'HUNT': {
      const t=PATROL[ent.patrolI%PATROL.length];
      stepToward(ent,t.x,t.z,1.45,dt);
      if(Math.hypot(t.x-ent.x,t.z-ent.z)<.55){ ent.patrolI++; ent.waitT=1.1+Math.random()*1.4; ent.state='LOOK'; }
      if(canSeePlayer()) spot(); break;
    }
    case 'LOOK': ent.waitT-=dt; ent.a+=dt*1.5;
      if(ent.waitT<=0) ent.state='HUNT'; if(canSeePlayer()) spot(); break;
    case 'RETURN':
      stepToward(ent,BED.x,BED.z,1.35,dt);
      if(Math.hypot(BED.x-ent.x,BED.z-ent.z)<.6){ ent.state='SLEEP'; ent.active=false; }
      if(canSeePlayer()) spot(); break;
    case 'BEDROOM_IDLE':
      ent.roamT-=dt;
      if(ent.roamT<=0){ ent.state='ROAM'; ent.roamT=9+Math.random()*7; ent.patrolI=1; }
      else stepToward(ent,BED.x+Math.sin(ent.anim*.7)*1.2,BED.z+.4,.55,dt);
      if(canSeePlayer()) spot(); break;
    case 'ROAM': {
      ent.roamT-=dt;
      const t=PATROL[ent.patrolI%PATROL.length];
      stepToward(ent,t.x,t.z,1.3,dt);
      if(Math.hypot(t.x-ent.x,t.z-ent.z)<.6) ent.patrolI++;
      if(ent.roamT<=0) ent.state='BEDROOM_RETURN';
      if(canSeePlayer()) spot(); break;
    }
    case 'BEDROOM_RETURN':
      stepToward(ent,BED.x,BED.z,1.25,dt);
      if(Math.hypot(BED.x-ent.x,BED.z-ent.z)<.7){ ent.state='BEDROOM_IDLE'; ent.roamT=10+Math.random()*8; }
      if(canSeePlayer()) spot(); break;
    case 'CHASE': {
      if(ent.lv!==state.lv){ ent.lostT+=dt; if(ent.lostT>3) ent.state='HUNT'; } else ent.lostT=0;
      stepToward(ent,state.px,state.pz,3.0,dt);
      if(!state.hidden&&Math.hypot(state.px-ent.x,state.pz-ent.z)<0.75) grab();
      if(!canSeePlayer()){ ent.seeT-=dt; if(ent.seeT<=0) ent.state='HUNT'; } else ent.seeT=2;
      break;
    }
  }
  // she shoves doors open as she reaches them
  for(const d of doors){
    if(d.lv!==ent.lv||d.open||d.locked) continue;
    if(Math.hypot(ent.x-(d.c+.5),ent.z-(d.r+.5))<1.35){
      d.open=true;
      if(Math.hypot(state.px-ent.x,state.pz-ent.z)<14) sfx.creak();
    }
  }
  if(ent.speed>0){
    ent.stepA+=dt*(ent.state==='CHASE'?7:3.4);
    if(ent.stepA>1){ ent.stepA=0;
      const d=Math.hypot(state.px-ent.x,state.pz-ent.z);
      if(ent.lv===state.lv&&d<12&&AC) sN(.08,300,3,Math.max(0,.10*(1-d/12)));
    }
  }
}

const OBJ=document.getElementById('obj');
function setObjective(t){
  OBJ.textContent=t; OBJ.classList.add('show');
  clearTimeout(setObjective._t); setObjective._t=setTimeout(()=>OBJ.classList.remove('show'),5200);
}
function beat(b){
  state.beat=b; state.beatT=0; save.beat=b; save.chapter=1; writeSave();
  switch(b){
    case 'EXPLORE':
      setObjective('LOOK AROUND THE HOUSE'); state.exploreRooms={};
      ent.active=true; ent.state='ABED'; ent.lv=0; ent.x=BED.x; ent.z=BED.z;
      ent.roamT=11+Math.random()*7;
      break;
    case 'SHE_WAKES':
      ent.active=true; ent.state='WAKE'; ent.wakeT=2.6; ent.lv=0; ent.x=BED.x; ent.z=BED.z;
      sfx.wake(); setObjective('SOMETHING GOT UP. HIDE BEHIND THE COUCH'); break;
    case 'HIDDEN_WAIT': setObjective('STAY DOWN'); break;
    case 'SHE_LOCKS':
      ent.lockI=0; ent.lockWait=0; ent.state='LOCKING'; ent.active=true;
      setObjective('SHE IS LOCKING THE HOUSE'); break;
    case 'CAMERAS': state.hidden=null; setObjective('SET UP 3 CAMERAS · LIVING ROOM · KITCHEN · BATHROOM'); break;
    case 'WAIT_PHONE':
      ent.active=true; ent.state='BEDROOM_IDLE'; ent.roamT=6+Math.random()*5;
      setObjective('WATCH THE CAMERAS. WAIT FOR HER TO LEAVE THE BEDROOM'); break;
    case 'GET_KEY': setObjective('GET THE KEY FROM HER BEDROOM'); break;
    case 'CHASE': setObjective('RUN. GET TO THE BASEMENT'); break;
    case 'BASEMENT': setObjective('THE DOOR OUT'); break;
    case 'ESCAPE_RUN': setObjective('GET TO THE CAR'); break;
  }
}
const keyVisible=()=>state.beat==='GET_KEY'||state.beat==='WAIT_PHONE';
function beatsUpdate(dt){
  state.beatT+=dt;
  const room=roomOf(state.lv,state.px,state.pz);
  switch(state.beat){
    case 'EXPLORE':
      if(room) state.exploreRooms[room]=1;
      if(state.beatT>46||Object.keys(state.exploreRooms).length>=5) beat('SHE_WAKES');
      break;
    case 'SHE_WAKES': if(state.hidden==='couch') beat('HIDDEN_WAIT'); break;
    case 'HIDDEN_WAIT': if(state.beatT>5.5){ beat('SHE_LOCKS'); } break;
    case 'SHE_LOCKS': if(state.beatT>3&&ent.state==='SLEEP') beat('CAMERAS'); break;
    case 'CAMERAS': if(state.camsPlaced.every(v=>v)) beat('WAIT_PHONE'); break;
    case 'WAIT_PHONE':
      if(ent.state==='ROAM'&&roomOf(0,ent.x,ent.z)!=='BEDROOM'&&state.phoneUp) beat('GET_KEY');
      break;
    case 'GET_KEY':
      if(state.hasKey&&room==='LIVING ROOM'){
        ent.active=true; ent.state='CHASE'; ent.seeT=4; ent.lv=0; ent.x=9.6; ent.z=13.6;
        sfx.scream(); beat('CHASE');
      }
      break;
    case 'CHASE': if(state.lv===BASEMENT) beat('BASEMENT'); break;
    case 'ESCAPE_RUN':
      if(state.lv===STREET&&Math.hypot(state.px-CAR.x,state.pz-CAR.z)<2.4) playCarCine();
      break;
  }
  if(room&&room!==beatsUpdate._r){
    beatsUpdate._r=room;
    const rl=document.getElementById('roomLbl');
    rl.textContent=room; rl.style.opacity='1';
    clearTimeout(beatsUpdate._t); beatsUpdate._t=setTimeout(()=>rl.style.opacity='0',2400);
  }
}

const PROMPT=document.getElementById('prompt');
const HIDES=[
  {lv:0,x:3.1,z:18.15,k:'couch',lab:'HIDE UNDER THE COUCH',
   to:{x:3.1,z:17.15},eye:0.26,slotT:38,slotB:30},
  {lv:0,x:2.9,z:3.9,k:'bed',lab:'HIDE UNDER THE BED',
   to:{x:2.9,z:2.7},eye:0.20,slotT:42,slotB:34},
  {lv:1,x:6.0,z:16.4,k:'attic',lab:'HIDE IN THE ATTIC',
   to:{x:6.0,z:16.4},eye:0.62,slotT:22,slotB:16}
];
const hideDef=k=>HIDES.find(h=>h.k===k);
function nearestInteract(){
  if(state.hidden) return {kind:'unhide',label:'COME OUT'};
  const c=state.px|0,r=state.pz|0;
  for(const [dc,dr] of [[0,0],[1,0],[-1,0],[0,1],[0,-1]]){
    const t=tileAt(state.lv,c+dc,r+dr);
    if(t==='F') return {kind:'front',label:'FRONT DOOR'};
    if(t==='D') return {kind:'bdoor',label:state.hasKey?'UNLOCK THE BASEMENT':'LOCKED · NEEDS A KEY'};
    if(t==='O') return {kind:'out',label:'GET OUT'};
  }
  if(keyVisible()&&!state.hasKey&&state.lv===0&&Math.hypot(state.px-5.4,state.pz-2.5)<1.3)
    return {kind:'key',label:'TAKE THE KEY'};
  if(state.beat==='CAMERAS') for(let i=0;i<3;i++){
    const d=CAMS[i];
    if(state.camsPlaced[i]||d.lv!==state.lv) continue;
    if(Math.hypot(state.px-d.x,state.pz-d.z)<1.6)
      return {kind:'camspot',cam:i,label:'PLACE CAMERA · '+d.name};
  }
  for(let i=0;i<NOTES.length;i++){
    const n=NOTES[i];
    if(n.lv!==state.lv) continue;
    if(Math.hypot(state.px-n.x,state.pz-n.z)<1.35)
      return {kind:'note',note:n,label:'READ THE NOTE'};
  }
  for(const d of doors){
    if(d.lv!==state.lv) continue;
    if(Math.hypot(state.px-(d.c+.5),state.pz-(d.r+.5))<1.45){
      if(d.locked) return {kind:'lockeddoor',label:'LOCKED FROM THE INSIDE'};
      return {kind:'door',door:d,label:(d.open?'CLOSE THE ':'OPEN THE ')+d.name};
    }
  }
  for(const h of HIDES){
    if(h.lv!==state.lv) continue;
    if(Math.hypot(state.px-h.x,state.pz-h.z)<1.25) return {kind:h.k,label:h.lab};
  }
  return null;
}
function doInteract(){
  if(state.reading){ closeNote(); return; }
  const it=nearestInteract(); if(!it) return;
  switch(it.kind){
    case 'unhide': {
      if(state.hideAnim) break;      // already crawling -- don't restart it
      const h=hideDef(state.hidden)||HIDES[0];
      state.hideAnim={k:state.hidden,t:0,dir:-1,fx:state.px,fz:state.pz,tx:h.x,tz:h.z};
      sfx.creak();
      break;
    }
    case 'front': sfx.deny(); setObjective(state.doorsLocked?'SHE LOCKED IT':'BOARDED FROM THE OUTSIDE'); break;
    case 'bdoor':
      if(state.hasKey){ state.basementOpen=true; sfx.lock(); flowKey='';
        rebuildLevel(GROUND); playBasementCine(); }
      else sfx.deny();
      break;
    case 'out': if(state.lv===BASEMENT&&state.hasKey) playEscape(); else sfx.deny(); break;
    case 'key': state.hasKey=true; sfx.pickup(); setObjective('BASEMENT KEY');
      if(keyObj) keyObj.visible=false; break;
    case 'camspot':
      if(state.placing) break;
      state.placing={i:it.cam,t:0}; sfx.place();
      document.getElementById('mount').classList.add('on');
      break;
    case 'lockeddoor': doorScare(); break;
    case 'note': openNote(it.note); break;
    case 'door': it.door.open=!it.door.open; sfx.creak(); break;
    case 'couch': case 'bed': case 'attic': {
      if(state.hideAnim) break;
      const h=hideDef(it.kind);
      state.hideAnim={k:it.kind,t:0,dir:1,fx:state.px,fz:state.pz,tx:h.to.x,tz:h.to.z};
      state.hidden=it.kind; sfx.creak();
      break;
    }
  }
}
// Rattle her handle while she is inside and she opens it herself.
function doorScare(){
  if(state.mode!=='play') return;
  const d=doors[0];
  if(!d||!d.locked){ sfx.deny(); return; }
  // she only answers the handle once she's locked up for the night
  if(state.beat!=='CAMERAS'&&state.beat!=='WAIT_PHONE'&&state.beat!=='GET_KEY'){
    sfx.deny(); setObjective('HER DOOR WON\u2019T OPEN'); return;
  }
  d.locked=false; d.open=true; d.t=1;              // flung wide
  ent.active=true; ent.lv=0; ent.state='CHASE'; ent.seeT=6;
  ent.x=6.55; ent.z=3.35;
  ent.a=Math.atan2(state.px-ent.x,state.pz-ent.z);
  ent.speed=0; ent.screamT=1.5;
  sfx.slam(); state.fear=1;
  grab();
}
function rebuildLevel(lv){
  if(levelGroups[lv]){ scene.remove(levelGroups[lv]); disposeGroup(levelGroups[lv]); }
  const g=buildLevel(lv); g.visible=(state.lv===lv); scene.add(g); levelGroups[lv]=g;
}
function disposeGroup(g){ g.traverse(o=>{ if(o.geometry) o.geometry.dispose(); }); }
function changeLevel(lv,x,z){
  state.lv=lv; state.px=x; state.pz=z; state.floorY=state.floorYT=0; flowKey=''; sfx.creak();
  showLevel(lv);
}

// You get the door open, step down into the dark, and glance back up the stairs.
// She is standing there. Then she starts screaming and it is a footrace.
function playBasementCine(){
  state.lv=BASEMENT; showLevel(BASEMENT); flowKey='';
  state.px=19.4; state.pz=10.5; state.yaw=Math.PI/2; state.pitch=0; state.hidden=null;
  ent.active=false; ent.lv=BASEMENT; ent.x=18.7; ent.z=10.5; ent.a=-Math.PI/2;
  ent.state='LOOK'; ent.speed=0; ent.screamT=0;
  sfx.creak(); cineTotal=0;
  let seen=false, screamed=false, lastStep=-1, gasp=false, stumb=false;
  playCine(t=>{
    if(t<2.7){                                   // down the steps, into the dark
      const k=t/2.7;
      state.px=19.4+(15.0-19.4)*k; state.pz=10.5;
      state.yaw=Math.PI/2;
      // heavier tread coming down, and a slip halfway
      const trip=Math.max(0,1-Math.abs(t-1.55)/0.35);
      state.pitch=Math.sin(t*5.2)*0.020+trip*0.22;
      state.roll=Math.sin(t*2.6)*0.014-trip*0.16;
      if(t>1.5&&!stumb){ stumb=true; sfx.step(.16); }
      if(t-lastStep>0.38){ lastStep=t; sfx.step(.10); }
      if(basementBulb) basementBulb.rotation.z=Math.sin(t*2.2)*0.10;
    } else if(t<4.8){                            // look back over your shoulder
      const k=(t-2.7)/2.1, e=k*k*(3-2*k);
      state.px=15.0; state.pz=10.5;
      state.yaw=Math.PI/2-Math.PI*e;
      state.pitch=0.02+Math.sin(t*3.1)*0.012;
      state.roll=Math.sin(t*2.0)*0.010;
      if(t>2.95&&!gasp){ gasp=true; sfx.breath(); }
      if(t>3.1&&!seen){ seen=true; ent.active=true; }
      if(basementBulb) basementBulb.rotation.z=Math.sin(t*2.6)*0.14;
    } else {                                     // she sees you
      if(!screamed){ screamed=true; ent.screamT=99; sfx.scream(); state.fear=1; state.hurt=.35; }
      state.yaw=-Math.PI/2+Math.sin(t*41)*0.016;
      state.pitch=0.02+Math.sin(t*33)*0.013;
      state.roll=Math.sin(t*27)*0.012;
      if(basementBulb) basementBulb.rotation.z=Math.sin(t*9)*0.22;
    }
  },[{t:'',d:2.7},{t:'',d:2.1},{t:'',d:2.2}],()=>{
    ent.screamT=0.9;                             // she's rooted for a beat -- go
    ent.state='CHASE'; ent.seeT=8; ent.active=true;
    beat('BASEMENT'); setObjective('RUN');
  });
}
function showLevel(lv){
  for(const k in levelGroups) levelGroups[k].visible=(+k===lv);
  for(const k in propGroups) propGroups[k].visible=(+k===lv);
  scene.fog.density = lv===STREET?0.045:(lv===BASEMENT?0.16:0.13);
  scene.fog.color.setHex(lv===STREET?0x0a1020:0x05060a);
  renderer.setClearColor(lv===STREET?0x0a1020:0x000000,1);
  if(moon) moon.intensity = lv===STREET?2.3:0;              // moonlight, outdoors only
  if(ambLight) ambLight.intensity = lv===STREET?4.8:2.6;
}

const mv={x:0,y:0}; let lookDX=0,lookDY=0; const keys={};
let stickId=null,lookId=null,lookLX=0,lookLY=0,stickBase={x:0,y:0};
const stickEl=document.getElementById('stick'),knobEl=document.getElementById('knob');
// The first touch on the left half drives the stick; ANY other touch looks around,
// whichever half it lands on, so a drag never gets ignored.
function tStart(e){
  if(state.mode!=='play') return;
  for(const t of e.changedTouches){
    if(stickId===null&&t.clientX<window.innerWidth*.5){
      stickId=t.identifier; stickBase={x:t.clientX,y:t.clientY};
      stickEl.style.display='block';
      stickEl.style.left=(t.clientX-66)+'px'; stickEl.style.top=(t.clientY-66)+'px';
      knobEl.style.left='38px'; knobEl.style.top='38px';
    } else if(lookId===null){
      lookId=t.identifier; lookLX=t.clientX; lookLY=t.clientY;
    }
  }
}
function tMove(e){
  if(e.cancelable) e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===stickId){
      let dx=t.clientX-stickBase.x, dy=t.clientY-stickBase.y;
      const d=Math.hypot(dx,dy),max=56;
      if(d>max){dx=dx/d*max;dy=dy/d*max;}
      knobEl.style.left=(38+dx)+'px'; knobEl.style.top=(38+dy)+'px';
      const dead=0.14, m=Math.hypot(dx,dy)/max;
      if(m<dead){ mv.x=mv.y=0; }
      else { const s=(m-dead)/(1-dead)/(m||1); mv.x=dx/max*s; mv.y=dy/max*s; }
    } else if(t.identifier===lookId){
      lookDX+=(t.clientX-lookLX)*0.0058*(settings.sens/100);
      lookDY+=(t.clientY-lookLY)*0.0044*(settings.sens/100);
      lookLX=t.clientX; lookLY=t.clientY;
    }
  }
}
function tEnd(e){
  for(const t of e.changedTouches){
    if(t.identifier===stickId){ stickId=null; mv.x=mv.y=0;
      knobEl.style.left='38px'; knobEl.style.top='38px'; stickEl.style.display='none'; }
    if(t.identifier===lookId) lookId=null;
  }
}
canvas.addEventListener('touchstart',tStart,{passive:false});
canvas.addEventListener('touchmove',tMove,{passive:false});
canvas.addEventListener('touchend',tEnd); canvas.addEventListener('touchcancel',tEnd);
window.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(state.mode==='play'){
    const k=e.key.toLowerCase();
    if(k==='e') doInteract();
    if(k==='c') state.crouch=!state.crouch;
    if(e.key==='Tab'||k==='f'){ e.preventDefault(); togglePhone(); }
    if(e.key==='Escape') pause();
  } else if(state.mode==='cine'&&e.key===' ') skipCine();
});
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
canvas.addEventListener('mousemove',e=>{
  if(document.pointerLockElement===canvas){
    lookDX+=e.movementX*0.0021*(settings.sens/100);
    lookDY+=e.movementY*0.0017*(settings.sens/100);
  }
});
canvas.addEventListener('click',()=>{
  if(state.mode==='play'&&!IS_TOUCH&&!document.pointerLockElement) canvas.requestPointerLock();
});
const bind=(id,fn,hold)=>{
  const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();fn(true);},{passive:false});
  if(hold) el.addEventListener('touchend',e=>{e.stopPropagation();fn(false);});
  el.addEventListener('click',e=>{e.stopPropagation(); if(!IS_TOUCH)fn(true);});
};
(function(){
  const nv=document.getElementById('noteView');
  const go=e=>{e.preventDefault();e.stopPropagation();closeNote();};
  nv.addEventListener('touchstart',go,{passive:false});
  nv.addEventListener('click',go);
})();
bind('bUse',()=>doInteract());
bind('bCrouch',()=>{state.crouch=!state.crouch;});
bind('bPhone',()=>togglePhone());
function readPad(){
  if(!navigator.getGamepads) return;
  const g=navigator.getGamepads()[0]; if(!g) return;
  const dz=v=>Math.abs(v)<.18?0:v;
  mv.x=dz(g.axes[0]); mv.y=dz(g.axes[1]);
  lookDX+=dz(g.axes[2]||0)*0.045*(settings.sens/100);
  lookDY+=dz(g.axes[3]||0)*0.035*(settings.sens/100);
  const b=i=>g.buttons[i]&&g.buttons[i].pressed;
  if(b(0)&&!readPad._a) doInteract(); readPad._a=b(0);
  if(b(1)&&!readPad._b) state.crouch=!state.crouch; readPad._b=b(1);
  if(b(3)&&!readPad._y) togglePhone(); readPad._y=b(3);
  state.run=b(6)||b(10);
}

const cineEl=document.getElementById('cine'), subEl=document.getElementById('sub');
let cineQ=[],cineI=0,cineT=0,cineDone=null,cineRig=null,typed=0;
const CPS=30;   // typed characters per second
function playCine(rig,lines,done){
  cineRig=rig; cineQ=lines; cineI=0; cineT=0; cineDone=done;
  state.mode='cine'; cineEl.classList.add('on');
  document.getElementById('hud').classList.add('hide');
  typed=0; subEl.textContent='';
}
function skipCine(){ if(state.mode==='cine') endCine(); }
document.getElementById('skip').addEventListener('click',skipCine);
document.getElementById('skip').addEventListener('touchstart',e=>{e.preventDefault();skipCine();},{passive:false});
function endCine(){
  cineEl.classList.remove('on'); state.mode='play';
  document.getElementById('hud').classList.remove('hide');
  const f=cineDone; cineDone=null; cineRig=null; if(f) f();
}
function cineUpdate(dt){
  cineT+=dt;
  const cur=cineQ[cineI];
  if(!cur){ endCine(); return; }
  if(cur.sfx&&!cur._p){ cur._p=1; (sfx[cur.sfx]||(()=>{}))(); }
  if(cineRig) cineRig(totalCineT()+dt);
  // type the line out a character at a time, with a cursor while it runs
  const full=cur.t||'';
  const want=Math.min(full.length,Math.floor(cineT*CPS));
  if(want>typed){
    if(full[want-1]&&full[want-1]!==' ') sfx.type();
    typed=want;
  }
  subEl.textContent = full ? full.slice(0,typed)+(typed<full.length?'\u258c':'') : '';
  if(cineT>cur.d){
    cineT=0; cineI++; typed=0;
    const n=cineQ[cineI]; subEl.textContent='';
    if(!n){ endCine(); return; }
  }
  cineTotal+=dt;
}
let cineTotal=0;
const totalCineT=()=>cineTotal;

function startChapter1(fromBeat,fromSave){
  resetRun();
  if(fromBeat&&fromBeat!=='STREET'){ jumpToBeat(fromBeat,fromSave); return; }
  // open out on the road so the street and the neighbours read, then push in
  state.lv=STREET; state.px=11.5; state.pz=22.5; state.yaw=0.42; state.pitch=0.03;
  showLevel(STREET);
  state.beat='STREET'; cineTotal=0;
  playCine(t=>{
    const k=Math.min(1,t/15.5), e=k*k*(3-2*k);    // ease in/out
    state.px=11.5+(6.4-11.5)*e;
    state.pz=22.5+(14.0-22.5)*e;
    state.yaw=0.42+(0.21-0.42)*e+Math.sin(t*.17)*.012;
    state.pitch=0.05+Math.sin(t*.21)*.015;
  },[
    {t:'BARRY CLARK · 27 · HOME INSPECTOR',d:2.6},
    {t:'"This house has been built. For 150 years exact."',d:4.0},
    {t:'"Since they didn\'t wanna take it down, it\'s time I would do a inspection and see what\'s in here."',d:5.2},
    {t:'"Ah, it\'s 2:03 AM. One quick look and I\'m out."',d:4.0}
  // the rig flies outside the walkable grid, so land on a valid tile whether the
  // cutscene played out or the player hit SKIP on the first frame
  ],()=>{ state.px=6.4; state.pz=14.0; state.yaw=0.21; state.pitch=0;
          state.beat='APPROACH'; setObjective('GO TO THE HOUSE'); });
}
function jumpToBeat(b,fromSave){
  state.lv=GROUND; state.px=5.5; state.pz=17.6; state.yaw=-0.7; state.pitch=0;
  flowKey=''; showLevel(GROUND);
  if(fromSave){
    state.camsPlaced=(save.cams||[false,false,false]).slice();
    state.hasKey=!!save.hasKey; state.doorsLocked=!!save.doorsLocked;
    if((b==='WAIT_PHONE'||b==='GET_KEY')&&!state.camsPlaced.every(Boolean)) b='CAMERAS';
    if((b==='CHASE'||b==='BASEMENT')&&!state.hasKey) b='GET_KEY';
  }
  const cams=()=>{ state.doorsLocked=true; if(!fromSave) state.camsPlaced=[true,true,true]; };
  switch(b){
    case 'SHE_WAKES': case 'HIDDEN_WAIT': beat('SHE_WAKES'); break;
    case 'SHE_LOCKS': case 'CAMERAS': state.doorsLocked=true; beat('CAMERAS'); break;
    case 'WAIT_PHONE': cams(); beat('WAIT_PHONE'); break;
    case 'GET_KEY': cams();
      ent.active=true; ent.state='ROAM'; ent.roamT=14; ent.lv=0; ent.x=16.5; ent.z=3.5;
      beat('GET_KEY'); break;
    case 'CHASE': case 'BASEMENT': cams(); state.hasKey=true; beat('GET_KEY'); break;
    default: beat('EXPLORE');
  }
  state.camsLeft=3-state.camsPlaced.filter(Boolean).length;
  document.querySelectorAll('#camTabs button').forEach((x,i)=>x.disabled=!state.camsPlaced[i]);
  camMeshes.forEach((m,i)=>m.visible=state.camsPlaced[i]);
  if(keyObj) keyObj.visible=!state.hasKey;
}
function resetRun(){
  state.lv=GROUND; state.crouch=false; state.run=false; state.hidden=null; state.hasKey=false;
  state.camsPlaced=[false,false,false]; state.camsLeft=3; state.basementOpen=false;
  state.doorsLocked=false; state.phoneUp=false; state.fear=0; state.hurt=0; state.pitch=0;
  state.floorY=0; state.floorYT=0; state.roll=0; state.reading=false; state.placing=null;
  state.hideAnim=null; state.slot=0;
  tabsEl.classList.remove('on');
  if(phoneMesh) phoneMesh.visible=false;
  ent.active=false; ent.state='SLEEP'; ent.lv=0; ent.x=BED.x; ent.z=BED.z; ent.screamT=0;
  doors.forEach(d=>{d.open=false;});
  flowKey='';
  document.querySelectorAll('#camTabs button').forEach(x=>x.disabled=true);
  camMeshes.forEach(m=>m.visible=false);
  if(keyObj) keyObj.visible=true;
  state.mode='play';
  document.getElementById('hud').classList.remove('hide');
  document.getElementById('death').classList.remove('on');
  hideAllScreens();
  rebuildLevel(GROUND);
  showLevel(GROUND);
}
function respawn(){
  let b=state.beat; if(b==='CHASE'||b==='BASEMENT') b='CHASE';
  save.cams=state.camsPlaced.slice(); save.hasKey=state.hasKey; save.doorsLocked=state.doorsLocked;
  document.getElementById('death').classList.remove('on');
  resetRun(); jumpToBeat(b,true);
}

  g.add(box(1.72,.05,.30,dash,0,-.325,-.90));                 // top pad
  // instrument binnacle with faintly lit dials
  const gauge=new T.MeshStandardMaterial({color:0x0d0f12,roughness:.4,
    emissive:0x1d2a1a,emissiveIntensity:1.1});

  wheel.add(box(.25,.026,.020,trim,0,0,.004));

  const hub=new T.Mesh(new T.CylinderGeometry(.042,.042,.020,12),trim);
  hub.rotation.x=Math.PI/2; wheel.add(hub);
  const badge=new T.Mesh(new T.CylinderGeometry(.016,.016,.004,10),

  badge.rotation.x=Math.PI/2; badge.position.z=.013; wheel.add(badge);
  g.add(wheel); g.userData.wheel=wheel;

  // pillars, roof lip, visors and mirror
  for(const sx of [-1,1]) g.add(box(.075,.90,.075,dash,sx*.78,.16,-.84));
  g.add(box(1.72,.09,.26,dash,0,.60,-.72));
  for(const sx of [-1,1]) g.add(box(.52,.03,.20,trim,sx*.34,.545,-.80));
  const mstem=box(.02,.05,.02,trim,.09,.53,-.85); g.add(mstem);
  g.add(box(.20,.070,.028,trim,.09,.485,-.845));
  g.add(box(.185,.055,.010,new T.MeshStandardMaterial({color:0x14161c,roughness:.1,
    metalness:.8}),.09,.485,-.860));
  // driver's door: card, glass frame, handle, winder
  g.add(box(.06,.55,.85,dash,-.78,-.34,-.18));
  g.add(box(.05,.09,.52,trim,-.775,-.06,-.18));
  g.add(box(.05,.055,.13,trim,-.772,-.20,-.36));
  const wind=new T.Mesh(new T.CylinderGeometry(.020,.020,.02,10),trim);
  wind.rotation.z=Math.PI/2; wind.position.set(-.770,-.30,-.12); g.add(wind);

    sl.position.set(sx*.098,-.212,.258); sl.rotation.set(1.22,0,-sx*0.30); a.add(sl);
    // upper arm

    up.position.set(sx*.126,-.300,.318);
    up.rotation.set(0.92,0,-sx*0.46); a.add(up);
    return a;
  };
  g.add(arm(-1)); g.add(arm(1));

  g.visible=false;

}
function drawCrack(){
  const cv=document.getElementById('crack');
  const w=cv.width=Math.min(900,window.innerWidth), h=cv.height=Math.min(1600,window.innerHeight);
  const g=cv.getContext('2d'); g.clearRect(0,0,w,h);
  const ox=w*0.62, oy=h*0.44, rnd=mulberry(7);
  g.strokeStyle='rgba(232,240,255,.85)'; g.lineCap='round';
  for(let i=0;i<26;i++){
    const a=rnd()*6.283; let x=ox,y=oy,len=40+rnd()*Math.max(w,h)*0.55;
    g.lineWidth=2.4-Math.min(1.6,i*0.05); g.beginPath(); g.moveTo(x,y);
    let dir=a;
    for(let k=0;k<7;k++){
      dir+=(rnd()-.5)*0.5; const st=len/7;
      x+=Math.cos(dir)*st; y+=Math.sin(dir)*st; g.lineTo(x,y);
    }
    g.stroke();
  }
  for(let r=16;r<130;r+=26){                     // concentric shatter rings
    g.lineWidth=1.3; g.beginPath();
    for(let k=0;k<=18;k++){
      const a=k/18*6.283, rr=r*(0.82+rnd()*0.36);
      const x=ox+Math.cos(a)*rr, y=oy+Math.sin(a)*rr;
      k?g.lineTo(x,y):g.moveTo(x,y);
    }
    g.closePath(); g.stroke();
  }
  const rg=g.createRadialGradient(ox,oy,2,ox,oy,150);
  rg.addColorStop(0,'rgba(228,238,255,.55)'); rg.addColorStop(1,'rgba(228,238,255,0)');
  g.fillStyle=rg; g.beginPath(); g.arc(ox,oy,150,0,6.283); g.fill();
}
let escDoor=null;
function playEscape(){
  if(!escDoor){
    escDoor=new T.Group();
    const d=makeDoor(); d.position.x=0.47; escDoor.add(d);
    escDoor.position.set(1.35,0,11.55); escDoor.rotation.y=-Math.PI/2;
    escDoor.userData.base=escDoor.rotation.y;
    propGroups[STREET].add(escDoor);
  }
  escDoor.visible=true;
  state.lv=STREET; showLevel(STREET); flowKey='';
  state.px=1.9; state.pz=12.0; state.yaw=-1.15; state.pitch=0.05; state.roll=0;
  state.hidden=null; state.hasKey=true;
  ent.active=false; ent.lv=STREET; ent.x=1.7; ent.z=11.3; ent.a=-0.9;
  ent.state='LOOK'; ent.speed=0; ent.screamT=0;
  cineTotal=0;
  let slammed=false,b1=false,b2=false,b3=false;
  const dBase=escDoor.userData.base;
  playCine(t=>{
    if(t<2.2){                                   // out, and you nearly go over
      const k=t/2.2;
      state.px=1.9+k*2.7; state.pz=12.0+k*1.8;
      state.yaw=-1.15+k*0.30;
      const st=Math.max(0,1-Math.abs(t-1.25)/0.55);
      state.pitch=0.05+st*0.60; state.roll=st*0.34;
      // the door is flung wide as you come through, then she runs into it
      if(t<1.45){ escDoor.rotation.y=dBase-Math.min(1.5,t*1.6); }
      else {
        const j=Math.max(0,1-(t-1.45)/0.45);
        escDoor.rotation.y=dBase-j*0.34+Math.sin((t-1.45)*46)*0.05*j;
        ent.active=true; ent.lv=STREET; ent.state='LOOK';
        ent.x=1.55; ent.z=11.75; ent.a=-0.7; ent.speed=0;
        ent.screamT=(t<1.75)?99:0;                // she rebounds off it
      }
      if(t>1.45&&!slammed){ slammed=true; sfx.slam(); state.hurt=.30; }
    }else{                                       // hands on knees, getting air
      state.px=4.6; state.pz=13.8; state.roll=Math.sin(t*1.6)*0.035;
      state.pitch=0.36+Math.sin(t*2.3)*0.10;
      state.yaw=-0.85;
      escDoor.rotation.y=dBase;
      ent.active=false; ent.screamT=0;
      if(t>2.6&&!b1){b1=true;sfx.breath();}
      if(t>3.5&&!b2){b2=true;sfx.breath();}
      if(t>4.4&&!b3){b3=true;sfx.breath();}
    }
  },[{t:'',d:2.2},{t:'',d:3.1}],()=>{
    state.roll=0; state.pitch=0.04;
    escDoor.rotation.y=dBase-1.45;               // she comes back through it
    ent.active=true; ent.state='CHASE'; ent.seeT=99;
    ent.x=2.2; ent.z=11.8; ent.lv=STREET;
    sfx.slam(); sfx.scream(); state.fear=1;
    beat('ESCAPE_RUN'); setObjective('GET TO THE CAR');
  });
}
function playCarCine(){
  cineTotal=0;
  if(carRig) carRig.visible=true;
  // the camera sits inside the parked car's shell; the interior rig replaces it
  if(barryCar) barryCar.visible=false;
  cars.forEach(c=>{ c.m.visible=false; c.wait=999; });   // keep the lane clear
  if(phoneMesh) phoneMesh.visible=false;
  state.phoneUp=false; tabsEl.classList.remove('on');
  const sx=state.px, sz=state.pz, sy=state.yaw;
  let shut=false,punch=false,started=false,revd=false;
  const crack=document.getElementById('crack');
  const FWD=-Math.PI/2, LEFT=-Math.PI;      // facing along the road, and out the door glass
  playCine(t=>{
    if(t<1.6){                                   // scramble in, door shut, face the road
      const k=Math.min(1,t/1.6), e=k*k*(3-2*k);
      state.px=sx+(CAR.x-0.75-sx)*e; state.pz=sz+(CAR.z-sz)*e;
      state.yaw=sy+(FWD-sy)*e; state.pitch=0.04;
      if(t>1.30&&!shut){ shut=true; sfx.slam(); }
      ent.x=CAR.x-5.2+(CAR.x-2.6-(CAR.x-5.2))*e; ent.z=CAR.z+2.2; ent.a=-Math.PI/2; ent.speed=3.2;
    }else if(t<4.0){                             // she arrives at your window and swings
      const k=Math.min(1,(t-1.6)/1.1), e=k*k*(3-2*k);
      state.yaw=FWD+(LEFT-FWD)*e;                // turn and look straight at her
      const m=Math.min(1,(t-1.6)/1.5);
      ent.x=CAR.x-2.6+((CAR.x-0.92)-(CAR.x-2.6))*m;
      ent.z=CAR.z+2.2+((CAR.z+1.06)-(CAR.z+2.2))*m;
      ent.a=-Math.PI/2; ent.speed=(m<1)?3.2:0;
      if(t>3.05&&!punch){
        punch=true; ent.screamT=99;
        sfx.glass(); sfx.scream(); state.hurt=1; state.fear=1;
        drawCrack(); crack.style.opacity='0.92';
      }
      if(punch){ state.roll=Math.sin(t*44)*0.022; state.pitch=0.04+Math.sin(t*37)*0.018; }
    }else{                                       // face front, crank it, and go
      const k=Math.min(1,(t-4.0)/0.9), e=k*k*(3-2*k);
      state.yaw=LEFT+(FWD-LEFT)*e;
      ent.screamT=0; state.hurt=Math.max(0,0.6-(t-4.0)*0.6); state.fear=Math.max(0,1-(t-4.0)*0.4);
      if(!started&&t>4.2){ started=true; sfx.engine(); }
      if(t>5.0&&!revd){ revd=true; sfx.rev(); }
      // pull out into the empty lane first -- the parked cars sit on the kerb
      // at z 17.2, so driving straight down z 16.7 went through them
      const d=Math.max(0,t-5.0), a=Math.min(1,d/3.4), e2=a*a;
      const pull=Math.min(1,d/1.3);
      state.px=CAR.x-0.75+e2*54;
      state.pz=CAR.z+(19.55-CAR.z)*(pull*pull*(3-2*pull));
      state.roll=Math.sin(t*9)*0.014*(1-a);
      state.pitch=0.04;
      if(carRig&&carRig.userData.wheel)
        carRig.userData.wheel.rotation.z=Math.sin(t*1.6)*0.26-0.14;
      crack.style.opacity=String(0.92*(1-a*0.30));
    }
  },[{t:'',d:1.6},{t:'',d:2.4},
     {t:'"Oh I\u2019m never going here again."',d:3.2},
     {t:'"I quit this job."',d:2.8},
     {t:'TO BE CONTINUED',d:2.6},{t:'CHAPTER II \u2014 EVADE',d:2.6}],()=>{
    crack.style.opacity='0'; state.roll=0; ent.screamT=0;
    if(carRig) carRig.visible=false;
    if(barryCar) barryCar.visible=true;
    cars.forEach(c=>{ c.wait=4+Math.random()*8; });
    if(escDoor) escDoor.visible=false;
    save.chapter=1; save.beat=null; writeSave();
    toMenu();
  });
}
function finishChapter(){
  save.chapter=1; save.beat=null; writeSave(); cineTotal=0;
  playCine(t=>{ state.pitch=Math.min(.35,t*.09); state.yaw+=0.0016; },
  [{t:'The basement door gives. Cold air. Grass.',d:3.4},
   {t:'"...I never even got upstairs."',d:3.6},
   {t:'RUINATION \u2014 COMPLETE',d:3.0}],()=>toMenu());
}

/* ==========================================================
   UPDATE
   ========================================================== */
function update(dt){
  if(state.mode==='cine'){ cineUpdate(dt); syncCamera(dt); return; }
  // keep the scream playing after the grab so the camera actually turns to her
  if(state.mode==='dead'){ entityUpdate(dt); syncCamera(dt); return; }
  if(state.mode!=='play'){ return; }
  if(PLATFORM==='CONSOLE') readPad();

  let kx=0,kz=0;
  if(keys['a'])kx-=1; if(keys['d'])kx+=1;
  if(keys['w'])kz-=1; if(keys['s'])kz+=1;
  if(keys['arrowleft'])lookDX-=dt*2.1; if(keys['arrowright'])lookDX+=dt*2.1;
  const running=state.run||keys['shift'];
  let ix=mv.x+kx, iz=mv.y+kz;
  const im=Math.hypot(ix,iz); if(im>1){ix/=im;iz/=im;}

  // three's rotateY(+yaw) swings the view LEFT, so a rightward drag has to
  // subtract. One place fixes touch, mouse, gamepad and the arrow keys alike.
  state.yaw-=lookDX;
  state.pitch+=lookDY*(settings.invY?-1:1);
  state.pitch=Math.max(-1.15,Math.min(1.15,state.pitch));
  lookDX=lookDY=0;

  if(!state.hidden&&!state.reading&&!state.placing&&!state.hideAnim){
    // once she's after you, moving at all means sprinting -- no button to hold
    const fleeing=(state.beat==='CHASE'||state.beat==='BASEMENT'||ent.state==='CHASE');
    let spd=state.crouch?1.35:((running||fleeing)?4.2:2.5);
    // must match the camera: three looks down -Z, so after rotateY(yaw)
    // forward is (-sin yaw, -cos yaw) and right is (cos yaw, -sin yaw)
    const fx=-Math.sin(state.yaw), fz=-Math.cos(state.yaw);
    const dx=(fx*-iz + Math.cos(state.yaw)*ix)*spd*dt;
    const dz=(fz*-iz - Math.sin(state.yaw)*ix)*spd*dt;
    const b4=state.px+state.pz;
    const p={lv:state.lv,x:state.px,z:state.pz};   // slide() works on .x/.z
    slide(p,dx,dz,.3,false);
    state.px=p.x; state.pz=p.z;
    if(Math.abs(state.px+state.pz-b4)>1e-4){
      state.bob+=dt*(state.crouch?6:(running?14:10));
      state.stepT+=dt*(state.crouch?1.3:(running?3.2:2.3));
      if(state.stepT>1){ state.stepT=0; sfx.step(running?.10:.07); }
    }
  }
  // walking the stairs: ride the ramp, and swap levels at the top / bottom
  if(!state.hidden){
    if(state.lv===GROUND&&onStair(state.px,state.pz)&&state.pz<=STAIR.upAt
       &&state.floorY>STAIR.rise*0.80){
      state.lv=UPSTAIRS; state.pz=STAIR.upTo; state.floorY=0; state.floorYT=0;
      flowKey=''; showLevel(UPSTAIRS); sfx.creak();
    } else if(state.lv===UPSTAIRS&&onStair(state.px,state.pz)&&state.pz>=STAIR.downAt){
      state.lv=GROUND; state.pz=STAIR.downTo;
      state.floorY=state.floorYT=stairHeight(GROUND,state.px,state.pz);
      flowKey=''; showLevel(GROUND); sfx.creak();
    }
  }
  state.floorYT=stairHeight(state.lv,state.px,state.pz);
  state.floorY+=(state.floorYT-state.floorY)*Math.min(1,dt*14);

  // approach trigger
  if(state.beat==='APPROACH'&&state.lv===STREET&&state.pz<9.9&&Math.abs(state.px-5.5)<2.2){
    state.beat='KNOCK'; cineTotal=0;
    playCine(t=>{ state.pitch=Math.sin(t*.5)*.03; },[
      {t:'*knock*',d:.75,sfx:'knock'},{t:'*knock*',d:.75,sfx:'knock'},{t:'*knock*',d:.95,sfx:'knock'},
      {t:'"Anyone there?"',d:2.2},
      {t:'Somewhere inside, a sink faucet runs.',d:2.8,sfx:'faucet'},
      {t:'The knob turns. It\'s unlocked.',d:2.6,sfx:'creak'}
    ],()=>{ state.px=5.5; state.pz=17.6; state.yaw=-0.7; state.lv=GROUND;
            showLevel(GROUND); flowKey=''; beat('EXPLORE'); });
  }

  // crawling under the couch / bed: three seconds, and your view narrows to a slit
  if(state.hideAnim){
    const A=state.hideAnim; A.t+=dt;
    const k=Math.min(1,A.t/3), e=k*k*(3-2*k);
    state.px=A.fx+(A.tx-A.fx)*e; state.pz=A.fz+(A.tz-A.fz)*e;
    if(A.t>=3){
      if(A.dir<0){ state.hidden=null; }
      state.hideAnim=null;
    }
  }
  {
    const h=state.hidden?hideDef(state.hidden):null;
    const want=h?(state.hideAnim&&state.hideAnim.dir<0
                    ? 1-Math.min(1,state.hideAnim.t/3)
                    : (state.hideAnim?Math.min(1,state.hideAnim.t/3):1)):0;
    state.slot=(state.slot||0)+((want)-(state.slot||0))*Math.min(1,dt*6);
    const sl=document.getElementById('slot');
    sl.style.opacity=state.slot>0.02?'1':'0';
    const tb=h?h.slotT:0, bb=h?h.slotB:0;
    sl.children[0].style.height=(tb*state.slot)+'%';
    sl.children[1].style.height=(bb*state.slot)+'%';
  }

  // mounting a camera: three seconds of fumbling with the bracket
  if(state.placing){
    const P=state.placing; P.t+=dt;
    const k=Math.min(1,P.t/3);
    const m=camMeshes[P.i];
    m.visible=true;
    m.scale.setScalar(.35+.65*k);
    m.rotation.z=(1-k)*0.7*(P.i%2?1:-1);
    document.getElementById('mfill').style.width=(k*100)+'%';
    if(P.t>0.45&&!P.c1){P.c1=1;sfx.place();}
    if(P.t>1.7&&!P.c2){P.c2=1;sfx.place();}
    if(k>=1){
      state.camsPlaced[P.i]=true; state.camsLeft--;
      m.scale.setScalar(1); m.rotation.z=0;
      document.querySelectorAll('#camTabs button')[P.i].disabled=false;
      document.getElementById('mount').classList.remove('on');
      setObjective('CAMERA PLACED · '+(3-state.camsLeft)+'/3');
      state.placing=null;
    }
  }

  entityUpdate(dt);
  beatsUpdate(dt);

  const near=(ent.active&&ent.lv===state.lv)?Math.max(0,1-Math.hypot(state.px-ent.x,state.pz-ent.z)/12):0;
  state.fear+=((ent.state==='CHASE'?1:near)-state.fear)*Math.min(1,dt*2.2);
  if(droneG) droneG.gain.value=0.03+state.fear*0.16;
  state.heartT-=dt;
  if(state.heartT<=0&&state.fear>0.18){ sfx.heart(state.fear); state.heartT=1.15-state.fear*.72; }
  state.hurt=Math.max(0,state.hurt-dt*.7);

  const it=nearestInteract();
  if(it){ PROMPT.textContent=it.label; PROMPT.classList.add('show'); }
  else { PROMPT.classList.remove('show'); PROMPT.textContent=''; }

  syncCamera(dt);
}

function syncCamera(dt){
  // eye height, crouch and hiding
  let tgt=1.55;
  if(state.crouch) tgt=0.95;
  if(state.hidden){
    const h=hideDef(state.hidden);
    if(h) tgt=h.eye;
  }
  if(carRig&&carRig.visible) tgt=1.16;
  state.eyeY+=(tgt-state.eyeY)*Math.min(1,dt*8);
  const bob=Math.sin(state.bob)*0.022*(state.crouch?.5:1);
  const sway=Math.cos(state.bob*.5)*0.012;
  camera.position.set(state.px+sway*Math.cos(state.yaw),(state.floorY||0)+state.eyeY+bob,state.pz-sway*Math.sin(state.yaw));
  camera.rotation.set(0,0,0);
  camera.rotateY(state.yaw); camera.rotateX(-state.pitch);
  if(state.roll) camera.rotateZ(state.roll);
  // during the scream, snap to look at her
  if(ent.screamT>0&&woman){
    const dx=ent.x-state.px, dz=ent.z-state.pz;
    const want=Math.atan2(dx,dz)+Math.PI;
    state.yaw+=(((want-state.yaw+Math.PI*3)%(Math.PI*2))-Math.PI)*Math.min(1,dt*9);
    camera.rotation.set(0,0,0); camera.rotateY(state.yaw);
    camera.rotateX(-state.pitch+Math.sin(performance.now()*.05)*.04);
  }
  // woman transform
  if(woman){
    const vis=ent.active&&ent.state!=='SLEEP'&&ent.lv===state.lv;
    woman.visible=vis;
    if(vis){
      if(ent.state==='ABED'){                    // on her back on top of the covers
        woman.position.set(2.92,0.92,3.45);
        woman.rotation.set(-Math.PI/2,0,0);
        animateWoman(woman,dt,0,false,false);
        const br=Math.sin(performance.now()*0.0012)*0.012;
        woman.position.y=0.92+br;
      }else{
        woman.rotation.set(0,ent.a,0);
        woman.position.set(ent.x,0,ent.z);
        animateWoman(woman,dt,ent.speed,ent.screamT>0,ent.state==='CHASE');
      }
    }
  }
  // phone
  if(phoneMesh){
    const want=state.phoneUp?0:1;
    state.phoneT+=((want)-state.phoneT)*Math.min(1,dt*7);
    const t=state.phoneT;                        // 0 = up in front of you, 1 = stowed
    phoneMesh.position.set(.035,-.115-t*.46,-.36+t*.05);
    phoneMesh.rotation.set(-.18-t*.55,-.10,.04+t*.22);
    phoneMesh.visible=t<0.985;
  }
  // the single basement bulb stutters harder the nearer the way out you get
  if(state.lv===BASEMENT){
    const d=Math.hypot(state.px-1.6,state.pz-10.5);
    const rate=3.2+Math.max(0,(16-d))*1.35;
    const tt=performance.now()*0.001;
    const a=Math.sin(tt*rate), b=Math.sin(tt*rate*2.7+1.1), c=Math.sin(tt*rate*0.6);
    const v=a*0.5+b*0.3+c*0.2;
    const dip=Math.max(0,(16-d))/16;
    state.flick=(v>-0.10-dip*0.34)?1:(0.06+Math.random()*0.10);
    if(basementBulb){
      basementBulb.rotation.z=Math.sin(tt*1.3)*0.05+Math.sin(tt*rate*0.5)*0.02*dip;
      const em=basementBulb.userData.glow;
      if(em) em.material.emissiveIntensity=3.0*state.flick;
    }
  } else state.flick=1;

  // pick the nearest lights for the fixed pool
  const act=LIGHT_DEFS.filter(l=>l.lv===state.lv)
    .map(l=>({l,d:(l.x-state.px)**2+(l.z-state.pz)**2}))
    .sort((a,b)=>a.d-b.d);
  const n=Q().lights;
  for(let i=0;i<lights.length;i++){
    const L=lights[i];
    if(i<n&&i<act.length){
      const s=act[i].l;
      L.position.set(s.x,s.y,s.z); L.color.setHex(s.col);
      L.distance=s.d; L.intensity=s.i*LIGHT_GAIN*(1+state.fear*0.12)*(state.lv===BASEMENT?(state.flick||1):1);
      L.visible=true;
    } else { L.visible=false; L.intensity=0; }
  }
  updateDoors(dt); updateTraffic(dt);
  if(nightstand&&nightstand.userData.drawer){
    const d=nightstand.userData.drawer;
    const want=(state.drawerOpen?0.30:0.02);
    d.position.z=d.position.z+(want-d.position.z)*Math.min(1,dt*6);
  }
  if(keyObj&&keyObj.visible) keyObj.rotation.y+=dt*1.6;
  for(let i=0;i<camMeshes.length;i++){
    const m=camMeshes[i]; if(!m.visible) continue;
    const sweep=Math.sin(performance.now()*0.00042+i*2.1)*0.62;
    m.rotation.y=CAMS[i].ry+sweep;
    CAMS[i].pan=sweep;
  }
  camMeshes.forEach(m=>{ if(m.visible&&m.userData.led)
    m.userData.led.material.color.setHex(((performance.now()%1400)<700)?0xff2020:0x400808); });
}

   RENDER
   ========================================================== */
let feedTick=0;
function render(dt){
  if(state.mode==='menu'){ renderer.setRenderTarget(null); renderer.clear(); return; }
  // camera feed for the phone (only the visible one, every other frame)
  if(state.phoneUp&&phoneScreen){
    const i=state.phoneCam, on=state.camsPlaced[i];
    phoneScreen.material.uniforms.uOn.value=on?1:0;
    phoneScreen.material.uniforms.uTime.value=performance.now()*.001;
    phoneScreen.material.uniforms.uGlitch.value=state.fear;
    if(on&&(feedTick++%2===0)){
      const d=CAMS[i], c=camObjs[i];
      c.position.set(d.x,d.y,d.z); c.rotation.set(0,0,0);
      c.rotateY(d.ry+(d.pan||0)); c.rotateX(-0.22);
      // the feed shows the level the camera is on
      const prev=state.lv;
      for(const k in levelGroups) levelGroups[k].visible=(+k===d.lv);
      for(const k in propGroups) propGroups[k].visible=(+k===d.lv);
      const wv=woman?woman.visible:false;
      if(woman) woman.visible=ent.active&&ent.state!=='SLEEP'&&ent.lv===d.lv;
      if(phoneMesh) phoneMesh.visible=false;
      renderer.setRenderTarget(camRT[i]); renderer.clear(); renderer.render(scene,c);
      renderer.setRenderTarget(null);
      for(const k in levelGroups) levelGroups[k].visible=(+k===prev);
      for(const k in propGroups) propGroups[k].visible=(+k===prev);
      if(woman) woman.visible=wv;
      if(phoneMesh) phoneMesh.visible=state.phoneT<0.985;
      phoneScreen.material.uniforms.tFeed.value=camRT[i].texture;
    }
  }
  if(Q().post){
    renderer.setRenderTarget(rtScene); renderer.clear(); renderer.render(scene,camera);
    renderer.setRenderTarget(null);
    postMat.uniforms.tDiffuse.value=rtScene.texture;
    postMat.uniforms.uTime.value=performance.now()*.001;
    postMat.uniforms.uFear.value=state.fear;
    postMat.uniforms.uHurt.value=Math.max(state.hurt,ent.screamT>0?.5:0);
    renderer.render(postScene,postCam);
  } else {
    renderer.setRenderTarget(null); renderer.render(scene,camera);
  }
}

   MENU TRANSITIONS
   ========================================================== */
const fxCv=document.getElementById('fx'), fxCtx=fxCv.getContext('2d');
let fxRun=null;
function fxSize(){
  const d=Math.min(window.devicePixelRatio||1,2);
  fxCv.width=Math.floor(window.innerWidth*d);
  fxCv.height=Math.floor(window.innerHeight*d);
}
// blood runs down the screen, covers it, then drains off the bottom
function drawBlood(g,W,H,p,phase){
  g.clearRect(0,0,W,H);
  const cols=30, cw=W/cols, rnd=mulberry(4242);
  const ease=x=>x*x*(3-2*x);
  const drain=phase==='out'?ease(p):0;
  const grow=phase==='in'?ease(p):1;
  g.save();
  g.translate(0,drain*H*1.15);
  for(let i=0;i<cols;i++){
    const speed=0.55+rnd()*0.95, wob=rnd()*6.283;
    const head=Math.min(H*1.05,grow*H*speed*1.5);
    const x=i*cw, w=cw+1.2;
    const grd=g.createLinearGradient(0,0,0,head||1);
    grd.addColorStop(0,'#5e0a08'); grd.addColorStop(.55,'#7d0f0b'); grd.addColorStop(1,'#3d0605');
    g.fillStyle=grd; g.fillRect(x,-2,w,head);
    if(head>4){                                    // bulging head of the run
      g.beginPath();
      g.ellipse(x+cw*0.5,head,cw*0.62,cw*(0.42+0.25*Math.sin(wob+p*7)),0,0,6.283);
      g.fill();
    }
    if(grow>0.12&&rnd()<0.5){                      // a rivulet running ahead
      const rh=Math.min(H*1.1,head+cw*(2.2+rnd()*5.5));
      g.fillStyle='#6b0c09';
      g.fillRect(x+cw*(0.25+rnd()*0.45),-2,Math.max(1.4,cw*0.16),rh);
    }
  }
  g.restore();
  if(grow>0.72){                                   // final wash so it fully covers
    const a=Math.min(1,(grow-0.72)/0.28)*(1-drain);
    g.fillStyle='rgba(74,7,6,'+a.toFixed(3)+')'; g.fillRect(0,0,W,H);
  }
}
// four slashes tear the screen open and black it out
function drawSlash(g,W,H,p,phase){
  g.clearRect(0,0,W,H);
  const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
  const k=phase==='in'?ease(p):1-ease(p);
  const D=Math.hypot(W,H), ang=-0.62;
  const nx=Math.cos(ang), ny=Math.sin(ang);
  const rnd=mulberry(99);
  for(let i=0;i<4;i++){
    const off=(i-1.5)*(H*0.30)+H*0.10;
    const wMax=H*(0.44+rnd()*0.26);
    const w=k*wMax*(0.75+0.25*Math.sin(p*9+i));
    if(w<=0.5) continue;
    g.save();
    g.translate(W/2,H/2); g.rotate(ang);
    g.fillStyle='#000';
    g.beginPath();
    g.moveTo(-D,off-w*0.5);
    for(let t=-1;t<=1;t+=0.125){                   // ragged edges
      g.lineTo(t*D,off-w*0.5+Math.sin(t*9+i*2)*w*0.10);
    }
    for(let t=1;t>=-1;t-=0.125){
      g.lineTo(t*D,off+w*0.5+Math.sin(t*7-i*3)*w*0.10);
    }
    g.closePath(); g.fill();
    g.strokeStyle='rgba(190,40,26,'+(0.5*k).toFixed(3)+')';
    g.lineWidth=2.2; g.stroke();
    g.restore();
  }
  if(k>0.80){
    const a=Math.min(1,(k-0.80)/0.20);
    g.fillStyle='rgba(0,0,0,'+a.toFixed(3)+')'; g.fillRect(0,0,W,H);
  }
}
// run a cover -> swap -> reveal transition
function fxTransition(kind,onCover,done){
  if(fxRun) return;
  audioInit();
  fxSize(); fxCv.classList.add('on');
  const draw=kind==='blood'?drawBlood:drawSlash;
  const W=fxCv.width,H=fxCv.height;
  const COVER=kind==='blood'?820:520, HOLD=kind==='blood'?140:90, OUT=kind==='blood'?680:420;
  if(kind==='blood') sN(.9,300,1.1,.20,'lowpass'); else sN(.35,2600,1.6,.30,'highpass');
  const t0=performance.now();
  let swapped=false;
  fxRun=()=>{
    const el=performance.now()-t0;
    if(el<COVER){ draw(fxCtx,W,H,el/COVER,'in'); }
    else if(el<COVER+HOLD){
      draw(fxCtx,W,H,1,'in');
      if(!swapped){ swapped=true; if(onCover) onCover(); }
    } else if(el<COVER+HOLD+OUT){
      draw(fxCtx,W,H,(el-COVER-HOLD)/OUT,'out');
    } else {
      fxCtx.clearRect(0,0,W,H); fxCv.classList.remove('on'); fxRun=null;
      if(done) done(); return;
    }
    requestAnimationFrame(fxRun);
  };
  requestAnimationFrame(fxRun);
}
window.addEventListener('resize',()=>{ if(fxRun) fxSize(); });

/* ==========================================================
   MENUS
   ========================================================== */
const screens=['mMain','mChapters','mSettings','mPause'];
const hideAllScreens=()=>screens.forEach(s=>document.getElementById(s).classList.add('hide'));
function show(id){ hideAllScreens(); document.getElementById(id).classList.remove('hide'); }
function toMenu(){
  state.mode='menu'; show('mMain');
  document.getElementById('hud').classList.add('hide');
  document.getElementById('death').classList.remove('on');
  tabsEl.classList.remove('on'); state.phoneUp=false;
  if(document.pointerLockElement) document.exitPointerLock();
  document.getElementById('btnResume').disabled=!save.beat;
}
function pause(){
  if(state.mode!=='play') return;
  state.mode='pause'; show('mPause');
  document.getElementById('hud').classList.add('hide');
  if(document.pointerLockElement) document.exitPointerLock();
  writeSave();
}
function unpause(){ hideAllScreens(); state.mode='play'; document.getElementById('hud').classList.remove('hide'); }
const on=(id,fn)=>document.getElementById(id).addEventListener('click',()=>{audioInit();sfx.ui();fn();});
let settingsFrom='mMain';
on('btnResume',()=>startChapter1(save.beat||'EXPLORE',true));
on('btnChapters',()=>fxTransition('slash',()=>show('mChapters')));
on('btnSettings',()=>fxTransition('blood',()=>{settingsFrom='mMain';show('mSettings');}));
on('chBack',()=>fxTransition('slash',()=>show('mMain')));
on('ch1',()=>startChapter1('STREET'));
on('setBack',()=>fxTransition('blood',()=>show(settingsFrom)));
on('pResume',()=>unpause());
on('pSettings',()=>fxTransition('blood',()=>{settingsFrom='mPause';show('mSettings');}));
on('pQuit',()=>{writeSave();toMenu();});
on('btnContinue',()=>respawn());
on('btnQuitDeath',()=>toMenu());
const sVol=document.getElementById('sVol'); sVol.value=settings.vol;
sVol.addEventListener('input',()=>{settings.vol=+sVol.value;setVol();saveSettings();});
const sMusic=document.getElementById('sMusic'); sMusic.value=settings.music;
sMusic.addEventListener('input',()=>{settings.music=+sMusic.value;setVol();saveSettings();});
const sSens=document.getElementById('sSens'); sSens.value=settings.sens;
sSens.addEventListener('input',()=>{settings.sens=+sSens.value;saveSettings();});
function segInit(id,val,fn){
  const box=document.getElementById(id);
  box.querySelectorAll('button').forEach(b=>{
    const v=b.dataset.q!==undefined?b.dataset.q:b.dataset.v;
    b.classList.toggle('on',String(val)===String(v));
    b.addEventListener('click',()=>{
      audioInit(); sfx.ui();
      box.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); fn(v); saveSettings();
    });
  });
}
segInit('sQual',settings.qual,v=>{settings.qual=v;resize();});
segInit('sInvY',settings.invY,v=>settings.invY=+v);
segInit('sScare',settings.scares,v=>settings.scares=+v);
segInit('sBlood',settings.blood,v=>settings.blood=+v);
paintPlatNote();
if(!IS_TOUCH) ['bUse','bCrouch','bPhone'].forEach(id=>document.getElementById(id).style.display='none');

/* ==========================================================
   BOOT
   ========================================================== */
let last=performance.now();
function loop(t){
  const dt=Math.min(.05,(t-last)/1000||0); last=t;
  update(dt); render(dt);
  requestAnimationFrame(loop);
}
(async function boot(){
  initThree();
  const barIn=document.getElementById('barIn');
  await buildTextures(p=>barIn.style.width=(p*100)+'%');
  buildMaterials();
  buildWorld();
  showLevel(GROUND);
  document.getElementById('load').classList.add('hide');
  document.getElementById('btnResume').disabled=!save.beat;
  show('mMain');
  window.__hg={state,ent,beat,jumpToBeat,startChapter1,doInteract,setObjective,
               blocked,slide,solid,LEVELS,CAMS,camMeshes,doors,cars,
               get music(){return musicEl;}, get scares(){return scareBufs;},
               get mv(){return mv;}, get keys(){return keys;},
               scene:()=>scene, renderer:()=>renderer, showLevel, togglePhone};
  requestAnimationFrame(loop);
})();
})();
</script>
