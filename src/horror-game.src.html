<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Presence</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;touch-action:none}
  html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;
    background:#000;font-family:'Courier New',monospace;color:#cdc5b4}
  #view{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}

  .screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:28px;background:radial-gradient(ellipse at 50% 40%,#141210 0%,#050404 70%,#000 100%)}
  .hide{display:none!important}
  h1{font-size:clamp(34px,12vw,72px);letter-spacing:14px;color:#cdbd8e;margin-bottom:6px;
    text-shadow:0 0 28px rgba(150,30,20,.5),0 0 70px rgba(120,20,14,.28);
    animation:breathe 5.5s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.86;letter-spacing:14px}50%{opacity:1;letter-spacing:16px}}
  .tag{font-size:clamp(10px,3vw,14px);letter-spacing:6px;color:#6b6152;margin-bottom:38px}

  .mbtn{position:relative;display:block;width:min(340px,82vw);margin:10px auto;padding:16px 12px;
    background:rgba(16,14,12,.62);border:1px solid #453b30;color:#cfc4a8;font-family:inherit;
    font-size:clamp(14px,4vw,18px);letter-spacing:5px;cursor:pointer;overflow:hidden;
    transition:color .2s,border-color .25s,letter-spacing .25s,transform .12s}
  .mbtn::before{content:'';position:absolute;inset:0;background:
    linear-gradient(90deg,rgba(150,26,18,0),rgba(150,26,18,.55),rgba(150,26,18,0));
    transform:translateX(-101%);transition:transform .38s ease}
  .mbtn::after{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:#8e1a12;
    transform:scaleY(0);transition:transform .28s ease}
  .mbtn>*{position:relative;z-index:1}
  .mbtn:hover,.mbtn:focus-visible{color:#fff;border-color:#8e5a3c;letter-spacing:7px}
  .mbtn:hover::before{transform:translateX(101%)}
  .mbtn:hover::after,.mbtn:active::after{transform:scaleY(1)}
  .mbtn:active{transform:scale(.975);color:#fff;border-color:#b6432c}
  .mbtn[disabled]{opacity:.30;pointer-events:none}
  .mbtn.locked .ct{color:#6b6152}
  .mbtn .cn{display:block;font-size:10px;letter-spacing:6px;color:#7d7060;margin-bottom:5px}
  .mbtn .ct{display:block;font-size:clamp(15px,4.4vw,20px);letter-spacing:7px}

  /* screens deal their contents in rather than snapping on */
  .screen:not(.hide) h1{animation:breathe 5.5s ease-in-out infinite,riseIn .5s ease both}
  .screen:not(.hide) .tag{animation:riseIn .5s .06s ease both}
  .screen:not(.hide) .mbtn{animation:riseIn .42s ease both}
  .screen:not(.hide) .mbtn:nth-of-type(1){animation-delay:.10s}
  .screen:not(.hide) .mbtn:nth-of-type(2){animation-delay:.17s}
  .screen:not(.hide) .mbtn:nth-of-type(3){animation-delay:.24s}
  .screen:not(.hide) .mbtn:nth-of-type(4){animation-delay:.31s}
  .screen:not(.hide) .row{animation:riseIn .42s ease both}
  .screen:not(.hide) .row:nth-of-type(1){animation-delay:.08s}
  .screen:not(.hide) .row:nth-of-type(2){animation-delay:.13s}
  .screen:not(.hide) .row:nth-of-type(3){animation-delay:.18s}
  .screen:not(.hide) .row:nth-of-type(4){animation-delay:.23s}
  .screen:not(.hide) .row:nth-of-type(5){animation-delay:.28s}
  @keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  #blackout{position:absolute;inset:0;z-index:16;background:#000;opacity:0;
    pointer-events:none;transition:opacity .45s}
  #fx{position:absolute;inset:0;width:100%;height:100%;z-index:40;pointer-events:none;display:none}
  #fx.on{display:block;pointer-events:auto}
  .row{display:flex;align-items:center;justify-content:space-between;width:min(360px,86vw);margin:11px auto;
    font-size:clamp(12px,3.4vw,15px);letter-spacing:2px;color:#a99d86}
  .seg{display:flex;gap:6px}
  .seg button{background:rgba(20,17,14,.6);border:1px solid #4a4034;color:#a99d86;font-family:inherit;
    font-size:clamp(11px,3vw,13px);padding:8px 12px;letter-spacing:2px;cursor:pointer}
  .seg button.on{background:#7a2a1c;border-color:#c06a4a;color:#fff}
  input[type=range]{width:150px;accent-color:#a04030}
  .note{font-size:clamp(10px,2.8vw,12px);color:#5f564a;letter-spacing:1px;line-height:1.9;margin-top:26px;max-width:400px}

  #hud{position:absolute;inset:0;z-index:10;pointer-events:none}
  #obj{position:absolute;top:calc(14px + env(safe-area-inset-top));left:0;right:0;text-align:center;
    font-size:clamp(11px,3.2vw,14px);letter-spacing:3px;color:#b7a98c;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .6s;padding:0 16px}
  #obj.show{opacity:1}
  #roomLbl{position:absolute;top:calc(52px + env(safe-area-inset-top));left:0;right:0;text-align:center;
    font-size:clamp(9px,2.6vw,11px);letter-spacing:7px;color:#6d6353;opacity:0;transition:opacity .8s}
  #prompt{position:absolute;bottom:34%;left:0;right:0;text-align:center;font-size:clamp(12px,3.4vw,15px);
    letter-spacing:2px;color:#e2d6b6;text-shadow:0 2px 10px #000;opacity:0;transition:opacity .2s}
  #prompt.show{opacity:1}
  /* purely visual -- it must never swallow a touch, or look-drag dies on it */
  #mount{position:absolute;bottom:26%;left:0;right:0;text-align:center;opacity:0;transition:opacity .2s}
  #mount.on{opacity:1}
  #mount .mlbl{font-size:11px;letter-spacing:4px;color:#c3b696;text-shadow:0 2px 8px #000;margin-bottom:8px}
  #mount .mbar{width:min(190px,50vw);height:3px;margin:0 auto;background:rgba(255,255,255,.14)}
  #mfill{height:100%;width:0;background:#c08a4a}
  #stick{position:absolute;width:132px;height:132px;bottom:38px;left:30px;border-radius:50%;pointer-events:none;
    background:rgba(60,52,42,.16);border:1px solid rgba(150,130,100,.24);display:none}
  #knob{position:absolute;width:56px;height:56px;top:38px;left:38px;border-radius:50%;
    background:radial-gradient(circle at 36% 30%,#9b8964,#3a3125);border:1px solid rgba(190,165,120,.4)}
  .abtn{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(28,24,19,.55);
    border:1px solid rgba(150,130,100,.32);color:#c3b696;font-size:10px;letter-spacing:1px;
    display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2}
  .abtn:active{background:rgba(120,40,28,.6);color:#fff}
  #bUse{width:84px;height:84px;bottom:100px;right:26px;font-size:12px}
  #bCrouch{width:66px;height:66px;bottom:36px;right:120px}
  #bPhone{width:66px;height:66px;bottom:36px;right:34px}

  #camTabs{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    display:flex;gap:8px;z-index:12;opacity:0;pointer-events:none;transition:opacity .3s}
  #camTabs.on{opacity:1;pointer-events:auto}
  #camTabs button{background:rgba(10,14,10,.85);border:1px solid #2a3a2a;color:#7a8a7a;font-family:inherit;
    font-size:10px;padding:10px 14px;letter-spacing:2px;cursor:pointer}
  #camTabs button.sel{background:#1f3a1f;border-color:#4e8a4e;color:#adf0ad}
  #camTabs button[disabled]{opacity:.3}

  #cfade{position:absolute;inset:0;z-index:15;background:#000;opacity:0;pointer-events:none}
  #lids{position:absolute;inset:0;z-index:15;pointer-events:none}
  #lids .ld{position:absolute;left:0;right:0;height:0;background:#000;
    box-shadow:0 0 26px 14px #000}
  #lids .ld.t{top:0} #lids .ld.b{bottom:0}
  #cine{position:absolute;inset:0;z-index:16;pointer-events:none;opacity:0;transition:opacity .6s}
  #cine.on{opacity:1;pointer-events:auto}
  .bar{position:absolute;left:0;right:0;height:11%;background:#000;z-index:2;pointer-events:none}
  .bar.t{top:0} .bar.b{bottom:0}
  #sub{position:absolute;bottom:15%;left:0;right:0;text-align:center;padding:0 24px;z-index:3;
    font-size:clamp(13px,3.8vw,19px);letter-spacing:1px;color:#ded2b4;text-shadow:0 3px 12px #000;line-height:1.6}
  #sub.card{bottom:47%;font-size:clamp(15px,5.2vw,27px);letter-spacing:6px;color:#cfc3a2;
    text-shadow:0 0 24px rgba(0,0,0,.9)}
  #skip{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));right:18px;z-index:4;font-size:10px;
    letter-spacing:3px;color:#6a6153;border:1px solid #3a352c;padding:9px 15px;pointer-events:auto;cursor:pointer}

  #death{position:absolute;inset:0;z-index:18;pointer-events:none;opacity:0;transition:opacity .35s;
    display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(24,0,0,.88)}
  #death.on{opacity:1;pointer-events:auto}
  #death h2{font-size:clamp(26px,8vw,48px);letter-spacing:8px;color:#8e1616;text-shadow:0 0 30px rgba(200,0,0,.7)}
  #death p{font-size:12px;letter-spacing:3px;color:#6a5a52;margin:14px 0 30px}

  #slot{position:absolute;inset:0;z-index:14;pointer-events:none;opacity:0;transition:opacity .35s}
  #slot .sb{position:absolute;left:0;right:0;background:#000;height:0;transition:height .5s}
  #slot .sb.t{top:0;box-shadow:0 14px 26px 6px rgba(0,0,0,.95)}
  #slot .sb.b{bottom:0;box-shadow:0 -14px 26px 6px rgba(0,0,0,.95)}
  #crack{position:absolute;inset:0;width:100%;height:100%;z-index:15;pointer-events:none;opacity:0;
    transition:opacity .12s}
  #noteView{position:absolute;inset:0;z-index:17;display:flex;align-items:center;justify-content:center;
    flex-direction:column;background:rgba(4,3,2,.86);opacity:0;pointer-events:none;transition:opacity .25s}
  #noteView.on{opacity:1;pointer-events:auto}
  #notePaper{width:min(340px,82vw);padding:26px 24px;background:#b9b09a;color:#241f16;
    box-shadow:0 20px 50px rgba(0,0,0,.8);transform:rotate(-1.4deg);
    background-image:radial-gradient(ellipse at 20% 30%,rgba(90,74,44,.22),transparent 60%),
                     radial-gradient(ellipse at 80% 70%,rgba(70,58,34,.24),transparent 55%)}
  #noteText{font-family:'Courier New',monospace;font-size:clamp(13px,3.7vw,16px);line-height:1.75;
    letter-spacing:.5px;white-space:pre-wrap}
  #noteText.scrawl{font-size:clamp(19px,5.6vw,26px);color:#5c1010;letter-spacing:2px;
    text-align:center;line-height:1.5;transform:rotate(-2deg)}
  #noteHint{margin-top:18px;font-size:10px;letter-spacing:4px;color:#6a6153}
  #load{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#050404}
  #load .t{font-size:12px;letter-spacing:6px;color:#6b6152;margin-bottom:18px}
  #bar{width:min(260px,64vw);height:2px;background:#221e19}
  #barIn{height:100%;width:0;background:#8a5a3a;transition:width .25s}
</style>
</head>
<body>

<canvas id="view"></canvas>

<div id="hud" class="hide">
  <div id="obj"></div>
  <div id="roomLbl"></div>
  <div id="prompt"></div>
  <div id="mount"><div class="mlbl">MOUNTING CAMERA</div><div class="mbar"><div id="mfill"></div></div></div>
  <div id="stick"><div id="knob"></div></div>
  <div class="abtn" id="bUse">USE</div>
  <div class="abtn" id="bCrouch">CROUCH</div>
  <div class="abtn" id="bPhone">PHONE</div>
</div>

<div id="camTabs">
  <button data-c="0">LIVING</button><button data-c="1">KITCHEN</button><button data-c="2">BATH</button>
</div>

<div id="cfade"></div>
<div id="lids"><div class="ld t"></div><div class="ld b"></div></div>
<div id="cine">
  <div class="bar t"></div><div class="bar b"></div>
  <div id="sub"></div><div id="skip">SKIP</div>
</div>

<div id="slot"><div class="sb t"></div><div class="sb b"></div></div>
<canvas id="crack"></canvas>
<div id="blackout"></div>
<canvas id="fx"></canvas>
<div id="noteView">
  <div id="notePaper"><div id="noteText"></div></div>
  <div id="noteHint">TAP TO PUT IT BACK</div>
</div>

<div id="death">
  <h2>CAUGHT</h2><p>SHE FOUND YOU</p>
  <button class="mbtn" id="btnContinue">CONTINUE</button>
  <button class="mbtn" id="btnQuitDeath">MAIN MENU</button>
</div>

<div class="screen hide" id="mMain">
  <h1 id="gameTitle">PRESENCE</h1>
  <div class="tag">150 YEARS &nbsp;·&nbsp; 2:03 AM</div>
  <button class="mbtn" id="btnResume">CONTINUE</button>
  <button class="mbtn" id="btnChapters">CHAPTERS</button>
  <button class="mbtn" id="btnSettings">SETTINGS</button>
  <div class="note" id="platNote"></div>
</div>

<div class="screen hide" id="mChapters">
  <h1 style="font-size:clamp(22px,7vw,40px)">CHAPTERS</h1><div class="tag">SELECT</div>
  <button class="mbtn" id="ch1"><span class="cn">CHAPTER I</span><span class="ct">RUINATION</span></button>
  <button class="mbtn locked" id="ch2" disabled><span class="cn">CHAPTER II</span><span class="ct">EVADE</span></button>
  <button class="mbtn locked" disabled><span class="cn">CHAPTER III</span><span class="ct">— — —</span></button>
  <button class="mbtn" id="chBack">BACK</button>
</div>

<div class="screen hide" id="mSettings">
  <h1 style="font-size:clamp(22px,7vw,40px)">SETTINGS</h1><div class="tag">&nbsp;</div>
  <div class="row"><span>VOLUME</span><input type="range" id="sVol" min="0" max="100" value="70"></div>
  <div class="row"><span>MUSIC</span><input type="range" id="sMusic" min="0" max="100" value="60"></div>
  <div class="row"><span>LOOK SPEED</span><input type="range" id="sSens" min="20" max="200" value="100"></div>
  <div class="row"><span>INVERT LOOK Y</span>
    <div class="seg" id="sInvY"><button data-v="0">OFF</button><button data-v="1">ON</button></div></div>
  <div class="row"><span>QUALITY</span>
    <div class="seg" id="sQual"><button data-q="low">LOW</button><button data-q="med">MED</button><button data-q="high">HIGH</button></div></div>
  <div class="row"><span>JUMP SCARES</span>
    <div class="seg" id="sScare"><button data-v="1">ON</button><button data-v="0">OFF</button></div></div>
  <div class="row"><span>BLOOD</span>
    <div class="seg" id="sBlood"><button data-v="1">ON</button><button data-v="0">OFF</button></div></div>
  <button class="mbtn" id="setBack" style="margin-top:26px">BACK</button>
</div>

<div class="screen hide" id="mPause">
  <h1 style="font-size:clamp(22px,7vw,40px)">PAUSED</h1><div class="tag">&nbsp;</div>
  <button class="mbtn" id="pResume">RESUME</button>
  <button class="mbtn" id="pSettings">SETTINGS</button>
  <button class="mbtn" id="pQuit">SAVE &amp; QUIT</button>
</div>

<div id="load"><div class="t">BUILDING THE HOUSE</div><div id="bar"><div id="barIn"></div></div></div>

<!--INLINE_THREE-->

<script>
(()=>{
"use strict";
const T=THREE;

/* ==========================================================
   SETTINGS / SAVE
   ========================================================== */
const SKEY='hg3_settings_v1', GKEY='hg3_save_v1';
const settings=Object.assign({vol:70,music:60,sens:100,qual:'med',scares:1,blood:1,invY:0},
  JSON.parse(localStorage.getItem(SKEY)||'{}'));
const saveSettings=()=>localStorage.setItem(SKEY,JSON.stringify(settings));
let save=Object.assign({chapter:0,beat:null,deaths:0,cams:[false,false,false],hasKey:false,doorsLocked:false,ch2:0,ch2seen:0},
  JSON.parse(localStorage.getItem(GKEY)||'{}'));
function writeSave(){
  if(typeof state!=='undefined'&&state.mode!=='menu'){
    save.cams=state.camsPlaced.slice(); save.hasKey=state.hasKey; save.doorsLocked=state.doorsLocked;
  }
  localStorage.setItem(GKEY,JSON.stringify(save));
}
const IS_TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
let PLATFORM=IS_TOUCH?'MOBILE':'PC';
window.addEventListener('gamepadconnected',()=>{PLATFORM='CONSOLE';paintPlatNote();});
function paintPlatNote(){
  document.getElementById('platNote').textContent =
    PLATFORM==='MOBILE'?'MOBILE DETECTED · LEFT PAD MOVES · DRAG RIGHT TO LOOK'
   :PLATFORM==='CONSOLE'?'CONTROLLER DETECTED · STICKS MOVE/LOOK · A USE · B CROUCH'
   :'PC DETECTED · WASD MOVE · MOUSE LOOK · SHIFT RUN · E USE · C CROUCH · TAB PHONE';
}

/* ==========================================================
   AUDIO
   ========================================================== */
let AC=null,master=null,droneG=null,musicEl=null,musicGain=null,sfxGain=null;
const SCARE_SRC=['<!--AUDIO_SCARE_A-->','<!--AUDIO_SCARE_B-->'];
const MUSIC_SRC='<!--AUDIO_MUSIC-->';
const scareBufs=[];                    // decoded jumpscares; empty => synth fallback
function audioInit(){
  if(AC)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain(); master.gain.value=settings.vol/100; master.connect(AC.destination);
  const o1=AC.createOscillator(),o2=AC.createOscillator(),f=AC.createBiquadFilter();
  droneG=AC.createGain(); droneG.gain.value=0;
  o1.type='sawtooth'; o1.frequency.value=36; o2.type='sine'; o2.frequency.value=54.2;
  f.type='lowpass'; f.frequency.value=150;
  o1.connect(f); o2.connect(f); f.connect(droneG); droneG.connect(master); o1.start(); o2.start();

  sfxGain=AC.createGain(); sfxGain.gain.value=1; sfxGain.connect(master);
  musicGain=AC.createGain(); musicGain.gain.value=settings.music/100*0.55; musicGain.connect(master);

  // background music: stream the element rather than decoding megabytes into RAM
  try{
    musicEl=new Audio(); musicEl.src=MUSIC_SRC; musicEl.loop=true; musicEl.preload='auto';
    musicEl.crossOrigin='anonymous';
    const ms=AC.createMediaElementSource(musicEl); ms.connect(musicGain);
    const go=()=>musicEl.play().catch(()=>{});
    go(); document.addEventListener('pointerdown',go,{once:true});
  }catch(e){ musicEl=null; }

  // jumpscares: decode up front so they fire with no latency
  SCARE_SRC.forEach((src,i)=>{
    // promise form only -- the callback form ALSO rejects its returned promise,
    // which surfaces as an unhandled rejection when a codec is missing
    fetch(src).then(r=>r.arrayBuffer())
      .then(a=>AC.decodeAudioData(a))
      .then(buf=>{ scareBufs[i]=buf; })
      .catch(()=>{});          // no AAC -> the synthesised scream still plays
  });
}
function setVol(){
  if(master) master.gain.value=settings.vol/100;
  if(musicGain) musicGain.gain.value=settings.music/100*0.55;
}
function nbuf(d){const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);
  for(let i=0;i<n;i++)c[i]=Math.random()*2-1; return b;}
function sN(d,fq,q,g,ty){ if(!AC)return;
  const s=AC.createBufferSource(); s.buffer=nbuf(d);
  const f=AC.createBiquadFilter(); f.type=ty||'bandpass'; f.frequency.value=fq; f.Q.value=q||1;
  const gn=AC.createGain(); gn.gain.setValueAtTime(g,AC.currentTime);
  gn.gain.exponentialRampToValueAtTime(1e-4,AC.currentTime+d);
  s.connect(f); f.connect(gn); gn.connect(sfxGain||master); s.start(); }
function sT(a,b,d,g,ty){ if(!AC)return;
  const o=AC.createOscillator(),gn=AC.createGain();
  o.type=ty||'sine'; o.frequency.setValueAtTime(a,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,b),AC.currentTime+d);
  gn.gain.setValueAtTime(g,AC.currentTime); gn.gain.exponentialRampToValueAtTime(1e-4,AC.currentTime+d);
  o.connect(gn); gn.connect(sfxGain||master); o.start(); o.stop(AC.currentTime+d+.05); }
const sfx={
  knock:()=>{                                   // knuckle on old wood
    sN(.045,1800,1.2,.42,'highpass');
    sN(.22,190,2.4,.75,'lowpass');
    sT(168,72,.20,.42,'sine');
    sT(92,54,.30,.30,'triangle');
    setTimeout(()=>sN(.10,320,3,.16,'lowpass'),34);
  }, creak:()=>sN(.55,900,7,.14),
  step:(l)=>sN(.09,380+Math.random()*120,4,l||.07),
  faucet:()=>sN(1.6,2600,.8,.10,'highpass'),
  lock:()=>{sN(.1,1400,6,.32); setTimeout(()=>sT(300,120,.12,.3,'square'),90);},
  place:()=>sT(760,1300,.1,.16,'square'),
  pickup:()=>{sT(700,1500,.09,.2,'triangle');setTimeout(()=>sT(1100,1900,.1,.15,'triangle'),80);},
  ui:()=>sT(500,300,.05,.12,'square'),
  type:()=>sN(.018,2400,6,.045,'bandpass'),
  slam:()=>{ sN(.30,140,1.4,.75,'lowpass'); sT(120,42,.34,.45,'square');
             setTimeout(()=>sN(.16,900,3,.18),40); },
  glass:()=>{ sN(.55,3600,.7,.55,'highpass');
              for(let i=0;i<7;i++) setTimeout(()=>sN(.10,1800+Math.random()*3200,5,.20),i*46); },

// The staircase is a walkable ramp on the ground level. Walk far enough up it
// and you hand off to the upper level; step back into it from above and you
// hand back down. Hysteresis on the two trigger lines stops it ping-ponging.
const STAIR={x0:17.10,x1:18.90,zBot:18.55,zTop:15.50,rise:WALL_H,
             upAt:15.70,downAt:15.55,upTo:15.30,downTo:15.85};
// Zero outside the run in BOTH directions. Returning `rise` for everything past
// the top meant the whole kitchen column counted as "top of the stairs".
function stairHeight(lv,x,z){
  if(lv!==GROUND) return 0;
  if(x<STAIR.x0||x>STAIR.x1) return 0;
  if(z>=STAIR.zBot||z<=STAIR.zTop) return 0;
  return STAIR.rise*(STAIR.zBot-z)/(STAIR.zBot-STAIR.zTop);
}
const onStair=(x,z)=>x>=STAIR.x0&&x<=STAIR.x1;
// STREET is all outdoors; at Barry's place only the yard and road are
const isOutdoor=(lv,c,r)=>lv===STREET||(lv===HOME&&r>=9);

const solid=(lv,c,r)=>{
  if(c<0||r<0||c>=COLS||r>=ROWS) return true;
  const ch=LEVELS[lv][r][c];
  if(ch==='D') return !state.basementOpen;
  return ch==='#'||ch==='F'||ch==='P';
};
const tileAt=(lv,c,r)=>(c<0||r<0||c>=COLS||r>=ROWS)?'#':LEVELS[lv][r][c];
const walkable=(lv,c,r)=>{const t=tileAt(lv,c,r);return t!=='#'&&t!=='F'&&t!=='P';};

const ROOMS=[
  [0,1,6,1,6,'BEDROOM'],[0,8,11,1,13,'HALLWAY'],[0,13,20,1,6,'KITCHEN'],
  [0,13,20,8,12,'BACK HALL'],[0,1,11,14,18,'LIVING ROOM'],[0,13,20,14,18,'STAIRWELL'],
  [1,13,20,8,12,'BATHROOM'],[1,1,11,14,18,'ATTIC'],[1,13,20,14,18,'UPSTAIRS HALL'],
  [2,1,20,9,12,'BASEMENT'],
  [4,1,5,1,5,'BATHROOM'],[4,7,20,1,7,'KITCHEN'],[4,1,20,7,7,'HALL']];
function roomOf(lv,x,z){
  const c=x|0,r=z|0;
  for(const m of ROOMS) if(m[0]===lv&&c>=m[1]&&c<=m[2]&&r>=m[3]&&r<=m[4]) return m[5];
  return '';
}
// which material a room's walls use
function wallKindAt(lv,c,r){
  if(isOutdoor(lv,c,r)) return 'siding';
  if(lv===HOME) return (c<=6&&r<=5)?'tile':'kitchen';
  if(lv===BASEMENT) return 'concrete';
  const rm=roomOf(lv,c+.5,r+.5);
  if(rm==='BATHROOM') return 'tile';
  if(rm==='ATTIC') return 'attic';
  if(rm==='KITCHEN') return 'kitchen';
  return 'paper';
}
function floorKindAt(lv,c,r){
  if(isOutdoor(lv,c,r)) return r>=14?'asphalt':'grass';
  if(lv===HOME) return (c<=6&&r<=5)?'tilefloor':'wood';
  if(lv===BASEMENT) return 'concrete';
  const rm=roomOf(lv,c+.5,r+.5);
  if(rm==='BATHROOM') return 'tilefloor';
  return 'wood';
}

/* ==========================================================
   PROCEDURAL TEXTURES
   ========================================================== */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296;};}
function valueNoise(w,h,cell,rnd){
  const gw=Math.ceil(w/cell)+2, gh=Math.ceil(h/cell)+2, g=new Float32Array(gw*gh);
  for(let i=0;i<g.length;i++) g[i]=rnd();
  const out=new Float32Array(w*h);
  const sm=t=>t*t*(3-2*t);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const fx=x/cell, fy=y/cell, ix=fx|0, iy=fy|0;
    const tx=sm(fx-ix), ty=sm(fy-iy);
    const a=g[ix+iy*gw], b=g[ix+1+iy*gw], c=g[ix+(iy+1)*gw], d=g[ix+1+(iy+1)*gw];
    out[x+y*w]=(a*(1-tx)+b*tx)*(1-ty)+(c*(1-tx)+d*tx)*ty;
  }
  return out;
}
function fbm(w,h,cell,oct,seed){
  const out=new Float32Array(w*h); let amp=1,tot=0,c=cell;
  for(let o=0;o<oct;o++){
    const n=valueNoise(w,h,Math.max(2,c),mulberry(seed+o*7919));
    for(let i=0;i<out.length;i++) out[i]+=n[i]*amp;
    tot+=amp; amp*=.5; c*=.5;
  }
  for(let i=0;i<out.length;i++) out[i]/=tot;
  return out;
}
// build a normal map from a height field
function normalTex(height,w,h,strength){
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx=cv.getContext('2d'), img=ctx.createImageData(w,h), d=img.data;
  const at=(x,y)=>height[((x%w)+w)%w + (((y%h)+h)%h)*w];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const dx=(at(x+1,y)-at(x-1,y))*strength;
    const dy=(at(x,y+1)-at(x,y-1))*strength;
    let nx=-dx, ny=-dy, nz=1;
    const l=Math.hypot(nx,ny,nz); nx/=l; ny/=l; nz/=l;
    const i=(x+y*w)*4;
    d[i]=(nx*.5+.5)*255; d[i+1]=(ny*.5+.5)*255; d[i+2]=(nz*.5+.5)*255; d[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const t=new T.CanvasTexture(cv); t.wrapS=t.wrapT=T.RepeatWrapping; return t;
}
function grayTex(field,w,h,lo,hi){
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx=cv.getContext('2d'), img=ctx.createImageData(w,h), d=img.data;
  for(let i=0;i<field.length;i++){
    const v=(lo+(hi-lo)*field[i])*255, j=i*4;
    d[j]=d[j+1]=d[j+2]=v; d[j+3]=255;
  }
  ctx.putImageData(img,0,0);
  const t=new T.CanvasTexture(cv); t.wrapS=t.wrapT=T.RepeatWrapping; return t;
}
function albedoTex(cv){
  const t=new T.CanvasTexture(cv); t.wrapS=t.wrapT=T.RepeatWrapping;
  t.colorSpace=T.SRGBColorSpace; t.anisotropy=4; return t;
}
const C=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};

/* ---- wallpaper: yellowed damask above, navy wainscot below, water stains + tears ---- */
function texWallpaper(seed){
  const S=512, cv=C(S,S), g=cv.getContext('2d');
  const rnd=mulberry(seed);
  const railY=Math.round(S*0.58);
  // upper: aged cream/yellow paper
  const grd=g.createLinearGradient(0,0,0,railY);
  grd.addColorStop(0,'#b9ae86'); grd.addColorStop(1,'#a2966f');
  g.fillStyle=grd; g.fillRect(0,0,S,railY);
  // damask motif
  g.save(); g.globalAlpha=.16;
  for(let y=-20;y<railY+40;y+=64)for(let x=-20;x<S+40;x+=64){
    const ox=((y/64)|0)%2?32:0;
    g.strokeStyle='#6d6042'; g.lineWidth=2.2;
    g.beginPath();
    g.moveTo(x+ox,y+30); g.bezierCurveTo(x+ox+14,y+2,x+ox+46,y+2,x+ox+30,y+30);
    g.bezierCurveTo(x+ox+46,y+58,x+ox+14,y+58,x+ox,y+30); g.stroke();
    g.beginPath(); g.arc(x+ox+15,y+30,5,0,6.283); g.stroke();
  }
  g.restore();
  // vertical seams
  g.globalAlpha=.20; g.fillStyle='#5d5238';
  for(let x=0;x<S;x+=128) g.fillRect(x,0,1.5,railY);
  g.globalAlpha=1;
  // water stains
  for(let i=0;i<7;i++){
    const x=rnd()*S, y=rnd()*railY, r=26+rnd()*70;
    const rg=g.createRadialGradient(x,y,r*.1,x,y,r);
    rg.addColorStop(0,'rgba(72,58,32,.42)'); rg.addColorStop(.7,'rgba(88,72,42,.22)');
    rg.addColorStop(1,'rgba(90,74,44,0)');
    g.fillStyle=rg; g.beginPath(); g.arc(x,y,r,0,6.283); g.fill();
  }
  // torn strips revealing dark lath
  for(let i=0;i<3;i++){
    const x=rnd()*S, y=rnd()*(railY-90), w=16+rnd()*40, h=50+rnd()*90;
    g.fillStyle='#241d15'; g.beginPath();
    g.moveTo(x,y);
    for(let k=0;k<6;k++) g.lineTo(x+w*(k%2?1:.25)+rnd()*10, y+h*k/5);
    for(let k=5;k>=0;k--) g.lineTo(x+rnd()*8, y+h*k/5);
    g.closePath(); g.fill();
    g.strokeStyle='rgba(180,168,132,.5)'; g.lineWidth=1.4; g.stroke();
  }
  // chair rail
  g.fillStyle='#3a2e1e'; g.fillRect(0,railY-9,S,11);
  g.fillStyle='#54432c'; g.fillRect(0,railY-9,S,3);
  // wainscot: navy painted panelling
  g.fillStyle='#1e2a44'; g.fillRect(0,railY+2,S,S-railY);
  const NP=2, pw=S/NP;                       // 2 panels per metre of wall
  for(let i=0;i<NP;i++){
    const x=i*pw+9, y=railY+16, w=pw-18, h=S-railY-34;
    g.fillStyle='#24314f'; g.fillRect(x,y,w,h);
    g.strokeStyle='#151d31'; g.lineWidth=3; g.strokeRect(x,y,w,h);
    g.strokeStyle='#2d3d61'; g.lineWidth=1.4; g.strokeRect(x+4,y+4,w-8,h-8);
  }
  // baseboard
  g.fillStyle='#181f30'; g.fillRect(0,S-16,S,16);
  g.fillStyle='#0f1420'; g.fillRect(0,S-4,S,4);
  // scuffs on the navy
  for(let i=0;i<50;i++){
    const x=rnd()*S, y=railY+10+rnd()*(S-railY-20);
    g.fillStyle='rgba(10,14,22,'+(.10+rnd()*.3)+')';
    g.beginPath(); g.ellipse(x,y,2+rnd()*14,1+rnd()*4,rnd()*3,0,6.283); g.fill();
  }
  // overall grime
  const gr=fbm(S,S,90,4,seed+31);
  const img=g.getImageData(0,0,S,S), d=img.data;
  for(let i=0;i<S*S;i++){
    const v=.72+gr[i]*.52, j=i*4;
    d[j]*=v; d[j+1]*=v; d[j+2]*=v;
  }
  g.putImageData(img,0,0);

  // height field: panel relief + rail + paper grain
  const hf=new Float32Array(S*S);
  const fine=fbm(S,S,7,3,seed+5);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    let v=.5+fine[x+y*S]*.10;
    if(y>railY-10&&y<railY+3) v+=.42;                 // rail proud
    if(y>S-17) v+=.34;                                // baseboard
    if(y>railY+16&&y<S-18){                           // sunken panel centres
      const px=x%(S/2);
      if(px>9&&px<S/2-9) v-=.20;
      if(px>13&&px<S/2-13) v+=.06;
    }
    hf[x+y*S]=v;
  }
  return {map:albedoTex(cv), normalMap:normalTex(hf,S,S,2.6),
          roughnessMap:grayTex(fbm(S,S,60,3,seed+77),S,S,.62,.96)};
}

/* ---- kitchen: painted board wall, no wainscot ---- */
function texKitchen(seed){
  const S=512, cv=C(S,S), g=cv.getContext('2d'), rnd=mulberry(seed);
  g.fillStyle='#7d7a63'; g.fillRect(0,0,S,S);
  for(let y=0;y<S;y+=48){
    g.fillStyle='rgba(0,0,0,.22)'; g.fillRect(0,y,S,2);
    g.fillStyle='rgba(255,250,225,.05)'; g.fillRect(0,y+2,S,3);
    for(let i=0;i<26;i++){
      const x=rnd()*S;
      g.fillStyle='rgba(60,58,44,'+(rnd()*.16)+')';
      g.fillRect(x,y+4,10+rnd()*70,40);
    }
  }
  for(let i=0;i<16;i++){
    const x=rnd()*S,y=rnd()*S,r=18+rnd()*50;
    const rg=g.createRadialGradient(x,y,1,x,y,r);
    rg.addColorStop(0,'rgba(48,42,26,.34)'); rg.addColorStop(1,'rgba(48,42,26,0)');
    g.fillStyle=rg; g.beginPath(); g.arc(x,y,r,0,6.283); g.fill();
  }
  const hf=new Float32Array(S*S), fine=fbm(S,S,6,3,seed+3);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    let v=.5+fine[x+y*S]*.12;
    const m=y%48; if(m<2) v-=.34;
    hf[x+y*S]=v;
  }
  return {map:albedoTex(cv), normalMap:normalTex(hf,S,S,2.4),
          roughnessMap:grayTex(fbm(S,S,50,3,seed+9),S,S,.55,.9)};
}

/* ---- bathroom tile ---- */
function texTile(seed){
  const S=512, cv=C(S,S), g=cv.getContext('2d'), rnd=mulberry(seed);
  g.fillStyle='#3d4038'; g.fillRect(0,0,S,S);                // grout
  const tw=S/8, th=S/12;
  for(let ry=0;ry<12;ry++)for(let rx=0;rx<8;rx++){
    const off=(ry%2)?tw*.5:0;
    const x=rx*tw+off+2, y=ry*th+2, w=tw-4, h=th-4;
    const shade=196+rnd()*34;
    g.fillStyle='rgb('+(shade*.92|0)+','+(shade*.94|0)+','+(shade*.86|0)+')';
    g.fillRect(x,y,w,h);
    g.fillStyle='rgba(255,255,255,.16)'; g.fillRect(x,y,w,2);
    if(rnd()<.20){ g.fillStyle='rgba(70,64,44,'+(rnd()*.3)+')';
      g.fillRect(x,y+h*rnd()*.6,w,h*.4); }
  }
  // mildew creeping along grout
  for(let i=0;i<160;i++){
    const x=rnd()*S,y=Math.round(rnd()*12)*th;
    g.fillStyle='rgba(38,44,30,'+(.1+rnd()*.4)+')';
    g.beginPath(); g.ellipse(x,y,3+rnd()*16,2+rnd()*4,0,0,6.283); g.fill();
  }
  const hf=new Float32Array(S*S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const ry=(y/th)|0, off=(ry%2)?tw*.5:0;
    const lx=((x-off)%tw+tw)%tw, ly=y%th;
    const on=(lx>2&&lx<tw-2&&ly>2&&ly<th-2);
    hf[x+y*S]=on?.72:.30;
  }
  return {map:albedoTex(cv), normalMap:normalTex(hf,S,S,3.4),
          roughnessMap:grayTex(fbm(S,S,40,3,seed+2),S,S,.22,.6)};
}

/* ---- wood floor planks ---- */
function texWood(seed){
  const S=512, cv=C(S,S), g=cv.getContext('2d'), rnd=mulberry(seed);
  const ph=S/8;
  g.fillStyle='#1b120a'; g.fillRect(0,0,S,S);
  for(let i=0;i<8;i++){
    const y=i*ph, tone=rnd();
    const base=[86+tone*44, 56+tone*30, 28+tone*18];
    g.fillStyle='rgb('+(base[0]|0)+','+(base[1]|0)+','+(base[2]|0)+')';
    g.fillRect(0,y+1.5,S,ph-3);
    // grain
    for(let k=0;k<44;k++){
      const gy=y+3+rnd()*(ph-6);
      g.strokeStyle='rgba('+((base[0]*.62)|0)+','+((base[1]*.6)|0)+','+((base[2]*.55)|0)+','+(.12+rnd()*.4)+')';
      g.lineWidth=.6+rnd()*1.5;
      g.beginPath(); g.moveTo(0,gy);
      for(let x=0;x<=S;x+=32) g.lineTo(x,gy+Math.sin((x+i*90)*.02)*2.2+(rnd()-.5)*1.6);
      g.stroke();
    }
    // knots
    if(rnd()<.6){
      const kx=rnd()*S, ky=y+ph*.5;
      for(let k=6;k>0;k--){
        g.strokeStyle='rgba(38,22,10,'+(.10+k*.05)+')'; g.lineWidth=1.3;
        g.beginPath(); g.ellipse(kx,ky,k*2.6,k*1.5,.3,0,6.283); g.stroke();
      }
    }
    // butt joints
    const jx=rnd()*S;
    g.fillStyle='rgba(12,8,4,.85)'; g.fillRect(jx,y+1.5,2,ph-3);
    // scuffs
    for(let k=0;k<16;k++){
      g.fillStyle='rgba(20,12,6,'+(rnd()*.22)+')';
      g.beginPath(); g.ellipse(rnd()*S,y+rnd()*ph,4+rnd()*26,1+rnd()*3,rnd(),0,6.283); g.fill();
    }
  }
  const dirt=fbm(S,S,110,4,seed+13);
  const img=g.getImageData(0,0,S,S), d=img.data;
  for(let i=0;i<S*S;i++){ const v=.66+dirt[i]*.6, j=i*4; d[j]*=v; d[j+1]*=v; d[j+2]*=v; }
  g.putImageData(img,0,0);
  const hf=new Float32Array(S*S), fine=fbm(S,S,5,3,seed+21);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const m=y%ph; let v=.55+fine[x+y*S]*.14;
    if(m<2||m>ph-2) v-=.40;
    hf[x+y*S]=v;
  }
  return {map:albedoTex(cv), normalMap:normalTex(hf,S,S,2.2),
          roughnessMap:grayTex(fbm(S,S,55,3,seed+8),S,S,.45,.88)};
}

function texCeiling(seed){
  const S=256, cv=C(S,S), g=cv.getContext('2d'), rnd=mulberry(seed);
  g.fillStyle='#8d8873'; g.fillRect(0,0,S,S);
  for(let i=0;i<24;i++){
    const x=rnd()*S,y=rnd()*S,r=14+rnd()*46;
    const rg=g.createRadialGradient(x,y,1,x,y,r);
    rg.addColorStop(0,'rgba(74,62,38,.4)'); rg.addColorStop(1,'rgba(74,62,38,0)');
    g.fillStyle=rg; g.beginPath(); g.arc(x,y,r,0,6.283); g.fill();
  }
  for(let i=0;i<10;i++){                      // cracks
    g.strokeStyle='rgba(50,44,32,'+(.2+rnd()*.4)+')'; g.lineWidth=.8+rnd();
    g.beginPath(); let x=rnd()*S,y=rnd()*S; g.moveTo(x,y);
    for(let k=0;k<7;k++){ x+=(rnd()-.5)*46; y+=(rnd()-.5)*46; g.lineTo(x,y); }
    g.stroke();
  }
  const hf=fbm(S,S,9,4,seed+4);
  return {map:albedoTex(cv), normalMap:normalTex(hf,S,S,1.5),

}

function texConcrete(seed){

  const n=fbm(S,S,60,5,seed), n2=fbm(S,S,9,4,seed+2);

  for(let i=0;i<S*S;i++){
    const v=64+n[i]*46+n2[i]*22, j=i*4;
    d[j]=v*1.02; d[j+1]=v; d[j+2]=v*.92; d[j+3]=255;
  }
  g.putImageData(img,0,0);
  for(let i=0;i<16;i++){                       // cracks + stains
    g.strokeStyle='rgba(24,22,20,'+(.3+rnd()*.5)+')'; g.lineWidth=.8+rnd()*1.8;
    g.beginPath(); let x=rnd()*S,y=rnd()*S; g.moveTo(x,y);
    for(let k=0;k<9;k++){ x+=(rnd()-.5)*70; y+=(rnd()-.5)*70; g.lineTo(x,y); }

function texSiding(seed){

function texGrass(seed){

    g.lineWidth=.8; g.beginPath(); g.moveTo(x,y); g.lineTo(x+(rnd()-.5)*2,y-l); g.stroke();

function texAsphalt(seed){

function texAttic(seed){
  const S=512, cv=C(S,S), g=cv.getContext('2d'), rnd=mulberry(seed);
  g.fillStyle='#2a2018'; g.fillRect(0,0,S,S);
  for(let i=0;i<9;i++){                                 // bare studs + lath
    const x=i*(S/9);
    g.fillStyle='#3d2f21'; g.fillRect(x,0,S/9-6,S);
    for(let y=0;y<S;y+=22){
      g.fillStyle='rgba(20,14,9,.5)'; g.fillRect(x,y,S/9-6,3);
    }
    for(let k=0;k<10;k++){
      g.fillStyle='rgba(12,8,5,'+(rnd()*.4)+')';
      g.fillRect(x,rnd()*S,S/9-6,4+rnd()*24);
    }
  }
  const hf=new Float32Array(S*S), fine=fbm(S,S,6,3,seed+2);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){

    if(m>S/9-6) v-=.34;

  return {map:albedoTex(cv), normalMap:normalTex(hf,S,S,2.6),
          roughnessMap:grayTex(fbm(S,S,40,3,seed+3),S,S,.7,1.0)};
}

/* ---- her skin: bloodless grey-white, filthy, with veins showing through ---- */
function texHair(seed){
  const W=64,H=256, cv=C(W,H), g=cv.getContext('2d'), rnd=mulberry(seed);
  g.clearRect(0,0,W,H);
  for(let i=0;i<7;i++){
    const x0=6+rnd()*(W-12), amp=3+rnd()*7, len=H*(0.55+rnd()*0.45);
    g.lineWidth=1.4+rnd()*2.6; g.lineCap='round';
    for(let y=0;y<len;y+=3){
      const a=1-Math.pow(y/len,1.7);
      const sh=96+rnd()*46;
      g.strokeStyle='rgba('+(sh|0)+','+((sh*0.96)|0)+','+((sh*0.88)|0)+','+(a*0.95).toFixed(3)+')';
      const x=x0+Math.sin(y*0.035+i)*amp;
      g.beginPath(); g.moveTo(x,y); g.lineTo(x0+Math.sin((y+3)*0.035+i)*amp,y+3.4); g.stroke();
    }
  }
  const t=new T.CanvasTexture(cv); t.colorSpace=T.SRGBColorSpace; return t;
}
function texSkin(seed){
  const S=512, cv=C(S,S), g=cv.getContext('2d'), rnd=mulberry(seed);
  const n=fbm(S,S,40,4,seed), n2=fbm(S,S,7,3,seed+1);
  const img=g.createImageData(S,S), d=img.data;
  for(let i=0;i<S*S;i++){
    const v=n[i]*.6+n2[i]*.4, j=i*4;
    d[j]=138+v*36; d[j+1]=134+v*34; d[j+2]=128+v*32; d[j+3]=255;
  }
  g.putImageData(img,0,0);
  g.strokeStyle='rgba(96,104,120,.20)'; g.lineWidth=1.1;      // veins
  for(let i=0;i<40;i++){
    let x=rnd()*S,y=rnd()*S; g.beginPath(); g.moveTo(x,y);
    for(let k=0;k<5;k++){ x+=(rnd()-.5)*44; y+=(rnd()-.5)*44; g.lineTo(x,y); }
    g.stroke();
  }
  for(let i=0;i<70;i++){                                       // grime
    const x=rnd()*S,y=rnd()*S,r=6+rnd()*40;
    const rg=g.createRadialGradient(x,y,1,x,y,r);
    rg.addColorStop(0,'rgba(78,70,56,'+(.10+rnd()*.28)+')'); rg.addColorStop(1,'rgba(78,70,56,0)');
    g.fillStyle=rg; g.beginPath(); g.arc(x,y,r,0,6.283); g.fill();
  }
  return {map:albedoTex(cv), normalMap:normalTex(n2,S,S,1.4), roughness:.96};
}
/* ---- her face, painted into the head sphere's equirect UVs.
       three's SphereGeometry puts +Z (the face) at u=0.25 and the crown at v=1. ---- */
function texFace(seed){
  const W=1024,H=512, cv=C(W,H), g=cv.getContext('2d'), rnd=mulberry(seed);
  const n=fbm(W,H,50,4,seed);
  const img=g.createImageData(W,H), d=img.data;
  for(let i=0;i<W*H;i++){ const v=n[i], j=i*4;
    d[j]=146+v*34; d[j+1]=141+v*32; d[j+2]=134+v*30; d[j+3]=255; }
  g.putImageData(img,0,0);
  const FX=W*0.25;                       // face centre
  const sm=(x,y,rx,ry,col,a)=>{ const r=g.createRadialGradient(x,y,1,x,y,Math.max(rx,ry));
    r.addColorStop(0,col.replace('A',a)); r.addColorStop(1,col.replace('A','0'));
    g.save(); g.translate(x,y); g.scale(1,ry/rx); g.fillStyle=r;
    g.beginPath(); g.arc(0,0,Math.max(rx,ry),0,6.283); g.fill(); g.restore(); };
  // sunken eye sockets + hollow cheeks + temple shadows
  sm(FX-64,H*0.445,54,46,'rgba(58,52,48,A)',.68);
  sm(FX+64,H*0.445,54,46,'rgba(58,52,48,A)',.68);
  sm(FX-84,H*0.575,44,66,'rgba(70,62,54,A)',.46);
  sm(FX+84,H*0.575,44,66,'rgba(70,62,54,A)',.46);
  sm(FX,H*0.36,120,40,'rgba(70,64,58,A)',.22);
  // brow ridge highlight and nose
  g.fillStyle='rgba(210,204,194,.14)';
  g.beginPath(); g.ellipse(FX,H*0.385,84,13,0,0,6.283); g.fill();
  sm(FX,H*0.525,16,40,'rgba(66,58,50,A)',.34);
  // wrinkles: brow, crow's feet, cheek lines
  g.strokeStyle='rgba(86,78,70,.42)'; g.lineWidth=1.6;
  for(let i=0;i<7;i++){ const y=H*0.295+i*6;
    g.beginPath(); for(let x=-84;x<=84;x+=14) g.lineTo(FX+x,y+Math.sin(x*.08+i)*2.4); g.stroke(); }
  for(const sx of [-1,1]) for(let i=0;i<5;i++){
    g.beginPath(); g.moveTo(FX+sx*92,H*0.435+i*7);
    g.lineTo(FX+sx*(126+i*4),H*0.405+i*9); g.stroke(); }
  for(const sx of [-1,1]){
    g.beginPath(); g.moveTo(FX+sx*44,H*0.545);
    g.quadraticCurveTo(FX+sx*70,H*0.635,FX+sx*56,H*0.72); g.stroke(); }
  // grime over everything, heavier on the body than the face
  for(let i=0;i<90;i++){
    const x=rnd()*W,y=rnd()*H,r=8+rnd()*52;
    const rg=g.createRadialGradient(x,y,1,x,y,r);
    rg.addColorStop(0,'rgba(76,68,54,'+(.06+rnd()*.22)+')'); rg.addColorStop(1,'rgba(76,68,54,0)');
    g.fillStyle=rg; g.beginPath(); g.arc(x,y,r,0,6.283); g.fill();
  }
  return {map:albedoTex(cv), normalMap:normalTex(fbm(W,H,9,3,seed+2),W,H,1.5), roughness:.95};
}
function rrect(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y); g.closePath();
}
// His phone: a messages thread drawn to a canvas and mapped onto the screen.
function makePhoneScreen(){
  const W=360,H=740, cv=C(W,H), g=cv.getContext('2d');
  const tex=new T.CanvasTexture(cv);
  if(T.SRGBColorSpace) tex.colorSpace=T.SRGBColorSpace;
  const wrap=(txt,max)=>{
    const words=txt.split(' '), out=[]; let line='';
    for(const w of words){
      const t=line?line+' '+w:w;
      if(g.measureText(t).width>max&&line){ out.push(line); line=w; } else line=t;
    }
    if(line) out.push(line); return out;
  };
  const draw=(msgs,typing)=>{
    g.fillStyle='#0a0a0c'; g.fillRect(0,0,W,H);
    g.fillStyle='#e8e8ec'; g.font='500 19px -apple-system,Helvetica,sans-serif';
    g.textAlign='left';  g.fillText('9:12',22,34);
    g.textAlign='right'; g.fillText('4G',W-64,34);
    g.fillStyle='#8a8a92'; g.fillRect(W-52,20,26,15);
    g.fillStyle='#e8e8ec'; g.fillRect(W-50,22,19,11);
    g.fillStyle='#141418'; g.fillRect(0,48,W,86);        // header
    g.fillStyle='#2f6bd8'; g.font='400 30px -apple-system,Helvetica,sans-serif';
    g.textAlign='left'; g.fillText('\u2039',20,102);
    g.fillStyle='#3a3a42'; g.beginPath(); g.arc(W/2,80,21,0,6.283); g.fill();
    g.fillStyle='#9a9aa2'; g.font='600 20px -apple-system,Helvetica,sans-serif';
    g.textAlign='center'; g.fillText('A',W/2,87);
    g.fillStyle='#f0f0f4'; g.font='600 21px -apple-system,Helvetica,sans-serif';
    g.fillText('Alan',W/2,120);
    g.fillStyle='#6d6d76'; g.font='400 14px -apple-system,Helvetica,sans-serif';
    g.fillText('cousin',W/2,138);
    g.fillStyle='#26262c'; g.fillRect(0,152,W,1);
    let y=180;
    g.font='400 23px -apple-system,Helvetica,sans-serif';
    for(const m of msgs){
      const lines=wrap(m.t,232), bw=Math.max(70,
        Math.min(252,Math.max.apply(null,lines.map(l=>g.measureText(l).width))+34));
      const bh=lines.length*31+22;
      const x=m.me?W-bw-18:18;
      g.fillStyle=m.me?'#2f6bd8':'#2a2a30';
      rrect(g,x,y,bw,bh,17); g.fill();
      g.fillStyle='#f4f4f8'; g.textAlign='left';
      lines.forEach((l,i)=>g.fillText(l,x+17,y+34+i*31));
      y+=bh+14;
    }
    if(typing){                                          // the three dots
      g.fillStyle='#2a2a30'; rrect(g,18,y,86,50,17); g.fill();
      const ph=Math.floor(performance.now()/260)%3;
      for(let i=0;i<3;i++){ g.fillStyle=i===ph?'#c8c8d0':'#63636c';
        g.beginPath(); g.arc(38+i*21,y+25,6,0,6.283); g.fill(); }
    }
    g.fillStyle='#141418'; g.fillRect(0,H-74,W,74);      // input bar
    g.strokeStyle='#3a3a42'; g.lineWidth=1.4;
    rrect(g,18,H-58,W-88,42,21); g.stroke();
    g.fillStyle='#5c5c66'; g.font='400 19px -apple-system,Helvetica,sans-serif';
    g.textAlign='left'; g.fillText('iMessage',34,H-30);
    g.fillStyle='#2f6bd8'; g.beginPath(); g.arc(W-38,H-37,19,0,6.283); g.fill();
    g.fillStyle='#fff'; g.font='600 22px -apple-system,Helvetica,sans-serif';
    g.textAlign='center'; g.fillText('\u2191',W-38,H-29);
    tex.needsUpdate=true;
  };
  draw([],false);
  const body=new T.Group();
  const shell=new T.MeshStandardMaterial({color:0x1b1c20,roughness:.34,metalness:.65});
  body.add(box(.079,.158,.010,shell,0,0,0));
  const scr=new T.Mesh(new T.PlaneGeometry(.070,.144),
    new T.MeshBasicMaterial({map:tex}));
  scr.position.z=.0055; body.add(scr);
  return {group:body,draw};
}
// A stretch of night motorway, built once and parked far from the neighbourhood.
const HWX=0, HWZ=-500;
function buildHighway(){

  road.rotation.x=-Math.PI/2; road.position.y=.01; g.add(road);
  const verge=new T.MeshStandardMaterial({color:0x101408,roughness:1});
  for(const sx of [-1,1]){
    const v=new T.Mesh(new T.PlaneGeometry(40,760),verge);
    v.rotation.x=-Math.PI/2; v.position.set(sx*28.5,0,0); g.add(v);
  }
  const paint=new T.MeshStandardMaterial({color:0xb9b7a6,roughness:.9,
    emissive:0x2a2a24,emissiveIntensity:1});

      metalness:.5}),sx*8.5,.52,0));                        // guardrail
  }

  const dashes=[], poles=[];
  for(let i=0;i<76;i++){

      const d=box(.14,.02,3.0,paint,sx*3.85,.03,-380+i*10);
      g.add(d); dashes.push(d);
    }
  }
  const lamp=new T.MeshStandardMaterial({color:0xffe6b4,

  const post=new T.MeshStandardMaterial({color:0x24262a,roughness:.8});
  for(let i=0;i<19;i++){
    const pz=-380+i*40, pg=new T.Group(); pg.position.z=pz;
    for(const sx of [-1,1]){
      pg.add(cyl(.08,.12,7.4,post,sx*9.2,3.7,0,7));
      pg.add(box(1.5,.10,.10,post,sx*8.5,7.32,0));
      pg.add(box(.52,.14,.26,lamp,sx*7.85,7.20,0));

    g.add(pg); poles.push(pg);
  }
  // traffic: our lanes at -2.2 / -5.7, oncoming at +2.2 / +5.7

  const cols=[0x2b3a4e,0x6d6a60,0x3a2b2b,0x243024,0x4a4a52,0x5a2a2a,0x2f3f46,0x38343c];
  // Nothing else runs in his lane except one car well ahead holding station, so
  // the wrap can never drop a car on top of him.
  const lanes=[[-2.2,1,-58,27],[-5.7,1,-150,21],[-5.7,1,60,23.5],[-5.7,1,-300,19],
               [2.2,0,-260,26],[5.7,0,-130,29],[2.2,0,40,25],[5.7,0,190,28],
               [2.2,0,300,24]];

function makeFogPane(w,h){
  const W=128,H=160, cv=C(W,H), g=cv.getContext('2d');
  const paint=()=>{
    g.globalCompositeOperation='source-over';
    g.clearRect(0,0,W,H);
    g.fillStyle='rgba(222,231,236,.90)'; g.fillRect(0,0,W,H);
    for(let i=0;i<70;i++){                            // uneven, like real steam
      const x=Math.random()*W,y=Math.random()*H,r=4+Math.random()*22;
      const rg=g.createRadialGradient(x,y,1,x,y,r);
      rg.addColorStop(0,'rgba(255,255,255,.30)'); rg.addColorStop(1,'rgba(255,255,255,0)');
      g.fillStyle=rg; g.beginPath(); g.arc(x,y,r,0,6.283); g.fill();
    }
    g.globalCompositeOperation='destination-out';     // a few dried runs
    g.lineWidth=2.4; g.lineCap='round';
    for(let i=0;i<5;i++){
      const x=10+Math.random()*(W-20); let y=Math.random()*40;
      g.strokeStyle='rgba(0,0,0,.5)'; g.beginPath(); g.moveTo(x,y);
      for(let k=0;k<7;k++){ y+=12+Math.random()*10; g.lineTo(x+(Math.random()-.5)*5,y); }
      g.stroke();
    }
    g.globalCompositeOperation='source-over';
  };
  paint();
  const tex=new T.CanvasTexture(cv);
  if(T.SRGBColorSpace) tex.colorSpace=T.SRGBColorSpace;
  const m=new T.Mesh(new T.PlaneGeometry(w,h),
    new T.MeshStandardMaterial({map:tex,transparent:true,roughness:.92,
      depthWrite:false,side:T.DoubleSide}));
  let last=0;
  const at=u=>[W*(0.09+0.82*u), H*(0.50-0.13*Math.sin(u*Math.PI))];
  return {mesh:m,
    wipe(p){
      p=Math.min(1,Math.max(0,p));
      if(p<=last) return;
      g.globalCompositeOperation='destination-out';
      g.strokeStyle='rgba(0,0,0,1)'; g.lineWidth=40; g.lineCap='round'; g.lineJoin='round';
      g.beginPath(); let q=at(last); g.moveTo(q[0],q[1]);
      for(let u=last;u<=p;u+=0.02){ q=at(u); g.lineTo(q[0],q[1]); }
      q=at(p); g.lineTo(q[0],q[1]); g.stroke();
      g.globalCompositeOperation='source-over';
      last=p; tex.needsUpdate=true;
    },
    reset(){ paint(); last=0; tex.needsUpdate=true; }};
}

/* ==========================================================
   GEOMETRY BUILDER (with baked corner AO in vertex colors)
   ========================================================== */
class Builder{
  constructor(){ this.p=[]; this.n=[]; this.u=[]; this.c=[]; }
  // a,b,c,d counter-clockwise; uv scale in world units
  quad(a,b,c,d,uvs,ao){
    const A=ao||[1,1,1,1];
    const nx=this._normal(a,b,c);
    const idx=[0,1,2, 0,2,3], V=[a,b,c,d], U=uvs;
    for(const i of idx){
      this.p.push(V[i][0],V[i][1],V[i][2]);
      this.n.push(nx[0],nx[1],nx[2]);
      this.u.push(U[i][0],U[i][1]);
      this.c.push(A[i],A[i],A[i]);
    }
  }
  _normal(a,b,c){
    const ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2];
    const vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];
    let x=uy*vz-uz*vy, y=uz*vx-ux*vz, z=ux*vy-uy*vx;
    const l=Math.hypot(x,y,z)||1; return [x/l,y/l,z/l];
  }
  geo(){
    const g=new T.BufferGeometry();
    g.setAttribute('position',new T.Float32BufferAttribute(this.p,3));
    g.setAttribute('normal',new T.Float32BufferAttribute(this.n,3));
    g.setAttribute('uv',new T.Float32BufferAttribute(this.u,2));
    g.setAttribute('color',new T.Float32BufferAttribute(this.c,3));
    g.computeTangents&&g.computeBoundingSphere();
    return g;
  }
  get empty(){ return this.p.length===0; }
}

// darker where a vertex is tucked into a corner
function aoAt(lv,x,z,y){
  let occ=0;
  for(let dz=-1;dz<=1;dz++)for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dz) continue;
    if(solid(lv,Math.round(x+dx*0.55-0.5),Math.round(z+dz*0.55-0.5))) occ++;
  }
  let a=1-Math.min(.55,occ*0.10);
  a*= 0.72+0.28*Math.min(1,y/ (WALL_H*0.8));     // floors/corners darker low down
  return a;
}

function buildLevel(lv){
  const grp=new T.Group();
  const bs={};                                  // builders keyed by material
  const B=k=>(bs[k]=bs[k]||new Builder());
  const H=WALL_H;

  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(!walkable(lv,c,r)) continue;
    const x0=c,x1=c+1,z0=r,z1=r+1;

    // floor (skipped over the stairwell so the flight below shows through)
    if(lv===UPSTAIRS&&c>=17&&c<=18&&r>=16&&r<=17) continue;
    const fk=floorKindAt(lv,c,r);
    const fa=[aoAt(lv,x0,z0,.1),aoAt(lv,x0,z1,.1),aoAt(lv,x1,z1,.1),aoAt(lv,x1,z0,.1)];
    B(fk).quad([x0,0,z0],[x0,0,z1],[x1,0,z1],[x1,0,z0],
               [[c,r],[c,r+1],[c+1,r+1],[c+1,r]],fa);
    // ceiling (not outdoors, and open over the stairwell)
    const outside=isOutdoor(lv,c,r);
    const stairVoid=(lv===GROUND&&c>=17&&c<=18&&r>=15&&r<=18);
    if(!outside&&!stairVoid){
      B('ceiling').quad([x0,H,z0],[x1,H,z0],[x1,H,z1],[x0,H,z1],
        [[c,r],[c+1,r],[c+1,r+1],[c,r+1]],[.75,.75,.75,.75]);
    }
    // walls: one quad per solid neighbour face
    const wk=wallKindAt(lv,c,r);
    const sides=[
      [ 0,-1, [[x0,0,z0],[x1,0,z0],[x1,H,z0],[x0,H,z0]] ],
      [ 0, 1, [[x1,0,z1],[x0,0,z1],[x0,H,z1],[x1,H,z1]] ],
      [-1, 0, [[x0,0,z1],[x0,0,z0],[x0,H,z0],[x0,H,z1]] ],
      [ 1, 0, [[x1,0,z0],[x1,0,z1],[x1,H,z1],[x1,H,z0]] ]
    ];
    for(const [dx,dz,v] of sides){
      if(!solid(lv,c+dx,r+dz)) continue;
      const nc=c+dx, nr=r+dz, nOut=isOutdoor(lv,nc,nr);
      if(outside){
        // On HOME the house IS the grid, so seen from the street its walls have
        // to be built as well -- but never the invisible bounds round the map,
        // which would ring the road in siding.
        if(lv!==HOME||nOut||nc<1||nc>COLS-2||nr<1||nr>ROWS-2) continue;
        B('sidingP').quad(v[0],v[1],v[2],v[3],[[0,0],[1,0],[1,1],[0,1]],
                          [.92,.92,.74,.74]);
        continue;
      }
      if(nOut) continue;
      // canvas top == v1 (flipY), and the wallpaper art has the paper up top and
      // the wainscot down the bottom, so the floor edge must be v0.
      const uv=[[0,0],[1,0],[1,1],[0,1]];
      const ao=[ aoAt(lv,v[0][0],v[0][2],0), aoAt(lv,v[1][0],v[1][2],0),
                 aoAt(lv,v[2][0],v[2][2],H), aoAt(lv,v[3][0],v[3][2],H) ];
      B(wk).quad(v[0],v[1],v[2],v[3],uv,ao);
    }
  }
  for(const k in bs){
    if(bs[k].empty) continue;
    const m=MAT[k]||MAT.paper;
    grp.add(new T.Mesh(bs[k].geo(),m));
  }
  return grp;
}

// a window standing proud of a wall plane, optionally lit from within
function window3(g,x,y,z,w,h,isLit,col,addLight){
  const frame=WIN_FRAME();
  const grp=new T.Group();
  grp.add(box(w+.14,h+.14,.07,frame,0,0,0));
  grp.add(box(w,h,.05,isLit?WIN_LIT(col):WIN_DARK(),0,0,.03));
  grp.add(box(.06,h,.06,frame,0,0,.04));
  grp.add(box(w,.06,.06,frame,0,0,.04));
  grp.position.set(x,y,z); g.add(grp);

    l.position.set(x,y,z+.5); g.add(l); }

// gable roof: two slabs meeting at a ridge that runs along X
function gableRoof(g,cx,cz,W,D,eaveY,rise,mat){
  const half=D/2, slope=Math.hypot(half,rise), ang=Math.atan2(rise,half);
  for(const s of [1,-1]){
    const slab=new T.Mesh(new T.BoxGeometry(W+.5,.18,slope+.3),mat);
    slab.position.set(cx,eaveY+rise/2,cz+s*(D/4));
    slab.rotation.x=s*ang;
    slab.castShadow=true; g.add(slab);
  }
  g.add(box(W+.5,.14,.22,mat,cx,eaveY+rise+.04,cz));      // ridge cap
}
// a house: body + gable roof + windows. `lit` marks which windows glow.
function makeHouseShell(cx,cz,W,D,H,rise,seed,litList,col){
  const g=new T.Group(), rnd=mulberry(seed);
  g.add(box(W,H,D,MAT.sidingP,cx,H/2,cz));
  gableRoof(g,cx,cz,W,D,H,rise,MAT.roof);
  const zf=cz+D/2+.02;
  const cols=Math.max(2,Math.round(W/3.2));
  let i=0;
  for(let row=0;row<2;row++)for(let k=0;k<cols;k++){
    const x=cx-W/2+W*(k+.5)/cols, y=1.5+row*2.4;
    window3(g,x,y,zf,.78,1.06,litList.indexOf(i)>=0,col,false);
    i++;
  }
  if(rnd()<.7) g.add(box(.7,1.6,.7,MAT.roof,cx+W*.3,H+rise*.6,cz-D*.1)); // chimney
  return g;
}

function updateTraffic(dt){
  if(state.lv!==STREET||!cars.length) return;
  for(const c of cars){
    if(c.wait>0){ c.wait-=dt; if(c.m.visible) c.m.visible=false; continue; }
    c.m.visible=true;
    c.m.position.x+=c.dir*c.speed*dt;
    if((c.dir>0&&c.m.position.x>62)||(c.dir<0&&c.m.position.x<-46)){
      c.m.position.x=c.dir>0?-46:62;
      c.wait=5+Math.random()*13; c.speed=7+Math.random()*6;
      c.m.visible=false;
    }
  }
}

      const a=rnd()*Math.PI*2, tilt=.45+rnd()*.55, len=(1.0+rnd()*1.1)*ts;
      const br=cyl(.028*ts,.055*ts,len,MAT.darkwood,0,len/2,0,5);
      const pv=new T.Group();
      pv.position.set(tx,(2.5+rnd()*.9)*ts,tz);
      pv.rotation.set(Math.cos(a)*tilt,a,Math.sin(a)*tilt);
      pv.add(br); g.add(pv);
      for(let k=0;k<2;k++){                       // one fork per branch
        const l2=len*(.45+rnd()*.3);
        const b2=cyl(.016*ts,.030*ts,l2,MAT.darkwood,0,l2/2,0,5);
        const pv2=new T.Group();
        pv2.position.y=len*(.7+rnd()*.25);
        pv2.rotation.set((rnd()-.5)*1.1,rnd()*6.283,(rnd()-.5)*1.1);
        pv2.add(b2); pv.add(pv2);
      }
    }
  }

  /* --- Barry's car: a plain 1998 saloon, parked out front --- */
  barryCar=makeCar(0x6d6a60,false);
  barryCar.position.set(CAR.x,0,CAR.z); barryCar.rotation.y=0; g.add(barryCar);

  /* --- parked cars on the kerb --- */
  for(const [x,col] of [[-9.5,0x2b3a4e],[22.5,0x3a2b2b],[33,0x243024]]){
    const c=makeCar(col,false); c.position.set(x,0,17.2); g.add(c);
  }
  /* --- traffic: two cars running the road, headlights on --- */
  cars.length=0;
  for(const [z,dir,col] of [[18.4,1,0x6e1f1f],[21.0,-1,0x1b2740]]){
    const m=makeCar(col,true);
    m.rotation.y=dir>0?0:Math.PI;
    m.position.set(dir>0?-46:62,0,z); m.visible=false; g.add(m);
    cars.push({m,dir,speed:7+Math.random()*6,wait:2+Math.random()*8});
  }

  /* --- kerbside clutter: mailboxes, bins, hedges, power poles --- */
  for(const mx of [5.5,-8.5,19.5,-20,31]){
    g.add(cyl(.05,.055,1.05,MAT.darkwood,mx+2.2,.52,15.6,6));
    g.add(box(.20,.18,.34,MAT.kerb,mx+2.2,1.14,15.6));
  }
  for(const [bx,bz] of [[3.0,15.7],[-6.5,15.7],[21.5,15.7]]){
    g.add(box(.55,.80,.52,MAT.bin,bx,.40,bz));
    g.add(box(.58,.07,.55,MAT.kerb,bx,.83,bz));
  }
  for(let i=0;i<26;i++){                                   // hedge along a neighbour
    g.add(box(.62,.85,.62,MAT.foliage,-16+i*.55,.42,13.6));
  }
  for(const px of [-14,24,38]){                            // power poles + wires
    g.add(cyl(.14,.19,7.2,MAT.darkwood,px,3.6,16.9,7));
    g.add(box(1.9,.13,.13,MAT.darkwood,px,6.7,16.9));
    for(const dz of [-.7,.7]){
      const wire=new T.Mesh(new T.CylinderGeometry(.022,.022,24,4),MAT.black);
      wire.rotation.z=Math.PI/2; wire.position.set(px+12,6.62,16.9+dz); g.add(wire);
    }
  }
  /* --- driveways --- */
  for(const dx of [-9.5,16.5]){
    const d=new T.Mesh(new T.PlaneGeometry(3.0,6.4),MAT.kerb);
    d.rotation.x=-Math.PI/2; d.position.set(dx,.015,12.6); g.add(d);
  }

  /* --- moon --- */
  const moonBall=new T.Mesh(new T.SphereGeometry(2.2,16,14),
    new T.MeshBasicMaterial({color:0xd9e2f2}));
  moonBall.position.set(-26,20,-34); g.add(moonBall);
  return g;
}

function makeStaircase(){
  const g=new T.Group();
  const N=13, RISE=WALL_H/N, GO=0.30, W=1.92;
  for(let i=0;i<N;i++){
    const y=(i+1)*RISE, z=-i*GO;
    g.add(box(W,.055,GO+.03,MAT.darkwood,0,y-.028,z-GO/2));      // tread
    g.add(box(W-.06,RISE,.035,MAT.trim,0,y-RISE/2,z-GO+.02));    // riser
    g.add(box(W,.012,GO,MAT.trim,0,y-.058,z-GO/2));              // nosing shadow
  }
  const run=N*GO, rise=N*RISE, slope=Math.hypot(run,rise), ang=Math.atan2(rise,run);
  for(const sx of [-1,1]){                                        // stringers
    const st=box(.09,.30,slope,MAT.darkwood,sx*(W/2+.045),rise/2-.10,-run/2);
    st.rotation.x=ang; g.add(st);
  }
  const skirt=box(W,.26,slope,MAT.trim,0,rise/2-.20,-run/2);      // closes the underside
  skirt.rotation.x=ang; g.add(skirt);
  // banister down the open side
  const bx=-(W/2+.10);
  g.add(box(.11,1.05,.11,MAT.darkwood,bx,.52,.06));               // bottom newel
  g.add(box(.11,1.05,.11,MAT.darkwood,bx,rise+.52,-run+.05));     // top newel
  const rail=box(.075,.075,slope,MAT.darkwood,bx,rise/2+.92,-run/2);
  rail.rotation.x=ang; g.add(rail);
  for(let i=0;i<N;i++){
    const y=(i+1)*RISE, z=-i*GO-GO/2;
    g.add(box(.035,.86,.035,MAT.trim,bx,y+.43,z));
  }
  return g;
}

function makeStairShaft(){

function makeStairwellRail(){
  const g=new T.Group();

  post(17.02,15.02); post(17.02,17.98); post(18.98,15.02);

   THE WOMAN  (articulated)
   ========================================================== */
// A plain articulated person. Barry, the neighbour and her boy are all this
// with different proportions and colours.
function makePerson(o){
  o=o||{};
  const H=o.h||1.78, sk=o.skin||0xc9ab92, sh=o.shirt||0x4a3428,
        pn=o.pants||0x22304a, hr=o.hair||0x3a2a1c, build=o.build||1;
  const skin=new T.MeshStandardMaterial({color:sk,roughness:.92});
  const shirt=new T.MeshStandardMaterial({color:sh,roughness:.95});
  const pants=new T.MeshStandardMaterial({color:pn,roughness:.94});
  const hair=new T.MeshStandardMaterial({color:hr,roughness:1});
  const shoe=new T.MeshStandardMaterial({color:0x1a1a1c,roughness:.85});
  const S=H/1.78;
  const root=new T.Group();
  // a lathe gives a silhouette a stack of cylinders never will: shoulders wide,
  // waist narrow, and no seam where one primitive meets the next
  const lathe=(prof,mat,zsq)=>{
    const pts=prof.map(q=>new T.Vector2(Math.max(.0008,q[0])*S,q[1]*S));
    const m=new T.Mesh(new T.LatheGeometry(pts,18),mat);
    m.scale.z=zsq||1; m.castShadow=true; m.receiveShadow=true; return m;
  };
  const ball=(r,mat,x,y,z,sy,sz)=>{
    const m=new T.Mesh(new T.SphereGeometry(r*S,10,8),mat);
    m.position.set(x*S,y*S,z*S); m.scale.set(1,sy||1,sz||1);
    m.castShadow=true; return m;
  };
  const hips=new T.Group(); hips.position.y=0.825*S; root.add(hips);
  const chest=new T.Group(); chest.position.y=0.34*S; hips.add(chest);
  // torso: waist -> ribs -> chest -> shoulders, flattened front to back
  const t1=lathe([[0,-.175],[.112,-.170],[.126,-.130],[.132,-.040],[.148,.060],
                  [.164,.170],[.174,.258],[.168,.310],[.116,.358],[0,.372]],shirt,.70);
  t1.scale.x=build; chest.add(t1);
  chest.add(cyl(.050*S,.060*S,.13*S,skin,0,.392*S,0,10));           // neck
  // pelvis, overlapping the waist so there is no gap at the belt
  const pv=lathe([[0,-.255],[.086,-.250],[.118,-.215],[.138,-.120],[.146,-.030],
                  [.138,.070],[.124,.170],[0,.190]],pants,.74);
  pv.scale.x=build; hips.add(pv);
  // head
  const head=new T.Group(); head.position.set(0,.528*S,0); chest.add(head);
  const skull=new T.Mesh(new T.SphereGeometry(.113*S,18,16),skin);
  skull.scale.set(1,1.18,1.04); head.add(skull);
  head.add(ball(.078,skin,0,-.056,.014,.88,1.0));                    // jaw
  const cap=new T.Mesh(new T.SphereGeometry(.120*S,16,14,0,6.283,0,1.22),hair);
  cap.position.y=.016*S; head.add(cap);
  if(o.longHair){
    for(let i=0;i<16;i++){
      const a=(i/16)*Math.PI*2;
      if(Math.cos(a)>0.30) continue;                  // keep the face clear
      const l=box(.048*S,.30*S,.030*S,hair,Math.sin(a)*.108*S,-.14*S,Math.cos(a)*.108*S);
      l.rotation.y=a; head.add(l);
    }
  }
  const eyeW=new T.MeshStandardMaterial({color:0xe8e4da,roughness:.3});
  const pup=new T.MeshBasicMaterial({color:0x120e0a});
  const brow=new T.MeshStandardMaterial({color:hr,roughness:1});
  for(const sx of [-1,1]){
    const e=new T.Mesh(new T.SphereGeometry(.019*S,10,10),eyeW);
    e.position.set(sx*.042*S,.014*S,.090*S); e.scale.set(1,.78,.62); head.add(e);
    const q=new T.Mesh(new T.SphereGeometry(.0085*S,8,8),pup);
    q.position.set(sx*.042*S,.014*S,.102*S); head.add(q);
    const bw=box(.040*S,.010*S,.014*S,brow,sx*.043*S,.042*S,.098*S);
    bw.rotation.z=sx*.10; head.add(bw);                             // brow
  }
  head.add(ball(.016,skin,0,-.012,.098,1.15,1.0));                  // nose
  head.add(ball(.026,skin,-.108,-.010,.006,1.2,.7));                // ears
  head.add(ball(.026,skin, .108,-.010,.006,1.2,.7));
  const mouth=new T.Group(); mouth.position.set(0,-.052*S,.094*S); head.add(mouth);
  const lips=new T.Mesh(new T.SphereGeometry(.028*S,10,8),
    new T.MeshStandardMaterial({color:0x7d5347,roughness:.8}));
  lips.scale.set(1.15,.42,.55); mouth.add(lips);
  const gap=new T.Mesh(new T.SphereGeometry(.022*S,10,8),
    new T.MeshBasicMaterial({color:0x140d0c}));
  gap.scale.set(1.0,.30,.5); gap.position.z=.006*S; mouth.add(gap);
  // a smile is a curve, and a squashed sphere will never read as one -- swap the
  // whole mouth for an arc when someone actually smiles
  const smile=new T.Mesh(new T.TorusGeometry(.036*S,.0080*S,6,14,Math.PI),
    new T.MeshStandardMaterial({color:0x6b3f36,roughness:.85}));
  smile.rotation.z=Math.PI; smile.position.set(0,-.034*S,.098*S);
  smile.visible=false; head.add(smile);
  // limbs: two segments with a ball at the joint, so a bent elbow or knee keeps
  // its volume instead of opening a wedge
  const limb=(uL,lL,r0,r1,r2,mat,tip)=>{
    const j0=new T.Group();
    j0.add(cyl(r0,r1,uL,mat,0,-uL/2,0,9));
    j0.add(ball(r1/S*1.02,mat,0,-uL/S,0));
    const j1=new T.Group(); j1.position.y=-uL; j0.add(j1);
    j1.add(cyl(r1,r2,lL,mat,0,-lL/2,0,9));
    const j2=new T.Group(); j2.position.y=-lL; j1.add(j2);
    if(tip) j2.add(tip);
    return {j0,j1,j2};
  };
  const hand=()=>{
    const g=new T.Group();
    g.add(box(.040*S,.070*S,.026*S,skin,0,-.035*S,0));
    g.add(ball(.020,skin,0,-.014,0,1.0,.72));
    for(let i=0;i<4;i++) g.add(box(.0090*S,.056*S,.012*S,skin,-.014*S+i*.0095*S,-.096*S,.003*S));
    g.add(box(.012*S,.038*S,.014*S,skin,-.024*S,-.052*S,.010*S));   // thumb
    return g;
  };
  const foot=()=>{
    const g=new T.Group();
    g.add(box(.076*S,.046*S,.170*S,shoe,0,-.023*S,.044*S));
    g.add(ball(.038,shoe,0,-.026,.122,.60,.55));                    // toe
    g.add(box(.070*S,.030*S,.052*S,shoe,0,-.012*S,-.030*S));        // heel
    return g;
  };
  const armL=limb(.28*S,.27*S,.049*S*build,.037*S,.030*S,skin,hand());
  const armR=limb(.28*S,.27*S,.049*S*build,.037*S,.030*S,skin,hand());
  armL.j0.position.set(-.192*S*build,.268*S,0); armR.j0.position.set(.192*S*build,.268*S,0);
  for(const a of [armL,armR]){                                  // t-shirt sleeve
    const sl=new T.Mesh(new T.CylinderGeometry(.070*S,.055*S,.17*S,12,1,true),shirt);
    sl.position.y=-.075*S; a.j0.add(sl);
    const dl=new T.Mesh(new T.SphereGeometry(.070*S,12,10),shirt); // deltoid cap
    dl.scale.set(1,.92,.90); a.j0.add(dl);
  }
  chest.add(armL.j0); chest.add(armR.j0);
  const legL=limb(.30*S,.29*S,.078*S,.055*S,.044*S,pants,foot());
  const legR=limb(.30*S,.29*S,.078*S,.055*S,.044*S,pants,foot());
  legL.j0.position.set(-.088*S,-.185*S,0); legR.j0.position.set(.088*S,-.185*S,0);
  hips.add(legL.j0); hips.add(legR.j0);
  root.userData={hips,chest,head,mouth,smile,armL,armR,legL,legR,S,t:0,talk:0};
  return root;
}
// walk / idle / talk for the plain people
function animPerson(w,dt,speed,talking){
  const u=w.userData, amp=Math.min(1,speed*0.8);
  u.t+=dt*(3.6+speed*1.5)*(0.3+amp*0.7);
  const sw=Math.sin(u.t), co=Math.cos(u.t);
  u.legL.j0.rotation.x= sw*0.62*amp;
  u.legR.j0.rotation.x=-sw*0.62*amp;
  u.legL.j1.rotation.x=Math.max(0,-sw)*0.95*amp+0.03;
  u.legR.j1.rotation.x=Math.max(0, sw)*0.95*amp+0.03;
  u.armL.j0.rotation.x=-sw*0.46*amp;
  u.armR.j0.rotation.x= sw*0.46*amp;
  u.armL.j1.rotation.x=-(0.16+Math.max(0, sw)*0.32)*amp-0.12;
  u.armR.j1.rotation.x=-(0.16+Math.max(0,-sw)*0.32)*amp-0.12;
  u.armL.j0.rotation.z= 0.09; u.armR.j0.rotation.z=-0.09;
  u.hips.position.y=0.825*u.S+Math.abs(sw)*0.026*amp;
  u.chest.rotation.y= sw*0.12*amp; u.hips.rotation.y=-sw*0.08*amp;
  u.head.rotation.z=-co*0.05*amp;
  u.talk+=(talking?1:0-u.talk)*Math.min(1,dt*8);
  const j=talking?(0.5+0.5*Math.sin(u.t*14)):0;
  u.mouth.scale.y=1+j*1.9;
  u.mouth.position.y=-0.048*u.S-j*0.012*u.S;
}
function makeWoman(){
  const root=new T.Group();
  const SKIN=MAT.skinT||MAT.skin;

  const hips=new T.Group();  hips.position.y=0.95;  root.add(hips);
  const chest=new T.Group(); chest.position.y=0.36; hips.add(chest);

  // filthy shift, ragged hem around the shins
  const prof=[[.224,-.60],[.231,-.50],[.226,-.30],[.216,-.10],[.203,.08],
              [.192,.22],[.186,.33],[.178,.43],[.152,.53],[.104,.60]]
             .map(p=>new T.Vector2(p[0],p[1]));
  const gownMat=new T.MeshStandardMaterial({
    map:TEX.gown.map,normalMap:TEX.gown.normalMap,roughness:.96,side:T.DoubleSide});
  const gown=new T.Mesh(new T.LatheGeometry(prof,22),gownMat);
  gown.castShadow=true; hips.add(gown);
  // torn hem: uneven tabs hanging off the bottom
  for(let i=0;i<22;i++){
    const a=i/22*Math.PI*2, len=.05+((i*37)%11)/11*.13;
    const tab=new T.Mesh(new T.PlaneGeometry(.085,len),gownMat);
    tab.position.set(Math.sin(a)*.226,-.60-len/2+.01,Math.cos(a)*.226);
    tab.rotation.y=a; hips.add(tab);
  }
  chest.add(cyl(.050,.058,.15,SKIN,0,.30,0,10));                 // neck

  /* ---------- head ---------- */
  const head=new T.Group(); head.position.set(0,.44,0); chest.add(head);
  const skull=new T.Mesh(new T.SphereGeometry(.135,26,20),MAT.faceT||SKIN);
  skull.scale.set(1,1.20,1.03); skull.castShadow=true; head.add(skull);

  // deep-set eyes: pale iris, dark pinprick pupil, shadowed socket
  const eyeW=new T.MeshStandardMaterial({color:0xd6d8d2,roughness:.28});
  const iris=new T.MeshStandardMaterial({color:0x8e9a9c,roughness:.3});
  const pup =new T.MeshBasicMaterial({color:0x090807});
  for(const sx of [-1,1]){
    const e=new T.Mesh(new T.SphereGeometry(.0295,12,12),eyeW);
    e.position.set(sx*.052,.028,.108); head.add(e);
    const ir=new T.Mesh(new T.SphereGeometry(.0155,10,10),iris);
    ir.position.set(sx*.052,.028,.129); head.add(ir);
    const pp=new T.Mesh(new T.SphereGeometry(.0068,8,8),pup);
    pp.position.set(sx*.052,.028,.140); head.add(pp);
  }

  // THE mouth: a huge vertical aperture. Rotating a jaw would swing the cavity
  // back into the skull, so it opens by scaling and the teeth ride its rim.
  const mouth=new T.Group(); mouth.position.set(0,-.100,.068); head.add(mouth);
  const MAWR=.082;
  const maw=new T.Mesh(new T.SphereGeometry(MAWR,16,14),
    new T.MeshBasicMaterial({color:0x060405}));
  maw.scale.set(.84,.55,.60); mouth.add(maw);
  const lipMat=new T.MeshStandardMaterial({color:0x8e8078,roughness:.88});
  const lip=new T.Mesh(new T.TorusGeometry(MAWR*.86,.0105,8,20),lipMat);
  lip.position.z=.038; mouth.add(lip);
  const toothMat=new T.MeshStandardMaterial({color:0xb9a552,roughness:.55});
  const upT=new T.Group(), loT=new T.Group(); mouth.add(upT); mouth.add(loT);
  for(let i=0;i<7;i++){
    const x=(i-3)*.0170, w=.0132, h=.019-Math.abs(i-3)*.0015;
    upT.add(box(w,h,.011,toothMat,x,-h/2,.040));
    loT.add(box(w,h*.88,.011,toothMat,x,h*.44,.038));
  }

  /* ---------- hair: wispy strips, parted, forehead showing ---------- */
  // alphaTest only (no blending) so the cards sort correctly and don't read
  // as solid slabs; blended cards with depthWrite off looked like a hat.
  const hairMat=new T.MeshStandardMaterial({map:TEX.hair,transparent:false,alphaTest:0.42,
    depthWrite:true,roughness:1.0,side:T.DoubleSide,color:0x9c958a});
  const scalpMat=new T.MeshStandardMaterial({color:0x241f1a,roughness:1.0});
  const scalp=new T.Mesh(new T.SphereGeometry(.136,20,16,0,6.283,0,1.30),scalpMat);
  scalp.position.y=.020; scalp.scale.set(1.03,1.05,1.05); head.add(scalp);
  const locks=[];
  const addLock=(a,rr,y0,len,w,tiltX,tiltZ)=>{
    const st=new T.Mesh(new T.PlaneGeometry(w,len),hairMat);
    st.position.set(Math.sin(a)*rr,y0-len/2,Math.cos(a)*rr);
    st.rotation.y=a; st.rotation.x=tiltX; st.rotation.z=tiltZ;
    head.add(st); locks.push(st); return st;
  };
  // long outer curtain, parted off the face
  for(let i=0;i<34;i++){
    const a=(i/34)*Math.PI*2+((i%3)-1)*0.035;
    if(Math.cos(a)>0.68&&Math.abs(Math.sin(a))<0.40) continue;
    addLock(a,.142+((i*17)%5)/5*.016,.055,
            .44+((i*53)%17)/17*.48,
            .052+((i*29)%7)/7*.040,
            (Math.cos(a)>0?0.09:-0.05), Math.sin(a)*0.12);
  }
  // shorter inner layer starting higher, hanging DOWN over the crown
  for(let i=0;i<26;i++){
    const a=(i/26)*Math.PI*2+0.12;
    if(Math.cos(a)>0.74&&Math.abs(Math.sin(a))<0.30) continue;
    addLock(a,.092+((i*23)%4)/4*.020,.150,
            .30+((i*31)%13)/13*.26,
            .058+((i*19)%5)/5*.034,
            (Math.cos(a)>0?0.22:-0.16), Math.sin(a)*0.08);
  }
  // a few over the very top so the crown isn't bare, still hanging downward
  for(let i=0;i<12;i++){
    const a=(i/12)*Math.PI*2+0.3;
    addLock(a,.050,.185,.26,.060,(Math.cos(a)>0?0.30:-0.24),Math.sin(a)*0.05);
  }
  for(const sx of [-1,1]){                                  // two strays across the face
    const f=new T.Mesh(new T.PlaneGeometry(.036,.32),hairMat);
    f.position.set(sx*.050,-.050,.130); f.rotation.z=sx*0.15;
    head.add(f); locks.push(f);
  }

  /* ---------- limbs ---------- */
  function limb(upLen,loLen,r0,r1,r2,tip){
    const j0=new T.Group();
    const up=cyl(r0,r1,upLen,SKIN,0,-upLen/2,0,8); up.castShadow=true; j0.add(up);
    const j1=new T.Group(); j1.position.y=-upLen; j0.add(j1);
    const lo=cyl(r1,r2,loLen,SKIN,0,-loLen/2,0,8); lo.castShadow=true; j1.add(lo);
    const j2=new T.Group(); j2.position.y=-loLen; j1.add(j2);
    if(tip) j2.add(tip);
    return {j0,j1,j2};
  }
  const hand=()=>{
    const g=new T.Group();
    g.add(box(.048,.078,.026,SKIN,0,-.039,0));
    for(let i=0;i<4;i++) g.add(box(.0105,.070,.012,SKIN,-.017+i*.0118,-.110,.003));
    g.add(box(.011,.046,.013,SKIN,.028,-.078,.011));
    return g;
  };
  const foot=()=>box(.072,.042,.165,SKIN,0,-.021,.044);

  const armL=limb(.29,.30,.043,.033,.028,hand());
  const armR=limb(.29,.30,.043,.033,.028,hand());
  armL.j0.position.set(-.172,.148,.005); armR.j0.position.set(.172,.148,.005);
  for(const a of [armL,armR]){                       // sleeve rides the upper arm
    const sl=new T.Mesh(new T.CylinderGeometry(.056,.049,.155,10,1,true),gownMat);
    sl.position.y=-.072; a.j0.add(sl);
  }
  chest.add(armL.j0); chest.add(armR.j0);
  const legL=limb(.30,.29,.058,.044,.037,foot());
  const legR=limb(.30,.29,.058,.044,.037,foot());
  legL.j0.position.set(-.092,-.37,0); legR.j0.position.set(.092,-.37,0);
  hips.add(legL.j0); hips.add(legR.j0);

  root.userData={hips,chest,head,gown,locks,mouth,maw,lip,upT,loT,MAWR,
                 armL,armR,legL,legR,t:0,reach:0,lean:0,lunge:0};
  return root;
}

// speed drives the cycle; scream/chase/lunge reshape the pose on top of it
function animateWoman(w,dt,speed,scream,chase){
  const u=w.userData;
  const amp=Math.min(1,speed*0.75);
  const run=Math.min(1,Math.max(0,(speed-1.9)/1.5));
  u.t+=dt*(4.0+speed*1.35)*(0.32+amp*0.68);
  const ph=u.t, sw=Math.sin(ph), co=Math.cos(ph);
  const lerp=(a,b,k)=>a+(b-a)*Math.min(1,k);

  // legs: longer stride and higher knees the faster she moves
  const stride=0.60+run*0.42;
  u.legL.j0.rotation.x =  sw*stride*amp;
  u.legR.j0.rotation.x = -sw*stride*amp;
  u.legL.j1.rotation.x = Math.max(0,-sw)*(1.00+run*0.55)*amp+0.04;
  u.legR.j1.rotation.x = Math.max(0, sw)*(1.00+run*0.55)*amp+0.04;
  u.legL.j2.rotation.x = -u.legL.j1.rotation.x*0.45;
  u.legR.j2.rotation.x = -u.legR.j1.rotation.x*0.45;

  // arms hang almost limp at a walk, drive harder at a run
  let aLx=-sw*(0.34+run*0.55)*amp, aRx= sw*(0.34+run*0.55)*amp;
  let aLe=-(0.10+run*0.35+Math.max(0, sw)*(0.25+run*0.5))*amp-0.06;
  let aRe=-(0.10+run*0.35+Math.max(0,-sw)*(0.25+run*0.5))*amp-0.06;
  let aLz= 0.07+amp*0.04, aRz=-0.07-amp*0.04;

  // closing in: both arms come up and reach. Needs a stored blend -- the
  // cycle above rewrites these joints every frame.
  u.reach=lerp(u.reach||0,(chase&&!scream)?1:0,dt*4);
  if(u.reach>0.002){
    const R=u.reach, fl=Math.sin(ph*2.1);
    const rx=-1.30+fl*0.24, re=-0.34-Math.abs(fl)*0.22;
    aLx=lerp(aLx,rx,R); aRx=lerp(aRx,rx,R);
    aLe=lerp(aLe,re,R); aRe=lerp(aRe,re,R);
    aLz=lerp(aLz,-0.34,R); aRz=lerp(aRz, 0.34,R);
  }
  u.armL.j0.rotation.x=aLx; u.armR.j0.rotation.x=aRx;
  u.armL.j1.rotation.x=aLe; u.armR.j1.rotation.x=aRe;
  u.armL.j0.rotation.z=aLz; u.armR.j0.rotation.z=aRz;

  // torso: bob, counter-rotation, and a forward lean that grows with speed
  u.hips.position.y = 0.95+Math.abs(sw)*(0.026+run*0.030)*amp;
  u.hips.rotation.y = -sw*0.11*amp;
  u.chest.rotation.y =  sw*0.17*amp;
  u.chest.rotation.z =  co*0.05*amp;
  u.lean=lerp(u.lean,chase?0.34:(0.05+run*0.16),dt*3);
  u.chest.rotation.x=u.lean;
  u.head.rotation.x=-u.lean*0.80;
  u.head.rotation.z=-co*0.07*amp;
  u.head.rotation.y=-u.chest.rotation.y*0.6;
  for(let i=0;i<u.locks.length;i++)
    u.locks[i].rotation.x=(u.locks[i].userData.b||0)-sw*0.20*amp;

  // scream / jumpscare: jaw yawns open, head thrusts at you, arms fly up.
  // lunge also drives the whole body forward and up into the camera.
  const k=Math.min(1,dt*11);
  u.open=lerp(u.open||0,scream?1:0,k);
  const sy=0.55+u.open*1.70;                       // maw half-height multiplier
  u.maw.scale.y=sy;
  u.lip.scale.set(1,sy*1.06,1);
  const rim=u.MAWR*sy;
  u.upT.position.y= rim-.010;
  u.loT.position.y=-rim+.010;
  u.lunge=lerp(u.lunge,scream?1:0,dt*(scream?14:6));
  if(u.lunge>0.002){
    const L=u.lunge, tr=Math.sin(u.t*33)*0.012*L;      // tremor
    u.head.rotation.x=lerp(u.head.rotation.x,0.24,L)+tr;
    u.chest.rotation.x=lerp(u.chest.rotation.x,0.30,L);
    u.hips.position.y=lerp(u.hips.position.y,1.02,L);
    w.position.y=tr*2.0;
    for(const a of [u.armL,u.armR]){
      a.j0.rotation.x=lerp(a.j0.rotation.x,-1.95,L);
      a.j1.rotation.x=lerp(a.j1.rotation.x,-0.72,L);
    }
    u.armL.j0.rotation.z=lerp(u.armL.j0.rotation.z,-0.66,L);
    u.armR.j0.rotation.z=lerp(u.armR.j0.rotation.z, 0.66,L);
  } else w.position.y=0;
}

const canvas=document.getElementById('view');
let renderer,scene,camera,levelGroups={},propGroups={},woman,phoneMesh,phoneScreen;
let rtScene=null,postScene=null,postCam=null,postMat=null;
const camRT=[];                       // render targets for the 3 wall cameras
const camObjs=[];
let lights=[],ambLight=null,moon=null,hemiLight=null;// the fixed pool we reposition each frame
const LIGHT_DEFS=[];                  // per-level virtual lights
const LIGHT_GAIN=34;                  // candela scale for the physical light units

const QUAL={low:{px:.55,lights:2,shadow:false,post:false,camRT:96},
            med:{px:.8, lights:3,shadow:false,post:true, camRT:128},
            high:{px:1.0,lights:4,shadow:true, camRT:192,post:true}};
function Q(){ return QUAL[settings.qual]||QUAL.med; }

function initThree(){
  renderer=new T.WebGLRenderer({canvas,antialias:settings.qual==='high',powerPreference:'high-performance'});
  renderer.setClearColor(0x000000,1);
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFSoftShadowMap;
  renderer.toneMapping=T.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.15;
  renderer.outputColorSpace=T.SRGBColorSpace;

  scene=new T.Scene();
  scene.fog=new T.FogExp2(0x05060a,0.13);
  camera=new T.PerspectiveCamera(72,1,0.05,60);

  // three r155+ uses physical light units, so point lights need candela-scale
  // intensities -- single digits read as pitch black.
  ambLight=new T.AmbientLight(0x3a3c50,2.6); scene.add(ambLight);
  hemiLight=new T.HemisphereLight(0x3a3c52,0x181008,0.9); scene.add(hemiLight);
  moon=new T.DirectionalLight(0x93a9d6,0); moon.position.set(-6,12,9); scene.add(moon);

  // fixed pool of point lights, repositioned to the nearest active sources
  for(let i=0;i<4;i++){
    const l=new T.PointLight(0xffb257,0,9,2);
    l.castShadow=false; scene.add(l); lights.push(l);
  }
  lights[0].castShadow=true;
  lights[0].shadow.mapSize.set(512,512);
  lights[0].shadow.bias=-0.005;
  lights[0].shadow.camera.near=0.1; lights[0].shadow.camera.far=10;

  // camera render targets
  for(let i=0;i<3;i++){
    const s=Q().camRT;
    camRT.push(new T.WebGLRenderTarget(s,Math.round(s*1.5),{minFilter:T.LinearFilter,magFilter:T.NearestFilter}));
    const c=new T.PerspectiveCamera(68,2/3,0.05,40); camObjs.push(c);
  }
  buildPost();
  resize();
}

function buildPost(){
  rtScene=new T.WebGLRenderTarget(2,2,{minFilter:T.LinearFilter,magFilter:T.LinearFilter});
  postCam=new T.OrthographicCamera(-1,1,1,-1,0,1);
  postScene=new T.Scene();
  postMat=new T.ShaderMaterial({
    uniforms:{tDiffuse:{value:null},uTime:{value:0},uFear:{value:0},uHurt:{value:0},uRes:{value:new T.Vector2(1,1)}},
    vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }',
    fragmentShader:`
      varying vec2 vUv; uniform sampler2D tDiffuse; uniform float uTime,uFear,uHurt; uniform vec2 uRes;
      float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
      void main(){
        vec2 uv=vUv;
        float ca=0.0012+uFear*0.004;                       // chromatic split grows with fear
        vec2 d=uv-0.5;
        vec3 col;
        col.r=texture2D(tDiffuse,uv+d*ca).r;
        col.g=texture2D(tDiffuse,uv).g;
        col.b=texture2D(tDiffuse,uv-d*ca).b;
        // --- linear-space work ---
        col*=vec3(1.06,0.99,0.86);                    // warm dim grade
        float v=smoothstep(1.15,0.25,length(d)*1.7);
        col*=mix(0.38,1.0,v);                         // vignette
        // the scene target holds tone-mapped LINEAR light; a ShaderMaterial gets no
        // automatic output encoding, so convert to sRGB here or everything reads black
        col=pow(max(col,0.0),vec3(1.0/2.2));
        // --- display-space work (grain here, or the gamma curve amplifies it hugely) ---
        float g=hash(uv*uRes+fract(uTime)*137.0);
        col+=(g-0.5)*(0.030+uFear*0.030);
        col=mix(col,vec3(0.62,0.05,0.05),uHurt*smoothstep(0.25,1.0,length(d)*1.4));
        gl_FragColor=vec4(max(col,0.0),1.0);
      }`
  });
  const q=new T.Mesh(new T.PlaneGeometry(2,2),postMat);
  q.frustumCulled=false; postScene.add(q);
}

function resize(){
  const w=window.innerWidth,h=window.innerHeight,q=Q();
  const dpr=Math.min(window.devicePixelRatio||1,2)*q.px;
  renderer.setPixelRatio(dpr);
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  const bw=Math.max(2,Math.floor(w*dpr)),bh=Math.max(2,Math.floor(h*dpr));
  if(rtScene) rtScene.setSize(bw,bh);
  if(postMat) postMat.uniforms.uRes.value.set(bw,bh);
  lights[0].castShadow=q.shadow;
}
window.addEventListener('resize',resize);
